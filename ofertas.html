<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#C8993A">
  <title>Ofertas - ARP</title>
  <style>
    :root{--gold:#C8993A;--dark:#1A1A1A;--surf:#F5F3EF;--border:#E2DDD5;--text:#2C2C2C;--muted:#8A8278;--red:#C0392B;--green:#27AE60;--orange:#E67E22;--blue:#1565C0;}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--surf);color:var(--text);min-height:100vh}
    .app-header{background:var(--dark);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
    .btn-back{background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer;padding:0;line-height:1}
    .hdr-mark{width:30px;height:30px;background:var(--gold);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;flex-shrink:0}
    .hdr-title{color:white;font-size:15px;font-weight:600;flex:1}
    .btn-nueva{background:var(--gold);color:white;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
    .content{padding:16px;max-width:680px;margin:0 auto;padding-bottom:40px}
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* lista */
    .oferta-card{background:white;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .2s}
    .oferta-card:hover{border-color:var(--gold);box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
    .oferta-num{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.04em;font-family:monospace}
    .oferta-cliente{font-size:14px;font-weight:600;color:var(--dark);margin:4px 0 2px}
    .oferta-proyecto{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .oferta-foot{display:flex;align-items:center;gap:8px;margin-top:10px}
    .badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;white-space:nowrap}
    .badge-borrador{background:var(--surf);color:var(--muted)}
    .badge-enviada{background:#E3F2FD;color:var(--blue)}
    .badge-aceptada{background:#E8F5E9;color:var(--green)}
    .badge-rechazada{background:#FFEBEE;color:var(--red)}
    .oferta-fecha{font-size:10px;color:var(--muted);margin-left:auto}
    /* form */
    .sec-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
    .sec-label:first-of-type{margin-top:4px}
    .form-card{background:white;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
    .form-field{padding:12px 14px;border-bottom:1px solid var(--border)}
    .form-field:last-child{border-bottom:none}
    .form-field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
    .form-field input,.form-field select,.form-field textarea{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;color:var(--text);background:white}
    .form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--gold);outline:none}
    .form-field textarea{resize:vertical;min-height:60px}
    /* normas */
    .norma-row{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
    .norma-row:last-child{border-bottom:none}
    .norma-row input[type=checkbox]{margin-top:2px;accent-color:var(--gold);width:16px;height:16px;flex-shrink:0;cursor:pointer}
    .norma-ref{font-size:12px;font-weight:700;color:var(--dark)}
    .norma-titulo{font-size:11px;color:var(--muted);margin-top:1px}
    /* partidas */
    .partidas-wrap{overflow-x:auto;padding:10px}
    .partidas-table{width:100%;border-collapse:collapse;min-width:400px}
    .partidas-table th{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:7px 8px;text-align:left;background:var(--surf);white-space:nowrap}
    .partidas-table td{padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
    .partidas-table tr:last-child td{border-bottom:none}
    .td-r{text-align:right}
    .inp-num{width:80px;padding:5px 7px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;text-align:right;font-family:inherit}
    .inp-num:focus{border-color:var(--gold);outline:none}
    /* totales */
    .tot-row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:13px}
    .tot-row.bold{font-weight:700;font-size:14px;border-top:1.5px solid var(--border);padding-top:10px}
    .tot-row.tot-iva{background:#F9F7F3;font-weight:700;color:var(--dark);border-radius:0 0 12px 12px}
    /* botones */
    .btn-primary{width:100%;padding:14px;background:var(--gold);color:white;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed}
    .btn-row{display:flex;gap:10px;margin-top:10px}
    .btn-sec{flex:1;padding:11px;background:white;color:var(--dark);border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .btn-ok{flex:1;padding:11px;background:var(--green);color:white;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .btn-del{flex:1;padding:11px;background:white;color:var(--red);border:1.5px solid var(--red);border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .btn-pdf{flex:1;padding:11px;background:var(--dark);color:white;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
    /* detalle */
    .det-block{padding:14px}
    .det-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
    .det-val{font-size:14px;color:var(--dark);margin-bottom:12px}
    /* misc */
    .empty-state{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;line-height:1.7}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:999}
    .toast.show{opacity:1}
  </style>
</head>
<body>

<div class="app-header">
  <button class="btn-back" onclick="handleBack()">&#8592;</button>
  <div class="hdr-mark" id="hdrMark">ARP</div>
  <div class="hdr-title" id="hdrTitle">Ofertas</div>
  <button class="btn-nueva" id="btnNueva" onclick="mostrarForm(null, null)">+ Nueva</button>
</div>

<div class="content" id="content">
  <div class="spinner"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="utils.js"></script>
<script>
if (!firebase.apps.length) {
  firebase.initializeApp({
    apiKey:"AIzaSyDncKj2_RBJWgzzjOn2079x47pf_ycGFlc",
    authDomain:"arp-inspecciones.firebaseapp.com",
    projectId:"arp-inspecciones",
    storageBucket:"arp-inspecciones.firebasestorage.app",
    messagingSenderId:"35880168451",
    appId:"1:35880168451:web:090e3c250b4416ed0b3236"
  });
}
var auth = firebase.auth();
var db   = firebase.firestore();

var vistaActual  = 'lista';
var usuarioActual = null;
var clientes      = [];
var ofertaCache   = null; // datos de la oferta en vista detalle

var NORMAS = [
  { ref:'UNE-EN 1176',          partes:'(Partes aplicables)', titulo:'Equipamiento de áreas de juego',                            fecha:'2017' },
  { ref:'UNE-EN 15567',         partes:'(Partes aplicables)', titulo:'Parques de aventura. Recorridos Acrobáticos en Altura.',    fecha:'2021' },
  { ref:'UNE-EN 16869',         partes:'',                    titulo:'Diseño y construcción de vías ferrata',                    fecha:'2018' },
  { ref:'UNE-EN 12572',         partes:'(Partes aplicables)', titulo:'Estructuras artificiales de escalada',                     fecha:'2017' },
  { ref:'UNE-EN 14960',         partes:'',                    titulo:'Equipos de juego hinchables',                              fecha:'2019' },
  { ref:'UNE-EN Deportivo',     partes:'(según aplicación)',  titulo:'Equipos deportivos',                                       fecha:'Según Norma' },
  { ref:'UNE-EN ISO 23659:2023',partes:'',                    titulo:'Trampoline Park',                                          fecha:'2023' },
  { ref:'Otras',                partes:'',                    titulo:'Otras normativas aplicables',                              fecha:'' }
];

var PARTIDAS = [
  'Inspección técnica conforme a normas de referencia',
  'Ensayos técnicos conforme a normativa aplicable',
  'Ensayos de extracción de anclajes (cuando proceda)',
  'Evaluación documental',
  'Dietas y Alojamiento',
  'Transporte y Kilometraje'
];

// ─── AUTH ───────────────────────────────────────────────────────────────────

initAuth({
  roles: ['admin', 'director', 'proyecto', 'oficina'],
  onReady: function(user, ud) {
    usuarioActual = {
      email:     user.email,
      nombre:    ud.nombre || '',
      iniciales: ud.nombreCorto || computeIniciales(ud.nombre),
      rol:       ud.rol
    };
    cargarClientes();
    cargarOfertas();
  }
});

function computeIniciales(nombre) {
  var words = (nombre || '').trim().split(/\s+/).filter(Boolean);
  return words.slice(0, 2).map(function(w) { return w[0].toUpperCase(); }).join('') || 'XX';
}

// ─── NAVEGACIÓN ─────────────────────────────────────────────────────────────

function handleBack() {
  if (vistaActual === 'form' || vistaActual === 'detalle') {
    mostrarLista();
  } else {
    location.href = 'admin.html';
  }
}

function mostrarLista() {
  vistaActual = 'lista';
  document.getElementById('hdrTitle').textContent = 'Ofertas';
  document.getElementById('btnNueva').style.display = '';
  cargarOfertas();
}

// ─── LISTA ──────────────────────────────────────────────────────────────────

function cargarClientes() {
  db.collection('clientes').orderBy('nombre').get().then(function(snap) {
    clientes = [];
    snap.forEach(function(d) { clientes.push({ id: d.id, nombre: d.data().nombre || d.id }); });
  }).catch(function() {});
}

function cargarOfertas() {
  document.getElementById('content').innerHTML = '<div class="spinner"></div>';
  db.collection('ofertas').orderBy('fechaCreacion', 'desc').get().then(function(snap) {
    if (snap.empty) {
      document.getElementById('content').innerHTML =
        '<div class="empty-state">No hay ofertas todavía.<br>Pulsa <strong>+ Nueva</strong> para crear la primera.</div>';
      return;
    }
    var html = '';
    snap.forEach(function(d) { html += renderOfertaCard(d.id, d.data()); });
    document.getElementById('content').innerHTML = html;
  }).catch(function() {
    document.getElementById('content').innerHTML = '<div class="empty-state">Error al cargar ofertas.</div>';
  });
}

function renderOfertaCard(id, o) {
  var BADGES = { borrador:'badge-borrador', enviada:'badge-enviada', aceptada:'badge-aceptada', rechazada:'badge-rechazada' };
  var LABELS = { borrador:'Borrador', enviada:'Enviada', aceptada:'Aceptada', rechazada:'Rechazada' };
  var fecha  = o.fechaCreacion ? new Date(o.fechaCreacion.seconds * 1000).toLocaleDateString('es-ES') : '';
  return '<div class="oferta-card" onclick="mostrarDetalle(\'' + id + '\')">' +
    '<div class="oferta-num">' + escHtml(o.nOferta || '') + '</div>' +
    '<div class="oferta-cliente">' + escHtml(o.clienteNombre || '') + '</div>' +
    '<div class="oferta-proyecto">' + escHtml(o.proyecto || '') + '</div>' +
    '<div class="oferta-foot">' +
    '<span class="badge ' + (BADGES[o.estado] || 'badge-borrador') + '">' + (LABELS[o.estado] || o.estado) + '</span>' +
    '<span class="oferta-fecha">' + fecha + '</span>' +
    '</div></div>';
}

// ─── FORMULARIO ─────────────────────────────────────────────────────────────

var editId = null;

function mostrarForm(ofertaId, datos) {
  vistaActual = 'form';
  editId = ofertaId || null;
  document.getElementById('hdrTitle').textContent = ofertaId ? 'Editar oferta' : 'Nueva oferta';
  document.getElementById('btnNueva').style.display = 'none';

  var normasChk  = (datos && datos.normas)    ? datos.normas    : [];
  var partidas   = (datos && datos.partidas)  ? datos.partidas  : PARTIDAS.map(function(c) { return { concepto:c, costeUnitario:0, unidades:0 }; });
  var descuento  = (datos && datos.descuento) ? datos.descuento : 0;

  var optsCliente = clientes.map(function(c) {
    var sel = datos && datos.clienteId === c.id ? ' selected' : '';
    return '<option value="' + escHtml(c.id) + '"' + sel + '>' + escHtml(c.nombre) + '</option>';
  }).join('');

  var normasHtml = NORMAS.map(function(n, i) {
    var chk    = normasChk.indexOf(n.ref) >= 0 ? 'checked' : '';
    var refTxt = n.ref + (n.partes ? ' ' + n.partes : '');
    return '<label class="norma-row">' +
      '<input type="checkbox" id="norma-' + i + '" value="' + escHtml(n.ref) + '" ' + chk + '>' +
      '<div><div class="norma-ref">' + escHtml(refTxt) + '</div>' +
      '<div class="norma-titulo">' + escHtml(n.titulo) + (n.fecha ? ' · ' + n.fecha : '') + '</div></div>' +
      '</label>';
  }).join('');

  var filas = partidas.map(function(p, i) {
    var sub = (parseFloat(p.costeUnitario) || 0) * (parseFloat(p.unidades) || 0);
    return '<tr><td style="font-size:11px">' + escHtml(p.concepto) + '</td>' +
      '<td class="td-r"><input class="inp-num" type="number" min="0" step="0.01" id="cu-' + i + '" value="' + (p.costeUnitario || 0) + '" oninput="recalc()"></td>' +
      '<td class="td-r"><input class="inp-num" type="number" min="0" step="1"    id="ud-' + i + '" value="' + (p.unidades || 0)      + '" oninput="recalc()"></td>' +
      '<td class="td-r" id="sub-' + i + '">' + fmtEur(sub) + '</td></tr>';
  }).join('');

  document.getElementById('content').innerHTML =
    '<div class="sec-label">Datos del cliente</div>' +
    '<div class="form-card">' +
      '<div class="form-field"><label>Cliente</label>' +
        '<select id="fCliente"><option value="">— Selecciona cliente —</option>' + optsCliente + '</select></div>' +
      '<div class="form-field"><label>Proyecto / instalación</label>' +
        '<textarea id="fProyecto" rows="2" placeholder="Inspección Técnica de la Instalación, ...">' + escHtml((datos && datos.proyecto) || '') + '</textarea></div>' +
    '</div>' +
    '<div class="sec-label">Normas aplicables</div>' +
    '<div class="form-card">' + normasHtml + '</div>' +
    '<div class="sec-label">Memoria económica</div>' +
    '<div class="form-card"><div class="partidas-wrap"><table class="partidas-table">' +
      '<thead><tr><th>Concepto</th><th style="text-align:right">€/ud.</th><th style="text-align:right">Uds.</th><th style="text-align:right">Subtotal</th></tr></thead>' +
      '<tbody>' + filas + '</tbody></table></div></div>' +
    '<div class="form-card">' +
      '<div class="form-field"><label>Descuento (€)</label>' +
        '<input type="number" id="fDescuento" min="0" step="0.01" value="' + (descuento || 0) + '" oninput="recalc()"></div>' +
      '<div id="totBlock"></div>' +
    '</div>' +
    '<button class="btn-primary" onclick="guardarOferta()">Guardar oferta</button>';

  recalc();
}

function recalc() {
  var total = 0;
  for (var i = 0; i < PARTIDAS.length; i++) {
    var cu  = parseFloat((document.getElementById('cu-' + i) || {}).value) || 0;
    var ud  = parseFloat((document.getElementById('ud-' + i) || {}).value) || 0;
    var sub = cu * ud;
    total  += sub;
    var el  = document.getElementById('sub-' + i);
    if (el) el.textContent = fmtEur(sub);
  }
  var desc    = parseFloat((document.getElementById('fDescuento') || {}).value) || 0;
  var trasDes = Math.max(0, total - desc);
  var iva     = trasDes * 0.21;
  var conIva  = trasDes + iva;
  var tb = document.getElementById('totBlock');
  if (!tb) return;
  tb.innerHTML =
    '<div class="tot-row"><span>Total (sin IVA)</span><span>' + fmtEur(total) + '</span></div>' +
    (desc > 0
      ? '<div class="tot-row"><span>Descuento</span><span>– ' + fmtEur(desc) + '</span></div>' +
        '<div class="tot-row bold"><span>Total tras descuento</span><span>' + fmtEur(trasDes) + '</span></div>'
      : '') +
    '<div class="tot-row"><span>IVA (21%)</span><span>' + fmtEur(iva) + '</span></div>' +
    '<div class="tot-row tot-iva"><span>TOTAL (con IVA)</span><span>' + fmtEur(conIva) + '</span></div>';
}

function guardarOferta() {
  var sel        = document.getElementById('fCliente');
  var clienteId  = sel ? sel.value : '';
  var clienteNom = sel && sel.selectedIndex >= 0 ? sel.options[sel.selectedIndex].text : '';
  var proyecto   = (document.getElementById('fProyecto') || {}).value || '';

  if (!clienteId)         { showToast('Selecciona un cliente'); return; }
  if (!proyecto.trim())   { showToast('Indica el proyecto o instalación'); return; }

  var normas = [];
  NORMAS.forEach(function(n, i) {
    var el = document.getElementById('norma-' + i);
    if (el && el.checked) normas.push(n.ref);
  });

  var partidas = PARTIDAS.map(function(c, i) {
    var cu = parseFloat((document.getElementById('cu-' + i) || {}).value) || 0;
    var ud = parseFloat((document.getElementById('ud-' + i) || {}).value) || 0;
    return { concepto: c, costeUnitario: cu, unidades: ud };
  });

  var desc    = parseFloat((document.getElementById('fDescuento') || {}).value) || 0;
  var total   = partidas.reduce(function(s, p) { return s + p.costeUnitario * p.unidades; }, 0);
  var trasDes = Math.max(0, total - desc);
  var iva     = trasDes * 0.21;

  var btn = document.querySelector('.btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }

  if (editId) {
    db.collection('ofertas').doc(editId).update({
      clienteId: clienteId, clienteNombre: clienteNom, proyecto: proyecto.trim(),
      normas: normas, partidas: partidas, descuento: desc,
      totalSinIVA: total, totalTrasDescuento: trasDes, ivaImporte: iva, totalConIVA: trasDes + iva,
      ultimaModificacion: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
      showToast('Oferta actualizada');
      mostrarDetalle(editId);
    }).catch(function(e) {
      showToast('Error: ' + e.message);
      if (btn) { btn.disabled = false; btn.textContent = 'Guardar oferta'; }
    });
  } else {
    var hoy       = new Date();
    var yy        = String(hoy.getFullYear()).slice(-2);
    var mm        = String(hoy.getMonth() + 1).padStart(2, '0');
    var dd        = String(hoy.getDate()).padStart(2, '0');
    var fechaDoc  = yy + mm + dd;
    var iniciales = usuarioActual ? usuarioActual.iniciales : 'XX';

    // Contar ofertas de hoy de este mismo usuario para obtener el correlativo del día
    db.collection('ofertas')
      .where('fechaDoc', '==', fechaDoc)
      .where('creadoPorIniciales', '==', iniciales)
      .get()
      .then(function(snap) {
        var n       = snap.size; // 0, 1, 2…
        var nOferta = fechaDoc + '/' + iniciales + '/' + n + '/Rev.0';
        return db.collection('ofertas').add({
          nOferta: nOferta, fechaDoc: fechaDoc, secuenciaDia: n, iniciales: iniciales, revision: 0,
          clienteId: clienteId, clienteNombre: clienteNom, proyecto: proyecto.trim(),
          normas: normas, partidas: partidas, descuento: desc,
          totalSinIVA: total, totalTrasDescuento: trasDes, ivaImporte: iva, totalConIVA: trasDes + iva,
          estado: 'borrador',
          fechaCreacion: firebase.firestore.FieldValue.serverTimestamp(),
          fechaEnvio: null,
          creadoPor: usuarioActual ? usuarioActual.email : '',
          creadoPorNombre: usuarioActual ? usuarioActual.nombre : '',
          creadoPorIniciales: iniciales
        });
      }).then(function(ref) {
        showToast('Oferta creada');
        mostrarDetalle(ref.id);
      }).catch(function(e) {
        showToast('Error: ' + e.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Guardar oferta'; }
      });
  }
}

// ─── DETALLE ────────────────────────────────────────────────────────────────

function mostrarDetalle(id) {
  vistaActual = 'detalle';
  document.getElementById('hdrTitle').textContent = 'Detalle oferta';
  document.getElementById('btnNueva').style.display = 'none';
  document.getElementById('content').innerHTML = '<div class="spinner"></div>';
  db.collection('ofertas').doc(id).get().then(function(snap) {
    if (!snap.exists) { mostrarLista(); return; }
    ofertaCache = snap.data();
    renderDetalle(id, ofertaCache);
  });
}

function renderDetalle(id, o) {

  var normasTxt = (o.normas && o.normas.length)
    ? o.normas.map(function(r) {
        var n = NORMAS.filter(function(x) { return x.ref === r; })[0];
        return n ? n.ref + (n.partes ? ' ' + n.partes : '') : r;
      }).join(', ')
    : '—';

  var filas = (o.partidas || []).map(function(p) {

  var total   = o.totalSinIVA         || 0;
  var desc    = o.descuento           || 0;

        '<button class="btn-sec"  onclick="mostrarForm(\'' + id + '\', ofertaCache)">Editar</button>' +

      '</div>' +
      '<div class="btn-row" style="margin-top:6px">' +

      '</div>';

    acciones =
      '<div class="btn-row">' +
        '<button class="btn-ok"  onclick="cambiarEstado(\'' + id + '\', \'aceptada\')">Aceptada</button>' +
        '<button class="btn-del" onclick="cambiarEstado(\'' + id + '\', \'rechazada\')">Rechazada</button>' +
      '</div>' +
      '<div class="btn-row" style="margin-top:6px">' +

        '<button class="btn-sec" onclick="nuevaRevision(\'' + id + '\')">Nueva revisión</button>' +

      '<div class="btn-row">' +
        '<button class="btn-pdf" onclick="generarPDF(\'' + id + '\')">Generar PDF</button>' +
        '<button class="btn-sec" onclick="nuevaRevision(\'' + id + '\')">Nueva revisión</button>' +

      '<div style="margin-top:12px"><div class="det-label">Oferta nº</div>' +

function cambiarEstado(id, estado) {
  var upd = { estado: estado };
  if (estado === 'enviada') upd.fechaEnvio = firebase.firestore.FieldValue.serverTimestamp();
  db.collection('ofertas').doc(id).update(upd).then(function() {
    showToast('Estado actualizado');
    mostrarDetalle(id);
  }).catch(function(e) { showToast('Error: ' + e.message); });
}

function eliminarOferta(id) {
  if (!confirm('¿Eliminar esta oferta? No se puede deshacer.')) return;
  db.collection('ofertas').doc(id).delete().then(function() {
    showToast('Oferta eliminada');
    mostrarLista();
  });
}

function nuevaRevision(id) {
  if (!ofertaCache) return;
  var rev     = (ofertaCache.revision || 0) + 1;
  var nOferta = ofertaCache.nOferta.replace(/Rev\.\d+$/, 'Rev.' + rev);
  db.collection('ofertas').doc(id).update({
    revision: rev, nOferta: nOferta, estado: 'borrador',
    ultimaModificacion: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function() {
    showToast('Rev.' + rev + ' creada');
    mostrarDetalle(id);
  }).catch(function(e) { showToast('Error: ' + e.message); });
}

function generarPDF(id) {
  db.collection('ofertas').doc(id).get().then(function(snap) {
    if (!snap.exists) return;
    buildPDF(snap.data());
  });
}

    paras.forEach(function(para, pi) {
      var lines = doc.splitTextToSize(para, maxW);

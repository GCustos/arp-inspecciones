<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#C8993A">
  <title>Ofertas - ARP</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .btn-nueva{background:var(--gold);color:white;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
    /* lista */
    .oferta-card{background:white;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .2s}
    .oferta-card:hover{border-color:var(--gold);box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
    .oferta-num{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.04em;font-family:monospace}
    .oferta-cliente{font-size:14px;font-weight:600;color:var(--dark);margin:4px 0 2px}
    .oferta-proyecto{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .oferta-foot{display:flex;align-items:center;gap:8px;margin-top:10px}
    .badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;white-space:nowrap}
    .badge-borrador{background:var(--surf);color:var(--muted)}
    .badge-enviada{background:#E3F2FD;color:var(--blue)}
    .badge-aceptada{background:#E8F5E9;color:var(--green)}
    .badge-rechazada{background:#FFEBEE;color:var(--red)}
    .oferta-fecha{font-size:10px;color:var(--muted);margin-left:auto}
    /* form */
    .form-card{background:white;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
    .form-field{padding:12px 14px;border-bottom:1px solid var(--border)}
    .form-field:last-child{border-bottom:none}
    .form-field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
    .form-field input,.form-field select,.form-field textarea{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;color:var(--text);background:white}
    .form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--gold);outline:none}
    .form-field textarea{resize:vertical;min-height:60px}
    /* normas */
    .norma-row{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
    .norma-row:last-child{border-bottom:none}
    .norma-row input[type=checkbox]{margin-top:2px;accent-color:var(--gold);width:16px;height:16px;flex-shrink:0;cursor:pointer}
    .norma-ref{font-size:12px;font-weight:700;color:var(--dark)}
    .norma-titulo{font-size:11px;color:var(--muted);margin-top:1px}
    /* partidas */
    .partidas-wrap{overflow-x:auto;padding:10px}
    .partidas-table{width:100%;border-collapse:collapse;min-width:400px}
    .partidas-table th{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:7px 8px;text-align:left;background:var(--surf);white-space:nowrap}
    .partidas-table td{padding:6px 8px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
    .partidas-table tr:last-child td{border-bottom:none}
    .td-r{text-align:right}
    .inp-num{width:80px;padding:5px 7px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;text-align:right;font-family:inherit}
    .inp-num:focus{border-color:var(--gold);outline:none}
    /* totales */
    .tot-row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:13px}
    .tot-row.bold{font-weight:700;font-size:14px;border-top:1.5px solid var(--border);padding-top:10px}
    .tot-row.tot-iva{background:#F9F7F3;font-weight:700;color:var(--dark);border-radius:0 0 12px 12px}
    /* botones */
    .btn-primary{width:100%;padding:14px;background:var(--gold);color:white;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
    .btn-row{display:flex;gap:10px;margin-top:10px}
    .chk-inline{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer}
    .chk-inline input{width:auto!important}
    .btn-sec{flex:1;padding:11px;background:white;color:var(--dark);border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .btn-ok{flex:1;padding:11px;background:var(--green);color:white;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .btn-del{flex:1;padding:11px;background:white;color:var(--red);border:1.5px solid var(--red);border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .btn-pdf{flex:1;padding:11px;background:var(--dark);color:white;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
    /* detalle */
    .det-block{padding:14px}
    .det-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
    .det-val{font-size:14px;color:var(--dark);margin-bottom:12px}
    /* misc */
    .empty-state{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;line-height:1.7}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:999}
    .toast.show{opacity:1}
  </style>
</head>
<body>

<div class="app-header">
  <button class="btn-back" onclick="handleBack()">&#8592;</button>
  <div class="hdr-mark" id="hdrMark" onclick="location.href='index.html'" style="cursor:pointer" title="Inicio">ARP</div>
  <div class="hdr-title" id="hdrTitle">Ofertas</div>
  <button class="btn-nueva" id="btnNueva" onclick="mostrarForm(null, null)">+ Nueva</button>
</div>

<div class="content" id="content">
  <div class="spinner"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="utils.js"></script>
<script>
if (!firebase.apps.length) {
  firebase.initializeApp({
    apiKey:"AIzaSyDncKj2_RBJWgzzjOn2079x47pf_ycGFlc",
    authDomain:"arp-inspecciones.firebaseapp.com",
    projectId:"arp-inspecciones",
    storageBucket:"arp-inspecciones.firebasestorage.app",
    messagingSenderId:"35880168451",
    appId:"1:35880168451:web:090e3c250b4416ed0b3236"
  });
}
var auth = firebase.auth();
var db   = firebase.firestore();

var vistaActual  = 'lista';
var usuarioActual = null;
var clientes      = [];
var instalaciones = [];
var ofertaCache   = null; // datos de la oferta en vista detalle

// alcanceApp: a qué alcance de la app corresponde esta norma (null = servicio que ARP
// factura pero sin módulo de inspección en la app todavía). El alcance de una oferta se
// calcula SOLO a partir de qué normas se marcan aquí — nunca es un campo aparte que
// alguien pueda desincronizar a mano. Añadir un alcance nuevo en el futuro (ej.
// hinchables) es solo rellenar este campo en la fila correspondiente, nada más que tocar.
var NORMAS = [
  { ref:'UNE-EN 1176',          partes:'(Partes aplicables)', titulo:'Equipamiento de áreas de juego',                            fecha:'2017', alcanceApp:null },
  { ref:'UNE-EN 15567',         partes:'(Partes aplicables)', titulo:'Parques de aventura. Recorridos Acrobáticos en Altura.',    fecha:'2021', alcanceApp:'PAA' },
  { ref:'UNE-EN 16869',         partes:'',                    titulo:'Diseño y construcción de vías ferrata',                    fecha:'2018', alcanceApp:'FER' },
  { ref:'UNE-EN 12572',         partes:'(Partes aplicables)', titulo:'Estructuras artificiales de escalada',                     fecha:'2017', alcanceApp:'SAE' },
  { ref:'UNE-EN 14960',         partes:'',                    titulo:'Equipos de juego hinchables',                              fecha:'2019', alcanceApp:null },
  { ref:'UNE-EN Deportivo',     partes:'(según aplicación)',  titulo:'Equipos deportivos',                                       fecha:'Según Norma', alcanceApp:null },
  { ref:'UNE-EN ISO 23659:2023',partes:'',                    titulo:'Trampoline Park',                                          fecha:'2023', alcanceApp:null },
  { ref:'Otras',                partes:'',                    titulo:'Otras normativas aplicables',                              fecha:'', alcanceApp:null }
];

var PARTIDAS = [
  'Inspección técnica conforme a normas de referencia',
  'Ensayos técnicos conforme a normativa aplicable',
  'Ensayos de extracción de anclajes (cuando proceda)',
  'Evaluación documental',
  'Dietas y Alojamiento',
  'Transporte y Kilometraje'
];

// ─── AUTH ───────────────────────────────────────────────────────────────────

initAuth({
  roles: ['admin', 'director', 'proyecto', 'oficina'],
  onReady: function(user, ud) {
    usuarioActual = {
      email:     user.email,
      nombre:    ud.nombre || '',
      iniciales: ud.nombreCorto || computeIniciales(ud.nombre, 'XX'),
      rol:       ud.rol
    };
    cargarClientes();
    cargarInstalaciones();
    cargarOfertas();
  }
});

// ─── NAVEGACIÓN ─────────────────────────────────────────────────────────────

function handleBack() {
  if (vistaActual === 'form' || vistaActual === 'detalle') {
    mostrarLista();
  } else {
    location.href = 'index.html';
  }
}

function mostrarLista() {
  vistaActual = 'lista';
  document.getElementById('hdrTitle').textContent = 'Ofertas';
  document.getElementById('btnNueva').style.display = '';
  cargarOfertas();
}

// ─── LISTA ──────────────────────────────────────────────────────────────────

function cargarInstalaciones() {
  db.collection('instalaciones').get().then(function(snap) {
    instalaciones = [];
    snap.forEach(function(d) {
      if (d.data().activo !== false) instalaciones.push(Object.assign({ id: d.id }, d.data()));
    });
  }).catch(function() {});
}

function cargarClientes() {
  db.collection('clientes').orderBy('nombre').get().then(function(snap) {
    clientes = [];
    snap.forEach(function(d) { clientes.push({ id: d.id, nombre: d.data().nombre || d.id }); });
  }).catch(function() {});
}

var ofertasCache  = [];
var filtroEstado  = null; // null = todas

function cargarOfertas() {
  document.getElementById('content').innerHTML = '<div class="spinner"></div>';
  db.collection('ofertas').orderBy('fechaCreacion', 'desc').get().then(function(snap) {
    ofertasCache = [];
    snap.forEach(function(d) { ofertasCache.push(Object.assign({ id: d.id }, d.data())); });
    renderListaOfertas();
  }).catch(function() {
    document.getElementById('content').innerHTML = '<div class="empty-state">Error al cargar ofertas.</div>';
  });
}

window.setFiltroEstado = function(estado) { filtroEstado = estado; renderListaOfertas(); };

function renderListaOfertas() {
  var ESTADOS = [['borrador','Borrador'], ['enviada','Enviada'], ['aceptada','Aceptada'], ['rechazada','Rechazada']];
  var filtros = '<div class="toolbar" style="margin-bottom:12px;flex-wrap:wrap">' +
    '<button class="filtro-btn' + (filtroEstado === null ? ' active' : '') + '" onclick="setFiltroEstado(null)">Todas</button>' +
    ESTADOS.map(function(e) {
      return '<button class="filtro-btn' + (filtroEstado === e[0] ? ' active' : '') + '" onclick="setFiltroEstado(\'' + e[0] + '\')">' + e[1] + '</button>';
    }).join('') +
  '</div>';
  var lista = filtroEstado ? ofertasCache.filter(function(o){ return o.estado === filtroEstado; }) : ofertasCache;
  if (!lista.length) {
    document.getElementById('content').innerHTML = filtros +
      '<div class="empty-state">' + (ofertasCache.length ? 'No hay ofertas con ese filtro.' : 'No hay ofertas todavía.<br>Pulsa <strong>+ Nueva</strong> para crear la primera.') + '</div>';
    return;
  }
  document.getElementById('content').innerHTML = filtros + lista.map(function(o) { return renderOfertaCard(o.id, o); }).join('');
}

function renderOfertaCard(id, o) {
  var BADGES = { borrador:'badge-borrador', enviada:'badge-enviada', aceptada:'badge-aceptada', rechazada:'badge-rechazada' };
  var LABELS = { borrador:'Borrador', enviada:'Enviada', aceptada:'Aceptada', rechazada:'Rechazada' };
  var fecha  = o.fechaCreacion ? new Date(o.fechaCreacion.seconds * 1000).toLocaleDateString('es-ES') : '';
  return '<div class="oferta-card" onclick="mostrarDetalle(\'' + id + '\')">' +
    '<div class="oferta-num">' + escHtml(o.nOferta || '') + '</div>' +
    '<div class="oferta-cliente">' + escHtml(o.clienteNombre || '') + '</div>' +
    '<div class="oferta-proyecto">' + escHtml(o.instalacionNombre || o.proyecto || '') + (o.alcances && o.alcances.length ? ' · ' + escHtml(o.alcances.join('/')) : '') + '</div>' +
    '<div class="oferta-foot">' +
    '<span class="badge ' + (BADGES[o.estado] || 'badge-borrador') + '">' + (LABELS[o.estado] || o.estado) + '</span>' +
    '<span class="oferta-fecha">' + fecha + '</span>' +
    '</div></div>';
}

// ─── FORMULARIO ─────────────────────────────────────────────────────────────

var editId = null;

function mostrarForm(ofertaId, datos) {
  vistaActual = 'form';
  editId = ofertaId || null;
  document.getElementById('hdrTitle').textContent = ofertaId ? 'Editar oferta' : 'Nueva oferta';
  document.getElementById('btnNueva').style.display = 'none';

  var normasChk  = (datos && datos.normas)    ? datos.normas    : [];
  var partidas   = (datos && datos.partidas)  ? datos.partidas  : PARTIDAS.map(function(c) { return { concepto:c, costeUnitario:0, unidades:0 }; });
  var descuento  = (datos && datos.descuento) ? datos.descuento : 0;

  var optsCliente = clientes.map(function(c) {
    var sel = datos && datos.clienteId === c.id ? ' selected' : '';
    return '<option value="' + escHtml(c.id) + '"' + sel + '>' + escHtml(c.nombre) + '</option>';
  }).join('');

  var instSelActual = (datos && datos.instalacionId) || '';
  var optsInstalacion = instalaciones.map(function(i) {
    var sel = instSelActual === i.id ? ' selected' : '';
    var propNombre = (clientes.find(function(c){ return c.id === i.propietarioId; }) || {}).nombre || i.propietario || '';
    return '<option value="' + escHtml(i.id) + '"' + sel + '>' + escHtml(i.nombre || i.id) + (propNombre ? ' · ' + escHtml(propNombre) : '') + '</option>';
  }).join('');
  // Cliente actual para mostrarlo ya resuelto si se está editando una oferta con
  // instalación existente ya elegida (no es un campo editable aparte, ver más abajo).
  var instActual = instSelActual ? instalaciones.find(function(i){ return i.id === instSelActual; }) : null;
  var clienteDerivadoTxt = instActual ? ((clientes.find(function(c){ return c.id === instActual.propietarioId; }) || {}).nombre || instActual.propietario || '—') : '—';

  var normasHtml = NORMAS.map(function(n, i) {
    var chk    = normasChk.indexOf(n.ref) >= 0 ? 'checked' : '';
    var refTxt = n.ref + (n.partes ? ' ' + n.partes : '');
    return '<label class="norma-row">' +
      '<input type="checkbox" id="norma-' + i + '" value="' + escHtml(n.ref) + '" ' + chk + '>' +
      '<div><div class="norma-ref">' + escHtml(refTxt) + '</div>' +
      '<div class="norma-titulo">' + escHtml(n.titulo) + (n.fecha ? ' · ' + n.fecha : '') + '</div></div>' +
      '</label>';
  }).join('');

  var filas = partidas.map(function(p, i) {
    var sub = (parseFloat(p.costeUnitario) || 0) * (parseFloat(p.unidades) || 0);
    return '<tr><td style="font-size:11px">' + escHtml(p.concepto) + '</td>' +
      '<td class="td-r"><input class="inp-num" type="number" min="0" step="0.01" id="cu-' + i + '" value="' + (p.costeUnitario || 0) + '" oninput="recalc()"></td>' +
      '<td class="td-r"><input class="inp-num" type="number" min="0" step="1"    id="ud-' + i + '" value="' + (p.unidades || 0)      + '" oninput="recalc()"></td>' +
      '<td class="td-r" id="sub-' + i + '">' + fmtEur(sub) + '</td></tr>';
  }).join('');

  document.getElementById('content').innerHTML =
    '<div class="sec-label">Instalación</div>' +
    '<div class="form-card">' +
      '<div class="form-field"><label>Instalación</label>' +
        '<select id="fInstalacion" onchange="onCambioInstalacion()">' +
          '<option value="">— Selecciona instalación —</option>' + optsInstalacion +
          '<option value="__nueva__"' + (instSelActual === '__nueva__' ? ' selected' : '') + '>+ Crear instalación nueva</option>' +
        '</select></div>' +
      '<div class="form-field" id="fClienteDerivadoWrap"' + (instSelActual && instSelActual !== '__nueva__' ? '' : ' style="display:none"') + '>' +
        '<label>Cliente (de la instalación)</label>' +
        '<div class="det-val" id="fClienteDerivadoTxt" style="padding:9px 0">' + escHtml(clienteDerivadoTxt) + '</div>' +
      '</div>' +
      '<div class="form-field" id="fInstalacionNuevaWrap" style="display:none">' +
        '<label>Nombre de la instalación nueva</label><input type="text" id="fInstalacionNuevaNombre" placeholder="Nombre">' +
        '<label style="margin-top:8px">Código corto (ej. CLF)</label><input type="text" id="fInstalacionNuevaCodigo" placeholder="CÓDIGO" style="text-transform:uppercase">' +
        '<label style="margin-top:8px">Cliente</label>' +
        '<select id="fClienteNueva" onchange="onCambioClienteNueva()">' +
          '<option value="">— Selecciona cliente —</option>' + optsCliente +
          '<option value="__nuevo__">+ Crear cliente nuevo</option>' +
        '</select>' +
        '<div id="fClienteNuevoWrap" style="display:none;margin-top:8px">' +
          '<label>Nombre del cliente nuevo</label><input type="text" id="fClienteNuevoNombre" placeholder="Nombre / razón social">' +
          '<label style="margin-top:8px">CIF (opcional)</label><input type="text" id="fClienteNuevoCif" placeholder="CIF" style="text-transform:uppercase">' +
        '</div>' +
        '<div style="font-size:11px;color:var(--muted);margin-top:8px">Dirección, gestor y demás se completan más adelante — no hace falta tenerlos ahora para hacer la oferta.</div>' +
      '</div>' +
    '</div>' +
    '<div class="sec-label">Normas aplicables</div>' +
    '<div class="form-card">' + normasHtml + '</div>' +
    '<div class="sec-label">Memoria económica</div>' +
    '<div class="form-card"><div class="partidas-wrap"><table class="partidas-table">' +
      '<thead><tr><th>Concepto</th><th style="text-align:right">€/ud.</th><th style="text-align:right">Uds.</th><th style="text-align:right">Subtotal</th></tr></thead>' +
      '<tbody>' + filas + '</tbody></table></div></div>' +
    '<div class="form-card">' +
      '<div class="form-field"><label>Descuento (€)</label>' +
        '<input type="number" id="fDescuento" min="0" step="0.01" value="' + (descuento || 0) + '" oninput="recalc()"></div>' +
      '<div id="totBlock"></div>' +
    '</div>' +
    '<button class="btn-primary" onclick="guardarOferta()">Guardar oferta</button>';

  recalc();
}

window.onCambioInstalacion = function() {
  var val = (document.getElementById('fInstalacion') || {}).value || '';
  var wrapNueva = document.getElementById('fInstalacionNuevaWrap');
  var wrapDerivado = document.getElementById('fClienteDerivadoWrap');
  if (wrapNueva)    wrapNueva.style.display    = val === '__nueva__' ? '' : 'none';
  if (wrapDerivado) wrapDerivado.style.display = (val && val !== '__nueva__') ? '' : 'none';
  if (val && val !== '__nueva__') {
    var inst = instalaciones.find(function(i) { return i.id === val; });
    // Cliente: se muestra ya resuelto desde el propietario real de la instalación — no
    // es un campo que se pueda elegir aparte, para que nunca puedan desincronizarse.
    var propNombre = inst ? ((clientes.find(function(c){ return c.id === inst.propietarioId; }) || {}).nombre || inst.propietario || '—') : '—';
    var txtEl = document.getElementById('fClienteDerivadoTxt');
    if (txtEl) txtEl.textContent = propNombre;
    // Precargar las normas de los alcances que la instalación ya tenía — editable igual
    // (esta oferta puede añadir un alcance nuevo marcando otra norma).
    if (inst && inst.alcances) {
      NORMAS.forEach(function(n, i) {
        if (!n.alcanceApp) return;
        var cb = document.getElementById('norma-' + i);
        if (cb && inst.alcances.indexOf(n.alcanceApp) >= 0) cb.checked = true;
      });
    }
    // Solo en oferta nueva (no al editar una ya guardada, para no pisar datos existentes).
    if (!editId) precargarJuegosUltimaInspeccion(val);
  }
};

// Precarga "Unidades" de la primera partida con el nº de juegos de la última inspección
// de esta instalación — solo orienta, el campo sigue siendo editable (el nº de juegos
// puede haber cambiado desde entonces).
function precargarJuegosUltimaInspeccion(instalacionId) {
  db.collection('inspecciones').where('instalacionId', '==', instalacionId).get().then(function(snap) {
    if (snap.empty) return;
    var docs = [];
    snap.forEach(function(d) { docs.push(d.data()); });
    docs.sort(function(a, b) { return (b.fechaCreacion && b.fechaCreacion.seconds || 0) - (a.fechaCreacion && a.fechaCreacion.seconds || 0); });
    var ultima = docs[0];
    var circuitos = ultima.circuitos;
    if (!circuitos) return;
    if (!Array.isArray(circuitos)) circuitos = Object.values(circuitos);
    var totalJuegos = circuitos.reduce(function(s, c) {
      var juegos = c.juegos;
      if (!juegos) return s;
      if (!Array.isArray(juegos)) juegos = Object.values(juegos);
      return s + juegos.filter(function(j) { return j.tipo === 'R'; }).length;
    }, 0);
    if (!totalJuegos) return;
    var ud0 = document.getElementById('ud-0');
    if (ud0 && (!ud0.value || parseFloat(ud0.value) === 0)) {
      ud0.value = totalJuegos;
      recalc();
    }
  }).catch(function(e) { console.warn('No se pudo precargar nº de juegos:', e.message); });
}

window.onCambioClienteNueva = function() {
  var val = (document.getElementById('fClienteNueva') || {}).value || '';
  var wrap = document.getElementById('fClienteNuevoWrap');
  if (wrap) wrap.style.display = val === '__nuevo__' ? '' : 'none';
};

function recalc() {
  var total = 0;
  for (var i = 0; i < PARTIDAS.length; i++) {
    var cu  = parseFloat((document.getElementById('cu-' + i) || {}).value) || 0;
    var ud  = parseFloat((document.getElementById('ud-' + i) || {}).value) || 0;
    var sub = cu * ud;
    total  += sub;
    var el  = document.getElementById('sub-' + i);
    if (el) el.textContent = fmtEur(sub);
  }
  var desc    = parseFloat((document.getElementById('fDescuento') || {}).value) || 0;
  var trasDes = Math.max(0, total - desc);
  var iva     = trasDes * 0.21;
  var conIva  = trasDes + iva;
  var tb = document.getElementById('totBlock');
  if (!tb) return;
  tb.innerHTML =
    '<div class="tot-row"><span>Total (sin IVA)</span><span>' + fmtEur(total) + '</span></div>' +
    (desc > 0
      ? '<div class="tot-row"><span>Descuento</span><span>– ' + fmtEur(desc) + '</span></div>' +
        '<div class="tot-row bold"><span>Total tras descuento</span><span>' + fmtEur(trasDes) + '</span></div>'
      : '') +
    '<div class="tot-row"><span>IVA (21%)</span><span>' + fmtEur(iva) + '</span></div>' +
    '<div class="tot-row tot-iva"><span>TOTAL (con IVA)</span><span>' + fmtEur(conIva) + '</span></div>';
}

function guardarOferta() {
  var instSel = (document.getElementById('fInstalacion') || {}).value || '';
  if (!instSel) { showToast('Selecciona o crea una instalación'); return; }

  var normas = [];
  NORMAS.forEach(function(n, i) {
    var el = document.getElementById('norma-' + i);
    if (el && el.checked) normas.push(n.ref);
  });
  // El alcance NUNCA se elige aparte — se calcula solo a partir de qué normas tienen
  // alcanceApp y están marcadas, para que no pueda desincronizarse de la norma real.
  var alcances = [];
  NORMAS.forEach(function(n) {
    if (n.alcanceApp && normas.indexOf(n.ref) >= 0 && alcances.indexOf(n.alcanceApp) < 0) alcances.push(n.alcanceApp);
  });

  var nombreNueva = '', codigoNueva = '';
  var clienteSelNueva = '', clienteNuevoNombre = '', clienteNuevoCif = '';
  if (instSel === '__nueva__') {
    nombreNueva = ((document.getElementById('fInstalacionNuevaNombre') || {}).value || '').trim();
    codigoNueva = ((document.getElementById('fInstalacionNuevaCodigo') || {}).value || '').trim().toUpperCase();
    if (!nombreNueva) { showToast('Indica el nombre de la instalación nueva'); return; }
    if (!codigoNueva) { showToast('Indica un código corto para la instalación nueva'); return; }
    if (instalaciones.some(function(i){ return (i.codigo||'').toUpperCase() === codigoNueva; })) {
      showToast('Ese código de instalación ya existe'); return;
    }
    clienteSelNueva = (document.getElementById('fClienteNueva') || {}).value || '';
    if (!clienteSelNueva) { showToast('Selecciona o crea un cliente para la instalación nueva'); return; }
    if (clienteSelNueva === '__nuevo__') {
      clienteNuevoNombre = ((document.getElementById('fClienteNuevoNombre') || {}).value || '').trim();
      clienteNuevoCif    = ((document.getElementById('fClienteNuevoCif') || {}).value || '').trim().toUpperCase();
      if (!clienteNuevoNombre) { showToast('Indica el nombre del cliente nuevo'); return; }
    }
  }

  var partidas = PARTIDAS.map(function(c, i) {
    var cu = parseFloat((document.getElementById('cu-' + i) || {}).value) || 0;
    var ud = parseFloat((document.getElementById('ud-' + i) || {}).value) || 0;
    return { concepto: c, costeUnitario: cu, unidades: ud };
  });

  var desc    = parseFloat((document.getElementById('fDescuento') || {}).value) || 0;
  var total   = partidas.reduce(function(s, p) { return s + p.costeUnitario * p.unidades; }, 0);
  var trasDes = Math.max(0, total - desc);
  var iva     = trasDes * 0.21;

  var btn = document.querySelector('.btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }

  // Cliente: nunca se elige aparte de la instalación — o se deriva del propietario real
  // de una instalación ya existente, o (solo si la instalación también es nueva) se crea/
  // elige aquí porque todavía no hay instalación de la que derivarlo.
  var resolverCliente;
  if (instSel !== '__nueva__') {
    var instExistente = instalaciones.find(function(i){ return i.id === instSel; });
    var clExistente = instExistente ? clientes.find(function(c){ return c.id === instExistente.propietarioId; }) : null;
    resolverCliente = Promise.resolve({
      id: instExistente ? instExistente.propietarioId : '',
      nombre: clExistente ? clExistente.nombre : (instExistente ? instExistente.propietario : '') || ''
    });
  } else if (clienteSelNueva === '__nuevo__') {
    resolverCliente = db.collection('clientes').add({
      nombre: clienteNuevoNombre, cif: clienteNuevoCif, activo: true,
      contactos: [], creadoEn: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(ref) { return { id: ref.id, nombre: clienteNuevoNombre }; });
  } else {
    resolverCliente = Promise.resolve({
      id: clienteSelNueva,
      nombre: (clientes.find(function(c){ return c.id === clienteSelNueva; }) || {}).nombre || ''
    });
  }

  resolverCliente.then(function(cliente) {
    // Si se eligió "+ Crear instalación nueva", se crea ahora (datos mínimos — nombre,
    // código y el cliente ya resuelto; el resto __PENDIENTE__, mismo criterio que ya usa
    // el resto de la app para no bloquear por datos que comercial aún no tiene en fase de
    // oferta). Si es una instalación existente, se resuelve directo sin ninguna escritura.
    var resolverInstalacion = instSel === '__nueva__'
      ? db.collection('instalaciones').add({
          nombre: nombreNueva, codigo: codigoNueva, alcances: alcances,
          propietarioId: cliente.id, propietario: cliente.nombre,
          municipio: '__PENDIENTE__', direccion: '__PENDIENTE__', provincia: '__PENDIENTE__',
          gestorActual: '__PENDIENTE__', solicitanteActual: '', cif: '',
          activo: true
        }).then(function(ref) { return { id: ref.id, nombre: nombreNueva }; })
      : Promise.resolve({ id: instSel, nombre: (instalaciones.find(function(i){return i.id===instSel;})||{}).nombre || '' });

    return resolverInstalacion.then(function(inst) { return { cliente: cliente, inst: inst }; });
  }).then(function(r) {
    var datosComunes = {
      clienteId: r.cliente.id, clienteNombre: r.cliente.nombre,
      instalacionId: r.inst.id, instalacionNombre: r.inst.nombre, alcances: alcances,
      normas: normas, partidas: partidas, descuento: desc,
      totalSinIVA: total, totalTrasDescuento: trasDes, ivaImporte: iva, totalConIVA: trasDes + iva
    };
    if (editId) {
      return db.collection('ofertas').doc(editId).update(Object.assign({}, datosComunes, {
        ultimaModificacion: firebase.firestore.FieldValue.serverTimestamp()
      })).then(function() {
        showToast('Oferta actualizada');
        mostrarDetalle(editId);
      });
    }
    var hoy       = new Date();
    var yy        = String(hoy.getFullYear()).slice(-2);
    var mm        = String(hoy.getMonth() + 1).padStart(2, '0');
    var dd        = String(hoy.getDate()).padStart(2, '0');
    var fechaDoc  = yy + mm + dd;
    var iniciales = usuarioActual ? usuarioActual.iniciales : 'XX';

    // Contar ofertas de hoy de este mismo usuario para obtener el correlativo del día
    return db.collection('ofertas')
      .where('fechaDoc', '==', fechaDoc)
      .where('creadoPorIniciales', '==', iniciales)
      .get()
      .then(function(snap) {
        var n       = snap.size; // 0, 1, 2…
        var nOferta = fechaDoc + '/' + iniciales + '/' + n + '/Rev.0';
        return db.collection('ofertas').add(Object.assign({}, datosComunes, {
          nOferta: nOferta, fechaDoc: fechaDoc, secuenciaDia: n, iniciales: iniciales, revision: 0,
          estado: 'borrador',
          fechaCreacion: firebase.firestore.FieldValue.serverTimestamp(),
          fechaEnvio: null,
          creadoPor: usuarioActual ? usuarioActual.email : '',
          creadoPorNombre: usuarioActual ? usuarioActual.nombre : '',
          creadoPorIniciales: iniciales
        }));
      }).then(function(ref) {
        showToast('Oferta creada');
        mostrarDetalle(ref.id);
      });
  }).catch(function(e) {
    showToast('Error: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Guardar oferta'; }
  });
}

function mostrarDetalle(id) {
  vistaActual = 'detalle';
  document.getElementById('hdrTitle').textContent = 'Detalle oferta';
  document.getElementById('btnNueva').style.display = 'none';
  document.getElementById('content').innerHTML = '<div class="spinner"></div>';
  db.collection('ofertas').doc(id).get().then(function(snap) {
    if (!snap.exists) { mostrarLista(); return; }
    ofertaCache = snap.data();
    renderDetalle(id, ofertaCache);
  });
}

function renderDetalle(id, o) {
  var BADGES = { borrador:'badge-borrador', enviada:'badge-enviada', aceptada:'badge-aceptada', rechazada:'badge-rechazada' };
  var LABELS = { borrador:'Borrador', enviada:'Enviada', aceptada:'Aceptada', rechazada:'Rechazada' };
  var fecha  = o.fechaCreacion ? new Date(o.fechaCreacion.seconds * 1000).toLocaleDateString('es-ES') : '—';

  var normasTxt = (o.normas && o.normas.length)
    ? o.normas.map(function(r) {
        var n = NORMAS.filter(function(x) { return x.ref === r; })[0];
        return n ? n.ref + (n.partes ? ' ' + n.partes : '') : r;
      }).join(', ')
    : '—';

  var filas = (o.partidas || []).map(function(p) {
    var sub = (p.costeUnitario || 0) * (p.unidades || 0);
    return '<tr><td style="font-size:11px">' + escHtml(p.concepto) + '</td>' +
      '<td class="td-r">' + fmtEur(p.costeUnitario) + '</td>' +
      '<td class="td-r">' + (p.unidades || 0) + '</td>' +
      '<td class="td-r">' + fmtEur(sub) + '</td></tr>';
  }).join('');

  var total   = o.totalSinIVA         || 0;
  var desc    = o.descuento           || 0;
  var trasDes = o.totalTrasDescuento  || 0;
  var ivaImp  = o.ivaImporte          || 0;
  var conIva  = o.totalConIVA         || 0;

  var acciones = '';
  if (o.estado === 'borrador') {
    acciones =
      '<div class="btn-row">' +
        '<button class="btn-sec"  onclick="mostrarForm(\'' + id + '\', ofertaCache)">Editar</button>' +
        '<button class="btn-ok"   onclick="cambiarEstado(\'' + id + '\', \'enviada\')">Marcar enviada</button>' +
      '</div>' +
      '<div class="btn-row" style="margin-top:6px">' +
        '<button class="btn-pdf" onclick="generarPDF(\'' + id + '\')">Generar PDF</button>' +
        '<button class="btn-del" onclick="eliminarOferta(\'' + id + '\')">Eliminar</button>' +
      '</div>';
  } else if (o.estado === 'enviada') {
    acciones =
      '<div class="btn-row">' +
        '<button class="btn-ok"  onclick="cambiarEstado(\'' + id + '\', \'aceptada\')">Aceptada</button>' +
        '<button class="btn-del" onclick="cambiarEstado(\'' + id + '\', \'rechazada\')">Rechazada</button>' +
      '</div>' +
      '<div class="btn-row" style="margin-top:6px">' +
        '<button class="btn-pdf" onclick="generarPDF(\'' + id + '\')">Generar PDF</button>' +
        '<button class="btn-sec" onclick="nuevaRevision(\'' + id + '\')">Nueva revisión</button>' +
      '</div>';
  } else {
    acciones =
      '<div class="btn-row">' +
        '<button class="btn-pdf" onclick="generarPDF(\'' + id + '\')">Generar PDF</button>' +
        '<button class="btn-sec" onclick="nuevaRevision(\'' + id + '\')">Nueva revisión</button>' +
      '</div>';
  }

  // Crear inspección(es): solo con la oferta aceptada — por cada alcance marcado, o ya se
  // generó (se ve el enlace a su resultado) o se puede crear ahora (lleva a
  // nueva-inspeccion.html con instalación/alcance ya preseleccionados, que es donde de
  // verdad se elige fecha e inspector con el formulario que ya existe y está probado).
  var crearInspHtml = '';
  if (o.estado === 'aceptada' && o.instalacionId && o.alcances && o.alcances.length) {
    var creadas = o.inspeccionesCreadas || [];
    var filasAlcance = o.alcances.map(function(a) {
      var ya = creadas.filter(function(c) { return c.alcance === a; });
      if (ya.length) {
        return '<div class="btn-row" style="margin-top:6px">' +
          '<a class="btn-sec" style="text-decoration:none;text-align:center;flex:1" href="resultado.html?id=' + escHtml(ya[ya.length-1].inspeccionId) + '">' + escHtml(a) + ' — Ver inspección</a>' +
        '</div>';
      }
      var url = 'nueva-inspeccion.html?instalacionId=' + encodeURIComponent(o.instalacionId) + '&alcance=' + encodeURIComponent(a) + '&ofertaId=' + encodeURIComponent(id);
      return '<div class="btn-row" style="margin-top:6px">' +
        '<a class="btn-ok" style="text-decoration:none;text-align:center;flex:1" href="' + url + '">Crear inspección ' + escHtml(a) + '</a>' +
      '</div>';
    }).join('');
    crearInspHtml = '<div class="sec-label">Inspecciones</div><div class="form-card">' + filasAlcance + '</div>';
  }

  document.getElementById('content').innerHTML =
    '<div class="form-card det-block">' +
      '<span class="badge ' + (BADGES[o.estado] || 'badge-borrador') + '">' + (LABELS[o.estado] || o.estado) + '</span>' +
      '<div style="margin-top:12px"><div class="det-label">Oferta nº</div>' +
        '<div class="det-val" style="font-size:16px;font-weight:700;color:var(--gold);font-family:monospace">' + escHtml(o.nOferta) + '</div></div>' +
      '<div><div class="det-label">Cliente</div><div class="det-val">' + escHtml(o.clienteNombre) + '</div></div>' +
      '<div><div class="det-label">Instalación</div><div class="det-val">' + escHtml(o.instalacionNombre || o.proyecto || '') + (o.alcances && o.alcances.length ? ' · ' + escHtml(o.alcances.join('/')) : '') + '</div></div>' +
      '<div><div class="det-label">Normas aplicables</div><div class="det-val" style="font-size:12px">' + escHtml(normasTxt) + '</div></div>' +
      '<div><div class="det-label">Fecha creación</div><div class="det-val">' + fecha + ' · ' + escHtml(o.creadoPorNombre || o.creadoPor || '') + '</div></div>' +
    '</div>' +
    crearInspHtml +
    '<div class="sec-label">Presupuesto</div>' +
    '<div class="form-card"><div class="partidas-wrap"><table class="partidas-table">' +
      '<thead><tr><th>Concepto</th><th style="text-align:right">€/ud.</th><th style="text-align:right">Uds.</th><th style="text-align:right">Subtotal</th></tr></thead>' +
      '<tbody>' + filas + '</tbody></table></div>' +
      '<div class="tot-row"><span>Total (sin IVA)</span><span>' + fmtEur(total) + '</span></div>' +
      (desc > 0
        ? '<div class="tot-row"><span>Descuento</span><span>– ' + fmtEur(desc) + '</span></div>' +
          '<div class="tot-row bold"><span>Total tras descuento</span><span>' + fmtEur(trasDes) + '</span></div>'
        : '') +
      '<div class="tot-row"><span>IVA (21%)</span><span>' + fmtEur(ivaImp) + '</span></div>' +
      '<div class="tot-row tot-iva"><span>TOTAL (con IVA)</span><span>' + fmtEur(conIva) + '</span></div>' +
    '</div>' +
    acciones;
}

function cambiarEstado(id, estado) {
  var upd = { estado: estado };
  if (estado === 'enviada') upd.fechaEnvio = firebase.firestore.FieldValue.serverTimestamp();
  db.collection('ofertas').doc(id).update(upd).then(function() {
    showToast('Estado actualizado');
    mostrarDetalle(id);
  }).catch(function(e) { showToast('Error: ' + e.message); });
}

function eliminarOferta(id) {
  if (!confirm('¿Eliminar esta oferta? No se puede deshacer.')) return;
  db.collection('ofertas').doc(id).delete().then(function() {
    showToast('Oferta eliminada');
    mostrarLista();
  });
}

function nuevaRevision(id) {
  if (!ofertaCache) return;
  var rev     = (ofertaCache.revision || 0) + 1;
  var nOferta = ofertaCache.nOferta.replace(/Rev\.\d+$/, 'Rev.' + rev);
  db.collection('ofertas').doc(id).update({
    revision: rev, nOferta: nOferta, estado: 'borrador',
    ultimaModificacion: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function() {
    showToast('Rev.' + rev + ' creada');
    mostrarDetalle(id);
  }).catch(function(e) { showToast('Error: ' + e.message); });
}

function generarPDF(id) {
  db.collection('ofertas').doc(id).get().then(function(snap) {
    if (!snap.exists) return;
    buildPDF(snap.data());
  });
}

function buildPDF(o) {
  var jsPDF   = window.jspdf.jsPDF;
  var doc     = new jsPDF({ unit:'mm', format:'a4' });
  var W = 210, H = 297, ML = 20, MR = 20, CW = W - ML - MR;
  var GOLD    = [200, 153, 58];
  var DARK    = [26, 26, 26];
  var MUTED   = [138, 130, 120];
  var NPAGS   = 8;

  var fechaHoy   = new Date();
  var fechaStr   = fechaHoy.toLocaleDateString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric' });
  var mesStr     = fechaHoy.toLocaleString('es-ES', { month:'long' });
  var lugarFecha = 'Dos Hermanas, a ' + fechaHoy.getDate() + ' de ' + mesStr + ' de ' + fechaHoy.getFullYear();
  var nOferta    = o.nOferta || '';
  var clienteNom = o.clienteNombre || '';
  var proyecto   = o.instalacionNombre || o.proyecto || '';
  var rev        = 'Rev. ' + (o.revision || 0);

  function sf(style, size, color) {
    doc.setFont('helvetica', style || 'normal');
    doc.setFontSize(size || 10);
    doc.setTextColor.apply(doc, color || DARK);
  }
  function hline(y, x1, x2, color, lw) {
    doc.setLineWidth(lw || 0.4);
    doc.setDrawColor.apply(doc, color || GOLD);
    doc.line(x1 !== undefined ? x1 : ML, y, x2 !== undefined ? x2 : W - MR, y);
  }
  function footer(pag) {
    hline(H - 18, ML, W - MR, GOLD, 0.5);
    sf('bold', 10, GOLD);
    doc.text('ARP', ML + 8, H - 8, { align:'center' });
    sf('normal', 7, MUTED);
    doc.text('Domicilio fiscal C/Gabriel Miró 3, Edificio Wertice, Planta 1ª Puerta 4', W / 2, H - 13, { align:'center' });
    doc.text('41704 Dos Hermanas, Sevilla', W / 2, H - 9, { align:'center' });
    doc.text('Info@arpprevencion.com   www.arpprevencion.com', W / 2, H - 5, { align:'center' });
    doc.text('Página ' + pag + ' de ' + NPAGS, W - MR, H - 5, { align:'right' });
  }
  function pageHeader(pag) {
    doc.setDrawColor.apply(doc, GOLD);
    doc.setLineWidth(0.5);
    doc.rect(ML, 15, CW, 22);
    doc.line(ML + 28, 15, ML + 28, 37);
    doc.line(W - MR - 32, 15, W - MR - 32, 37);
    sf('bold', 12, GOLD); doc.text('ARP', ML + 14, 29, { align:'center' });
    sf('bold', 10, DARK); doc.text('OFERTA ECONÓMICA', ML + 28 + (CW - 60) / 2, 23, { align:'center' });
    sf('bold',  8, DARK); doc.text('CERTIFICACIÓN RESPECTO A NORMA', ML + 28 + (CW - 60) / 2, 31, { align:'center' });
    sf('normal', 7, DARK);
    doc.text(rev,               W - MR - 16, 21, { align:'center' });
    doc.text('Fecha: ' + fechaStr, W - MR - 16, 27, { align:'center' });
    doc.text('Pág. ' + pag + ' / ' + NPAGS, W - MR - 16, 33, { align:'center' });
    return 44;
  }
  function justifiedText(text, x, y, maxW, lh) {
    var paras = text.split('\n\n').map(function(p) { return p.replace(/\s+/g, ' ').trim(); }).filter(Boolean);
    paras.forEach(function(para, pi) {
      var lines = doc.splitTextToSize(para, maxW);
      lines.forEach(function(line, li) {
        var words = line.trim().split(' ').filter(Boolean);
        if (li === lines.length - 1 || words.length <= 1) {
          doc.text(line.trim(), x, y);
        } else {
          var ww   = words.reduce(function(s, w) { return s + doc.getTextWidth(w); }, 0);
          var gap  = (maxW - ww) / (words.length - 1);
          var cx   = x;
          words.forEach(function(w) { doc.text(w, cx, y); cx += doc.getTextWidth(w) + gap; });
        }
        y += lh;
      });
      if (pi < paras.length - 1) y += lh;
    });
    return y;
  }
  function bullet(items, x, y, maxW, lh) {
    items.forEach(function(item) {
      doc.setFillColor.apply(doc, GOLD);
      doc.circle(x + 2.5, y - 1.8, 0.9, 'F');
      var lines = doc.splitTextToSize(item, maxW - 7);
      doc.text(lines, x + 6, y);
      y += lines.length * lh + 1;
    });
    return y;
  }

  // ── PAG 1: PORTADA ──────────────────────────────────────────────────────
  doc.setFillColor.apply(doc, GOLD);
  doc.rect(ML, 15, CW, 1, 'F');

  sf('bold', 9, MUTED);
  doc.text('Domicilio fiscal C/Gabriel Miró 3, Edificio Wertice, Planta 1ª Puerta 4', W - MR, 20, { align:'right' });
  doc.text('41704 Dos Hermanas, Sevilla', W - MR, 24, { align:'right' });
  doc.text('Info@arpprevencion.com   www.arpprevencion.com', W - MR, 28, { align:'right' });

  sf('bold', 30, GOLD); doc.text('ARP', ML + 15, 40);

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#C8993A">
  <title>Instalaciones - ARP</title>
  <style>
    :root{--gold:#C8993A;--dark:#1A1A1A;--surf:#F5F3EF;--border:#E2DDD5;--text:#2C2C2C;--muted:#8A8278;--red:#C0392B;--green:#27AE60;--orange:#E67E22;}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--surf);color:var(--text);min-height:100vh}
    .app-header{background:var(--dark);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
    .btn-back{background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer;padding:0;line-height:1}
    .hdr-mark{width:30px;height:30px;background:var(--gold);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white}
    .hdr-title{color:white;font-size:15px;font-weight:600;flex:1}
    .content{padding:16px;max-width:680px;margin:0 auto;padding-bottom:40px}
    .filtros{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
    .filtro-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .filtro-btn{padding:5px 12px;border:1.5px solid var(--border);border-radius:20px;background:white;font-family:inherit;font-size:11px;font-weight:600;color:var(--text);cursor:pointer;transition:all 0.15s}
    .filtro-btn.active{background:var(--gold);color:white;border-color:var(--gold)}
    .card{background:white;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
    .row-info{flex:1;min-width:0}
    .row-title{font-size:13px;font-weight:600;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px;text-transform:uppercase;flex-shrink:0}
    .badge-sinf{background:#F5F5F5;color:var(--muted)}
    .badge-12m{background:#FFF8E1;color:var(--orange)}
    .badge-2a{background:#FFEBEE;color:var(--red)}
    .empty-state{text-align:center;color:var(--muted);font-size:13px;padding:24px}
    .contador{font-size:12px;color:var(--muted);margin-bottom:10px}
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<div class="app-header">
  <button class="btn-back" onclick="location.href='admin.html'">&#8592;</button>
  <div class="hdr-mark">ARP</div>
  <div class="hdr-title">Instalaciones pendientes</div>
</div>

<div class="content" id="content">
  <div class="spinner"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="utils.js"></script>
<script>
  if (!firebase.apps.length) {
    firebase.initializeApp({
      apiKey:"AIzaSyDncKj2_RBJWgzzjOn2079x47pf_ycGFlc",
      authDomain:"arp-inspecciones.firebaseapp.com",
      projectId:"arp-inspecciones",
      storageBucket:"arp-inspecciones.firebasestorage.app",
      messagingSenderId:"35880168451",
      appId:"1:35880168451:web:090e3c250b4416ed0b3236"
    });
  }
  var auth = firebase.auth();
  var db = firebase.firestore();
  var instData = [];
  var filtroActivo = '12m';

  function fechaHace(meses) { var d = new Date(); d.setMonth(d.getMonth()-meses); return d.toISOString().slice(0,10); }

  initAuth({
    roles: ['admin', 'director', 'proyecto'],
    onReady: function(user, ud) { cargar(); }
  });

  function cargar() {
    db.collection('instalaciones').get().then(function(snap) {
      instData = [];
      snap.forEach(function(d) {
        var data = d.data();
        if (data.activo !== false) instData.push(Object.assign({ id: d.id }, data));
      });
      renderFiltros();
      render();
    }).catch(function(e) {
      document.getElementById('content').innerHTML = '<div class="empty-state">Error: ' + escHtml(e.message) + '</div>';
    });
  }

  function renderFiltros() {
    var filtrosHtml = '<div class="filtros">' +
      '<span class="filtro-label">Sin inspección en</span>' +
      '<button class="filtro-btn' + (filtroActivo==='12m'?' active':'') + '" onclick="setFiltro(\'12m\',this)">12 meses</button>' +
      '<button class="filtro-btn' + (filtroActivo==='24m'?' active':'') + '" onclick="setFiltro(\'24m\',this)">2 años</button>' +
      '<button class="filtro-btn' + (filtroActivo==='todas'?' active':'') + '" onclick="setFiltro(\'todas\',this)">Todas</button>' +
      '</div>';
    document.getElementById('content').innerHTML = filtrosHtml + '<div id="lista"></div>';
  }

  function render() {
    var PEND = '__PENDIENTE__';
    var umbral = filtroActivo === '12m' ? fechaHace(12) : filtroActivo === '24m' ? fechaHace(24) : null;
    var relevantes = instData.filter(function(i) {
      var u = i.ultimaInspeccion;
      if (!u || u === PEND) return true;
      if (!umbral) return true;
      return u <= umbral;
    }).sort(function(a,b) {
      var ua = (!a.ultimaInspeccion || a.ultimaInspeccion===PEND) ? '0000' : a.ultimaInspeccion;
      var ub = (!b.ultimaInspeccion || b.ultimaInspeccion===PEND) ? '0000' : b.ultimaInspeccion;
      return ua < ub ? -1 : ua > ub ? 1 : 0;
    });

    var html = '<div class="contador">' + relevantes.length + ' instalación' + (relevantes.length!==1?'es':'') + '</div>';
    if (!relevantes.length) {
      html += '<div class="card"><div class="empty-state">Todas las instalaciones están al día.</div></div>';
    } else {
      relevantes.slice(0,50).forEach(function(i) {
        var u = i.ultimaInspeccion;
        var sinFecha = !u || u === PEND;
        var hace24m = fechaHace(24);
        var badgeClass = sinFecha ? 'badge-sinf' : u <= hace24m ? 'badge-2a' : 'badge-12m';
        var badgeTxt  = sinFecha ? 'Sin dato' : u <= hace24m ? '+2 años' : '+12 m';
        html += '<div class="card">' +
          '<div class="row-info">' +
          '<div class="row-title">' + escHtml(i.nombre || i.id) + (i.codigo ? ' &middot; ' + escHtml(i.codigo) : '') + '</div>' +
          '<div class="row-sub">Última: ' + (sinFecha ? 'sin fecha' : escHtml(u)) + (i.provincia ? ' &middot; ' + escHtml(i.provincia) : '') + '</div>' +
          '</div>' +
          '<span class="badge ' + badgeClass + '">' + badgeTxt + '</span>' +
          '</div>';
      });
      if (relevantes.length > 50) {
        html += '<div class="empty-state">Mostrando las 50 más antiguas de ' + relevantes.length + '.</div>';
      }
    }
    document.getElementById('lista').innerHTML = html;
  }

  window.setFiltro = function(f, btn) {
    filtroActivo = f;
    document.querySelectorAll('.filtro-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    render();
  };
</script>
</body>
</html>

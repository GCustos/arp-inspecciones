<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#C8993A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ARP">
  <link rel="manifest" href="manifest.json">
  <title>ARP Inspecciones</title>
  <style>
    :root {
      --gold: #C8993A;
      --dark: #1A1A1A;
      --surf: #F5F3EF;
      --border: #E2DDD5;
      --text: #2C2C2C;
      --muted: #8A8278;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--surf);
      color: var(--text);
      min-height: 100vh;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
      padding: 20px;
    }
    .logo {
      width: 88px; height: 88px;
      background: var(--gold);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
      color: white;
      box-shadow: 0 8px 24px rgba(200,153,58,0.3);
    }
    .app-name {
      font-size: 26px;
      font-weight: 700;
      color: var(--dark);
      margin-top: 8px;
    }
    .app-sub {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
    }
    .btn-login {
      margin-top: 24px;
      padding: 15px 32px;
      background: var(--gold);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(200,153,58,0.3);
      transition: all 0.2s;
    }
    .btn-login:hover { transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }
    .user-info {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }
    .user-info.visible { display: flex; }
    .user-avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 3px solid var(--gold);
    }
    .user-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--dark);
    }
    .user-email {
      font-size: 13px;
      color: var(--muted);
    }
    .btn-enter {
      padding: 14px 40px;
      background: var(--dark);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-logout {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 4px;
    }
    .loading {
      font-size: 14px;
      color: var(--muted);
      margin-top: 20px;
    }
    .offline-badge {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--dark);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      display: none;
    }
    .offline-badge.visible { display: block; }
  </style>
</head>
<body>

<div class="splash">
  <div class="logo">ARP</div>
  <div class="app-name">ARP Inspecciones</div>
  <div class="app-sub">Sistema de gestión de inspecciones<br>ARP Prevención S.L.</div>

  <button class="btn-login" id="btnLogin" onclick="loginGoogle()">
    <svg width="20" height="20" viewBox="0 0 48 48">
      <path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"/>
      <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.8 13.6-4.7l-6.3-5.2C29.4 35.6 26.8 36 24 36c-5.2 0-9.6-2.9-11.7-7.2l-6.5 5C9.5 39.5 16.3 44 24 44z"/>
      <path fill="#1976D2" d="M43.6 20H24v8h11.3c-.9 2.4-2.5 4.4-4.6 5.8l6.3 5.2C40.8 35.7 44 30.3 44 24c0-1.3-.1-2.7-.4-4z"/>
    </svg>
    Entrar con Google
  </button>

  <div class="user-info" id="userInfo">
    <img class="user-avatar" id="userAvatar" src="" alt="avatar">
    <div class="user-name" id="userName"></div>
    <div class="user-email" id="userEmail"></div>
    <button class="btn-enter" onclick="enterApp()">Entrar a la app →</button>
    <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
  </div>

  <div class="loading" id="loadingMsg">Cargando...</div>
</div>

<div class="offline-badge" id="offlineBadge">Sin conexión — modo offline</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDncKj2_RBJWgzzjOn2079x47pf_ycGFlc",
    authDomain: "arp-inspecciones.firebaseapp.com",
    projectId: "arp-inspecciones",
    storageBucket: "arp-inspecciones.firebasestorage.app",
    messagingSenderId: "35880168451",
    appId: "1:35880168451:web:090e3c250b4416ed0b3236"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  onAuthStateChanged(auth, user => {
    document.getElementById('loadingMsg').style.display = 'none';
    if (user) {
      mostrarUsuario(user);
    } else {
      document.getElementById('btnLogin').style.display = 'flex';
      document.getElementById('userInfo').classList.remove('visible');
    }
  });

  function mostrarUsuario(user) {
    document.getElementById('btnLogin').style.display = 'none';
    document.getElementById('userInfo').classList.add('visible');
    document.getElementById('userAvatar').src = user.photoURL || '';
    document.getElementById('userName').textContent = user.displayName || '';
    document.getElementById('userEmail').textContent = user.email || '';
  }

  window.loginGoogle = async () => {
    try {
      const result = await signInWithPopup(auth, provider);
      mostrarUsuario(result.user);
    } catch (e) {
      console.error('Error login:', e.code, e.message);
      if (e.code === 'auth/popup-blocked') {
        alert('Tu navegador bloqueó la ventana. Permite popups para este sitio e inténtalo de nuevo.');
      } else {
        alert('Error: ' + e.message);
      }
    }
  };

  window.logout = async () => { await signOut(auth); };
  window.enterApp = () => { window.location.href = 'app.html'; };

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/arp-inspecciones/sw.js')
      .catch(e => console.log('SW error:', e));
  }

  function updateOnlineStatus() {
    document.getElementById('offlineBadge').classList.toggle('visible', !navigator.onLine);
  }
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  updateOnlineStatus();
</script>


</body>
</html>

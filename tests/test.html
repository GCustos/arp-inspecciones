<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ARP — Tests</title>
  <style>
    body { font-family: monospace; background: #1A1A1A; color: #eee; padding: 24px; }
    h1 { color: #C8993A; margin-bottom: 20px; font-size: 16px; }
    .suite { margin-bottom: 24px; }
    .suite-name { color: #C8993A; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
    .test { padding: 5px 10px; border-radius: 4px; font-size: 12px; margin-bottom: 4px; }
    .pass { background: rgba(39,174,96,.15); color: #27AE60; }
    .fail { background: rgba(192,57,43,.2); color: #E74C3C; }
    .summary { margin-top: 24px; font-size: 14px; font-weight: bold; padding: 12px 16px; border-radius: 8px; }
    .all-pass { background: rgba(39,174,96,.2); color: #27AE60; }
    .has-fail { background: rgba(192,57,43,.2); color: #E74C3C; }
  </style>
</head>
<body>
<h1>ARP Inspecciones — Tests</h1>
<div id="output"></div>

<!-- utils.js sin Firebase (las funciones puras no lo necesitan) -->
<script>
// ── Mocks mínimos para que utils.js no explote sin Firebase ──
var firebase = { apps: [], auth: function(){ return {}; }, firestore: function(){ return {}; } };
var auth = { onAuthStateChanged: function(){} };
var db = { collection: function(){ return { doc: function(){ return { get: function(){ return Promise.resolve({}); } }; } }; } };
</script>
<script src="../utils.js"></script>

<script>
// ── Framework de test mínimo ──
var results = [];
function suite(name) { results.push({ type:'suite', name }); }
function test(desc, fn) {
  try {
    fn();
    results.push({ type:'pass', desc });
  } catch(e) {
    results.push({ type:'fail', desc, msg: e.message });
  }
}
function expect(val) {
  return {
    toBe: function(expected) {
      if (val !== expected) throw new Error('Esperado: ' + JSON.stringify(expected) + '\n  Obtenido: ' + JSON.stringify(val));
    },
    toContain: function(sub) {
      if (String(val).indexOf(sub) === -1) throw new Error('Esperado que contenga: ' + sub + '\n  Obtenido: ' + val);
    },
    toBeTruthy: function() {
      if (!val) throw new Error('Esperado truthy, obtenido: ' + val);
    },
    toBeFalsy: function() {
      if (val) throw new Error('Esperado falsy, obtenido: ' + val);
    }
  };
}

// ── Helper: getNRegistro replicado (igual que resultado.html) ──
function getNRegistro(D) {
  var cod = D.codigoInstalacion || 'SIN_COD';
  var alcance = D.tipoAlcance || 'PAA';
  var p = (D.fechaInspeccion || '').split('-');
  var fechaCod = p.length === 3 ? p[0].slice(2) + p[1] + p[2] : '';
  var rev = D.revision !== undefined ? D.revision : 0;
  return fechaCod ? (cod + '/' + alcance + '/' + fechaCod + '/Rev' + rev) : (D.nRegistro || '');
}

// ── Helper: corregirFechaNRegistro replicado (igual que inspeccion.html) ──
function corregirFechaNRegistro(nRegistro, fechaISO) {
  if (!nRegistro || !fechaISO) return nRegistro;
  var p = fechaISO.split('-');
  if (p.length !== 3) return nRegistro;
  var aammdd = p[0].slice(2) + p[1] + p[2];
  return nRegistro.replace(/\/\d{6}\//, '/' + aammdd + '/');
}

// ══════════════════════════════════════════
// SUITES
// ══════════════════════════════════════════

suite('escHtml — protección XSS');
test('escapa < y >', function() {
  expect(escHtml('<script>')).toBe('&lt;script&gt;');
});
test('escapa comillas dobles', function() {
  expect(escHtml('"hola"')).toBe('&quot;hola&quot;');
});
test('escapa &', function() {
  expect(escHtml('A&B')).toBe('A&amp;B');
});
test('null y undefined devuelven string vacío', function() {
  expect(escHtml(null)).toBe('');
  expect(escHtml(undefined)).toBe('');
});
test('texto normal no cambia', function() {
  expect(escHtml('ARP Prevención')).toBe('ARP Prevención');
});

suite('fmtFecha — formato de fecha');
test('convierte YYYY-MM-DD a DD/MM/YYYY', function() {
  expect(fmtFecha('2026-07-01')).toBe('01/07/2026');
});
test('devuelve vacío si no hay fecha', function() {
  expect(fmtFecha('')).toBe('');
  expect(fmtFecha(null)).toBe('');
});
test('devuelve original si formato incorrecto', function() {
  expect(fmtFecha('01/07/2026')).toBe('01/07/2026');
});

suite('getNRegistro — cálculo desde campos');
test('Rev.0 genera formato correcto', function() {
  var D = { codigoInstalacion:'PPB', tipoAlcance:'PAA', fechaInspeccion:'2026-07-01', revision:0 };
  expect(getNRegistro(D)).toBe('PPB/PAA/260701/Rev0');
});
test('Rev.1 usa misma fecha, distinto Rev', function() {
  var D = { codigoInstalacion:'PPB', tipoAlcance:'PAA', fechaInspeccion:'2026-07-01', revision:1, nRegistro:'PPB/PAA/260630/Rev1' };
  expect(getNRegistro(D)).toBe('PPB/PAA/260701/Rev1');
});
test('ignora nRegistro guardado si fechaInspeccion es válida', function() {
  var D = { codigoInstalacion:'PPB', tipoAlcance:'PAA', fechaInspeccion:'2026-07-01', revision:1, nRegistro:'PPB/PAA/260630/Rev1' };
  expect(getNRegistro(D)).not === 'PPB/PAA/260630/Rev1';
  expect(getNRegistro(D)).toBe('PPB/PAA/260701/Rev1');
});
test('fallback a nRegistro si no hay fechaInspeccion', function() {
  var D = { nRegistro:'PPB/PAA/260701/Rev1' };
  expect(getNRegistro(D)).toBe('PPB/PAA/260701/Rev1');
});

suite('corregirFechaNRegistro — corrección de fecha en nRegistro');
test('corrige la fecha manteniendo Rev', function() {
  expect(corregirFechaNRegistro('PPB/PAA/260630/Rev0', '2026-07-01')).toBe('PPB/PAA/260701/Rev0');
});
test('no toca el nRegistro si fechaISO está vacía', function() {
  expect(corregirFechaNRegistro('PPB/PAA/260630/Rev0', '')).toBe('PPB/PAA/260630/Rev0');
});
test('no toca el nRegistro si nRegistro está vacío', function() {
  expect(corregirFechaNRegistro('', '2026-07-01')).toBe('');
});

suite('slugify — generación de IDs');
test('convierte texto a slug', function() {
  var s = typeof slugify === 'function' ? slugify('Parque Aventura') : null;
  if (s === null) throw new Error('slugify no está en utils.js');
  expect(s).toContain('parque');
});

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
var out = document.getElementById('output');
var pass = 0, fail = 0, currentSuite = '';
results.forEach(function(r) {
  if (r.type === 'suite') {
    var d = document.createElement('div');
    d.className = 'suite';
    d.innerHTML = '<div class="suite-name">▸ ' + r.name + '</div>';
    out.appendChild(d);
    currentSuite = d;
  } else {
    var t = document.createElement('div');
    t.className = 'test ' + r.type;
    t.textContent = (r.type === 'pass' ? '✓ ' : '✗ ') + r.desc + (r.msg ? ' — ' + r.msg : '');
    var last = out.lastElementChild;
    if (last) last.appendChild(t);
    if (r.type === 'pass') pass++; else fail++;
  }
});
var sum = document.createElement('div');
sum.className = 'summary ' + (fail === 0 ? 'all-pass' : 'has-fail');
sum.textContent = fail === 0
  ? '✓ Todos los tests pasan (' + pass + '/' + (pass+fail) + ')'
  : '✗ ' + fail + ' test(s) fallando — NO commitear';
out.appendChild(sum);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#C8993A">
  <title>Resultado - ARP</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    .app-header{background:var(--dark);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
    .res-header{border-radius:14px;padding:24px 20px;text-align:center;margin-bottom:16px}
    .res-header.favorable{background:linear-gradient(135deg,#1a3a2a,#1e4d35)}
    .res-header.desfavorable{background:linear-gradient(135deg,#3a1a1a,#4d1e1e)}
    .res-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px}
    .res-header.favorable .res-icon{background:rgba(39,174,96,0.25)}
    .res-header.desfavorable .res-icon{background:rgba(192,57,43,0.25)}
    .res-titulo{color:white;font-size:22px;font-weight:700;margin-bottom:4px}
    .res-ref{color:rgba(255,255,255,0.5);font-size:12px;font-family:monospace}
    .res-instalacion{color:rgba(255,255,255,0.8);font-size:14px;margin-top:8px}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
    .stat-box{background:white;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
    .stat-num{font-size:28px;font-weight:700;color:var(--gold)}
    .stat-label{font-size:11px;color:var(--muted);margin-top:2px}
    .nc-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
    .nc-item:last-child{border-bottom:none}
    .nc-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;flex-shrink:0}
    .btn-pdf{width:100%;padding:15px;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s}
    .btn-informe{background:var(--gold);color:white;box-shadow:0 4px 12px rgba(200,153,58,.3)}
    .btn-informe:hover{opacity:.9}
    .btn-certificado{background:#1e4d35;color:white;box-shadow:0 4px 12px rgba(39,174,96,.2)}
    .btn-certificado:hover{opacity:.9}
    .btn-registro{background:var(--dark);color:white}
    .btn-registro:hover{opacity:.9}
    .btn-disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
    .info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--surf);font-size:13px}
    .info-label{color:var(--muted);font-size:12px}
    .sesion-item{font-size:12px;color:var(--muted);padding:3px 0}
    .alert-offline{background:#FFF9F0;border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12px;display:none}
    .alert-offline.vis{display:block}
    .generating{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
    .generating.vis{display:flex}
    .generating-text{color:white;font-size:15px;font-weight:600}
    .generating-sub{color:rgba(255,255,255,.6);font-size:12px}
  </style>
</head>
<body>

<div class="app-header">
  <button class="btn-back" onclick="volverAtras()">&#8592;</button>
  <div class="hdr-title" id="hdrTitulo">Resultado</div>
</div>

<div class="content">
  <div class="alert-offline" id="alertOffline">

  </div>
  <div id="mainContent">

  </div>
</div>

  initAuth({
    onReady: function(user, ud) { cargarDatos(); }
  });

  setTimeout(async () => {
    if (D) return;
    const local = localStorage.getItem('insp_' + inspeccionId);
    if (local) {
      try {
        D = JSON.parse(local);
        D_actual = D;
        document.getElementById('alertOffline').classList.add('vis');
        CONFIG = CONFIG_DEFAULT;
        renderResultado();
        return;
      } catch(e) {}
    }
    // Sin datos tras 4s — mostrar error en lugar de spinner eterno
    document.getElementById('mainContent').innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--muted)"><div style="font-size:40px;margin-bottom:12px">&#9888;</div><div style="font-size:14px;margin-bottom:16px">No se pudo cargar el resultado.<br>Verifica tu conexión e inténtalo de nuevo.</div><button onclick="location.reload()" style="padding:10px 20px;background:var(--gold);color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer">Reintentar</button><br><br><a href=\"inspecciones.html\" style="color:var(--muted);font-size:13px">&#8592; Volver</a></div>';
  }, 4000);

  async function cargarDatos() {
    try {
      // Cargar configuración
      try {
        const [ceSnap, paaSnap, dirSnap] = await Promise.all([
          db.collection('config').doc('empresa').get(),
          db.collection('config').doc('paa').get(),
          db.collection('config').doc('director').get()
        ]);
        CONFIG = {
          empresa:  ceSnap.exists  ? ceSnap.data()  : CONFIG_DEFAULT.empresa,
          paa:      paaSnap.exists ? paaSnap.data() : CONFIG_DEFAULT.paa,
          director: dirSnap.exists ? dirSnap.data() : CONFIG_DEFAULT.director
        };
      } catch(e) {
        CONFIG = CONFIG_DEFAULT;
      }

      // Cargar inspección
      const snap = await db.collection('inspecciones').doc(inspeccionId).get();
      if (!snap.exists) { document.getElementById('mainContent').innerHTML = '<p style="color:var(--red);padding:20px">Inspección no encontrada.</p>'; return; }
      D = { id: snap.id, ...snap.data() };
      // Normalizar circuitos: nuevo formato = mapa {id: circData}, legacy = array
      if (D.circuitos && !Array.isArray(D.circuitos))
        D.circuitos = Object.values(D.circuitos).sort(function(a,b){ return (a.orden||0)-(b.orden||0); });
      D_actual = D;

      // Guardar snapshot en localStorage (triple backup)
      try { localStorage.setItem('insp_' + inspeccionId, JSON.stringify(D)); } catch(e) {}

      if (!navigator.onLine) document.getElementById('alertOffline').classList.add('vis');
      renderResultado();
    } catch(e) {
      // Intentar desde localStorage
      const local = localStorage.getItem('insp_' + inspeccionId);
      if (local) {
        try {
          D = JSON.parse(local);
          if (D.circuitos && !Array.isArray(D.circuitos))
            D.circuitos = Object.values(D.circuitos).sort(function(a,b){ return (a.orden||0)-(b.orden||0); });
          D_actual = D;
          CONFIG = CONFIG_DEFAULT;
          document.getElementById('alertOffline').classList.add('vis');
          renderResultado();
        } catch(e2) {
          document.getElementById('mainContent').innerHTML = '<p style="color:var(--red);padding:20px">Error cargando datos: ' + e.message + '</p>';
        }
      }
    }
  }

  function volverAtras() {
    if (D) location.href = 'inspeccion.html?id=' + inspeccionId;
    else location.href = 'inspecciones.html';
  }

  function renderResultado() {
    if (!D) return;
    const favorable = D.resultado === 'FAVORABLE';
    const ncs = (D.ncs || []).filter(n => n.prio && n.prio !== 'OBSERVACION');
    const obs = (D.ncs || []).filter(n => n.prio === 'OBSERVACION');
    const totalJuegos = (D.circuitos || []).reduce((s,c) => s + (c.juegos||[]).filter(j => j.tipo === 'R').length, 0);
    const totalAux = (D.circuitos || []).reduce((s,c) => s + (c.juegos||[]).filter(j => j.tipo !== 'R').length, 0);
    const juegosOk = (D.circuitos || []).reduce((s,c) =>
      s + (c.juegos||[]).filter(j => j.tipo === 'R' && ['ie','af','ej','ra','zs'].every(k => j[k]==='S'||j[k]==='NA')).length, 0);
    const juegosNC = (D.circuitos || []).reduce((s,c) =>
      s + (c.juegos||[]).filter(j => j.tipo === 'R' && ['ie','af','ej','ra','zs'].some(k => j[k]==='N')).length, 0);
    const auxOk = (D.circuitos || []).reduce((s,c) =>
      s + (c.juegos||[]).filter(j => j.tipo !== 'R' && ['ie','af','ej','ra','zs'].every(k => j[k]==='S'||j[k]==='NA')).length, 0);
    const auxNC = (D.circuitos || []).reduce((s,c) =>
      s + (c.juegos||[]).filter(j => j.tipo !== 'R' && ['ie','af','ej','ra','zs'].some(k => j[k]==='N')).length, 0);
    const ncsGenerales = (D.ncs || []).filter(n => n.prio && n.prio !== 'OBSERVACION' && n.autoId && n.autoId.startsWith('g')).length;

    document.getElementById('hdrTitulo').textContent = D.nombreInstalacion || 'Resultado';

    const sesiones = (function() {
      const src = D.sesiones && D.sesiones.length ? D.sesiones : [];
      const ses = src.filter(s => s.horaInicio || s.horaFin);
      if (!ses.length) return `<div class="sesion-item">📅 ${D.fechaInspeccion||'Sin fecha'}</div>`;
      return ses.map(s => `<div class="sesion-item">📅 ${s.fecha||'Sin fecha'} · ${s.horaInicio||'--'}–${s.horaFin||'--'}</div>`).join('');
    })();

    // Agrupar NCs por tipo+prio para mostrar resumen
    const ncGrupos = {};
    ncs.forEach(nc => {
      const key = (nc.tipo||'Sin tipo') + '|' + nc.prio;
      if (!ncGrupos[key]) ncGrupos[key] = { tipo: nc.tipo||'Sin tipo', prio: nc.prio, items: [] };
      ncGrupos[key].items.push(getNcElem(nc));
    });

    const allNcsDisplay = (D.ncs||[]).filter(n=>n.prio).map(nc => {
      const cerrada = nc.cerrada;
      return `<div class="nc-item" style="${cerrada?'opacity:.5':''}">
        <span class="nc-badge p-${nc.prio}">${nc.prio}</span>
        <div style="flex:1">
          <div style="font-weight:600;font-size:12px;${cerrada?'text-decoration:line-through':''}">${nc.tipo||'Sin tipo'}</div>
          <div style="font-size:11px;color:var(--muted)">${getNcElem(nc)}${nc.desc?' — '+nc.desc:''}</div>
          ${cerrada?'<div style="font-size:10px;color:var(--green);font-weight:600">✓ CERRADA — '+( nc.resolucion||'Resuelta')+'</div>':''}
        </div>
      </div>`;
    }).join('') || '<div style="font-size:13px;color:var(--muted);padding:8px 0">Sin no conformidades.</div>';
    const ncHtml = allNcsDisplay;

    document.getElementById('mainContent').innerHTML = `
      <div class="res-header ${favorable?'favorable':'desfavorable'}">
        <div class="res-icon">${favorable?'✓':'!'}</div>
        <div class="res-titulo">${favorable?'FAVORABLE':'DESFAVORABLE'}</div>
        <div class="res-ref">${getNRegistro()||D.id}</div>
        <div class="res-instalacion">${D.nombreInstalacion||''}</div>
      </div>

      <div class="stats-grid" style="grid-template-columns:repeat(5,1fr)">
        <div class="stat-box"><div class="stat-num">${totalJuegos}</div><div class="stat-label">Juegos</div></div>
        <div class="stat-box"><div class="stat-num">${totalAux}</div><div class="stat-label">Aux.</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--green)">${juegosOk} / ${auxOk}</div><div class="stat-label">Conformes</div></div>
        <div class="stat-box"><div class="stat-num" style="color:${(juegosNC+auxNC)?'var(--red)':'var(--green)'}">${juegosNC} / ${auxNC}</div><div class="stat-label">Con NC</div></div>
        <div class="stat-box"><div class="stat-num" style="color:${ncsGenerales?'var(--red)':'var(--green)'}">${ncsGenerales}</div><div class="stat-label">NC Gen.</div></div>
      </div>

      <div class="card">
        <div class="card-title">Sesiones</div>
        ${sesiones}
      </div>

      <div class="card">
        <div class="card-title">No conformidades</div>
        ${ncHtml}
        ${obs.length?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)">${obs.length} observación${obs.length>1?'es':''} (no bloquean certificado)</div>`:''}
      </div>

      ${viendoRevisionIdx!==null?`<div class="alert-offline vis" style="background:#FFF3E0;border-color:var(--orange)">&#9888; Viendo Rev.${D.revision} (histórica) — <a href="#" onclick="volverActual();return false;" style="color:var(--orange);font-weight:600">volver a la versión actual</a></div>`:''}

      <div class="card">
        <div class="card-title">Generar documentos ${viendoRevisionIdx!==null?'(Rev.'+D.revision+')':''}</div>
        <button class="btn-pdf btn-informe" onclick="generarInforme()">
          &#128196; Generar Informe PDF
        </button>
        <button class="btn-pdf ${favorable?'btn-certificado':'btn-disabled'}" onclick="${favorable?'generarCertificado()':'void(0)'}">
          &#127941; ${favorable?'Generar Certificado PDF':'Certificado (solo FAVORABLE)'}
        </button>
        <button class="btn-pdf btn-registro" onclick="generarRegistro()">
          &#128203; Generar Registro
        </button>
        ${(D.ncs||[]).filter(function(n){return n.prio&&n.prio!=='OBSERVACION';}).length?`<button class="btn-pdf" style="background:#2C3E50;color:white;" onclick="generarPlanCorrecciones()">&#9998; Plan de Correcciones (cliente)</button>`:''}
      </div>

      ${(D_actual.historialRevisiones&&D_actual.historialRevisiones.length)?`
      <div class="card">
        <div class="card-title">Historial de revisiones</div>
        ${D_actual.historialRevisiones.map((r,idx)=>`
          <div class="info-row">
            <span>Rev.${r.revision} — ${r.resultado||'?'} ${r.fechaCompletada?('· '+new Date(r.fechaCompletada).toLocaleDateString('es-ES')):''}</span>
            <a href="#" onclick="verRevisionHistorica(${idx});return false;" style="color:var(--gold);font-weight:600;font-size:12px">Ver / Descargar &#8594;</a>
          </div>`).join('')}

  // Colores
  // Resuelve el nombre del elemento de una NC.
  // Formato nuevo: nc.juegoId → busca por ID estable (inmune a reordenación).
  // Fallback legacy: nc._ci / nc._ji para inspecciones antiguas.
  function getNcElem(nc) {
    if (D && D.circuitos) {
      var circs = Array.isArray(D.circuitos) ? D.circuitos : Object.values(D.circuitos);
      // Formato nuevo: buscar juego por ID estable
      if (nc.juegoId) {
        var matches = [];
        for (var c of circs) {
          for (var j of (c.juegos||[])) {
            if (j.id === nc.juegoId) matches.push(c.nombre + ' — ' + (j.nombre || 'Juego'));
          }
        }
        if (matches.length === 1) return matches[0];
        // juegoId duplicado (datos corruptos): usar elem almacenado como referencia
        if (matches.length > 1) return nc.elem || matches[0];
      }
      // Fallback legacy: índices posicionales _ci/_ji
      if (nc._ci !== undefined && nc._ci !== 'g' && nc._ji !== undefined) {
        var circ = circs[nc._ci];
        var juego = circ && circ.juegos && circ.juegos[nc._ji];
        if (circ && juego) return circ.nombre + ' — ' + (juego.nombre || ('Juego ' + (nc._ji + 1)));
      }
    }
    return nc.elem || '';
  }

  function fitImage(doc, src, maxW, maxH) {
    try {
      var props = doc.getImageProperties(src);
      var ratio = props.width / props.height;
      var w, h;
      if (ratio > maxW / maxH) { w = maxW; h = maxW / ratio; }
      else { h = maxH; w = maxH * ratio; }
      return { w: w, h: h };
    } catch(e) {

  }

  function composeDireccion(d) {
    var parts = [];
    if (d.direccion) parts.push(d.direccion);
    var loc = '';
    if (d.cp) loc += d.cp + ' ';
    if (d.localidad) loc += d.localidad;
    if (loc.trim()) parts.push(loc.trim());
    if (d.municipio && d.municipio !== (d.localidad || '')) parts.push(d.municipio);

  // Helper: load image URL as base64 for jsPDF
  // IndexedDB helpers para leer fotos pendientes (copia ligera de inspeccion.html)
  var _fotosDB_res = null;
  function abrirFotosDB_res() {
    if (_fotosDB_res) return Promise.resolve(_fotosDB_res);
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open('arpFotosDB', 1);
      req.onupgradeneeded = function() { req.result.createObjectStore('fotosPendientes'); };
      req.onsuccess = function() { _fotosDB_res = req.result; resolve(_fotosDB_res); };
      req.onerror = function() { reject(req.error); };
    });
  }
  function leerFotoLocal_res(key) {
    return abrirFotosDB_res().then(function(db) {
      return new Promise(function(resolve, reject) {
        var tx = db.transaction('fotosPendientes', 'readonly');
        var req = tx.objectStore('fotosPendientes').get(key);
        req.onsuccess = function() { resolve(req.result || null); };
        req.onerror = function() { reject(req.error); };
      });
    });
  }

  function loadImageAsBase64(url, localKey) {
    function fromUrl(resolve) {
      if (!url || url.startsWith('data:')) { resolve(url || null); return; }
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const MAX_W = 1200, MAX_H = 900;
        let w = img.width, h = img.height;
        if (w > MAX_W || h > MAX_H) {
          const r = Math.min(MAX_W / w, MAX_H / h);
          w = Math.round(w * r); h = Math.round(h * r);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => resolve(null);
      img.src = url;
    }
    return new Promise((resolve) => {
      if (localKey) {
        leerFotoLocal_res(localKey).then(function(data) {
          if (data && data.dataUrl) { resolve(data.dataUrl); return; }
          fromUrl(resolve);
        }).catch(function() { fromUrl(resolve); });
        return;
      }
      fromUrl(resolve);
    });
  }

  // Helper: preload all photos in inspection data
  async function preloadFotos(data) {
    // Fotos generales
    const fotos = data.fotos || [];
    for (let i = 0; i < fotos.length; i++) {
      fotos[i].dataUrl = await loadImageAsBase64(fotos[i].url, fotos[i].localKey);
    }
    // Fotos por juego
    for (const circ of (data.circuitos || [])) {
      for (const j of (circ.juegos || [])) {
        for (let i = 0; i < (j.fotos || []).length; i++) {
          const f = j.fotos[i];
          j.fotos[i].dataUrl = await loadImageAsBase64(f.url, f.localKey);
        }
      }
    }
    // Fotos NCs
    for (const nc of (data.ncs || [])) {
      for (const arr of [nc.fotosDefecto || [], nc.fotosCorreccion || []]) {
        for (let i = 0; i < arr.length; i++) {
          const f = arr[i];
          arr[i].dataUrl = await loadImageAsBase64(f.url, f.localKey);
        }
      }
    }
  }

        doc.setFillColor(...SURF); doc.setDrawColor(...DARK); doc.setLineWidth(0.2);
        doc.rect(ML, y, CW, 7, 'FD');
        doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
        doc.text('Observaciones Generales', ML+2, y+4.5); y += 7;
        const obsLines = doc.splitTextToSize(D.obsGral, CW-4);
        const obsH = Math.max(20, obsLines.length * 5 + 4);
        doc.setFillColor(...WHITE); doc.rect(ML, y, CW, obsH, 'FD');
        doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
        doc.text(obsLines, ML+2, y+4); y += obsH + 4;
      }


      // ═══ INSPECCIÓN — CIRCUITOS Y JUEGOS ═══
      doc.addPage(); nPag[0]++;
      addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr, true);
      y = MT + 8;

      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('II. Específica Circuitos y Juegos', ML, y); y += 8;

      // Tabla por criterio — formato tabla independiente igual que I. General
      var ncNumGlobal = 0;
      for (const col of COLS_PDF) {
        const vArr = [];
        circuitos.forEach(circ => { (circ.juegos||[]).forEach(j => { if(j[col.key]) vArr.push(j[col.key]); }); });
        const hayN = vArr.includes('N');
        const allNA = vArr.length>0 && vArr.every(v=>v==='NA');
        const allS = vArr.length>0 && vArr.every(v=>v==='S'||v==='NA');
        var vGlobal = hayN?'N':allNA?'NA':allS?'S':'S';

        var ncsDelCol = (D.ncs||[]).filter(n => n.autoId && n.autoId.includes('_'+col.key));
        if (col.key === COLS_PDF[COLS_PDF.length-1].key) {
          (D.ncs||[]).forEach(function(n){ if(n.autoId && n.autoId.includes('_manual')) ncsDelCol.push(n); });
          (D.ncs||[]).forEach(function(n){ if(n.autoId && n.autoId.startsWith('g')) ncsDelCol.push(n); });
        }
        var ncsAbiertas = ncsDelCol.filter(function(n){ return !n.cerrada; });
        var todasCerradas = ncsDelCol.length > 0 && ncsAbiertas.length === 0;
        var _ncItemsFull = ncsDelCol.map(function(n){ ncNumGlobal++; return (n.cerrada?'(✓) ':'')+ncNumGlobal+'. '+(getNcElem(n)+(n.desc?' — '+n.desc:'')); });
        var notaCol = _ncItemsFull.slice(0,5).join(' ') + (_ncItemsFull.length > 5 ? ' ... y '+(_ncItemsFull.length-5)+' más (ver Listado)' : '');

        // Color fila según NC más grave ABIERTA del criterio
        const prioCol = ncsAbiertas.length ? ncsAbiertas.reduce((max,n) => {
          const ord = {GRAVE:4,MEDIA:3,LEVE:2,DOCUMENTAL:1,OBSERVACION:0};
          return (ord[n.prio]||0) > (ord[max]||0) ? n.prio : max;
        }, '') : '';
        const filaFondoCol = prioCol === 'GRAVE' ? [255,235,238]
          : prioCol === 'MEDIA'      ? [255,248,225]
          : prioCol === 'LEVE'       ? [232,245,233]
          : prioCol === 'DOCUMENTAL' ? [227,242,253]
          : WHITE;

        // CRÍTICO: setFont antes de splitTextToSize
        doc.setFontSize(8); doc.setFont('helvetica','normal');
        const descLinesCol = doc.splitTextToSize(col.desc, descW - 5);
        const notaLinesRaw = notaCol ? doc.splitTextToSize(notaCol, notasW - 4) : [];
        const MAX_NOTA_LINES = 10;
        const notaLinesCol = notaLinesRaw.slice(0, MAX_NOTA_LINES);
        if (notaLinesRaw.length > MAX_NOTA_LINES) notaLinesCol[MAX_NOTA_LINES - 1] += '…';
        const rowHcol = Math.max(14, Math.max(descLinesCol.length, notaLinesCol.length) * 4.5 + 6);

        if (y + 7 + rowHcol + 8 > PH-18) {
          doc.addPage(); nPag[0]++;
          addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr, true);
          y = MT+8;
        }

        doc.setDrawColor(...DARK); doc.setLineWidth(0.2);

        // Cabecera
        doc.setFillColor(...SURF);
        doc.rect(ML, y, CW, 7, 'FD');
        doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
        doc.text(`${col.ref} ${col.label}`, ML+2, y+4.8);
        doc.setFontSize(7);
        doc.text('SAT.', ML+descW+colSW/2, y+4.8, {align:'center'});
        doc.text('N.S.', ML+descW+colSW+colNsW/2, y+4.8, {align:'center'});
        doc.text('N.A.', ML+descW+colSW+colNsW+colNaW/2, y+4.8, {align:'center'});
        doc.text('NOTAS SI/NO OBSERVACIONES', ML+descW+colSW+colNsW+colNaW+2, y+4.8);
        y += 7;

        // Fila contenido con color según NC
        doc.setFillColor(...filaFondoCol);
        doc.rect(ML, y, CW, rowHcol, 'FD');
        doc.setDrawColor(...DARK);
        doc.line(ML+descW, y, ML+descW, y+rowHcol);
        doc.line(ML+descW+colSW, y, ML+descW+colSW, y+rowHcol);
        doc.line(ML+descW+colSW+colNsW, y, ML+descW+colSW+colNsW, y+rowHcol);
        doc.line(ML+descW+colSW+colNsW+colNaW, y, ML+descW+colSW+colNsW+colNaW, y+rowHcol);

        doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
        descLinesCol.forEach((l,i) => doc.text(l, ML+2, y+5+i*4.5));

        if (todasCerradas && vGlobal==='N') vGlobal = 'S';
        doc.setFontSize(11); doc.setFont('helvetica','bold');
        doc.setTextColor(...(todasCerradas ? GREEN_C : DARK));
        if (vGlobal==='S')  doc.text('X', ML+descW+colSW/2,                    y+rowHcol/2+2, {align:'center'});
        else if (vGlobal==='N')  doc.text('X', ML+descW+colSW+colNsW/2,        y+rowHcol/2+2, {align:'center'});
        else if (vGlobal==='NA') doc.text('X', ML+descW+colSW+colNsW+colNaW/2, y+rowHcol/2+2, {align:'center'});

        if (notaCol) {
          doc.setFontSize(7); doc.setFont('helvetica','normal');
          doc.setTextColor(...(todasCerradas ? GREEN_C : DARK));
          notaLinesCol.forEach((l,i) => doc.text(l, ML+descW+colSW+colNsW+colNaW+2, y+5+i*4.5));
        }
        y += rowHcol;

        doc.setFontSize(7); doc.setFont('helvetica','italic'); doc.setTextColor(...MUTED);
        doc.text('Sat. : Satisfactorio; N. S.: no satisfactorio; N.A.: no aplica', ML, y+3.5);
        y += 7;
      }


      // ═══ ANEXOS ═══
      doc.addPage(); nPag[0]++;
      indicePags['ANEXOS'] = nPag[0];
      addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
      y = MT + 8;

      doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(...GOLD);
      doc.text('ANEXOS', ML, y); y += 10;

      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('Documentos realizados por ADELL RIESGOS Y PREVENCIÓN, S.L:', ML, y); y += 6;

      const docs = ['Atestado de conformidad (en caso de que no haya situaciones de riesgo grave que subsanar)', 'Informe de inspección (presente documento)', 'Listado de Observaciones (a continuación)'];
      docs.forEach(d2 => {
        doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
        doc.text('— ' + d2, ML+4, y); y += 6;
      });
      y += 4;
      doc.setFont('helvetica','bold');
      doc.text('Ensayos o partes de norma no realizados:', ML, y); y += 6;
      doc.setFont('helvetica','normal');
      const ensayosStr = D.ensayos || 'No se realiza ensayo de inercia.';
      doc.text('— ' + ensayosStr, ML+4, y); y += 6;


      // ═══ LISTADO DE OBSERVACIONES ═══
      // Agrupar NCs por tipo — una entrada por tipo con todos los elementos afectados
      const PRIO_ORD = {GRAVE:4,MEDIA:3,LEVE:2,DOCUMENTAL:1,OBSERVACION:0};
      const ncGruposMap = {};
      (D.ncs||[]).forEach(function(nc) {
        var key = nc.tipo || 'Sin tipo';
        if (!ncGruposMap[key]) ncGruposMap[key] = { tipo:key, prio:nc.prio||'', elems:[], descs:[], fotosDefecto:[], fotosCorreccion:[], norma:nc.norma||'', resoluciones:[], cerradas:true };
        var g = ncGruposMap[key];
        if ((PRIO_ORD[nc.prio]||0) > (PRIO_ORD[g.prio]||0)) g.prio = nc.prio;
        var ncElemText = getNcElem(nc); if (ncElemText) g.elems.push({texto:ncElemText, prio:nc.prio});
        if (nc.desc) g.descs.push(nc.desc);
        if (nc.fotosDefecto && nc.fotosDefecto.length) g.fotosDefecto.push(nc.fotosDefecto[0]);
        if (nc.fotosCorreccion && nc.fotosCorreccion.length) g.fotosCorreccion.push(nc.fotosCorreccion[0]);
        if (nc.resolucion) g.resoluciones.push(nc.resolucion);
        if (!nc.cerrada) g.cerradas = false;
        if (!g.norma && nc.norma) g.norma = nc.norma;
      });
      const todasNCs = Object.values(ncGruposMap).sort(function(a,b){ return (PRIO_ORD[b.prio]||0)-(PRIO_ORD[a.prio]||0); });

      if (todasNCs.length > 0) {
        doc.addPage(); nPag[0]++;
        indicePags['LISTADO'] = nPag[0];
        addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
        y = MT + 8;

        // Cabecera sección
        doc.setFillColor(...GOLD); doc.rect(ML, y-2, CW, 8, 'F');
        doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(...WHITE);
        doc.text('LISTADO DE OBSERVACIONES', ML+3, y+3.5); y += 12;

        for (let ncIdx = 0; ncIdx < todasNCs.length; ncIdx++) {
          const nc = todasNCs[ncIdx];
          const ncColor = colorNC(nc.prio);
          const ncBg = bgNC(nc.prio);
          const hasFotoD = nc.fotosDefecto.length > 0;
          const hasFotoC = nc.fotosCorreccion.length > 0;

          // Estimar alto total de esta NC para no partirla
          let estAlto = 8 + (nc.elems&&nc.elems.length?Math.min(nc.elems.length+1,9)*5:0) + 15 + (hasFotoD?48:0) + 15 + 12 + 20 + (hasFotoC?44:28) + 14 + 10;
          if (y + estAlto > PH-18) {
            doc.addPage(); nPag[0]++;
            addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
            y = MT + 8;
          }

          // Cabecera NC
          doc.setFillColor(...SURF); doc.setDrawColor(...DARK); doc.setLineWidth(0.3);
          doc.rect(ML, y, CW, 8, 'FD');
          doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
          doc.text(`${ncIdx+1}. ${nc.tipo||'Sin tipo'}`, ML+2, y+5.5); y += 8;

          // Elementos afectados (agrupados) con gravedad a la derecha — máx 8 visibles
          if (nc.elems.length) {
            var elemsVis = nc.elems.slice(0, 8);
            var elemsExtra = nc.elems.length - elemsVis.length;
            var elemH = Math.max(7, (elemsVis.length + (elemsExtra ? 1 : 0)) * 5 + 2);
            doc.setFillColor(...WHITE); doc.rect(ML, y, CW, elemH, 'FD');
            elemsVis.forEach(function(el, ei) {
              doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
              doc.text('• ' + el.texto, ML+2, y + 4.5 + ei*5, {maxWidth:CW-30});
              var elColor = colorNC(el.prio);
              doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.setTextColor(...elColor);
              doc.text(el.prio||'', PW-MR-2, y + 4.5 + ei*5, {align:'right'});
            });
            if (elemsExtra > 0) {
              doc.setFontSize(7); doc.setFont('helvetica','italic'); doc.setTextColor(...MUTED);
              doc.text('... y ' + elemsExtra + ' elemento' + (elemsExtra > 1 ? 's' : '') + ' más con el mismo defecto', ML+2, y + 4.5 + elemsVis.length*5);
            }
            y += elemH;
          }

          // Observación (agrupa descripciones)
          var descTexto = nc.descs.filter(Boolean).join('. ');
          doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
          y += 3;
          doc.text('Observación:', ML, y); y += 5;
          if (descTexto) {
            y = addTextBlock(doc, descTexto, ML, y, CW, 8, DARK, 'normal', 5, PH-18, ref, fmtRev, fmtFechaStr, nPag, totPag);
          }

          // Fotos defecto (hasta 3 del grupo en grid)
          if (hasFotoD) {
            var fotosD = nc.fotosDefecto.slice(0,3);
            var fwD = fotosD.length>1 ? (CW/3-3) : 55;
            var fhD = fotosD.length>1 ? 35 : 40;
            if (y + fhD + 5 > PH-18) { doc.addPage(); nPag[0]++; addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr); y = MT+8; }
            fotosD.forEach(function(fd, fi) {
              var fotoSrc = fd ? (fd.dataUrl||fd.url) : null;
              if (!fotoSrc) return;
              var fx = fotosD.length>1 ? (ML + fi*(fwD+3)) : (PW/2-fwD/2);
              try {
                var fmt = fotoSrc.includes('data:image/png')?'PNG':'JPEG';
                var fitD = fitImage(doc, fotoSrc, fwD, fhD);
                var oxD = (fwD - fitD.w) / 2;
                var oyD = (fhD - fitD.h) / 2;
                doc.addImage(fotoSrc, fmt, fx + oxD, y + oyD, fitD.w, fitD.h);
              } catch(e) {}
            });
            y += fhD + 4;
          }

          // Referencia normativa
          y += 2;
          doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
          doc.text('Referencia normativa:', ML, y); y += 5;
          doc.setFont('helvetica','italic'); doc.setFontSize(8);
          y = addTextBlock(doc, nc.norma||'', ML+4, y, CW-4, 8, MUTED, 'italic', 5, PH-18, ref, fmtRev, fmtFechaStr, nPag, totPag);
          y += 3;

          // Banner gravedad
          if (y + 10 > PH-18) { doc.addPage(); nPag[0]++; addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr); y = MT+8; }
          const bannerW = CW*0.65;
          doc.setFillColor(...ncBg); doc.setDrawColor(...ncColor); doc.setLineWidth(0.5);
          doc.rect(ML, y, bannerW, 9, 'FD');
          doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...ncColor);
          doc.text(textNC(nc.prio), ML+2, y+5.5, {maxWidth:bannerW-4});
          doc.setFillColor(...ncColor); doc.setDrawColor(...ncColor);
          doc.rect(ML+bannerW, y, CW-bannerW, 9, 'FD');
          doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...WHITE);
          doc.text('Prioridad: ' + nc.prio, ML+bannerW+2, y+5.5);
          y += 12;

          // Modificación: texto resolución a la derecha — altura dinámica, máx 3 líneas
          var resTxt = nc.resoluciones.filter(Boolean).join('. ');
          doc.setFontSize(8); doc.setFont('helvetica','normal');
          var resLinesAll = resTxt ? doc.splitTextToSize(resTxt, CW * 2/3 - 4) : [];
          var resLines = resLinesAll.slice(0, 3);
          if (resLinesAll.length > 3) resLines[2] = '… ver Listado de Observaciones';
          var modH = Math.max(7, resLines.length * 4.5 + 4);
          if (y + modH + (hasFotoC ? 44 : 28) + 14 > PH - MB) {
            doc.addPage(); nPag[0]++;
            addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
            y = MT + 8;
          }
          doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
          doc.setDrawColor(...DARK); doc.setLineWidth(0.2);
          doc.rect(ML, y, CW/3, modH, 'D');
          doc.rect(ML+CW/3, y, CW*2/3, modH, 'D');
          doc.text('Modificación', ML+2, y+4.5);
          if (resLines.length) {
            doc.setFont('helvetica','normal');
            resLines.forEach(function(l, li) { doc.text(l, ML+CW/3+2, y+4.5+li*4.5); });
          }
          y += modH;

          if (hasFotoC) {
            var fotosC = nc.fotosCorreccion.slice(0,3);
            var fwC = fotosC.length>1 ? (CW/3-3) : 55;
            var fhC = fotosC.length>1 ? 35 : 40;
            if (y + fhC + 5 > PH-18) { doc.addPage(); nPag[0]++; addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr); y = MT+8; }
            fotosC.forEach(function(fc, fi) {
              var fotoCorr = fc ? (fc.dataUrl||fc.url) : null;
              if (!fotoCorr) return;
              var fx = fotosC.length>1 ? (ML + fi*(fwC+3)) : (PW/2-fwC/2);
              try {
                var fmt = fotoCorr.includes('data:image/png')?'PNG':'JPEG';
                var fitC = fitImage(doc, fotoCorr, fwC, fhC);
                var oxC = (fwC - fitC.w) / 2;
                var oyC = (fhC - fitC.h) / 2;
                doc.addImage(fotoCorr, fmt, fx + oxC, y + oyC, fitC.w, fitC.h);
              } catch(e) {}
            });
            y += fhC + 2;
          } else {
            doc.rect(ML, y, CW, 25, 'D'); y += 25;
          }

          // Resolución: solo muestra FAVORABLE/resultado
          if (y + 12 > PH-18) { doc.addPage(); nPag[0]++; addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr); y = MT+8; }
          doc.setDrawColor(...DARK); doc.rect(ML, y, CW/2, 11, 'D');
          doc.rect(ML+CW/2, y, CW/2, 11, 'D');
          doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
          doc.text('RESOLUCIÓN', ML+2, y+7);
          if (nc.cerradas) {
            doc.setFont('helvetica','bold'); doc.setTextColor(...GREEN_C);
            doc.text('FAVORABLE', ML+CW/2+2, y+7);
          }
          y += 14;

        }
      }

      // ═══ CARACTERÍSTICAS DE INSPECCIÓN ═══
      doc.addPage(); nPag[0]++;
      indicePags['CARACTERISTICAS'] = nPag[0];
      addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
      y = MT + 8;

      doc.setFillColor(...GOLD); doc.rect(ML, y-2, CW, 8, 'F');
      doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(...WHITE);
      doc.text('CARACTERÍSTICAS DE INSPECCIÓN', ML+3, y+3.5); y += 14;

      y = addTextBlock(doc, TEXTO_CARACTERISTICAS, ML, y, CW, 9, DARK, 'normal', 5, PH-40, ref, fmtRev, fmtFechaStr, nPag, totPag);
      y += 10;

      // Fecha(s) y nombre inspector — ultima hoja muestra solo la ultima visita
      const diasSemana = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
      const portadaSes = D.sesiones && D.sesiones.length ? D.sesiones : [{fecha:D.fechaInspeccion||''}];
      const lastSesInf = portadaSes[portadaSes.length - 1];
      const lastRawInf = portadaSes.length > 1 ? (lastSesInf.fecha||'') : (D.fechaInspeccion||lastSesInf.fecha||'');
      const lastFmtInf = fmtFecha(lastRawInf);
      const diasArr = lastFmtInf ? (() => {
        try { const p=lastFmtInf.split('/'); return [diasSemana[new Date(`${p[2]}-${p[1]}-${p[0]}`).getDay()]+', '+lastFmtInf]; }
        catch(e) { return [lastFmtInf]; }
      })() : [];

      doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      diasArr.forEach(ds => { doc.text(ds, PW/2, y, {align:'center'}); y += 6; });
      doc.text(D.inspectorNombre||'', PW/2, y, {align:'center'}); y += 5;
      if (D.inspector2Nombre) { doc.text(D.inspector2Nombre, PW/2, y, {align:'center'}); y += 5; }
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      doc.text('Inspector Autorizado', PW/2, y, {align:'center'}); y += 12;

      // Logo ARP + firma
      try { doc.addImage('data:image/jpeg;base64,'+LOGO_B64,'JPEG', PW/2-20, y, 40, 28); } catch(e){}
      y += 32;

      // Pie firma
      doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
      doc.text('Inspector', ML+30, y);
      doc.text('Revisor', PW-MR-30, y, {align:'right'});


      // Estampar índice dinámico y total de páginas
      estamparTotalPaginas(doc, doc.getNumberOfPages());
      doc.setPage(indicePagina);
      var iy = indiceY0;
      indiceItems.forEach(function(item) {
        var pg = indicePags[item[1]] || '';
        doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
        doc.text(String(pg), PW-MR, iy, {align:'right'});
        iy += 7;
      });
      const fileName = (ref.replace(/\//g,'_').replace(/\s/g,'_') || 'informe') + '.pdf';
      doc.save(fileName);

      // Guardar snapshot JSON
      try { localStorage.setItem('insp_'+inspeccionId, JSON.stringify(D)); } catch(e) {}

      hideGenerating();
    } catch(e) {
      hideGenerating();
      alert('Error generando PDF: ' + e.message);
      console.error(e);
    }
  }

  // ═══════════════════════════════════════════════════
  // Renderiza texto justificado párrafo a párrafo (párrafos separados por \n\n)
  function renderJustified(doc, text, x, y, maxW, lineH) {
    const spaceW = doc.getTextWidth(' ');
    const paras = text.split('\n\n').map(function(p){ return p.replace(/\s+/g,' ').trim(); }).filter(Boolean);
    paras.forEach(function(para, pi) {
      const lines = doc.splitTextToSize(para, maxW);
      lines.forEach(function(line, li) {
        const isLast = li === lines.length - 1;
        const words = line.trim().split(' ').filter(Boolean);
        if (isLast || words.length <= 1) {
          doc.text(line.trim(), x, y);
        } else {
          const wordsW = words.reduce(function(s,w){ return s + doc.getTextWidth(w); }, 0);
          const gap = (maxW - wordsW) / (words.length - 1);
          let cx = x;
          words.forEach(function(w) { doc.text(w, cx, y); cx += doc.getTextWidth(w) + gap; });
        }
        y += lineH;
      });
      if (pi < paras.length - 1) y += lineH;
    });
    return y;
  }

  async function generarCertificado() {

${c.nombre}, certifica que los equipamientos cumplen con las exigencias marcadas en las normas UNE-EN 15567-1:2015+A1:2021. Recorrido acrobático en altura. Parte 1 tras la inspección in situ realizada, la validación de los distintos documentos exigidos por norma y las acciones correctoras realizadas por ${solicitante}.

Visto que el informe presenta un resultado FAVORABLE, se considera que los equipamientos cumplen con las especificaciones de seguridad de las normas de aplicación en vigencia y que son aptos para su uso bajo las indicaciones y directrices del manual de uso y mantenimiento del constructor/instalador.`;

      doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
      y = renderJustified(doc, textoCert, ML, y, CW, 6);
      y += 10;

      // Datos firmante

      // Fechas vigor — alineadas al mismo X calculando el label más ancho
      doc.setFontSize(9); doc.setFont('helvetica','italic'); doc.setTextColor(...DARK);
      const fechaLabelW = Math.max(doc.getTextWidth('Fecha entrada en vigor:'), doc.getTextWidth('Fecha próxima inspección:')) + 2;
      doc.text('Fecha entrada en vigor:', ML, PH-30);
      doc.setFont('helvetica','normal'); doc.text(fechaInsp, ML+fechaLabelW, PH-30);
      doc.setFont('helvetica','italic');
      doc.text('Fecha próxima inspección:', ML, PH-24);
      doc.setFont('helvetica','normal'); doc.text(fechaProxima, ML+fechaLabelW, PH-24);

      // Pie
      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...GOLD);
      doc.line(ML, PH-16, PW-MR, PH-16);
      doc.text(`${c.sedeSocial}`, PW/2, PH-12, {align:'center'});
      doc.text(`${c.sedeFiscal}`, PW/2, PH-8, {align:'center'});
      doc.setFont('helvetica','normal');

      const certFile = (ref.replace(/\//g,'_')||'certificado') + '_CERT_Rev' + (D.revision||0) + '.pdf';

    } catch(e) {

      console.error(e);

  }

      let ciIdx2 = 0;
      for (const circ of circuitos) {
        if (y + 8 > PH-15) { doc.addPage(); nPag2[0]++; addCabReg(nPag2[0], totPag2[0]); y = 18; }
        let circWritten = false;
        let jiIdx2 = 0;
        for (const j of (circ.juegos||[])) {
          if (y + 7 > PH-15) { doc.addPage(); nPag2[0]++; addCabReg(nPag2[0], totPag2[0]); y = 18; circWritten = false; }
          doc.setFillColor(...WHITE); doc.setDrawColor(...BORDER); doc.setLineWidth(0.1);
          doc.rect(ML, y, cw0, 7, 'D');
          if (!circWritten) {
            doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
            doc.text(circ.nombre, ML+1, y+4.5, {maxWidth:cw0-2});
            circWritten = true;
          }
          doc.rect(ML+cw0, y, cw1, 7, 'D');
          doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
          doc.text((j.tipo==='NR'?'*. ':j.tipo==='AUX'?'* ':'') + (j.nombre||''), ML+cw0+1, y+4.5, {maxWidth:cw1-2});
          KEYS.forEach((k,ki) => {
            doc.setFillColor(...WHITE);
            doc.rect(ML+cw0+cw1+ki*cw2, y, cw2, 7, 'D');
            const v2 = j[k]||'';
            const prev = getPrevVal(ciIdx2,jiIdx2,k);
            doc.setFontSize(10); doc.setFont('helvetica','bold');
            if (prevCircuitos && prev !== null) {
              // Rev.N: colorear según cambio
              if (v2==='S' && prev==='N') { doc.setTextColor(...GREEN_C); } // corregido
              else if (v2==='N' && prev==='S') { doc.setTextColor(...RED); } // empeorado
              else { doc.setTextColor(...DARK); } // sin cambio = negro
            } else {
              // Rev.0: colores normales
              if(v2==='S'){doc.setTextColor(...GREEN_C);}else if(v2==='N'){doc.setTextColor(...RED);}else{doc.setTextColor(...MUTED);}
            }
            doc.text(v2, ML+cw0+cw1+ki*cw2+cw2/2, y+5, {align:'center'});
          });
          doc.setFillColor(...WHITE);
          doc.rect(ML+cw0+cw1+5*cw2, y, obsW2, 7, 'D');
          var jPat1 = 'c'+ciIdx2+'j'+jiIdx2;
          var jPat2 = 'j_'+ciIdx2+'_'+jiIdx2+'_';
          var jObs = (D.ncs||[]).filter(function(nc){ var aid=nc.autoId||''; return (aid.indexOf(jPat1)===0 && (aid.length===jPat1.length || aid[jPat1.length]==='_')) || aid.indexOf(jPat2)===0; }).map(function(nc){ return nc.desc||nc.tipo||''; }).filter(Boolean).join('\n');
          if (jObs) {
            doc.setFontSize(5.5); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
            doc.text(doc.splitTextToSize(jObs, obsW2-2), ML+cw0+cw1+5*cw2+1, y+3);
          }
          y += 7;
          jiIdx2++;
        }
        ciIdx2++;
      }

      addPieReg();

      var totalPagsReg = doc.getNumberOfPages();
      for (var pr = 1; pr <= totalPagsReg; pr++) {
        doc.setPage(pr);
        doc.setFillColor(255,255,255);
        doc.rect(PW-MR-25, 9, 25, 5, 'F');
        doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
        doc.text(pr + ' de ' + totalPagsReg, PW-MR, 12, {align:'right'});
      }

      const regFile = (ref.replace(/\//g,'_').replace(/\s/g,'_') || 'registro') + '_REGISTRO.pdf';
      doc.save(regFile);
      hideGenerating();
    } catch(e) {
      hideGenerating();
      alert('Error generando registro: ' + e.message);
      console.error(e);
    }
  }

  async function generarPlanCorrecciones() {
    if (!D) return;
    var todasNCs = (D.ncs||[]).filter(function(n){ return n.prio; });
    if (!todasNCs.length) { alert('No hay no conformidades para incluir en el plan.'); return; }

    showGenerating('Generando Plan de Correcciones...', 'Cargando fotos...');

    // Preload TODAS las fotos defecto y corrección de todas las NCs
    for (var _i = 0; _i < todasNCs.length; _i++) {
      var _nc2 = todasNCs[_i];
      for (var _j = 0; _j < (_nc2.fotosDefecto||[]).length; _j++) {
        var _f2 = _nc2.fotosDefecto[_j];
        if (!_f2.dataUrl) {
          try { _f2.dataUrl = await loadImageAsBase64(_f2.url, _f2.localKey); } catch(e){}
        }
      }
      for (var _k = 0; _k < (_nc2.fotosCorreccion||[]).length; _k++) {
        var _fc2 = _nc2.fotosCorreccion[_k];
        if (!_fc2.dataUrl) {
          try { _fc2.dataUrl = await loadImageAsBase64(_fc2.url, _fc2.localKey); } catch(e){}
        }
      }
    }

    await new Promise(function(r){ setTimeout(r, 80); });
    showGenerating('Generando Plan de Correcciones...', 'Preparando páginas...');

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
      const ref = getNRegistro();
      var pgPC = 1;

      function addPiePC() {
        doc.setDrawColor(...GOLD); doc.setLineWidth(0.3);
        doc.line(ML, PH-10, PW-MR, PH-10);
        doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
        doc.text(ref, PW/2, PH-7, {align:'center'});
        doc.text('Página ' + pgPC, PW-MR, PH-7, {align:'right'});
      }

      var fH = 35; // alto cajas foto defecto y corrección
      var y = MT;

      // Cabecera primera página
      try { doc.addImage('data:image/jpeg;base64,'+LOGO_B64,'JPEG', ML, y-2, 28, 20); } catch(e){}
      doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
      var empPC = (CONFIG && CONFIG.empresa && CONFIG.empresa.nombreCorto) || 'Arp Prevención S.L.';
      doc.text(empPC, PW-MR, y+4, {align:'right'});
      doc.text(ref, PW-MR, y+9, {align:'right'});
      doc.text(fmtFecha(D.fechaInspeccion||''), PW-MR, y+14, {align:'right'});
      doc.setDrawColor(...GOLD); doc.setLineWidth(0.5);
      doc.line(ML, y+18, PW-MR, y+18);
      y += 24;

      doc.setFontSize(15); doc.setFont('helvetica','bold'); doc.setTextColor(...GOLD);
      doc.text('PLAN DE CORRECCIONES', PW/2, y, {align:'center'}); y += 7;
      doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
      doc.text(D.nombreInstalacion||'', PW/2, y, {align:'center'}); y += 10;

      doc.setFontSize(8); doc.setFont('helvetica','italic'); doc.setTextColor(...MUTED);
      var introLines = doc.splitTextToSize('Listado individual de no conformidades detectadas. Para cada defecto se adjunta fotografía del estado observado y espacio para la fotografía acreditativa de la corrección.', CW);
      introLines.forEach(function(l,li){ doc.text(l, ML, y+li*5); });
      y += introLines.length * 5 + 8;

      // Una sección por cada NC individual (sin agrupar)
      todasNCs.forEach(function(nc, ncIdx) {
        var ncColor = colorNC(nc.prio);
        var ncBg = bgNC(nc.prio);
        var elem = getNcElem(nc);
        var descLnsAll = nc.desc ? doc.splitTextToSize(nc.desc, CW-4) : [];
        var descLns = descLnsAll.slice(0, 4);
        var descTrunc = descLnsAll.length > 4;
        var fotosD = (nc.fotosDefecto||[]).filter(function(f){ return f && (f.dataUrl || f.url); });
        var nFotos = Math.min(fotosD.length, 3);
        var fotosC = (nc.fotosCorreccion||[]).filter(function(f){ return f && (f.dataUrl || f.url); });
        var nFotosC = Math.min(fotosC.length, 3);

        // Estimación altura bloque (defecto + corrección ahora en la misma fila)
        var descH = descLns.length ? 4.5 + descLns.length*4.5 + (descTrunc ? 6 : 3) : 0;
        var estH = 9 + (elem ? 6 : 0) + descH + 2 + 4 + fH + 5 + 6;

        if (y + estH > PH - MB - 12) {
          addPiePC(); pgPC++;
          doc.addPage(); y = MT;
        }

        // Cabecera NC
        doc.setFillColor(...SURF); doc.setDrawColor(...DARK); doc.setLineWidth(0.3);
        doc.rect(ML, y, CW, 9, 'FD');
        var badgeW = 30;
        doc.setFillColor(...ncBg); doc.setDrawColor(...ncColor); doc.setLineWidth(0.4);
        doc.rect(PW-MR-badgeW, y+1, badgeW, 7, 'FD');
        doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...ncColor);
        doc.text(nc.prio, PW-MR-badgeW/2, y+5.5, {align:'center'});
        doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
        doc.text((ncIdx+1)+'. '+nc.tipo, ML+2, y+5.8, {maxWidth:CW-badgeW-6});
        y += 9;

        // Elemento (circuito — juego)
        if (elem) {
          doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
          doc.text(elem, ML+2, y+4.5);
          y += 6;
        }

        // Descripción (máx 4 líneas)
        if (descLns.length) {
          doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
          descLns.forEach(function(l,li){ doc.text(l, ML+2, y+4.5+li*4.5); });
          if (descTrunc) {
            doc.setFontSize(7); doc.setFont('helvetica','italic'); doc.setTextColor(...MUTED);
            doc.text('(texto completo en el informe)', ML+2, y+4.5+descLns.length*4.5+1.5);
          }
          y += 4.5 + descLns.length * 4.5 + (descTrunc ? 6 : 3);
        }

        y += 2;

        // Defecto (izquierda) y Corrección (derecha) en la misma fila
        var halfW = (CW - 4) / 2;
        var corrX = ML + halfW + 4;

        // Labels en la misma línea
        doc.setFontSize(7.5); doc.setFont('helvetica','bold'); doc.setTextColor(...MUTED);
        doc.text('Fotografía del defecto:', ML, y);
        doc.text('Fotografía de corrección:', corrX, y);
        y += 4;

        // Izquierda: fotos del defecto (hasta 3 en fila dentro del halfW)
        if (nFotos > 0) {
          var fw = nFotos > 1 ? (halfW / nFotos - 1) : halfW;
          fotosD.slice(0, 3).forEach(function(fd, fi) {
            var fotoSrc = fd.dataUrl || fd.url;
            var fx = ML + fi * (fw + 1);
            try {
              var fmt = fotoSrc.startsWith('data:image/png') ? 'PNG' : 'JPEG';
              var fit = fitImage(doc, fotoSrc, fw, fH);
              var ox = (fw - fit.w) / 2;
              var oy = (fH - fit.h) / 2;
              doc.addImage(fotoSrc, fmt, fx+ox, y+oy, fit.w, fit.h);
            } catch(e) {}
            doc.setDrawColor(...BORDER); doc.setLineWidth(0.2);
            doc.rect(fx, y, fw, fH, 'D');
          });
        } else {
          doc.setFillColor(225,225,225); doc.rect(ML, y, halfW, fH, 'F');
          doc.setDrawColor(...BORDER); doc.rect(ML, y, halfW, fH, 'D');
          doc.setFontSize(8); doc.setFont('helvetica','italic'); doc.setTextColor(...MUTED);
          doc.text('Sin fotografía', ML + halfW/2, y+fH/2, {align:'center'});
        }

        // Derecha: fotos de corrección o caja vacía si no hay
        if (nFotosC > 0) {
          var fwC = nFotosC > 1 ? (halfW / nFotosC - 1) : halfW;
          fotosC.slice(0, 3).forEach(function(fc, fi) {
            var fotoSrc = fc.dataUrl || fc.url;
            var fxC = corrX + fi * (fwC + 1);
            try {
              var fmtC = fotoSrc.startsWith('data:image/png') ? 'PNG' : 'JPEG';
              var fitC = fitImage(doc, fotoSrc, fwC, fH);
              var oxC = (fwC - fitC.w) / 2;
              var oyC = (fH - fitC.h) / 2;
              doc.addImage(fotoSrc, fmtC, fxC+oxC, y+oyC, fitC.w, fitC.h);
            } catch(e) {}
            doc.setDrawColor(...BORDER); doc.setLineWidth(0.2);
            doc.rect(fxC, y, fwC, fH, 'D');
          });
        } else {
          doc.setDrawColor(...MUTED); doc.setLineWidth(0.5);
          doc.setLineDashPattern([2, 1.5], 0);
          doc.rect(corrX, y, halfW, fH, 'D');
          doc.setLineDashPattern([], 0);
          doc.setFontSize(9); doc.setFont('helvetica','italic'); doc.setTextColor(...MUTED);
          doc.text('Foto corrección', corrX + halfW/2, y+fH/2, {align:'center'});
        }

        y += fH + 5;

        // Separador
        doc.setDrawColor(...BORDER); doc.setLineWidth(0.2);
        doc.line(ML, y, PW-MR, y);
        y += 6;
      });

      addPiePC();
      var fileName = (ref.replace(/\//g,'_')||'plan') + '_CORRECCIONES.pdf';
      doc.save(fileName);
      hideGenerating();
    } catch(e) {
      hideGenerating();
      alert('Error generando plan de correcciones: ' + e.message);
      console.error(e);
    }
  }

  function updateOnline() {
    if (!navigator.onLine) document.getElementById('alertOffline').classList.add('vis');
  }
  window.addEventListener('offline', updateOnline);
</script>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#C8993A">
  <title>Resultado - ARP</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{--gold:#C8993A;--dark:#1A1A1A;--surf:#F5F3EF;--border:#E2DDD5;--text:#2C2C2C;--muted:#8A8278;--red:#C0392B;--green:#27AE60;--orange:#E67E22;--blue:#2980B9;}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--surf);color:var(--text);min-height:100vh}
    .app-header{background:var(--dark);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
    .btn-back{background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer;padding:0;line-height:1}
    .hdr-title{color:white;font-size:15px;font-weight:600;flex:1}
    .content{padding:16px;max-width:680px;margin:0 auto;padding-bottom:40px}
    .res-header{border-radius:14px;padding:24px 20px;text-align:center;margin-bottom:16px}
    .res-header.favorable{background:linear-gradient(135deg,#1a3a2a,#1e4d35)}
    .res-header.desfavorable{background:linear-gradient(135deg,#3a1a1a,#4d1e1e)}
    .res-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px}
    .res-header.favorable .res-icon{background:rgba(39,174,96,0.25)}
    .res-header.desfavorable .res-icon{background:rgba(192,57,43,0.25)}
    .res-titulo{color:white;font-size:22px;font-weight:700;margin-bottom:4px}
    .res-ref{color:rgba(255,255,255,0.5);font-size:12px;font-family:monospace}
    .res-instalacion{color:rgba(255,255,255,0.8);font-size:14px;margin-top:8px}
    .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
    .stat-box{background:white;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
    .stat-num{font-size:28px;font-weight:700;color:var(--gold)}
    .stat-label{font-size:11px;color:var(--muted);margin-top:2px}
    .card{background:white;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
    .card-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .card-title::after{content:"";flex:1;height:1px;background:var(--border)}
    .nc-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
    .nc-item:last-child{border-bottom:none}
    .nc-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;flex-shrink:0}
    .p-GRAVE{background:#FFEBEE;color:var(--red);border:1px solid var(--red)}
    .p-MEDIA{background:#FFF8E1;color:#E65100;border:1px solid #E65100}
    .p-LEVE{background:#E8F5E9;color:var(--green);border:1px solid var(--green)}
    .p-DOCUMENTAL{background:#E3F2FD;color:var(--blue);border:1px solid var(--blue)}
    .p-OBSERVACION{background:#F5F5F5;color:#666;border:1px solid #999}
    .btn-pdf{width:100%;padding:15px;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s}
    .btn-informe{background:var(--gold);color:white;box-shadow:0 4px 12px rgba(200,153,58,.3)}
    .btn-informe:hover{opacity:.9}
    .btn-certificado{background:#1e4d35;color:white;box-shadow:0 4px 12px rgba(39,174,96,.2)}
    .btn-certificado:hover{opacity:.9}
    .btn-registro{background:var(--dark);color:white}
    .btn-registro:hover{opacity:.9}
    .btn-disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
    .spinner-wrap{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--surf);font-size:13px}
    .info-label{color:var(--muted);font-size:12px}
    .sesion-item{font-size:12px;color:var(--muted);padding:3px 0}
    .alert-offline{background:#FFF9F0;border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12px;display:none}
    .alert-offline.vis{display:block}
    .generating{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
    .generating.vis{display:flex}
    .generating-text{color:white;font-size:15px;font-weight:600}
    .generating-sub{color:rgba(255,255,255,.6);font-size:12px}
  </style>
</head>
<body>

<div class="app-header">
  <button class="btn-back" onclick="volverAtras()">&#8592;</button>
  <div class="hdr-title" id="hdrTitulo">Resultado</div>
</div>

<div class="content">
  <div class="alert-offline" id="alertOffline">
    &#128317; Sin conexión — datos cargados desde memoria local
  </div>
  <div id="mainContent">
    <div class="spinner-wrap"><div class="spinner"></div>Cargando resultado...</div>
  </div>
</div>

<!-- Overlay generando PDF -->
<div class="generating" id="generatingOverlay">
  <div class="spinner" style="border-color:rgba(255,255,255,.3);border-top-color:var(--gold);width:40px;height:40px"></div>
  <div class="generating-text" id="generatingText">Generando PDF...</div>
  <div class="generating-sub" id="generatingSub">Esto puede tardar unos segundos</div>
</div>

    if (local) {

  async function cargarDatos() {
    try {
      // Cargar configuración
      try {
        const [ceSnap, paaSnap] = await Promise.all([
          db.collection('config').doc('empresa').get(),
          db.collection('config').doc('paa').get()
        ]);
        CONFIG = {
          empresa: ceSnap.exists ? ceSnap.data() : CONFIG_DEFAULT.empresa,
          paa: paaSnap.exists ? paaSnap.data() : CONFIG_DEFAULT.paa
        };
      } catch(e) {
        CONFIG = CONFIG_DEFAULT;
      }

      // Cargar inspección
      const snap = await db.collection('inspecciones').doc(inspeccionId).get();
      if (!snap.exists) { document.getElementById('mainContent').innerHTML = '<p style="color:var(--red);padding:20px">Inspección no encontrada.</p>'; return; }
      D = { id: snap.id, ...snap.data() };

      // Guardar snapshot en localStorage (triple backup)
      try { localStorage.setItem('insp_' + inspeccionId, JSON.stringify(D)); } catch(e) {}

      if (!navigator.onLine) document.getElementById('alertOffline').classList.add('vis');
      renderResultado();
    } catch(e) {
      // Intentar desde localStorage
      const local = localStorage.getItem('insp_' + inspeccionId);
      if (local) {
        try {
          D = JSON.parse(local);
          CONFIG = CONFIG_DEFAULT;
          document.getElementById('alertOffline').classList.add('vis');
          renderResultado();
        } catch(e2) {
          document.getElementById('mainContent').innerHTML = '<p style="color:var(--red);padding:20px">Error cargando datos: ' + e.message + '</p>';
        }
      }
    }
  }

  function volverAtras() {

    else location.href = 'inspecciones.html';

  function renderResultado() {
    if (!D) return;
    const favorable = D.resultado === 'FAVORABLE';
    const ncs = (D.ncs || []).filter(n => n.prio && n.prio !== 'OBSERVACION');
    const obs = (D.ncs || []).filter(n => n.prio === 'OBSERVACION');
    const totalJuegos = (D.circuitos || []).reduce((s,c) => s + (c.juegos||[]).length, 0);
    const juegosOk = (D.circuitos || []).reduce((s,c) =>
      s + (c.juegos||[]).filter(j => ['ie','af','ej','ra','zs'].every(k => j[k]==='S'||j[k]==='NA')).length, 0);

    document.getElementById('hdrTitulo').textContent = D.nombreInstalacion || 'Resultado';

    const sesiones = D.sesiones && D.sesiones.length
      ? D.sesiones.map(s => `<div class="sesion-item">📅 ${s.fecha} · ${s.horaInicio||'--'}–${s.horaFin||'--'}</div>`).join('')
      : `<div class="sesion-item">📅 ${D.fechaInspeccion||'Sin fecha'}</div>`;

    // Agrupar NCs por tipo+prio para mostrar resumen
    const ncGrupos = {};
    ncs.forEach(nc => {
      const key = (nc.tipo||'Sin tipo') + '|' + nc.prio;
      if (!ncGrupos[key]) ncGrupos[key] = { tipo: nc.tipo||'Sin tipo', prio: nc.prio, items: [] };
      ncGrupos[key].items.push(nc.elem||'');
    });

    const ncHtml = Object.values(ncGrupos).map(g => `
      <div class="nc-item">
        <span class="nc-badge p-${g.prio}">${g.prio}</span>
        <div style="flex:1">
          <div style="font-weight:600;font-size:12px">${g.tipo}</div>
          <div style="font-size:11px;color:var(--muted)">${g.items.filter(Boolean).join(' · ')}</div>
        </div>
      </div>`).join('') || '<div style="font-size:13px;color:var(--muted);padding:8px 0">Sin no conformidades.</div>';

    document.getElementById('mainContent').innerHTML = `
      <div class="res-header ${favorable?'favorable':'desfavorable'}">
        <div class="res-icon">${favorable?'✓':'!'}</div>
        <div class="res-titulo">${favorable?'FAVORABLE':'DESFAVORABLE'}</div>
        <div class="res-ref">${D.nRegistro||D.id}</div>
        <div class="res-instalacion">${D.nombreInstalacion||''}</div>
      </div>

      <div class="stats-grid">
        <div class="stat-box"><div class="stat-num">${totalJuegos}</div><div class="stat-label">Juegos</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--green)">${juegosOk}</div><div class="stat-label">Conformes</div></div>
        <div class="stat-box"><div class="stat-num" style="color:${ncs.length?'var(--red)':'var(--green)'}">${ncs.length}</div><div class="stat-label">No Conform.</div></div>
      </div>

      <div class="card">
        <div class="card-title">Sesiones</div>
        ${sesiones}
      </div>

      <div class="card">
        <div class="card-title">No conformidades</div>
        ${ncHtml}
        ${obs.length?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)">${obs.length} observación${obs.length>1?'es':''} (no bloquean certificado)</div>`:''}
      </div>

      <div class="card">
        <div class="card-title">Generar documentos</div>
        <button class="btn-pdf btn-informe" onclick="generarInforme()">
          &#128196; Generar Informe PDF
        </button>
        <button class="btn-pdf ${favorable?'btn-certificado':'btn-disabled'}" onclick="${favorable?'generarCertificado()':'void(0)'}">
          &#127941; ${favorable?'Generar Certificado PDF':'Certificado (solo FAVORABLE)'}
        </button>
        <button class="btn-pdf btn-registro" onclick="generarRegistro()">
          &#128203; Generar Registro ENAC
        </button>
      </div>`;
  }

  function fmtFecha(str) {
    if (!str) return '';
    // YYYY-MM-DD → DD/MM/YYYY
    const m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return `${m[3]}/${m[2]}/${m[1]}`;
    return str;
  }

  function getSesionesStr() {
    if (D.sesiones && D.sesiones.length) {
      return D.sesiones.map(s => `Fecha inspección: ${fmtFecha(s.fecha)} – Inspector: ${D.inspectorNombre||''}`).join('\n');
    }
    return `Fecha inspección: ${fmtFecha(D.fechaInspeccion||'')} – Inspector: ${D.inspectorNombre||''}`;
  }

  function getNRegistro() {
    return D.nRegistro || (D.id ? D.id.substring(0,12) : 'ARP/PAA/000000');

  function colorNC(prio) {
    if (prio==='GRAVE') return RED;
    if (prio==='MEDIA') return ORANGE;
    if (prio==='LEVE') return GREEN_C;
    if (prio==='DOCUMENTAL') return BLUE_C;
    return MUTED;
  }
  function bgNC(prio) {
    if (prio==='GRAVE') return [255,235,238];
    if (prio==='MEDIA') return [255,248,225];
    if (prio==='LEVE') return [232,245,233];
    if (prio==='DOCUMENTAL') return [227,242,253];
    return [245,245,245];
  }
  function textNC(prio) {
    if (prio==='GRAVE') return 'NO CONFORMIDAD GRAVE — NECESITA ACCIÓN CORRECTORA URGENTE';
    if (prio==='MEDIA') return 'NO CONFORMIDAD MEDIA — NECESITA ACCIÓN CORRECTORA';
    if (prio==='LEVE') return 'NO CONFORMIDAD LEVE — NECESITA ACCIÓN, EL RIESGO DE DAÑO ES BAJO';
    if (prio==='DOCUMENTAL') return 'NO CONFORMIDAD DOCUMENTAL — FALTA DOCUMENTACIÓN';
    return 'OBSERVACIÓN';
  }

  // ── TEXTO LARGO con salto de página automático ──
  function addTextBlock(doc, text, x, y, maxW, fontSize, color, font, lineH, maxY, ref, fmtRev, fmtFecha, nPag, totPag) {
    doc.setFontSize(fontSize); doc.setFont('helvetica', font||'normal'); doc.setTextColor(...(color||DARK));
    const lines = doc.splitTextToSize(text, maxW);
    for (const line of lines) {
      if (y > maxY) {
        doc.addPage();
        nPag[0]++;
        addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFecha);

    }
    return y;

          doc.text(ref, PW/2, y, {align:'center'}); y += 8;

          doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...GOLD);
          doc.text(c.nombreCorto, ML, PH-3);
          doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
          doc.text(`Página ${nPag[0]} de ${totPag[0]}`, PW-MR, PH-3, {align:'right'});
        }
      }

      // ═══ CARACTERÍSTICAS DE INSPECCIÓN ═══
      doc.addPage(); nPag[0]++;
      addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
      y = MT + 8;

      doc.setFillColor(...GOLD); doc.rect(ML, y-2, CW, 8, 'F');

      // Fecha y nombre inspector

        ? fmtFecha(D.sesiones[D.sesiones.length-1].fecha)

      const diasSemana = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
      let diaStr = '';
      if (sessFecha) {
        try {
          const parts = sessFecha.split('/');
          const dateObj = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
          diaStr = diasSemana[dateObj.getDay()] + ', ' + sessFecha;
        } catch(e) { diaStr = sessFecha; }
      }

      doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text(diaStr, PW/2, y, {align:'center'}); y += 6;
      doc.text(D.inspectorNombre||'', PW/2, y, {align:'center'}); y += 5;
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      doc.text('Inspector Autorizado', PW/2, y, {align:'center'}); y += 12;

      // Logo ARP + firma
      try { doc.addImage('data:image/png;base64,'+LOGO_B64,'PNG', PW/2-20, y, 40, 28); } catch(e){}
      y += 32;

      // Pie firma
      doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
      doc.text('Inspector', ML+30, y);
      doc.text('Revisor', PW-MR-30, y, {align:'right'});

      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...GOLD);
      doc.text(c.nombreCorto, ML, PH-3);
      doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
      doc.text(`Página ${nPag[0]} de ${totPag[0]}`, PW-MR, PH-3, {align:'right'});

      // Actualizar total páginas en todas las páginas no es posible con jsPDF básico
      // El total es aproximado — en producción se haría en 2 pasadas

      // Guardar
      const fileName = (ref.replace(/\/g,'_') || 'informe') + '_Rev' + (D.revision||0) + '.pdf';
      doc.save(fileName);

      // Guardar snapshot JSON
      try { localStorage.setItem('insp_'+inspeccionId, JSON.stringify(D)); } catch(e) {}

      hideGenerating();
    } catch(e) {
      hideGenerating();
      alert('Error generando PDF: ' + e.message);
      console.error(e);
    }
  }

      doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);

          doc.rect(ML+cw0, y, cw1, 7, 'D');
          doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
          doc.text((j.tipo==='NR'?'*.':'') + (j.nombre||''), ML+cw0+1, y+4.5, {maxWidth:cw1-2});
          KEYS.forEach((k,ki) => {
            doc.rect(ML+cw0+cw1+ki*cw2, y, cw2, 7, 'D');
            const v2 = j[k]||'';
            doc.setFontSize(10); doc.setFont('helvetica','bold');
            doc.setTextColor(v2==='S'?...GREEN_C:v2==='N'?...RED:...MUTED);
            doc.text(v2, ML+cw0+cw1+ki*cw2+cw2/2, y+5, {align:'center'});
          });
          doc.rect(ML+cw0+cw1+5*cw2, y, obsW2, 7, 'D');
          if (j.obs) {
            doc.setFontSize(6.5); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
            doc.text(j.obs, ML+cw0+cw1+5*cw2+1, y+4, {maxWidth:obsW2-2});
          }
          y += 7;
        }
      }

      addPieReg();

      const regFile = (ref.replace(/\/g,'_')||'registro') + '_REGISTRO.pdf';
      doc.save(regFile);
      hideGenerating();
    } catch(e) {
      hideGenerating();
      alert('Error generando registro: ' + e.message);
      console.error(e);
    }
  }

  function updateOnline() {
    if (!navigator.onLine) document.getElementById('alertOffline').classList.add('vis');
  }
  window.addEventListener('offline', updateOnline);
</script>
</body>
</html>

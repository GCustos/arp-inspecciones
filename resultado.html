<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#C8993A">
  <title>Resultado - ARP</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{--gold:#C8993A;--dark:#1A1A1A;--surf:#F5F3EF;--border:#E2DDD5;--text:#2C2C2C;--muted:#8A8278;--red:#C0392B;--green:#27AE60;--orange:#E67E22;--blue:#2980B9;}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--surf);color:var(--text);min-height:100vh}
    .app-header{background:var(--dark);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
    .btn-back{background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer;padding:0;line-height:1}
    .hdr-title{color:white;font-size:15px;font-weight:600;flex:1}
    .content{padding:16px;max-width:680px;margin:0 auto;padding-bottom:40px}
    .res-header{border-radius:14px;padding:24px 20px;text-align:center;margin-bottom:16px}
    .res-header.favorable{background:linear-gradient(135deg,#1a3a2a,#1e4d35)}
    .res-header.desfavorable{background:linear-gradient(135deg,#3a1a1a,#4d1e1e)}
    .res-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px}
    .res-header.favorable .res-icon{background:rgba(39,174,96,0.25)}
    .res-header.desfavorable .res-icon{background:rgba(192,57,43,0.25)}
    .res-titulo{color:white;font-size:22px;font-weight:700;margin-bottom:4px}
    .res-ref{color:rgba(255,255,255,0.5);font-size:12px;font-family:monospace}
    .res-instalacion{color:rgba(255,255,255,0.8);font-size:14px;margin-top:8px}
    .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
    .stat-box{background:white;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
    .stat-val{font-size:24px;font-weight:700;color:var(--dark)}
    .stat-lbl{font-size:10px;color:var(--muted);margin-top:2px}
    .card{background:white;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
    .card-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .card-title::after{content:"";flex:1;height:1px;background:var(--border)}
    .nc-item{border-left:3px solid var(--border);padding:10px 12px;background:var(--surf);border-radius:0 8px 8px 0;margin-bottom:8px}
    .nc-item.grave{border-color:var(--red)}
    .nc-item.media{border-color:var(--orange)}
    .nc-item.leve{border-color:var(--blue)}
    .nc-item.documental{border-color:#8E24AA}
    .nc-item.observacion{border-color:#78909C}
    .nc-titulo{font-size:13px;font-weight:600;margin-bottom:3px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .nc-desc{font-size:12px;color:var(--muted)}
    .nc-norma{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}
    .prio-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px;flex-shrink:0;text-transform:uppercase}
    .prio-badge.grave{background:#FFEBEE;color:var(--red)}
    .prio-badge.media{background:#FFF8E1;color:var(--orange)}
    .prio-badge.leve{background:#E3F2FD;color:var(--blue)}
    .prio-badge.documental{background:#F3E5F5;color:#8E24AA}
    .prio-badge.observacion{background:#ECEFF1;color:#546E7A}
    /* NC editable (corrección) */
    .nc-correccion{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;display:none}
    .nc-correccion.vis{display:block}
    .nc-correccion label{font-size:10px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
    .nc-correccion textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:12px;resize:vertical;min-height:60px}
    .nc-correccion input[type=date]{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:12px;margin-bottom:8px}
    .nc-correccion-fotos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
    .foto-mini{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
    .foto-mini img{width:100%;height:100%;object-fit:cover}
    .foto-mini-del{position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(0,0,0,.6);border:none;border-radius:50%;color:white;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .btn-add-correccion{background:none;border:1.5px dashed var(--border);border-radius:6px;padding:6px;font-size:11px;color:var(--muted);cursor:pointer;width:100%;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:4px}
    .btn-add-correccion:hover{border-color:var(--gold);color:var(--gold)}
    .btn-toggle-correccion{font-size:10px;font-weight:600;color:var(--gold);background:none;border:none;cursor:pointer;padding:4px 0;margin-top:6px;display:block}
    .doc-item{display:flex;align-items:center;gap:12px;padding:13px;background:var(--surf);border-radius:10px;margin-bottom:8px}
    .doc-icon{font-size:24px;flex-shrink:0}
    .doc-info{flex:1}
    .doc-nombre{font-size:13px;font-weight:600;color:var(--dark)}
    .doc-desc{font-size:11px;color:var(--muted);margin-top:2px}
    .doc-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:14px;flex-shrink:0}
    .doc-badge.listo{background:#E8F5E9;color:var(--green)}
    .doc-badge.no{background:#FFEBEE;color:var(--red)}
    .doc-badge.pendiente{background:var(--surf);color:var(--muted);border:1px solid var(--border)}
    .btn-pdf{width:100%;padding:15px;background:var(--gold);color:white;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:10px;box-shadow:0 4px 12px rgba(200,153,58,0.3);display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-pdf:hover{transform:translateY(-1px)}
    .btn-pdf:disabled{opacity:0.5;cursor:not-allowed;transform:none}
    .btn-sec{width:100%;padding:13px;background:white;color:var(--text);border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-sec:hover{border-color:var(--gold);color:var(--gold)}
    .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .offline-badge{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:8px 16px;border-radius:20px;font-size:12px;display:none;z-index:300}
    .offline-badge.visible{display:block}
    .aviso-banner{background:#FFF8E1;border:1px solid #FFE082;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:12px;color:#795548;display:none}
    .aviso-banner.vis{display:block}
  </style>
</head>

  const PRIO_COLORS = {
    GRAVE:      { bg:[192,57,43],   light:[255,235,238], text:[192,57,43] },
    MEDIA:      { bg:[230,126,34],  light:[255,248,225], text:[230,126,34] },
    LEVE:       { bg:[41,128,185],  light:[227,242,253], text:[41,128,185] },
    DOCUMENTAL: { bg:[142,36,170],  light:[243,229,245], text:[142,36,170] },
    OBSERVACION:{ bg:[84,110,122],  light:[236,239,241], text:[84,110,122] }
  };

  // ─── AUTH ──────────────────────────────────────────────
  let authOk = false;
  setTimeout(() => {
    if (authOk) return;
    const keys = Object.keys(localStorage).filter(k => k.startsWith('arpUser_'));
    if (keys.length) {
      iniciarCarga({ email: keys[0].replace('arpUser_',''), photoURL:'', displayName:'' });
    } else { location.href = 'index.html'; }
  }, 5000);

  auth.onAuthStateChanged(user => {
    authOk = true;
    if (!user) { location.href = 'index.html'; return; }
    iniciarCarga(user);
  });

  async function iniciarCarga(user) {
    try {
      const snap = await db.collection("inspecciones").doc(inspeccionId).get();
      if (!snap.exists) { location.href = "inspecciones.html"; return; }
      D = { id: snap.id, ...snap.data() };
      renderResultado();
    } catch(e) { console.error(e); }
  }

  // ─── REFERENCIA ────────────────────────────────────────
  function generarRef() {
    const inst = D.nombreInstalacion || "XXX";
    const fecha = (D.fechaInspeccion || "").replace(/-/g,"").slice(2);
    const sig = inst.split(" ").map(w => w[0]).join("").toUpperCase().slice(0,3);
    return `${sig}/PAA/${fecha} Rev 0`;
  }

  // ─── RENDER RESULTADO ──────────────────────────────────
  function renderResultado() {
    const favorable = D.resultado === "FAVORABLE";
    const ref = generarRef();
    const ncs = D.ncs || [];
    const graves = ncs.filter(n => n.prio === "GRAVE").length;
    const totalJuegos = (D.circuitos || []).reduce((a,c) => a + (c.juegos||[]).length, 0);
    const nsGen = Object.values(D.checklist || {}).filter(v => v === "N").length;
    const nsJuegos = (D.circuitos || []).reduce((a,c) =>
      a + (c.juegos||[]).reduce((b,j) =>
        b + ["ie","af","ej","ra","zs"].filter(k => j[k]==="N").length, 0), 0);

    let ncHtml = "";
    if (ncs.length) {
      ncHtml = ncs.map((nc,i) => {
        const cl = (nc.prio||"observacion").toLowerCase();
        const corrFotos = (nc.fotosCorreccion || []).map((f,fi) =>
          `<div class="foto-mini"><img src="${f.dataUrl}"><button class="foto-mini-del" onclick="delFotoCorreccion(${i},${fi})">&#215;</button></div>`
        ).join("");
        return `<div class="nc-item ${cl}" id="nc_${i}">
          <div class="nc-titulo">
            <span>NC ${i+1}${nc.autoId?" · auto":""} — ${nc.elem||"Sin elemento"}</span>
            <span class="prio-badge ${cl}">${nc.prio||"—"}</span>
          </div>
          <div class="nc-desc">${nc.desc||""}</div>
          ${nc.norma ? `<div class="nc-norma">${nc.norma}</div>` : ""}
          <button class="btn-toggle-correccion" onclick="toggleCorreccion(${i})">
            ${nc.resolucion || nc.fechaCorreccion ? "✓ Corrección registrada — editar" : "+ Registrar corrección"}
          </button>
          <div class="nc-correccion ${nc.resolucion||nc.fechaCorreccion?"vis":""}" id="cor_${i}">
            <label>Fecha corrección</label>
            <input type="date" value="${nc.fechaCorreccion||""}" onchange="D.ncs[${i}].fechaCorreccion=this.value;markDirty()">
            <label>Descripción de la corrección</label>
            <textarea placeholder="Describe cómo se resolvió..." onchange="D.ncs[${i}].resolucion=this.value;markDirty()">${nc.resolucion||""}</textarea>
            <label>Fotos de corrección</label>
            <div class="nc-correccion-fotos" id="cfoto_${i}">${corrFotos}
              <button class="btn-add-correccion" onclick="addFotoCorreccion(${i})">📷 Foto</button>
            </div>
          </div>
        </div>`;
      }).join("");
    }

    document.getElementById("mainContent").innerHTML = `
      <div class="res-header ${favorable ? "favorable" : "desfavorable"}">
        <div class="res-icon">${favorable ? "&#10003;" : "&#10007;"}</div>
        <div class="res-titulo">Resultado ${favorable ? "FAVORABLE" : "DESFAVORABLE"}</div>
        <div class="res-ref">${ref}</div>
        <div class="res-instalacion">${D.nombreInstalacion||""}</div>
      </div>

      <div class="stats-grid">
        <div class="stat-box"><div class="stat-val">${totalJuegos}</div><div class="stat-lbl">Juegos inspeccionados</div></div>
        <div class="stat-box"><div class="stat-val" style="color:var(--orange)">${nsGen+nsJuegos}</div><div class="stat-lbl">No satisfactorios</div></div>
        <div class="stat-box"><div class="stat-val" style="color:${graves?"var(--red)":"var(--muted)"}">${ncs.length}</div><div class="stat-lbl">No conformidades</div></div>
      </div>

      ${ncs.length ? `<div class="card"><div class="card-title">No conformidades</div>${ncHtml}</div>` : ""}

      <div id="avisoBanner" class="aviso-banner"></div>

      <div class="card">

    // Input file oculto para fotos de corrección
    const inp = document.createElement('input');
    inp.type='file'; inp.id='fileCorreccion'; inp.accept='image/*'; inp.multiple=true; inp.style.display='none';
    inp.onchange = e => handleFotoCorreccion(e);
    document.body.appendChild(inp);
  }

  let _activeNcIdx = null;
  let _dirty = false;
  function isDirty() { return _dirty; }
  function markDirty() { _dirty = true; }

  function toggleCorreccion(i) {
    const el = document.getElementById('cor_'+i);
    el.classList.toggle('vis');
  }

  function addFotoCorreccion(i) {
    _activeNcIdx = i;
    document.getElementById('fileCorreccion').click();
  }

  function handleFotoCorreccion(e) {
    const i = _activeNcIdx;
    if (i === null) return;
    if (!D.ncs[i].fotosCorreccion) D.ncs[i].fotosCorreccion = [];
    Array.from(e.target.files).forEach(f => {
      const r = new FileReader();
      r.onload = ev => {
        D.ncs[i].fotosCorreccion.push({ dataUrl: ev.target.result, name: f.name });
        renderFotosCorreccion(i);
        markDirty();
      };
      r.readAsDataURL(f);
    });
    e.target.value = "";
  }

  function renderFotosCorreccion(i) {
    const nc = D.ncs[i];
    const fotos = nc.fotosCorreccion || [];
    const g = document.getElementById('cfoto_'+i);
    if (!g) return;
    g.innerHTML = fotos.map((f,fi) =>
      `<div class="foto-mini"><img src="${f.dataUrl}"><button class="foto-mini-del" onclick="delFotoCorreccion(${i},${fi})">&#215;</button></div>`
    ).join("") + `<button class="btn-add-correccion" onclick="addFotoCorreccion(${i})">📷 Foto</button>`;
  }

  function delFotoCorreccion(i, fi) {
    D.ncs[i].fotosCorreccion.splice(fi,1);
    renderFotosCorreccion(i);
    markDirty();
  }

  async function guardarCorrecciones() {
    try {
      await db.collection("inspecciones").doc(inspeccionId).update({ ncs: D.ncs, ultimaModificacion: firebase.firestore.FieldValue.serverTimestamp() });
      _dirty = false;
      const btn = document.getElementById('btnGuardar');
      if (btn) { btn.textContent = '✓ Guardado'; setTimeout(() => btn.innerHTML = '&#128190; Guardar correcciones', 2000); }
    } catch(e) { alert('Error al guardar: ' + e.message); }
  }

  // ─── PDF ───────────────────────────────────────────────
  async function generarPDF() {
    if (typeof window.jspdf === 'undefined') {
      alert('El generador de PDF está cargando. Espera un momento e inténtalo de nuevo.');
      return;
    }
    const btn = document.getElementById('btnPDF');
    btn.disabled = true; btn.textContent = 'Generando...';
    try { await buildInformePDF(); }
    catch(e) { console.error(e); alert('Error al generar el PDF: ' + e.message); }
    btn.disabled = false; btn.innerHTML = '&#128229; Descargar informe PDF';
  }

  function pdfAddLogo(doc, W, M) {
    try {
      doc.addImage(LOGO_B64, 'JPEG', W-M-22, 8, 22, 14);
    } catch(e) { /* logo no disponible */ }
  }

  async function buildInformePDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    const W=210, M=18;
    const G=[200,153,58], D2=[26,26,26], MU=[138,130,120];
    const ref = generarRef();
    const favorable = D.resultado === "FAVORABLE";
    const ncs = D.ncs || [];
    const circuitos = D.circuitos || [];
    const fechaFmt = (D.fechaInspeccion||"").split("-").reverse().join("/");

    const hw = W-M*2;

    const addHdr = () => {

      doc.text("Arp Prevención S.L.", M+20, 12);
      doc.setFont("helvetica","normal"); doc.setFontSize(6.5); doc.setTextColor(...MU);
      doc.text("C/ Gabriel Miró 3, Edificio Wertice, Planta 1ª Puerta 4 — 41704 Dos Hermanas, Sevilla", M+20, 16);
      doc.setTextColor(...G); doc.setFontSize(7.5); doc.setFont("helvetica","bold");
      doc.text(ref, W-M, 14, {align:"right"});
      doc.setDrawColor(...G); doc.setLineWidth(0.4); doc.line(M,22,W-M,22);
    };

    const addFtr = (pg, tot) => {
      doc.setDrawColor(...G); doc.setLineWidth(0.3); doc.line(M,284,W-M,284);
      doc.setFontSize(7); doc.setFont("helvetica","bold"); doc.setTextColor(...G);
      doc.text("Arp Prevención S.L.", M, 289);
      doc.setTextColor(...MU); doc.setFont("helvetica","normal");
      doc.text(ref, W/2, 289, {align:"center"});
      doc.text(`Página ${pg} de ${tot}`, W-M, 289, {align:"right"});
    };

    const fld = (lbl, val, x, y, w) => {
      doc.setFillColor(245,243,239); doc.rect(x,y,w,10,"F");
      doc.setDrawColor(...G); doc.setLineWidth(0.15); doc.rect(x,y,w,10);
      doc.setTextColor(...MU); doc.setFontSize(6.5); doc.setFont("helvetica","bold");
      doc.text(lbl, x+2, y+4);
      doc.setTextColor(...D2); doc.setFontSize(8.5); doc.setFont("helvetica","normal");
      doc.text(String(val||"—"), x+2, y+8.5, {maxWidth:w-4});
    };

    // Calcular total páginas estimado
    const pgNCs = ncs.length > 0 ? 1 : 0;
    const pgCirc = circuitos.length > 0 ? 1 : 0;
    const TOTAL_PAGES = 3 + pgCirc + pgNCs;

    // ── PORTADA ──────────────────────────────────────────
    addHdr(); let y=28;
    doc.setFontSize(18); doc.setFont("helvetica","bold"); doc.setTextColor(...D2);
    doc.text("Inspección de Parque Acrobático en Altura", W/2, y, {align:"center"}); y+=8;
    doc.setFontSize(10); doc.setFont("helvetica","normal"); doc.setTextColor(...MU);
    doc.text("según UNE-EN 15.567-1:2015+A1:2021", W/2, y, {align:"center"}); y+=10;
    doc.setDrawColor(...G); doc.setLineWidth(0.5); doc.line(M,y,W-M,y); y+=8;
    doc.setFontSize(18); doc.setFont("helvetica","bold"); doc.setTextColor(...D2);
    doc.text(D.nombreInstalacion||"", W-M, y, {align:"right"}); y+=7;
    doc.setFontSize(10); doc.setFont("helvetica","normal"); doc.setTextColor(...MU);
    doc.text(`${D.municipio||""} ${D.provincia?", "+D.provincia:""}`, W-M, y, {align:"right"}); y+=8;
    doc.setDrawColor(...G); doc.line(M,y,W-M,y); y+=8;
    doc.setFontSize(10); doc.setFont("helvetica","bold"); doc.setTextColor(...G);
    doc.text(ref, W-M, y, {align:"right"}); y+=8;
    doc.setDrawColor(...G); doc.line(M,y,W-M,y); y+=8;
    doc.setFontSize(9); doc.setFont("helvetica","italic"); doc.setTextColor(...MU);
    doc.text(`Fecha inspección: ${fechaFmt}  —  Inspector: ${D.inspectorNombre||""}`, W/2, y, {align:"center"});
    // Resultado en portada
    y+=12; const pColor = favorable ? [39,174,96] : [192,57,43];
    doc.setFillColor(...pColor); doc.roundedRect(M,y,hw,14,3,3,"F");
    doc.setTextColor(255,255,255); doc.setFontSize(13); doc.setFont("helvetica","bold");
    doc.text(`Resultado: ${D.resultado}`, W/2, y+9, {align:"center"});
    addFtr(1, TOTAL_PAGES);

    // ── DATOS GENERALES ──────────────────────────────────
    doc.addPage(); addHdr(); y=28;
    doc.setFillColor(...D2); doc.rect(M,y,hw,7,"F");
    doc.setTextColor(255,255,255); doc.setFontSize(8.5); doc.setFont("helvetica","bold");
    doc.text("PROPIETARIO DE LAS INSTALACIONES", M+4, y+5); y+=9;
    fld("EMPRESA", D.propietario, M, y, hw*0.6);
    fld("CIF", D.cif, M+hw*0.6+1, y, hw*0.4); y+=12;
    fld("GESTOR", D.gestor, M, y, hw); y+=12;
    doc.setFillColor(...D2); doc.rect(M,y,hw,7,"F");
    doc.setTextColor(255,255,255); doc.setFontSize(8.5); doc.setFont("helvetica","bold");
    doc.text("SOLICITANTE DE LA INSPECCIÓN", M+4, y+5); y+=9;
    fld("SOLICITANTE", D.solicitante||D.propietario, M, y, hw*0.6);
    fld("TIPO DE INSPECCIÓN", D.tipoInspeccion, M+hw*0.6+1, y, hw*0.4); y+=12;
    doc.setFillColor(...D2); doc.rect(M,y,hw,7,"F");
    doc.setTextColor(255,255,255); doc.setFontSize(8.5); doc.setFont("helvetica","bold");
    doc.text("ORGANISMO DE INSPECCIÓN", M+4, y+5); y+=9;
    doc.setFontSize(9); doc.setFont("helvetica","bold"); doc.setTextColor(...D2);
    doc.text("ARP PREVENCIÓN S.L.", M, y+5); y+=8;
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...MU);
    doc.text("C/ Gabriel Miró 3, Edificio Wertice Planta 1ª Puerta 4 — 41703 Dos Hermanas, Sevilla", M, y+5); y+=6;
    doc.text("Teléfono: 93 377 67 95  ·  info@arpprevencion.com  ·  www.arpprevencion.com", M, y+5);
    addFtr(2, TOTAL_PAGES);

    // ── CHECKLIST GENERAL ────────────────────────────────
    doc.addPage(); addHdr(); y=28;
    const GEN_ITEMS = [
      {id:"g1",ref:"4.1",sec:"General",desc:"4.1 Selección de Lugar y Entorno. Evacuación posible desde cualquier punto; riesgos locales (rayos, inundaciones, viento, corrosión)."},
      {id:"g2",ref:"4.3.3",sec:"4.3.3 Sistemas de Soporte",desc:"4.3.3.3 Sistemas de soporte naturales – Árboles. Evaluación de resistencia e idoneidad por experto; diagnóstico actualizado; protección de raíces; medidas correctivas."},
      {id:"g3",ref:"4.3.3",sec:"4.3.3 Sistemas de Soporte",desc:"4.3.3.2 Sistemas de soporte artificiales. Adecuación a cargas; vientos y anclajes protegidos; verificación de estructuras existentes si aplican; cálculos disponibles."},
      {id:"g4",ref:"4.2",sec:"4.2 Materiales y cables",desc:"Maderas, metales, compuestos; cables (galvanizado/inox); terminaciones conforme; criterio de desecho."},
      {id:"g5",ref:"6",sec:"6 Señalización",desc:"Control de acceso. Codificación de recorridos y dificultad; pictogramas; ubicación y legibilidad."},
      {id:"g6",ref:"7",sec:"7 EPI y equipos de rescate",desc:"Identificación y marcados; revisión periódica vigente; prueba funcional si aplica; adecuación a morfología de usuarios; registros al día."},
      {id:"g7",ref:"8",sec:"8 Documentación",desc:"Manual del constructor, mantenimiento, evaluación arbórea, identificación en planos, marcados."},
    ];
    const checklist = D.checklist||{}, checklistObs=D.checklistObs||{};
    doc.setFillColor(...D2); doc.rect(M,y,hw,7,"F");
    doc.setTextColor(255,255,255); doc.setFontSize(8); doc.setFont("helvetica","bold");
    doc.text("General", W/2, y+5, {align:"center"}); y+=9;
    let lastSec="";
    GEN_ITEMS.forEach((item,i) => {
      if (y>265) { doc.addPage(); addHdr(); y=28; }
      if (item.sec !== lastSec) {
        lastSec=item.sec;
        doc.setFillColor(245,243,239); doc.rect(M,y,hw,5.5,"F");
        doc.setFillColor(...G); doc.rect(M,y,1.5,5.5,"F");
        doc.setTextColor(...G); doc.setFontSize(6.5); doc.setFont("helvetica","bold");
        doc.text(item.ref, M+3.5, y+3.8);
        doc.setTextColor(...D2); doc.text(item.sec, M+12, y+3.8);
        y+=6.5;
      }
      const v=checklist[item.id]||"";
      const obs=checklistObs[item.id]||"";
      const rh=(obs&&v==="N")?13:8;
      doc.setFillColor(i%2===0?[255,255,255]:[252,251,249]); doc.rect(M,y,hw-22,rh,"F");

      doc.text(doc.splitTextToSize(item.desc,hw-27), M+2, y+5);
      const vc=v==="S"?[39,174,96]:v==="N"?[230,126,34]:v==="NA"?[160,160,160]:[240,238,234];

    addFtr(3, TOTAL_PAGES);

    // ── CIRCUITOS Y JUEGOS ───────────────────────────────
    let pg=4;
    if (circuitos.length>0) {
      doc.addPage(); addHdr(); y=28;
      const COLS=["ie","af","ej","ra","zs"];
      const COL_LBLS=["Integridad\nestructural","Anclajes y\nfijaciones","Elementos de\njuego","Riesgos y\natrapamientos","Zona de\nseguridad"];
      const jW=hw*0.22, sW=hw*0.09, obsW=hw-jW-sW*5-14;

      COL_LBLS.forEach(l => {
        const ls=l.split("\n");

      doc.text("Obs.", cx+obsW/2, y+9, {align:"center"});

      circuitos.forEach(circ => {

          doc.text(tipoStr+ramaStr+(j.nombre||"—"), M+2, y+4.8, {maxWidth:jW-4});

    // ── NO CONFORMIDADES ─────────────────────────────────
    if (ncs.length) {
      doc.addPage(); addHdr(); y=28;
      doc.setFillColor(...D2); doc.rect(M,y,hw,7,"F");
      doc.setTextColor(255,255,255); doc.setFontSize(8); doc.setFont("helvetica","bold");
      doc.text("LISTADO DE OBSERVACIONES Y NO CONFORMIDADES", M+4, y+5); y+=10;
      ncs.forEach((nc,i) => {
        if (y>240) { doc.addPage(); addHdr(); y=28; }

        }
        // Si hay resolución, añadirla
        if (nc.resolucion || nc.fechaCorreccion) {
          if (y>255) { doc.addPage(); addHdr(); y=28; }

          doc.text(resLines, M+6, y+10);

          // Fotos de corrección
          if (nc.fotosCorreccion && nc.fotosCorreccion.length) {

              try { doc.addImage(f.dataUrl,"JPEG",fx,y,40,fH); } catch(e){}
              fx+=42;

            y+=fH+4;
          }
        }
        y+=4;
      });
      addFtr(pg, TOTAL_PAGES); pg++;
    }

    // ── FIRMA ─────────────────────────────────────────────
    if (ncs.length===0 || y>220) { doc.addPage(); addHdr(); y=28; }
    y=Math.max(y+10,210);
    if (D.ensayos) {
      doc.setFontSize(8); doc.setFont("helvetica","bold"); doc.setTextColor(...D2);
      doc.text("Ensayos no realizados:", M, y); y+=5;
      const el=doc.splitTextToSize(D.ensayos,hw);
      doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...MU);
      doc.text(el, M, y); y+=el.length*5+6;
    }
    doc.setFontSize(10); doc.setFont("helvetica","bold"); doc.setTextColor(...D2);
    doc.text(fechaLarga, W/2, y, {align:"center"}); y+=5;
    doc.text(D.inspectorNombre||"", W/2, y, {align:"center"}); y+=5;
    doc.setFontSize(8); doc.setFont("helvetica","normal"); doc.setTextColor(...MU);
    doc.text("Inspector Autorizado", W/2, y, {align:"center"}); y+=14;
    doc.setDrawColor(...G); doc.setLineWidth(0.35);
    doc.rect(W/2-36,y,32,16); doc.rect(W/2+4,y,32,16);
    doc.setFontSize(6.5); doc.setFont("helvetica","bold"); doc.setTextColor(...G);
    doc.text("Inspector", W/2-20, y+4, {align:"center"});
    doc.text("Director Técnico", W/2+20, y+4, {align:"center"});

    doc.text("José Manuel Moreno Vélez", W/2+20, y+10, {align:"center", maxWidth:28});
    addFtr(pg, TOTAL_PAGES);

    const filename = ref.replace(/\//g,"_").replace(/ /g,"_") + ".pdf";

  }

  // ── CERTIFICADO ───────────────────────────────────────
  async function generarCertificado() {
    if (typeof window.jspdf === "undefined") { alert("PDF cargando, espera un momento."); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
    const W=210, M=20;
    const G=[200,153,58], D2=[26,26,26], MU=[138,130,120];
    const ref = generarRef();
    const fechaFmt = (D.fechaInspeccion||"").split("-").reverse().join("/");
    const totalJuegos=(D.circuitos||[]).reduce((a,c)=>a+(c.juegos||[]).length,0);
    const vigencia=D.fechaInspeccion?((()=>{const dt=new Date(D.fechaInspeccion+"T12:00:00");dt.setDate(dt.getDate()+1);return dt.toLocaleDateString("es-ES");})()):"";
    const proxima=D.fechaInspeccion?((()=>{const dt=new Date(D.fechaInspeccion+"T12:00:00");dt.setFullYear(dt.getFullYear()+1);return dt.toLocaleDateString("es-ES");})()):"";

    try { doc.addImage(LOGO_B64,"JPEG",W/2-20,14,40,26); } catch(e){}
    doc.setFillColor(...G); doc.rect(M,44,W-M*2,0.5,"F");
    doc.setFontSize(18); doc.setFont("helvetica","bold"); doc.setTextColor(...D2);
    doc.text("CERTIFICADO DE CONFORMIDAD", W/2, 56, {align:"center"});
    doc.setFontSize(12); doc.text("A NORMA UNE EN 15567-1:2015+A1:2021", W/2, 64, {align:"center"});
    doc.setFillColor(...G); doc.rect(M,68,W-M*2,0.5,"F");
    doc.setFontSize(10); doc.setTextColor(...G); doc.setFont("helvetica","bold");
    doc.text(ref, W/2, 76, {align:"center"});
    doc.setFontSize(9); doc.setTextColor(...D2); doc.setFont("helvetica","normal");
    doc.text("Concedido a", W/2, 83, {align:"center"});
    doc.setFontSize(13); doc.setFont("helvetica","bold");
    doc.text((D.propietario||"").toUpperCase(), W/2, 91, {align:"center"});

    doc.setFontSize(10); doc.setFont("helvetica","normal"); doc.setTextColor(...D2);
    const c1=`ARP PREVENCIÓN S.L., organismo de inspección, certifica haber efectuado en fecha ${fechaFmt} la inspección de los equipamientos de RECORRIDO ACROBÁTICO EN ALTURA de las instalaciones de ${D.nombreInstalacion||""}, ${totalJuegos} JUEGOS, situado en ${D.direccion||""}, ${D.municipio||""}${D.provincia?", "+D.provincia:""}.`;
    const l1=doc.splitTextToSize(c1,W-M*2); doc.text(l1,M,102); let y=102+l1.length*6+6;
    const c2=`La intervención realizada da como resultado un "Informe de inspección", con la numeración ${ref}, que indica las observaciones relativas a las instalaciones y omisiones. Estas observaciones sólo son válidas en las condiciones presentes en la instalación en el momento de control.`;
    const l2=doc.splitTextToSize(c2,W-M*2); doc.text(l2,M,y); y+=l2.length*6+6;
    const c3=`ARP PREVENCIÓN S.L. certifica que los equipamientos cumplen con las exigencias marcadas en las normas UNE-EN 15567-1:2015+A1:2021. Recorrido acrobático en altura. Parte 1 tras la inspección in situ realizada, la validación de los distintos documentos exigidos por norma y las acciones de mantenimiento realizadas.`;
    const l3=doc.splitTextToSize(c3,W-M*2); doc.text(l3,M,y); y+=l3.length*6+6;
    const c4=`Visto que el informe presenta un resultado FAVORABLE, se considera que los equipamientos cumplen con las especificaciones de seguridad de las normas de aplicación en vigencia y que son aptos para su uso bajo las indicaciones y directrices del manual de uso y mantenimiento del constructor/instalador.`;
    const l4=doc.splitTextToSize(c4,W-M*2); doc.text(l4,M,y); y+=l4.length*6+10;
    doc.setFontSize(9); doc.setFont("helvetica","bold"); doc.setTextColor(...D2);
    doc.text("FIRMA DIGITAL", W/2, y, {align:"center"}); y+=12;
    doc.setDrawColor(...G); doc.setLineWidth(0.35);
    doc.rect(W/2-36,y,32,18); doc.rect(W/2+4,y,32,18);
    doc.setFontSize(6.5); doc.setFont("helvetica","bold"); doc.setTextColor(...G);
    doc.text("Inspector", W/2-20, y+4, {align:"center"});
    doc.text("Director Técnico / Revisor", W/2+20, y+4, {align:"center"});
    doc.setTextColor(...D2); doc.setFont("helvetica","normal"); doc.setFontSize(7);
    doc.text(D.inspectorNombre||"", W/2-20, y+11, {align:"center", maxWidth:28});
    doc.text("José Manuel Moreno Vélez", W/2+20, y+11, {align:"center", maxWidth:28}); y+=24;
    doc.setFontSize(9); doc.setTextColor(...D2); doc.setFont("helvetica","normal");
    doc.text("Fecha entrada en vigor:", M, y); doc.setFont("helvetica","bold"); doc.text(vigencia, M+50, y); y+=6;
    doc.setFont("helvetica","normal"); doc.text("Fecha próxima inspección:", M, y); doc.setFont("helvetica","bold"); doc.text(proxima, M+50, y); y+=10;
    doc.setFillColor(...G); doc.rect(M,y,W-M*2,0.5,"F"); y+=4;
    doc.setFontSize(7.5); doc.setFont("helvetica","normal"); doc.setTextColor(...MU);
    doc.text("Adell Riesgos y Prevención S.L. · C/ Gabriel Miró 3, Edificio Wertice, Planta 1ª Puerta 4 — 41704 Dos Hermanas, Sevilla", W/2, y+4, {align:"center"});

    const fn=ref.replace(/\//g,"_").replace(/ /g,"_")+"_Certificado.pdf";
    doc.save(fn);
  }

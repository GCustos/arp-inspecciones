        }
        doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...WHITE);
        lines.forEach((l,i) => doc.text(l, ML+2, y+4.5+i*4.5));
        y += bh + 1;
      });

      if (textoResMetodo) {
        // La metodología de resolución de NC va como un bloque: si no cabe entera en lo que
        // queda de página, empieza en la siguiente (antes se partía y su última línea podía
        // quedar sola en una página). Si fuese más larga que una página entera, se parte.
        doc.setFontSize(9); doc.setFont('helvetica','normal');
        const altoMetodo = doc.splitTextToSize(textoResMetodo, CW).length * 5;
        const cabeEnPagina = altoMetodo <= (PH-18) - (MT+8);
        if (cabeEnPagina && y + 6 + altoMetodo > PH-18) {
          doc.addPage(); nPag[0]++; addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr); y = MT+8;
        } else {
          y += 6;
        }
        y = addTextBlock(doc, textoResMetodo, ML, y, CW, 9, DARK, 'normal', 5, PH-18, ref, fmtRev, fmtFechaStr, nPag, totPag);
      }
      y = cmpCerrarSeccion('Resultados de la inspección', cmpCtx(doc, ref, fmtRev, fmtFechaStr, nPag, totPag), y);


      // ═══ DESCRIPCIÓN DEL RECORRIDO ═══
      doc.addPage(); nPag[0]++;
      indicePags['DESCRIPCION'] = nPag[0];
      addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
      y = MT + 8;

      // Cabecera sección dorada
      doc.setFillColor(...GOLD); doc.setDrawColor(...GOLD);
      doc.rect(ML, y-2, CW, 8, 'F');
      doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(...WHITE);
      doc.text(tituloDescripcionSeccion, ML+3, y+3.5); y += 12;

      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('I. Localización', ML, y); y += 6;
      const circuitos = D.circuitos || [];
      const totalElems = circuitos.reduce((s,c2)=>s+(c2.juegos||[]).length,0);
      const totalJR = circuitos.reduce((s,c2)=>s+(c2.juegos||[]).filter(j=>j.tipo==='R').length,0);
      const dirCompleta = composeDireccion(D);
      var _resumenTipos = '';
      if (esTiposJuego) {
        var _tiposCount = {};
        circuitos.forEach(function(c2){ if(c2.tipoElemento){ _tiposCount[c2.tipoElemento]=(_tiposCount[c2.tipoElemento]||0)+1; } });
        _resumenTipos = tiposJuegoInforme.map(function(t){ var n=_tiposCount[t.id]||0; return n ? (n+' '+(t.label||t.id)+(n!==1?'s':'')) : null; }).filter(Boolean).join(', ');
      }
      const locText = PLANTILLA_INFORME.localizacion(esTiposJuego, {
        municipio: D.municipio||'', direccion: dirCompleta, nombre: D.nombreInstalacion||'',
        nCircuitos: circuitos.length, totalJuegos: totalJR, totalElementos: totalElems, resumenTipos: _resumenTipos
      });
      y = addTextBlock(doc, locText, ML, y, CW, 9, DARK, 'normal', 5, PH-18, ref, fmtRev, fmtFechaStr, nPag, totPag);
      y += 6;

      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text(esTiposJuego ? 'II. Descripción de los elementos' : 'II. Descripción de los juegos', ML, y); y += 8;

      // Dibuja una celda de foto+nombre en el grid de 3 columnas — factorizado para
      // reutilizar exactamente el mismo render en modo "circuito por página" (PAA, un
      // circuito puede tener muchos juegos) y en modo "grid continuo" (SAE/FER: cada
      // circuito es un único elemento, forzar una página por circuito generaba informes
      // de decenas de páginas — reportado por Guille 2026-09-02, 60 páginas en Climbat
      // Zaragoza para 47 elementos).
      function _celdaFotoJuego(imgX, rowY, imgW, imgH, j, nombreMostrar) {
        if (j.fotos && j.fotos.length > 0) {
          const foto = j.fotos[0];
          const src = foto.dataUrl || foto.url;
          if (src) {
            try {
              const fmt = src.includes('data:image/png') ? 'PNG' : 'JPEG';
              const fit = fitImage(doc, src, imgW, imgH-8);
              const offsetX = (imgW - fit.w) / 2;
              const offsetY = (imgH - 8 - fit.h) / 2;
              doc.addImage(src, fmt, imgX + offsetX, rowY + offsetY, fit.w, fit.h);
            } catch(e) {
              doc.setFillColor(...SURF); doc.rect(imgX, rowY, imgW, imgH-8, 'F');
              doc.setFontSize(7); doc.setTextColor(...MUTED);
              doc.text('sin foto', imgX+imgW/2, rowY+(imgH-8)/2, {align:'center'});
            }
          } else {
            doc.setFillColor(...SURF); doc.setDrawColor(...BORDER); doc.rect(imgX, rowY, imgW, imgH-8, 'FD');
            doc.setFontSize(7); doc.setTextColor(...MUTED);
            doc.text('sin foto', imgX+imgW/2, rowY+(imgH-8)/2, {align:'center'});
          }
        } else {
          doc.setFillColor(...SURF); doc.setDrawColor(...BORDER); doc.rect(imgX, rowY, imgW, imgH-8, 'FD');
          doc.setFontSize(7); doc.setTextColor(...MUTED);
          doc.text('sin foto', imgX+imgW/2, rowY+(imgH-8)/2, {align:'center'});
        }
        doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
        doc.text(nombreMostrar, imgX+imgW/2, rowY+imgH-4, {align:'center', maxWidth:imgW});
      }

      const imgW = CW/3 - 3;
      const imgH = 45;

      if (esTiposJuego) {
        // Un grid por tipo de elemento (Vía, luego Zona/Muro) con la misma barra
        // divisoria dorada que ya usa "II. Específica" — antes era un único grid
        // continuo con todos los circuitos mezclados sin distinguir tipo.
        const gruposFotos = tiposJuegoInforme.filter(function(t){ return circuitos.some(function(c){ return c.tipoElemento===t.id; }); });
        gruposFotos.forEach(function(tipoCfg) {
          const circsDeTipo = circuitos.filter(function(c){ return c.tipoElemento===tipoCfg.id; });
          if (y + 12 > PH-18) { doc.addPage(); nPag[0]++; addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr); y = MT+8; }
          y = drawTipoGroupBar(doc, y, tipoCfg, {count: circsDeTipo.length, heightAfter: 9});
          // Grid continuo dentro del tipo: sin salto de página forzado ni cabecera por
          // circuito — solo pagina cuando el grid se llena de verdad.
          let col = 0, rowY = y;
          for (const circ of circsDeTipo) {
            const j = (circ.juegos||[])[0];
            if (!j) continue;
            if (col === 3) { col = 0; rowY += imgH + 12; y = rowY; }
            if (rowY + imgH + 12 > PH-18) {
              doc.addPage(); nPag[0]++;
              addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
              rowY = MT+8; y = rowY; col = 0;
            }
            const imgX = ML + col * (imgW + 3);
            _celdaFotoJuego(imgX, rowY, imgW, imgH, j, circ.nombre||j.nombre||'');
            col++;
          }
          y = rowY + imgH + 12;
        });
      } else {
        // Fotos por circuito — grid 3 columnas, cada circuito en página nueva (un circuito
        // PAA puede tener muchos juegos, mezclar circuitos en el mismo grid confundiría).
        let circIdx = 0;
        for (const circ of circuitos) {
          if (circIdx > 0 || y > PH-60) { doc.addPage(); nPag[0]++; addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr); y = MT+8; }
          circIdx++;
          // Cabecera circuito
          doc.setFillColor(...DARK); doc.rect(ML, y, CW, 8, 'F');
          doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...WHITE);
          doc.text(circ.nombre||'', PW/2, y+5.5, {align:'center'}); y += 10;

          const juegos = circ.juegos || [];
          let col = 0; let rowY = y;

          for (const j of juegos) {
            if (col === 3) { col = 0; rowY += imgH + 12; y = rowY; }
            if (rowY + imgH + 12 > PH-18) {
              doc.addPage(); nPag[0]++;
              addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
              rowY = MT+8; y = rowY;
            }
            const imgX = ML + col * (imgW + 3);
            const jNombre = (j.tipo==='NR'?'*. ':j.tipo==='AUX'?'* ':'') + j.nombre;
            _celdaFotoJuego(imgX, rowY, imgW, imgH, j, jNombre);
            col++;
          }
          y = rowY + imgH + 12;
        }
      }


      // ═══ INSPECCIÓN DE PARQUES — GENERAL ═══
      doc.addPage(); nPag[0]++;
      indicePags['INSPECCION'] = nPag[0];
      addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr, true);
      y = MT + 8;

      doc.setFillColor(...GOLD); doc.rect(ML, y-2, CW, 8, 'F');
      doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(...WHITE);
      doc.text(tituloInspeccionSeccion, ML+3, y+3.5); y += 12;

      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('I. General', ML, y); y += 8;

      // Tabla checklist general — UNA tabla independiente por ítem
      const descW = CW * 0.55;
      const colSW = 12, colNsW = 12, colNaW = 12;
      const notasW = CW - descW - colSW - colNsW - colNaW;

      GEN_ITEMS_PDF.forEach(item => {
        const v = (D.checklist||{})[item.id]||'';
        const obs = (D.checklistObs||{})[item.id]||'';
        // Buscar NC asociada a este ítem para color de fondo
        const ncAsoc = (D.ncs||[]).filter(n => n.checklistId === item.id || n.autoId === item.id);
        const prioFila = ncAsoc.length ? ncAsoc.reduce((max,n) => {
          const ord = {GRAVE:4,MEDIA:3,LEVE:2,DOCUMENTAL:1,OBSERVACION:0};
          return (ord[n.prio]||0) > (ord[max]||0) ? n.prio : max;
        }, '') : '';
        const filaFondo = prioFila === 'GRAVE' ? [255,235,238]
          : prioFila === 'MEDIA'     ? [255,248,225]
          : prioFila === 'LEVE'      ? [232,245,233]
          : prioFila === 'DOCUMENTAL'? [227,242,253]
          : WHITE;

        // Split desc a 8pt (render) y obs a 7pt (render) para métricas exactas
        doc.setFontSize(8); doc.setFont('helvetica','normal');
        const descLines = doc.splitTextToSize(item.desc, descW - 5);
        doc.setFontSize(7); doc.setFont('helvetica','normal');
        const obsLines = obs ? doc.splitTextToSize(obs, notasW - 3) : [];
        doc.setFontSize(8);
        const rowH2 = Math.max(14, Math.max(descLines.length * 4.5 + 6, obsLines.length * 4.5 + 9));

        if (y + 7 + rowH2 + 8 > PH-18) {
          doc.addPage(); nPag[0]++;
          addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr, true);
          y = MT+8;
        }

        doc.setDrawColor(...DARK); doc.setLineWidth(0.2);

        // Cabecera fila: fondo SURF
        doc.setFillColor(...SURF);
        doc.rect(ML, y, CW, 7, 'FD');
        doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...(cmpColor(`${item.ref||''} ${item.sec||''}`.trim()) || DARK));
        doc.text(`${item.ref} ${item.sec}`, ML+2, y+4.8);
        doc.setTextColor(...DARK);
        doc.setFontSize(7);
        doc.text('SAT.', ML+descW+colSW/2, y+4.8, {align:'center'});
        doc.text('N.S.', ML+descW+colSW+colNsW/2, y+4.8, {align:'center'});
        doc.text('N.A.', ML+descW+colSW+colNsW+colNaW/2, y+4.8, {align:'center'});
        doc.text('NOTAS SI/NO OBSERVACIONES', ML+descW+colSW+colNsW+colNaW+2, y+4.8);
        y += 7;

        // Fila contenido: fondo color según NC
        doc.setFillColor(...filaFondo);
        doc.rect(ML, y, CW, rowH2, 'FD');
        doc.setDrawColor(...DARK);
        doc.line(ML+descW, y, ML+descW, y+rowH2);
        doc.line(ML+descW+colSW, y, ML+descW+colSW, y+rowH2);
        doc.line(ML+descW+colSW+colNsW, y, ML+descW+colSW+colNsW, y+rowH2);
        doc.line(ML+descW+colSW+colNsW+colNaW, y, ML+descW+colSW+colNsW+colNaW, y+rowH2);

        // Descripción
        doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...(cmpColor(item.desc) || DARK));
        descLines.forEach((l,i) => doc.text(l, ML+2, y+5+i*4.5));

        // X negra en columna correcta
        doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
        if (v === 'S')  doc.text('X', ML+descW+colSW/2,                    y+rowH2/2+2, {align:'center'});
        else if (v === 'N')  doc.text('X', ML+descW+colSW+colNsW/2,        y+rowH2/2+2, {align:'center'});
        else if (v === 'NA') doc.text('X', ML+descW+colSW+colNsW+colNaW/2, y+rowH2/2+2, {align:'center'});

        // Notas
        if (obs) {
          doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
          obsLines.forEach((l,i) => doc.text(l, ML+descW+colSW+colNsW+colNaW+2, y+5+i*4.5));
        }
        y += rowH2;

        // Sat. en cursiva debajo
        doc.setFontSize(7); doc.setFont('helvetica','italic'); doc.setTextColor(...MUTED);
        doc.text('Sat. : Satisfactorio; N. S.: no satisfactorio; N.A.: no aplica', ML, y+3.5);
        y += 7;
      });

      // Observaciones generales
      if (D.obsGral) {
        if (y + 20 > PH-18) { doc.addPage(); nPag[0]++; addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr); y = MT+8; }
        doc.setFillColor(...SURF); doc.setDrawColor(...DARK); doc.setLineWidth(0.2);
        doc.rect(ML, y, CW, 7, 'FD');
        doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
        doc.text('Observaciones Generales', ML+2, y+4.5); y += 7;
        const obsLines = doc.splitTextToSize(D.obsGral, CW-4);
        const obsH = Math.max(20, obsLines.length * 5 + 4);
        doc.setFillColor(...WHITE); doc.rect(ML, y, CW, obsH, 'FD');
        doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
        doc.text(obsLines, ML+2, y+4); y += obsH + 4;
      }


      // ═══ INSPECCIÓN — CIRCUITOS Y JUEGOS ═══
      doc.addPage(); nPag[0]++;
      addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr, true);
      y = MT + 8;

      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text(esTiposJuego ? 'II. Específica — Resumen por elemento' : 'II. Específica Circuitos y Juegos', ML, y); y += 8;

      // Tabla por criterio — formato tabla independiente igual que I. General.
      // Una fila por columna(criterio), agregando SAT/N.S./N.A. de los juegos que la usan.
      var ncNumGlobal = 0;
      // Comprueba si una NC pertenece a alguno de los circuitos del subset (mismo tipo de
      // elemento). Necesario porque SAE y MURO comparten ids de columna (ej. "SUP" es
      // 4.10 en Vía y 4.11 en Muro) — sin esto, filtrar solo por col.key mezcla las notas
      // de un tipo con el resumen del otro.
      function ncPerteneceASubset(n, circsSubset) {
        if (n.juegoId) {
          return circsSubset.some(function(c){ return (c.juegos||[]).some(function(j){ return j.id === n.juegoId; }); });
        }
        if (n._ci !== undefined && n._ci !== 'g') {
          var circ = circuitos[n._ci];
          return circ ? circsSubset.indexOf(circ) !== -1 : false;
        }
        return false;
      }
      function renderFilaCriterioInforme(col, circsSubset, esUltimaColumna) {
        const vArr = [];
        circsSubset.forEach(circ => { (circ.juegos||[]).forEach(j => { if(j[col.key]) vArr.push(j[col.key]); }); });
        const hayN = vArr.includes('N');
        const allNA = vArr.length>0 && vArr.every(v=>v==='NA');
        const allS = vArr.length>0 && vArr.every(v=>v==='S'||v==='NA');
        var vGlobal = hayN?'N':allNA?'NA':allS?'S':'S';

        var ncsDelCol = (D.ncs||[]).filter(n => n.autoId && n.autoId.includes('_'+col.key) && ncPerteneceASubset(n, circsSubset));
        if (esUltimaColumna) {
          (D.ncs||[]).forEach(function(n){ if(n.autoId && n.autoId.includes('_manual')) ncsDelCol.push(n); });
          (D.ncs||[]).forEach(function(n){ if(n.autoId && n.autoId.startsWith('g')) ncsDelCol.push(n); });
        }
        var ncsAbiertas = ncsDelCol.filter(function(n){ return !n.cerrada; });
        var todasCerradas = ncsDelCol.length > 0 && ncsAbiertas.length === 0;
        var _ncItemsFull = ncsDelCol.map(function(n){ ncNumGlobal++; return (n.cerrada?'(C) ':'')+ncNumGlobal+'. '+(getNcElem(n)+(n.desc?' — '+n.desc:'')); });
        var notaCol = _ncItemsFull.slice(0,5).join(' ') + (_ncItemsFull.length > 5 ? ' ... y '+(_ncItemsFull.length-5)+' más (ver Listado)' : '');

        // Color fila según NC más grave ABIERTA del criterio
        const prioCol = ncsAbiertas.length ? ncsAbiertas.reduce((max,n) => {
          const ord = {GRAVE:4,MEDIA:3,LEVE:2,DOCUMENTAL:1,OBSERVACION:0};
          return (ord[n.prio]||0) > (ord[max]||0) ? n.prio : max;
        }, '') : '';
        const filaFondoCol = prioCol === 'GRAVE' ? [255,235,238]
          : prioCol === 'MEDIA'      ? [255,248,225]
          : prioCol === 'LEVE'       ? [232,245,233]
          : prioCol === 'DOCUMENTAL' ? [227,242,253]
          : WHITE;

        // Calcular líneas con el mismo tamaño de fuente que se usará al renderizar
        doc.setFontSize(8); doc.setFont('helvetica','normal');
        const descLinesCol = doc.splitTextToSize(col.desc, descW - 5);
        doc.setFontSize(7); doc.setFont('helvetica','normal');
        const notaLinesRaw = notaCol ? doc.splitTextToSize(notaCol, notasW - 4) : [];
        const MAX_NOTA_LINES = 10;
        const notaLinesCol = notaLinesRaw.slice(0, MAX_NOTA_LINES);
        if (notaLinesRaw.length > MAX_NOTA_LINES) notaLinesCol[MAX_NOTA_LINES - 1] += '…';
        doc.setFontSize(8);
        const rowHcol = Math.max(14, Math.max(descLinesCol.length * 4.5 + 6, notaLinesCol.length * 4.5 + 9));

        if (y + 7 + rowHcol + 8 > PH-18) {
          doc.addPage(); nPag[0]++;
          addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr, true);
          y = MT+8;
        }

        doc.setDrawColor(...DARK); doc.setLineWidth(0.2);

        // Cabecera
        doc.setFillColor(...SURF);
        doc.rect(ML, y, CW, 7, 'FD');
        doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...(cmpColor(`${col.ref||''} ${col.label||''}`.trim()) || DARK));
        doc.text(`${col.ref} ${col.label}`, ML+2, y+4.8);
        doc.setTextColor(...DARK);
        doc.setFontSize(7);
        doc.text('SAT.', ML+descW+colSW/2, y+4.8, {align:'center'});
        doc.text('N.S.', ML+descW+colSW+colNsW/2, y+4.8, {align:'center'});
        doc.text('N.A.', ML+descW+colSW+colNsW+colNaW/2, y+4.8, {align:'center'});
        doc.text('NOTAS SI/NO OBSERVACIONES', ML+descW+colSW+colNsW+colNaW+2, y+4.8);
        y += 7;

        // Fila contenido con color según NC
        doc.setFillColor(...filaFondoCol);
        doc.rect(ML, y, CW, rowHcol, 'FD');
        doc.setDrawColor(...DARK);
        doc.line(ML+descW, y, ML+descW, y+rowHcol);
        doc.line(ML+descW+colSW, y, ML+descW+colSW, y+rowHcol);
        doc.line(ML+descW+colSW+colNsW, y, ML+descW+colSW+colNsW, y+rowHcol);
        doc.line(ML+descW+colSW+colNsW+colNaW, y, ML+descW+colSW+colNsW+colNaW, y+rowHcol);

        doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...(cmpColor(col.desc) || DARK));
        descLinesCol.forEach((l,i) => doc.text(l, ML+2, y+5+i*4.5));

        if (todasCerradas && vGlobal==='N') vGlobal = 'S';
        doc.setFontSize(11); doc.setFont('helvetica','bold');
        doc.setTextColor(...(todasCerradas ? GREEN_C : DARK));
        if (vGlobal==='S')  doc.text('X', ML+descW+colSW/2,                    y+rowHcol/2+2, {align:'center'});
        else if (vGlobal==='N')  doc.text('X', ML+descW+colSW+colNsW/2,        y+rowHcol/2+2, {align:'center'});
        else if (vGlobal==='NA') doc.text('X', ML+descW+colSW+colNsW+colNaW/2, y+rowHcol/2+2, {align:'center'});

        if (notaCol) {
          doc.setFontSize(7); doc.setFont('helvetica','normal');
          doc.setTextColor(...(todasCerradas ? GREEN_C : DARK));
          notaLinesCol.forEach((l,i) => doc.text(l, ML+descW+colSW+colNsW+colNaW+2, y+5+i*4.5));
        }
        y += rowHcol;

        doc.setFontSize(7); doc.setFont('helvetica','italic'); doc.setTextColor(...MUTED);
        doc.text('Sat. : Satisfactorio; N. S.: no satisfactorio; N.A.: no aplica', ML, y+3.5);
        y += 7;
      }

      if (esTiposJuego) {
        // Un sub-bloque por tipo de elemento (ej. Vía, luego Zona/Muro) — el agregado
        // SAT/N.S./N.A. de cada columna solo cuenta los elementos de ESE tipo, nunca mezcla
        // Vías con Muros aunque compartan el mismo id de columna (4.1..4.9 no significa lo mismo).
        const gruposNoVacios = tiposJuegoInforme.filter(function(t){ return circuitos.some(function(c){ return c.tipoElemento===t.id; }); });
        gruposNoVacios.forEach(function(tipoCfg, tiIdx) {
          const circsDeTipo = circuitos.filter(function(c){ return c.tipoElemento===tipoCfg.id; });
          const colsDeTipo = (tipoCfg.columnas||[]).map(function(c){ return {key:c.id, label:c.label, abbrev:c.abbrev, ref:'', desc:''}; });
          if (y + 12 > PH-18) { doc.addPage(); nPag[0]++; addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr, true); y = MT+8; }
          y = drawTipoGroupBar(doc, y, tipoCfg, {count: circsDeTipo.length, heightAfter: 9});
          const esUltimoGrupo = tiIdx === gruposNoVacios.length-1;
          colsDeTipo.forEach(function(col, ci2) {
            renderFilaCriterioInforme(col, circsDeTipo, esUltimoGrupo && ci2===colsDeTipo.length-1);
          });
        });
      } else {
        for (const col of COLS_PDF) {
          renderFilaCriterioInforme(col, circuitos, col.key === COLS_PDF[COLS_PDF.length-1].key);
        }
      }


      // ═══ ANEXOS ═══
      doc.addPage(); nPag[0]++;
      indicePags['ANEXOS'] = nPag[0];
      addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
      y = MT + 8;

      doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(...GOLD);
      doc.text('ANEXOS', ML, y); y += 10;

      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text(PLANTILLA_INFORME.ANEXOS_TITULO, ML, y); y += 6;

      PLANTILLA_INFORME.ANEXOS_DOCS.forEach(d2 => {
        doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
        doc.text('— ' + d2, ML+4, y); y += 6;
      });
      y += 4;
      doc.setFont('helvetica','bold');
      doc.text(PLANTILLA_INFORME.ANEXOS_ENSAYOS_TITULO, ML, y); y += 6;
      doc.setFont('helvetica','normal');
      const ensayosStr = D.ensayos || PLANTILLA_INFORME.ENSAYOS_POR_DEFECTO;
      doc.text('— ' + ensayosStr, ML+4, y); y += 6;


      // ═══ LISTADO DE OBSERVACIONES ═══
      // Agrupar NCs por tipo — una entrada por tipo con todos los elementos afectados
      const PRIO_ORD = {GRAVE:4,MEDIA:3,LEVE:2,DOCUMENTAL:1,OBSERVACION:0};
      const ncGruposMap = {};
      (D.ncs||[]).forEach(function(nc) {
        var key = nc.tipo || 'Sin tipo';
        if (!ncGruposMap[key]) ncGruposMap[key] = { tipo:key, prio:nc.prio||'', elems:[], descs:[], fotosDefecto:[], fotosCorreccion:[], norma:nc.norma||'', resoluciones:[], cerradas:true };
        var g = ncGruposMap[key];
        if ((PRIO_ORD[nc.prio]||0) > (PRIO_ORD[g.prio]||0)) g.prio = nc.prio;
        var ncElemText = getNcElem(nc); if (ncElemText) g.elems.push({texto:ncElemText, prio:nc.prio});
        if (nc.desc) g.descs.push(nc.desc);
        if (nc.fotosDefecto && nc.fotosDefecto.length) g.fotosDefecto.push(nc.fotosDefecto[0]);
        if (nc.fotosCorreccion && nc.fotosCorreccion.length) g.fotosCorreccion.push(nc.fotosCorreccion[0]);
        if (nc.resolucion) g.resoluciones.push(nc.resolucion);
        if (!nc.cerrada) g.cerradas = false;
        if (!g.norma && nc.norma) g.norma = nc.norma;
      });
      const todasNCs = Object.values(ncGruposMap).sort(function(a,b){ return (PRIO_ORD[b.prio]||0)-(PRIO_ORD[a.prio]||0); });

      if (todasNCs.length > 0) {
        doc.addPage(); nPag[0]++;
        indicePags['LISTADO'] = nPag[0];
        addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
        y = MT + 8;

        // Cabecera sección
        doc.setFillColor(...GOLD); doc.rect(ML, y-2, CW, 8, 'F');
        doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(...WHITE);
        doc.text('LISTADO DE OBSERVACIONES', ML+3, y+3.5); y += 12;

        for (let ncIdx = 0; ncIdx < todasNCs.length; ncIdx++) {
          const nc = todasNCs[ncIdx];
          const ncColor = colorNC(nc.prio);
          const ncBg = bgNC(nc.prio);
          const hasFotoD = nc.fotosDefecto.length > 0;
          const hasFotoC = nc.fotosCorreccion.length > 0;

          // Estimar alto total de esta NC para no partirla
          let estAlto = 8 + (nc.elems&&nc.elems.length?Math.min(nc.elems.length+1,9)*5:0) + 15 + (hasFotoD?48:0) + 15 + 12 + 20 + (hasFotoC?44:28) + 14 + 10;
          if (y + estAlto > PH-18) {
            doc.addPage(); nPag[0]++;
            addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
            y = MT + 8;
          }

          // Cabecera NC
          doc.setFillColor(...SURF); doc.setDrawColor(...DARK); doc.setLineWidth(0.3);
          doc.rect(ML, y, CW, 8, 'FD');
          doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
          doc.text(`${ncIdx+1}. ${nc.tipo||'Sin tipo'}`, ML+2, y+5.5); y += 8;

          // Elementos afectados (agrupados) con gravedad a la derecha — máx 8 visibles
          if (nc.elems.length) {
            var elemsVis = nc.elems.slice(0, 8);
            var elemsExtra = nc.elems.length - elemsVis.length;
            var elemH = Math.max(7, (elemsVis.length + (elemsExtra ? 1 : 0)) * 5 + 2);
            doc.setFillColor(...WHITE); doc.rect(ML, y, CW, elemH, 'FD');
            elemsVis.forEach(function(el, ei) {
              doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
              doc.text('• ' + el.texto, ML+2, y + 4.5 + ei*5, {maxWidth:CW-30});
              var elColor = colorNC(el.prio);
              doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.setTextColor(...elColor);
              doc.text(el.prio||'', PW-MR-2, y + 4.5 + ei*5, {align:'right'});
            });
            if (elemsExtra > 0) {
              doc.setFontSize(7); doc.setFont('helvetica','italic'); doc.setTextColor(...MUTED);
              doc.text('... y ' + elemsExtra + ' elemento' + (elemsExtra > 1 ? 's' : '') + ' más con el mismo defecto', ML+2, y + 4.5 + elemsVis.length*5);
            }
            y += elemH;
          }

          // Observación (agrupa descripciones)
          var descTexto = nc.descs.filter(Boolean).join('. ');
          doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
          y += 3;
          doc.text('Observación:', ML, y); y += 5;
          if (descTexto) {
            y = addTextBlock(doc, descTexto, ML, y, CW, 8, DARK, 'normal', 5, PH-18, ref, fmtRev, fmtFechaStr, nPag, totPag);
          }

          // Fotos defecto (hasta 3 del grupo en grid)
          if (hasFotoD) {
            var fotosD = nc.fotosDefecto.slice(0,3);
            var fwD = fotosD.length>1 ? (CW/3-3) : 55;
            var fhD = fotosD.length>1 ? 35 : 40;
            if (y + fhD + 5 > PH-18) { doc.addPage(); nPag[0]++; addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr); y = MT+8; }
            fotosD.forEach(function(fd, fi) {
              var fotoSrc = fd ? (fd.dataUrl||fd.url) : null;
              if (!fotoSrc) return;
              var fx = fotosD.length>1 ? (ML + fi*(fwD+3)) : (PW/2-fwD/2);
              try {
                var fmt = fotoSrc.includes('data:image/png')?'PNG':'JPEG';
                var fitD = fitImage(doc, fotoSrc, fwD, fhD);
                var oxD = (fwD - fitD.w) / 2;
                var oyD = (fhD - fitD.h) / 2;
                doc.addImage(fotoSrc, fmt, fx + oxD, y + oyD, fitD.w, fitD.h);
              } catch(e) {}
            });
            y += fhD + 4;
          }

          // Referencia normativa
          y += 2;
          doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
          doc.text('Referencia normativa:', ML, y); y += 5;
          doc.setFont('helvetica','italic'); doc.setFontSize(8);
          y = addTextBlock(doc, nc.norma||'', ML+4, y, CW-4, 8, MUTED, 'italic', 5, PH-18, ref, fmtRev, fmtFechaStr, nPag, totPag);
          y += 3;

          // Banner gravedad
          if (y + 10 > PH-18) { doc.addPage(); nPag[0]++; addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr); y = MT+8; }
          const bannerW = CW*0.65;
          doc.setFillColor(...ncBg); doc.setDrawColor(...ncColor); doc.setLineWidth(0.5);
          doc.rect(ML, y, bannerW, 9, 'FD');
          doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...ncColor);
          doc.text(textNC(nc.prio), ML+2, y+5.5, {maxWidth:bannerW-4});
          doc.setFillColor(...ncColor); doc.setDrawColor(...ncColor);
          doc.rect(ML+bannerW, y, CW-bannerW, 9, 'FD');
          doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...WHITE);
          doc.text('Prioridad: ' + nc.prio, ML+bannerW+2, y+5.5);
          y += 12;

          // Modificación: texto resolución a la derecha — altura dinámica, máx 3 líneas
          var resTxt = nc.resoluciones.filter(Boolean).join('. ');
          doc.setFontSize(8); doc.setFont('helvetica','normal');
          var resLinesAll = resTxt ? doc.splitTextToSize(resTxt, CW * 2/3 - 4) : [];
          var resLines = resLinesAll.slice(0, 3);
          if (resLinesAll.length > 3) resLines[2] = '… ver Listado de Observaciones';
          var modH = Math.max(7, resLines.length * 4.5 + 4);
          if (y + modH + (hasFotoC ? 44 : 28) + 14 > PH - MB) {
            doc.addPage(); nPag[0]++;
            addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
            y = MT + 8;
          }
          doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
          doc.setDrawColor(...DARK); doc.setLineWidth(0.2);
          doc.rect(ML, y, CW/3, modH, 'D');
          doc.rect(ML+CW/3, y, CW*2/3, modH, 'D');
          doc.text('Modificación', ML+2, y+4.5);
          if (resLines.length) {
            doc.setFont('helvetica','normal');
            resLines.forEach(function(l, li) { doc.text(l, ML+CW/3+2, y+4.5+li*4.5); });
          }
          y += modH + 3;

          if (hasFotoC) {
            var fotosC = nc.fotosCorreccion.slice(0,3);
            var fwC = fotosC.length>1 ? (CW/3-3) : 55;
            var fhC = fotosC.length>1 ? 35 : 40;
            if (y + fhC + 5 > PH-18) { doc.addPage(); nPag[0]++; addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr); y = MT+8; }
            fotosC.forEach(function(fc, fi) {
              var fotoCorr = fc ? (fc.dataUrl||fc.url) : null;
              if (!fotoCorr) return;
              var fx = fotosC.length>1 ? (ML + fi*(fwC+3)) : (PW/2-fwC/2);
              try {
                var fmt = fotoCorr.includes('data:image/png')?'PNG':'JPEG';
                var fitC = fitImage(doc, fotoCorr, fwC, fhC);
                var oxC = (fwC - fitC.w) / 2;
                var oyC = (fhC - fitC.h) / 2;
                doc.addImage(fotoCorr, fmt, fx + oxC, y + oyC, fitC.w, fitC.h);
              } catch(e) {}
            });
            y += fhC + 2;
          } else {
            doc.rect(ML, y, CW, 25, 'D'); y += 25;
          }

          // Resolución: solo muestra FAVORABLE/resultado
          if (y + 12 > PH-18) { doc.addPage(); nPag[0]++; addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr); y = MT+8; }
          doc.setDrawColor(...DARK); doc.rect(ML, y, CW/2, 11, 'D');
          doc.rect(ML+CW/2, y, CW/2, 11, 'D');
          doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
          doc.text('RESOLUCIÓN', ML+2, y+7);
          if (nc.cerradas) {
            doc.setFont('helvetica','bold'); doc.setTextColor(...GREEN_C);
            doc.text('FAVORABLE', ML+CW/2+2, y+7);
          }
          y += 14;

        }
      }

      // ═══ CARACTERÍSTICAS DE INSPECCIÓN ═══
      doc.addPage(); nPag[0]++;
      indicePags['CARACTERISTICAS'] = nPag[0];
      addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
      y = MT + 8;

      doc.setFillColor(...GOLD); doc.rect(ML, y-2, CW, 8, 'F');
      doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(...WHITE);
      doc.text('CARACTERÍSTICAS DE INSPECCIÓN', ML+3, y+3.5); y += 14;

      y = addTextBlock(doc, textoPorAlcance({SAE: TEXTO_CARACTERISTICAS_SAE}, TEXTO_CARACTERISTICAS), ML, y, CW, 9, DARK, 'normal', 5, PH-40, ref, fmtRev, fmtFechaStr, nPag, totPag);
      y = cmpCerrarSeccion('Características de inspección', cmpCtx(doc, ref, fmtRev, fmtFechaStr, nPag, totPag, { maxY: PH-40 }), y);
      y += 10;

      // Fecha(s) y nombre inspector — ultima hoja muestra solo la ultima visita
      const diasSemana = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
      // Mismo filtro que getSesionesStr()/generarRegistro(): descarta sesiones fantasma
      // (sin horaInicio ni horaFin) para no coger como "última visita" un día en que
      // solo se abrió la inspección sin trabajar en ella.
      const portadaSesRaw = D.sesiones && D.sesiones.length ? D.sesiones : [{fecha:D.fechaInspeccion||''}];
      const portadaSesFilt = portadaSesRaw.filter(function(s){ return s.horaInicio || s.horaFin; });
      const portadaSes = portadaSesFilt.length ? portadaSesFilt : portadaSesRaw;
      const lastSesInf = portadaSes[portadaSes.length - 1];
      const lastRawInf = portadaSes.length > 1 ? (lastSesInf.fecha||'') : (D.fechaInspeccion||lastSesInf.fecha||'');
      // Junto a la firma va la fecha de EMISIÓN del informe; la de la visita ya está en la
      // portada. Inspecciones antiguas sin fechaEmision siguen mostrando la última visita.
      const lastFmtInf = fmtFecha(D.fechaEmision || lastRawInf);
      const diasArr = lastFmtInf ? (() => {
        try { const p=lastFmtInf.split('/'); return [diasSemana[new Date(`${p[2]}-${p[1]}-${p[0]}`).getDay()]+', '+lastFmtInf]; }
        catch(e) { return [lastFmtInf]; }
      })() : [];

      doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      diasArr.forEach(ds => { doc.text(ds, PW/2, y, {align:'center'}); y += 6; });
      doc.text(D.inspectorNombre||'', PW/2, y, {align:'center'}); y += 5;
      if (D.inspector2Nombre) { doc.text(D.inspector2Nombre, PW/2, y, {align:'center'}); y += 5; }
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      doc.text('Inspector Autorizado', PW/2, y, {align:'center'}); y += 12;

      // Logo ARP + firma
      try { doc.addImage('data:image/jpeg;base64,'+LOGO_B64,'JPEG', PW/2-20, y, 40, 28); } catch(e){}
      y += 32;

      // Pie firma
      doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
      doc.text('Inspector', ML+30, y);
      doc.text('Revisor', PW-MR-30, y, {align:'right'});


      // Estampar índice dinámico y total de páginas
      estamparTotalPaginas(doc, doc.getNumberOfPages());
      doc.setPage(indicePagina);
      var iy = indiceY0;
      indiceItems.forEach(function(item) {
        var pg = indicePags[item[1]] || '';
        doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
        doc.text(String(pg), PW-MR, iy, {align:'right'});
        iy += 7;
      });
      const fileName = CMP
        ? (CMP.soloPlantilla
            ? 'Plantilla_informe_' + CMP.alc.toUpperCase() + '_Rev' + CMP.a.revision + '.pdf'
            : 'Informe_comparativo_' + CMP.alc.toUpperCase() + '_Rev' + CMP.de.revision + '_a_Rev' + CMP.a.revision + '.pdf')
        : (ref.replace(/\//g,'_').replace(/\s/g,'_') || 'informe') + '.pdf';
      doc.save(fileName);

      // Guardar snapshot JSON
      if (!CMP) { try { localStorage.setItem('insp_'+inspeccionId, JSON.stringify(D)); } catch(e) {} }

      hideGenerating();
    } catch(e) {
      hideGenerating();
      alert('Error generando PDF: ' + e.message);
      console.error(e);
    }
  }

  // ═══════════════════════════════════════════════════
  // Renderiza texto justificado párrafo a párrafo (párrafos separados por \n\n)
  function renderJustified(doc, text, x, y, maxW, lineH) {
    const spaceW = doc.getTextWidth(' ');
    const paras = text.split('\n\n').map(function(p){ return p.replace(/\s+/g,' ').trim(); }).filter(Boolean);
    paras.forEach(function(para, pi) {
      const lines = doc.splitTextToSize(para, maxW);
      lines.forEach(function(line, li) {
        const isLast = li === lines.length - 1;
        const words = line.trim().split(' ').filter(Boolean);
        if (isLast || words.length <= 1) {
          doc.text(line.trim(), x, y);
        } else {
          const wordsW = words.reduce(function(s,w){ return s + doc.getTextWidth(w); }, 0);
          const gap = (maxW - wordsW) / (words.length - 1);
          let cx = x;
          words.forEach(function(w) { doc.text(w, cx, y); cx += doc.getTextWidth(w) + gap; });
        }
        y += lineH;
      });
      if (pi < paras.length - 1) y += lineH;
    });
    return y;
  }

  //   GENERACIÓN PDF — CERTIFICADO
  // ═══════════════════════════════════════════════════
  async function generarCertificado() {
    if (!D || D.resultado !== 'FAVORABLE') return;
    const { jsPDF } = window.jspdf;
    showGenerating('Generando Certificado PDF...', '');
    await new Promise(r => setTimeout(r, 100));
    try {
      const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
      const ref = getNRegistro();
      const c = CONFIG?.empresa || CONFIG_DEFAULT.empresa;
      const norma = D.formatoDocumento?.normaAplicable || CONFIG?.alcance?.normaAplicable || { numero:'', titulo:'', tipoInstalacion:'la instalación' };
      // Alcances con varias partes de norma (ej. SAE: UNE-EN 12572-1/2/3) deben citar cada
      // parte con su fecha en el certificado (norma.numero por sí solo es el genérico sin
      // fecha, insuficiente para ENAC) — mismo dato que ya usa "I. Normativa de referencia"
      // en el Informe. Si el alcance no tiene normasDetalle (ej. PAA), se usa norma.numero
      // tal cual, comportamiento sin cambios.
      const normasDetalleCert = D.formatoDocumento?.normasDetalle || CONFIG?.alcance?.normasDetalle || null;
      const tiposJuegoCert = D.formatoDocumento?.tiposJuego;
      let totalJUnidadTxt;
      if (tiposJuegoCert && tiposJuegoCert.length) {
        const _cCount = {};
        (D.circuitos||[]).forEach(function(cc){ if(cc.tipoElemento){ _cCount[cc.tipoElemento]=(_cCount[cc.tipoElemento]||0)+1; } });
        const _tot = Object.values(_cCount).reduce(function(a,b){return a+b;},0);
        const _detalle = tiposJuegoCert.map(function(t){ var n=_cCount[t.id]||0; return n?(n+' '+(t.label||t.id)+(n!==1?'s':'')):null; }).filter(Boolean).join(', ');
        totalJUnidadTxt = _tot + (_tot!==1?' ELEMENTOS':' ELEMENTO') + (_detalle?' ('+_detalle.toUpperCase()+')':'');
      } else {
        const totalJ = (D.circuitos||[]).reduce((s,cc)=>s+(cc.juegos||[]).filter(j=>j.tipo==='R').length,0);
        totalJUnidadTxt = totalJ + ' JUEGOS';
      }

      // Fecha de inspección (última sesión)
      const fechaInsp = D.sesiones && D.sesiones.length
        ? fmtFecha(D.sesiones[D.sesiones.length-1].fecha)
        : fmtFecha(D.fechaInspeccion||'');

      // Fecha próxima inspección (+1 año)
      let fechaProxima = '';
      try {
        const parts = fechaInsp.split('/');
        const d2 = new Date(`${parseInt(parts[2])+1}-${parts[1]}-${parts[0]}`);
        fechaProxima = `${String(d2.getDate()).padStart(2,'0')}/${String(d2.getMonth()+1).padStart(2,'0')}/${d2.getFullYear()}`;
      } catch(e) {}

      let y = 20;

      // Título
      doc.setFontSize(20); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('CERTIFICADO DE CONFORMIDAD', PW/2, y, {align:'center'}); y += 10;
      doc.setTextColor(...GOLD);
      if (normasDetalleCert && normasDetalleCert.length > 1) {
        doc.setFontSize(12); doc.setFont('helvetica','bold');
        doc.text('A NORMAS', PW/2, y, {align:'center'}); y += 6;
        doc.setFontSize(11);
        normasDetalleCert.forEach(function(n){ doc.text(n.numero, PW/2, y, {align:'center'}); y += 5.5; });
        y += 2.5;
      } else {
        doc.setFontSize(15);
        doc.text('A NORMA ' + ((normasDetalleCert && normasDetalleCert[0]?.numero) || norma.numero), PW/2, y, {align:'center'}); y += 10;
      }
      doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(...GOLD);
      doc.text(ref, PW/2, y, {align:'center'}); y += 8;
      doc.setFontSize(11); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
      doc.text('Concedido a', PW/2, y, {align:'center'}); y += 8;
      doc.setFontSize(14); doc.setFont('helvetica','bold');
      doc.text(D.propietario||D.nombreInstalacion||'', PW/2, y, {align:'center'}); y += 15;

      // Texto certificación
      const dirCert = composeDireccion(D);
      const solicitante = D.solicitante||D.propietario||'';
      const enacActivo = !!D.enacActivo;
      const acreditTxt = enacActivo && c.acreditacion ? ` acreditado ${c.acreditacion}` : '';
      const textoCert = `${c.nombre.toUpperCase()}, organismo de inspección${acreditTxt}, certifica haber efectuado en fecha ${fechaInsp} la inspección de los equipamientos de ${norma.tipoInstalacion.toUpperCase()} de las instalaciones de ${D.nombreInstalacion||''}, ${totalJUnidadTxt}, situado en ${dirCert}.

La intervención realizada, da como resultado un "Informe de inspección", con la numeración ${ref}, que indica las observaciones relativas a las instalaciones y omisiones. Estas observaciones sólo son válidas en las condiciones presentes en la instalación en el momento de control, y no serán válidas en caso de modificaciones en las mismas.

${c.nombre}, certifica que los equipamientos cumplen con las exigencias marcadas en ${(normasDetalleCert && normasDetalleCert.length) ? (normasDetalleCert.length>1?'las normas ':'la norma ') + normasDetalleCert.map(function(n){ return n.numero + (n.titulo?' ('+n.titulo+')':''); }).join('; ') : 'la norma ' + norma.numero + (norma.titulo ? ' (' + norma.titulo + ')' : '')} tras la inspección in situ realizada, la validación de los distintos documentos exigidos por norma y las acciones correctoras realizadas por ${solicitante}.

Visto que el informe presenta un resultado FAVORABLE, se considera que los equipamientos cumplen con las especificaciones de seguridad de las normas de aplicación en vigencia y que son aptos para su uso bajo las indicaciones y directrices del manual de uso y mantenimiento del constructor/instalador.`;

      doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
      y = renderJustified(doc, textoCert, ML, y, CW, 6);
      y += 10;

      // Datos firmante
      const dir = CONFIG?.director || CONFIG_DEFAULT.director;
      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text(dir.nombre, PW-MR, y, {align:'right'}); y += 5;
      doc.setFont('helvetica','normal');
      doc.text(dir.cargo, PW-MR, y, {align:'right'}); y += 5;
      doc.text(dir.titulacion, PW-MR, y, {align:'right'}); y += 5;
      doc.text(dir.colegiado, PW-MR, y, {align:'right'}); y += 10;

      doc.text('FIRMA DIGITAL', PW-MR, y, {align:'right'}); y += 15;

      // Logo ARP esquina inferior derecha
      try { doc.addImage('data:image/jpeg;base64,'+LOGO_B64,'JPEG', PW-MR-40, PH-55, 38, 27); } catch(e){}

      // Fechas vigor — alineadas al mismo X calculando el label más ancho
      doc.setFontSize(9); doc.setFont('helvetica','italic'); doc.setTextColor(...DARK);
      const fechaLabelW = Math.max(doc.getTextWidth('Fecha entrada en vigor:'), doc.getTextWidth('Fecha próxima inspección:')) + 2;
      doc.text('Fecha entrada en vigor:', ML, PH-30);
      doc.setFont('helvetica','normal'); doc.text(fechaInsp, ML+fechaLabelW, PH-30);
      doc.setFont('helvetica','italic');
      doc.text('Fecha próxima inspección:', ML, PH-24);
      doc.setFont('helvetica','normal'); doc.text(fechaProxima, ML+fechaLabelW, PH-24);

      // Pie
      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...GOLD);
      doc.line(ML, PH-16, PW-MR, PH-16);
      doc.text(`${c.sedeSocial}`, PW/2, PH-12, {align:'center'});
      if (c.sedeFiscal && c.sedeFiscal !== c.sedeSocial) doc.text(`${c.sedeFiscal}`, PW/2, PH-8, {align:'center'});
      doc.setFont('helvetica','normal');
      const revDoc = enacActivo
        ? (c.revCertificadoDocEnac || '')
        : (c.revCertificadoDoc    || '');
      doc.text(revDoc, PW/2, PH-4, {align:'center'});

      // Guarda
      const certFile = (ref.replace(/\//g,'_')||'certificado') + '_CERT_Rev' + (D.revision||0) + '.pdf';
      doc.save(certFile);
      hideGenerating();
    } catch(e) {
      hideGenerating();
      alert('Error generando certificado: ' + e.message);
      console.error(e);
    }
  }

  // ═══════════════════════════════════════════════════
  //   GENERACIÓN PDF — REGISTRO ENAC
  // ═══════════════════════════════════════════════════
  async function generarRegistro() {
    if (!D) return;
    const { jsPDF } = window.jspdf;
    showGenerating('Generando Registro...', '');
    await new Promise(r => setTimeout(r, 100));
    try {
      const circuitos = D.circuitos || [];
      const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
      const ref = getNRegistro();
      const c = CONFIG?.empresa || CONFIG_DEFAULT.empresa;
      const norma = D.formatoDocumento?.normaAplicable || CONFIG?.alcance?.normaAplicable || { numero:'', titulo:'', tipoInstalacion:'' };
      const fmtRev = D.formatoDocumento?.registroRevision || CONFIG?.alcance?.registroRevision || '';
      const fmtFechaStr = D.formatoDocumento?.registroFecha || CONFIG?.alcance?.registroFecha || '';
      if (!fmtRev || !fmtFechaStr) {
        console.warn('[registro] Rev./Fecha en blanco para alcance "' + D.tipoAlcance + '" — revisa config/' + (D.tipoAlcance||'').toLowerCase() + '.registroRevision/registroFecha en Firestore.');
      }

      const totPag2 = [0];
      const nPag2 = [0];

      function addCabReg(pg, tot) {
        doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
        doc.text(CONFIG?.empresa?.nombreCorto || '', ML, 7);
        doc.text('FICHA REGISTRO RECORRIDOS ACROBATICOS EN ALTURA', PW/2, 7, {align:'center'});
        doc.text(`Rev ${fmtRev}  Fecha ${fmtFechaStr}`, PW-MR, 7, {align:'right'});
        doc.text(`${pg} de ${tot}`, PW-MR, 12, {align:'right'});
        doc.setDrawColor(...MUTED); doc.line(ML, 9, PW-MR, 9);
      }

      function addPieReg() {
        doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
        doc.text(`N°REGISTRO: ${ref}`, ML, PH-5);
        doc.text('S.: Satisfactorio; N.: no satisfactorio; NA.: no aplica  N°NOTA A CONTINUACION DEL SIMBOLO', PW-MR, PH-5, {align:'right'});
      }

      // PÁGINA 1: DATOS GENERALES + EQUIPOS
      nPag2[0]++;
      addCabReg(nPag2[0], totPag2[0]);
      let y = 20;

      doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('ESTRUCTURAS DE DEPORTE Y ACTIVIDADES RECREATIVAS', ML, y); y += 5;
      doc.text('RECORRIDO ACROBÁTICO EN ALTURA', ML, y); y += 7;

      // Tabla datos generales
      doc.setFillColor(...SURF); doc.setDrawColor(...DARK); doc.setLineWidth(0.3);
      doc.rect(ML, y, CW, 8, 'FD');
      doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('DATOS GENERALES INSPECCION', ML+2, y+5.5); y += 11;

      // Inspector
      doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
      doc.text('INSPECTOR', ML, y); y += 4;
      var inspBoxH = D.inspector2Nombre ? 14 : 8;
      doc.setDrawColor(...DARK); doc.rect(ML, y, CW, inspBoxH, 'D');
      doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
      doc.text(D.inspectorNombre||'', ML+2, y+5.5);
      if (D.inspector2Nombre) { doc.text(D.inspector2Nombre, ML+2, y+11.5); }
      y += inspBoxH + 4;

      // Fecha + hora — una fila por visita (Rev.0, Rev.1, Rev.2…)
      var allSes = D.sesiones && D.sesiones.length ? D.sesiones : [{fecha:D.fechaInspeccion||'',horaInicio:'',horaFin:''}];
      var _sesFilt = allSes.filter(function(s){return s.horaInicio||s.horaFin;});
      if (_sesFilt.length) allSes = _sesFilt;
      var histRev = D.historialRevisiones || [];
      doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
      doc.text(allSes.length > 1 ? 'FECHAS DE INSPECCION' : 'FECHA DE INSPECCION', ML, y);
      doc.text('Hora de inicio', ML+CW*0.65, y);
      doc.text('Hora fin', ML+CW*0.82, y); y += 4;
      allSes.forEach(function(ses, si) {
        var isLast = si === allSes.length - 1;
        var sesFecha = ses.fecha || (si === 0 ? (D.fechaInspeccion || '') : '') || '';
        var hist = histRev[si] || {};
        var sesHoraI = ses.horaInicio || (isLast ? (D.horaInicio || '') : (hist.horaInicio || ''));
        var sesHoraF = ses.horaFin || (isLast ? (D.horaFin || '') : (hist.horaFin || ''));
        doc.setDrawColor(...DARK);
        doc.rect(ML, y, CW*0.63, 8, 'D');
        doc.rect(ML+CW*0.65, y, CW*0.15, 8, 'D');
        doc.rect(ML+CW*0.82, y, CW*0.18, 8, 'D');
        doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
        doc.text(fmtFecha(sesFecha), ML+2, y+5.5);
        doc.text(sesHoraI, ML+CW*0.65+2, y+5.5);
        doc.text(sesHoraF, ML+CW*0.82+2, y+5.5);
        y += 12;
      });

      // Lugar
      doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
      doc.text('LUGAR DE INSPECCION', ML, y); y += 4;
      doc.setDrawColor(...DARK); doc.rect(ML, y, CW, 8, 'D');
      doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
      doc.text(D.nombreInstalacion||'', ML+2, y+5.5); y += 12;

      // Actividad
      doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
      doc.text('ACTIVIDAD/JUEGO/INSTALACION', ML, y); y += 4;
      doc.setDrawColor(...DARK); doc.rect(ML, y, CW, 8, 'D');
      doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
      doc.text(D.tipoAlcance||'', ML+2, y+5.5); y += 14;

      // Normativa
      doc.setFillColor(...SURF); doc.rect(ML, y, CW, 7, 'FD');
      doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('NORMATIVA APLICABLE', PW/2, y+4.5, {align:'center'}); y += 7;
      doc.rect(ML, y, CW, 8, 'D');
      doc.setFontSize(10); doc.setFont('helvetica','normal');
      doc.text(norma.numero, PW/2, y+5.5, {align:'center'}); y += 10;

      // Equipos medición
      doc.setFillColor(...SURF); doc.rect(ML, y, CW, 7, 'FD');
      doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('EQUIPOS MEDICION USADOS', PW/2, y+4.5, {align:'center'}); y += 7;

      // Cabecera tabla equipos medición
      doc.setFillColor(...SURF); doc.setDrawColor(...DARK); doc.setLineWidth(0.3);
      doc.rect(ML, y, CW/2, 7, 'FD');
      doc.rect(ML+CW/2, y, CW/2, 7, 'FD');
      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('TIPO EQUIPO', ML+CW/4, y+4.5, {align:'center'});
      doc.text('N° SERIE/N° EQUIPO', ML+CW*0.75, y+4.5, {align:'center'});
      y += 7;

      const equipos = D.equiposMedicion || D.equiposUsados || [];
      const equiposMedicion = equipos.filter(e => !e.tipo?.toLowerCase().includes('epi') && !e.tipo?.toLowerCase().includes('arnes'));
      for (let i=0; i<Math.max(5, equiposMedicion.length); i++) {
        const eq = equiposMedicion[i] || {};
        doc.rect(ML, y, CW/2, 7, 'D');
        doc.rect(ML+CW/2, y, CW/2, 7, 'D');
        doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
        if (eq.tipo) {
          doc.text(eq.tipo, ML+2, y+4.5);
          doc.text(eq.nSerie||eq.codigo||'', ML+CW/2+2, y+4.5);
        }
        y += 7;
      }
      y += 5;

      // Equipos EPI
      doc.setFillColor(...SURF); doc.rect(ML, y, CW, 7, 'FD');
      doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('EQUIPOS PROTECCION INDIVIDUAL USADOS', PW/2, y+4.5, {align:'center'}); y += 7;
      doc.setFillColor(...SURF); doc.setDrawColor(...DARK); doc.setLineWidth(0.3);
      doc.rect(ML, y, CW/2, 7, 'FD');
      doc.rect(ML+CW/2, y, CW/2, 7, 'FD');
      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('TIPO EQUIPO', ML+CW/4, y+4.5, {align:'center'});
      doc.text('N° SERIE/N° EQUIPO', ML+CW*0.75, y+4.5, {align:'center'});
      y += 7;

      const equiposEPI = equipos.filter(e => e.tipo?.toLowerCase().includes('epi') || e.tipo?.toLowerCase().includes('arnes'));
      for (let i=0; i<Math.max(3, equiposEPI.length); i++) {
        const eq = equiposEPI[i] || {};
        doc.rect(ML, y, CW/2, 7, 'D');
        doc.rect(ML+CW/2, y, CW/2, 7, 'D');
        if (eq.tipo) {
          doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
          doc.text(eq.tipo, ML+2, y+4.5);
          doc.text(eq.nSerie||eq.codigo||'', ML+CW/2+2, y+4.5);
        }
        y += 7;
      }
      y += 8;

      // Firma inspector
      doc.setFillColor(...SURF); doc.rect(ML, y, CW, 7, 'FD');
      doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('FIRMA INSPECTOR', PW/2, y+4.5, {align:'center'}); y += 7;
      doc.rect(ML, y, CW, 30, 'D');
      y += 30;

      addPieReg();

      // PÁGINA 2: CHECKLIST GENERAL
      doc.addPage(); nPag2[0]++;
      addCabReg(nPag2[0], totPag2[0]);
      y = 18;

      doc.setFillColor(...SURF); doc.rect(ML, y, CW, 7, 'FD');
      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('General', PW/2, y+4.5, {align:'center'}); y += 7;

      // Checklist registro: formato 2 columnas lado a lado (como en paper real)
      // Columna izq: items pares; columna derecha: items impares
      // Cada celda: ref+sec arriba, descripcion, valor S/NA/N a la derecha
      const half = (CW - 4) / 2;
      const regItems = [...GEN_ITEMS_PDF];
      // Agrupar en pares para mostrar 2 por fila
      // Items especiales: 4.3.3 Arboles y 4.3.3 Artificiales van juntos en una fila
      const rFilas = [];
      let i2 = 0;
      while (i2 < regItems.length) {
        if (i2 + 1 < regItems.length) {
          rFilas.push([regItems[i2], regItems[i2+1]]);
          i2 += 2;
        } else {
          rFilas.push([regItems[i2], null]);
          i2++;
        }
      }

      for (const fila of rFilas) {
        const rH3 = 20;
        if (y + rH3 > PH-15) {
          addPieReg();
          doc.addPage(); nPag2[0]++;
          addCabReg(nPag2[0], totPag2[0]);
          y = 18;
        }
        for (let ci = 0; ci < 2; ci++) {
          const it = fila[ci];
          if (!it) continue;
          const xOff = ci === 0 ? 0 : half + 4;
          const v = (D.checklist||{})[it.id]||'';
          const obs = (D.checklistObs||{})[it.id]||'';

          doc.setFillColor(...WHITE); doc.setDrawColor(...DARK); doc.setLineWidth(0.15);
          doc.rect(ML+xOff, y, half, rH3, 'FD');

          // Texto ref+sec
          doc.setFontSize(7.5); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
          doc.text(`${it.ref} ${it.sec}`, ML+xOff+2, y+4.5, {maxWidth: half-14});

          // Descripción
          doc.setFont('helvetica','normal'); doc.setFontSize(6.5);
          const descL = doc.splitTextToSize(it.desc, half-14);
          descL.forEach((l,li) => doc.text(l, ML+xOff+2, y+9+li*3.2));

          // Valor S/N/NA — color según resultado (Rev.N: negro si sin cambio)
          if (v) {
            var prevGen = (D.historialRevisiones&&D.historialRevisiones.length) ? (D.historialRevisiones[D.historialRevisiones.length-1].checklist||{})[it.id]||'' : '';
            doc.setFontSize(10); doc.setFont('helvetica','bold');
            if (prevGen && v===prevGen) { doc.setTextColor(...DARK); }
            else if (v==='S' && prevGen==='N') { doc.setTextColor(...GREEN_C); }
            else if (v==='N' && prevGen==='S') { doc.setTextColor(...RED); }
            else if (v==='S') { doc.setTextColor(...GREEN_C); }
            else if (v==='N') { doc.setTextColor(...RED); }
            else { doc.setTextColor(...DARK); }
            doc.text(v === 'N' ? 'NS' : v, ML+xOff+half-10, y+rH3/2+2);
          }
          // Obs si hay NC
          if (obs && v==='N') {
            doc.setFontSize(6); doc.setFont('helvetica','italic'); doc.setTextColor(...MUTED);
            doc.text(obs, ML+xOff+2, y+rH3-3, {maxWidth:half-14});
          }
        }
        y += rH3;
      }

      y += 6;
      doc.setFillColor(...SURF); doc.rect(ML, y, CW, 7, 'FD');
      doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('Observaciones Generales', PW/2, y+4.5, {align:'center'}); y += 7;
      doc.rect(ML, y, CW, 35, 'D');
      if (D.obsGral) {
        doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
        doc.text(doc.splitTextToSize(D.obsGral, CW-4), ML+2, y+5);
      }

      addPieReg();

      // PÁGINAS 3+: TABLA CIRCUITOS/JUEGOS
      doc.addPage(); nPag2[0]++;
      addCabReg(nPag2[0], totPag2[0]);
      y = 18;
      const esTiposJuegoReg = !!(D.formatoDocumento?.tiposJuego && D.formatoDocumento.tiposJuego.length);

      // Cabecera tabla fija de 5 columnas — solo para alcances sin tiposJuego (hoy, solo
      // PAA); cualquier alcance con tiposJuego (SAE, FER...) dibuja su propia cabecera por
      // tipo más abajo, con sus propias columnas.
      const cw0=30, cw1=35, cw2=(CW-cw0-cw1-25)/5, obsW2=25;
      if (!esTiposJuegoReg) {
        doc.setTextColor(...DARK);
        var _colsPaaHeader = [
          {width:cw0, label:'Circuitos', align:'left'},
          {width:cw1, label:'Juegos', align:'left'}
        ].concat(COLS_PDF.map(function(c){ return {width:cw2, label:c.label}; }))
         .concat([{width:obsW2, label:'Observaciones'}]);
        y = drawRegHeaderRow(doc, y, _colsPaaHeader);
      }

      // Para Rev.1+: obtener checks de la revisión anterior para comparar
      const prevCircuitos = (D.historialRevisiones && D.historialRevisiones.length)
        ? D.historialRevisiones[D.historialRevisiones.length-1].circuitos || []
        : null;
      function getPrevVal(ci2,ji2,k2) {
        if (!prevCircuitos) return null;
        var pc = prevCircuitos[ci2];
        if (!pc || !pc.juegos || !pc.juegos[ji2]) return null;
        return pc.juegos[ji2][k2] || null;
      }

      if (esTiposJuegoReg) {
        // ── SAE (u otro alcance con tiposJuego): una tabla por tipo de elemento (Vía,
        // luego Zona/Muro), columnas dinámicas de ese tipo — nunca comparte columnas
        // entre tipos aunque compartan id (4.1..4.9 no significa lo mismo en cada uno).
        const tiposJuegoReg = D.formatoDocumento.tiposJuego;
        var filasPorTipo = {};
        tiposJuegoReg.forEach(function(t){ filasPorTipo[t.id]=[]; });
        circuitos.forEach(function(circ, ciG){
          if (!circ.tipoElemento || !filasPorTipo[circ.tipoElemento]) return;
          (circ.juegos||[]).forEach(function(j, jiG){
            filasPorTipo[circ.tipoElemento].push({circ:circ, j:j, ci:ciG, ji:jiG});
          });
        });
        tiposJuegoReg.forEach(function(tipoCfg){
          var filas = filasPorTipo[tipoCfg.id]||[];
          if (!filas.length) return;
          var colsT = tipoCfg.columnas||[];
          if (y + 15 > PH-15) { doc.addPage(); nPag2[0]++; addCabReg(nPag2[0], totPag2[0]); y = 18; }
          y = drawTipoGroupBar(doc, y, tipoCfg, {heightAfter: 8});

          var elemW=38, obsWT=22;
          var colWT=(CW-elemW-obsWT)/colsT.length;
          doc.setTextColor(...DARK);
          var _colsTipoHeader = [{width:elemW, label:'Elemento', align:'left'}]
            .concat(colsT.map(function(col){ return {width:colWT, label:shortLabelNorma(col.label||col.abbrev||col.id)}; }))
            .concat([{width:obsWT, label:'Obs.'}]);
          y = drawRegHeaderRow(doc, y, _colsTipoHeader, 5.5);

          filas.forEach(function(f){
            // Altura de fila dinámica según el contenido real de Observaciones — antes era
            // fija a 7mm y el texto de notas se desbordaba por debajo de su caja sin que la
            // comprobación de salto de página se enterara, dando la sensación de que la fila
            // se "cortaba" antes de saltar de página (reportado: registro SAE, "Vía 7").
            var jPat1b='c'+f.ci+'j'+f.ji;
            var jPat2b='j_'+f.j.id+'_';
            var jObsB=(D.ncs||[]).filter(function(nc){var aid=nc.autoId||'';return (aid.indexOf(jPat1b)===0&&(aid.length===jPat1b.length||aid[jPat1b.length]==='_'))||aid.indexOf(jPat2b)===0;}).map(function(nc){return nc.desc||nc.tipo||'';}).filter(Boolean).join('\n');
            doc.setFontSize(5); doc.setFont('helvetica','normal');
            var obsLinesB = jObsB ? doc.splitTextToSize(jObsB, obsWT-2) : [];
            var rowHB = Math.max(7, obsLinesB.length * 2.8 + 4);
            if (y + rowHB > PH-15) { doc.addPage(); nPag2[0]++; addCabReg(nPag2[0], totPag2[0]); y = 18; }
            doc.setFillColor(...WHITE); doc.setDrawColor(...BORDER); doc.setLineWidth(0.1);
            doc.rect(ML, y, elemW, rowHB, 'D');
            doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
            doc.text(f.circ.nombre||'', ML+1, y+4.5, {maxWidth:elemW-2});
            colsT.forEach(function(col, ki){
              doc.rect(ML+elemW+ki*colWT, y, colWT, rowHB, 'D');
              var v2=f.j[col.id]||'';
              var prev=getPrevVal(f.ci,f.ji,col.id);
              doc.setFontSize(9); doc.setFont('helvetica','bold');
              if (prevCircuitos && prev !== null) {
                if (v2==='S'&&prev==='N'){doc.setTextColor(...GREEN_C);}
                else if(v2==='N'&&prev==='S'){doc.setTextColor(...RED);}
                else {doc.setTextColor(...DARK);}
              } else {
                if(v2==='S'){doc.setTextColor(...GREEN_C);}else if(v2==='N'){doc.setTextColor(...RED);}else{doc.setTextColor(...MUTED);}
              }
              doc.text(v2, ML+elemW+ki*colWT+colWT/2, y+rowHB/2+1.5, {align:'center'});
            });
            doc.rect(ML+elemW+colsT.length*colWT, y, obsWT, rowHB, 'D');
            if (jObsB) {
              doc.setFontSize(5); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
              doc.text(obsLinesB, ML+elemW+colsT.length*colWT+1, y+3);
            }
            y += rowHB;
          });
          y += 4;
        });

        // Detalle completo del ensayo de prueba (PPI/PSPI/SSPC) — punto por punto, solo aquí
        // en el Registro; el Informe solo muestra el agregado SAT/N.S. de la columna 4.6.
        var ensCfgReg = D.formatoDocumento.ensayoPrueba;
        if (ensCfgReg) {
          var filasConEnsayo = (filasPorTipo[ensCfgReg.aplicaATipo]||[]).filter(function(f){
            var ep=f.j.ensayoPrueba||{}; return (ep.ppi||[]).length||(ep.pspi||[]).length||(ep.sspc||[]).length;
          });
          if (filasConEnsayo.length) {
            if (y + 15 > PH-15) { doc.addPage(); nPag2[0]++; addCabReg(nPag2[0], totPag2[0]); y = 18; }
            doc.setFillColor(...DARK); doc.rect(ML, y, CW, 6, 'F');
            doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...WHITE);
            doc.text('DETALLE ENSAYO DE PRUEBA (carga '+(ensCfgReg.carga||'')+')', ML+2, y+4.2);
            y += 9;
            (ensCfgReg.secciones||[]).forEach(function(sec){
              var key=sec.id.toLowerCase();
              filasConEnsayo.forEach(function(f){
                var pts=(f.j.ensayoPrueba||{})[key]||[];
                if (!pts.length) return;
                if (y + 6 > PH-15) { doc.addPage(); nPag2[0]++; addCabReg(nPag2[0], totPag2[0]); y = 18; }
                doc.setFontSize(7); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
                doc.text(f.circ.nombre+' — '+sec.label, ML, y+3.5); y += 5;
                pts.forEach(function(p, pi){
                  if (y + 5 > PH-15) { doc.addPage(); nPag2[0]++; addCabReg(nPag2[0], totPag2[0]); y = 18; }
                  doc.setFontSize(6.5); doc.setFont('helvetica','normal');
                  doc.setTextColor(...(p.ok===false?RED:p.ok===true?GREEN_C:MUTED));
                  var etiqueta=(p.ubicacion?p.ubicacion:'Punto '+(pi+1))+': '+(p.ok===true?'SAT':p.ok===false?'N.S.':'—');
                  doc.text(etiqueta, ML+4, y+3.5);
                  y += 4.5;
                });
                y += 1.5;
              });
            });
            y += 3;
          }
        }
      } else {
        // ── PAA/FER — comportamiento anterior, sin cambios ──
        const KEYS = ['ie','af','ej','ra','zs'];
        let ciIdx2 = 0;
        for (const circ of circuitos) {
          if (y + 8 > PH-15) { doc.addPage(); nPag2[0]++; addCabReg(nPag2[0], totPag2[0]); y = 18; }
          let circWritten = false;
          let jiIdx2 = 0;
          for (const j of (circ.juegos||[])) {
            // Altura de fila dinámica según Observaciones — mismo arreglo que en la rama
            // SAE/FER de arriba: antes era fija a 7mm y el texto de notas se desbordaba sin
            // que el salto de página se enterara ("Vía 7" cortada en el registro).
            var jPat1 = 'c'+ciIdx2+'j'+jiIdx2;
            var jPat2 = 'j_'+ciIdx2+'_'+jiIdx2+'_';
            var jObs = (D.ncs||[]).filter(function(nc){ var aid=nc.autoId||''; return (aid.indexOf(jPat1)===0 && (aid.length===jPat1.length || aid[jPat1.length]==='_')) || aid.indexOf(jPat2)===0; }).map(function(nc){ return nc.desc||nc.tipo||''; }).filter(Boolean).join('\n');
            doc.setFontSize(5.5); doc.setFont('helvetica','normal');
            var obsLinesPaa = jObs ? doc.splitTextToSize(jObs, obsW2-2) : [];
            var rowHPaa = Math.max(7, obsLinesPaa.length * 2.8 + 4);
            if (y + rowHPaa > PH-15) { doc.addPage(); nPag2[0]++; addCabReg(nPag2[0], totPag2[0]); y = 18; circWritten = false; }
            doc.setFillColor(...WHITE); doc.setDrawColor(...BORDER); doc.setLineWidth(0.1);
            doc.rect(ML, y, cw0, rowHPaa, 'D');
            if (!circWritten) {
              doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
              doc.text(circ.nombre, ML+1, y+4.5, {maxWidth:cw0-2});
              circWritten = true;
            }
            doc.rect(ML+cw0, y, cw1, rowHPaa, 'D');
            doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
            doc.text((j.tipo==='NR'?'*. ':j.tipo==='AUX'?'* ':'') + (j.nombre||''), ML+cw0+1, y+4.5, {maxWidth:cw1-2});
            KEYS.forEach((k,ki) => {
              doc.setFillColor(...WHITE);
              doc.rect(ML+cw0+cw1+ki*cw2, y, cw2, rowHPaa, 'D');
              const v2 = j[k]||'';
              const prev = getPrevVal(ciIdx2,jiIdx2,k);
              doc.setFontSize(10); doc.setFont('helvetica','bold');
              if (prevCircuitos && prev !== null) {
                // Rev.N: colorear según cambio
                if (v2==='S' && prev==='N') { doc.setTextColor(...GREEN_C); } // corregido
                else if (v2==='N' && prev==='S') { doc.setTextColor(...RED); } // empeorado
                else { doc.setTextColor(...DARK); } // sin cambio = negro
              } else {
                // Rev.0: colores normales
                if(v2==='S'){doc.setTextColor(...GREEN_C);}else if(v2==='N'){doc.setTextColor(...RED);}else{doc.setTextColor(...MUTED);}
              }
              doc.text(v2, ML+cw0+cw1+ki*cw2+cw2/2, y+rowHPaa/2+1.5, {align:'center'});
            });
            doc.setFillColor(...WHITE);
            doc.rect(ML+cw0+cw1+5*cw2, y, obsW2, rowHPaa, 'D');
            if (jObs) {
              doc.setFontSize(5.5); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
              doc.text(obsLinesPaa, ML+cw0+cw1+5*cw2+1, y+3);
            }
            y += rowHPaa;
            jiIdx2++;
          }
          ciIdx2++;
        }
      }

      addPieReg();

      var totalPagsReg = doc.getNumberOfPages();
      for (var pr = 1; pr <= totalPagsReg; pr++) {
        doc.setPage(pr);
        doc.setFillColor(255,255,255);
        doc.rect(PW-MR-25, 9, 25, 5, 'F');
        doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
        doc.text(pr + ' de ' + totalPagsReg, PW-MR, 12, {align:'right'});
      }

      const regFile = (ref.replace(/\//g,'_').replace(/\s/g,'_') || 'registro') + '_REGISTRO.pdf';
      doc.save(regFile);
      hideGenerating();
    } catch(e) {
      hideGenerating();
      alert('Error generando registro: ' + e.message);
      console.error(e);
    }
  }

  async function generarPlanCorrecciones() {
    if (!D) return;
    var todasNCs = (D.ncs||[]).filter(function(n){ return n.prio; });
    if (!todasNCs.length) { alert('No hay no conformidades para incluir en el plan.'); return; }

    showGenerating('Generando Plan de Correcciones...', 'Cargando fotos...');

    // Preload TODAS las fotos defecto y corrección de todas las NCs
    for (var _i = 0; _i < todasNCs.length; _i++) {
      var _nc2 = todasNCs[_i];
      for (var _j = 0; _j < (_nc2.fotosDefecto||[]).length; _j++) {
        var _f2 = _nc2.fotosDefecto[_j];
        if (!_f2.dataUrl) {
          try { _f2.dataUrl = await loadImageAsBase64(_f2.url, _f2.localKey); } catch(e){}
        }
      }
      for (var _k = 0; _k < (_nc2.fotosCorreccion||[]).length; _k++) {
        var _fc2 = _nc2.fotosCorreccion[_k];
        if (!_fc2.dataUrl) {
          try { _fc2.dataUrl = await loadImageAsBase64(_fc2.url, _fc2.localKey); } catch(e){}
        }
      }
    }

    await new Promise(function(r){ setTimeout(r, 80); });
    showGenerating('Generando Plan de Correcciones...', 'Preparando páginas...');

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
      const ref = getNRegistro();
      var pgPC = 1;

      function addPiePC() {
        doc.setDrawColor(...GOLD); doc.setLineWidth(0.3);
        doc.line(ML, PH-10, PW-MR, PH-10);
        doc.setFontSize(7); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
        doc.text(ref, PW/2, PH-7, {align:'center'});
        doc.text('Página ' + pgPC, PW-MR, PH-7, {align:'right'});
      }

      var fH = 35; // alto cajas foto defecto y corrección
      var y = MT;

      // Cabecera primera página
      try { doc.addImage('data:image/jpeg;base64,'+LOGO_B64,'JPEG', ML, y-2, 28, 20); } catch(e){}
      doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
      var empPC = (CONFIG && CONFIG.empresa && CONFIG.empresa.nombreCorto) || '';
      doc.text(empPC, PW-MR, y+4, {align:'right'});
      doc.text(ref, PW-MR, y+9, {align:'right'});
      doc.text(fmtFecha(D.fechaInspeccion||''), PW-MR, y+14, {align:'right'});
      doc.setDrawColor(...GOLD); doc.setLineWidth(0.5);
      doc.line(ML, y+18, PW-MR, y+18);
      y += 24;

      doc.setFontSize(15); doc.setFont('helvetica','bold'); doc.setTextColor(...GOLD);
      doc.text('PLAN DE CORRECCIONES', PW/2, y, {align:'center'}); y += 7;
      doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
      doc.text(D.nombreInstalacion||'', PW/2, y, {align:'center'}); y += 10;

      doc.setFontSize(8); doc.setFont('helvetica','italic'); doc.setTextColor(...MUTED);
      var introLines = doc.splitTextToSize('Listado individual de no conformidades detectadas. Para cada defecto se adjunta fotografía del estado observado y espacio para la fotografía acreditativa de la corrección.', CW);
      introLines.forEach(function(l,li){ doc.text(l, ML, y+li*5); });
      y += introLines.length * 5 + 8;

      // Una sección por cada NC individual (sin agrupar)
      todasNCs.forEach(function(nc, ncIdx) {
        var ncColor = colorNC(nc.prio);
        var ncBg = bgNC(nc.prio);
        var elem = getNcElem(nc);
        var descLnsAll = nc.desc ? doc.splitTextToSize(nc.desc, CW-4) : [];
        var descLns = descLnsAll.slice(0, 4);
        var descTrunc = descLnsAll.length > 4;
        var fotosD = (nc.fotosDefecto||[]).filter(function(f){ return f && (f.dataUrl || f.url); });
        var nFotos = Math.min(fotosD.length, 3);
        var fotosC = (nc.fotosCorreccion||[]).filter(function(f){ return f && (f.dataUrl || f.url); });
        var nFotosC = Math.min(fotosC.length, 3);

        // Estimación altura bloque (defecto + corrección ahora en la misma fila)
        var descH = descLns.length ? 4.5 + descLns.length*4.5 + (descTrunc ? 6 : 3) : 0;
        var estH = 9 + (elem ? 6 : 0) + descH + 2 + 4 + fH + 5 + 6;

        if (y + estH > PH - MB - 12) {
          addPiePC(); pgPC++;
          doc.addPage(); y = MT;
        }

        // Cabecera NC
        doc.setFillColor(...SURF); doc.setDrawColor(...DARK); doc.setLineWidth(0.3);
        doc.rect(ML, y, CW, 9, 'FD');
        var badgeW = 30;
        doc.setFillColor(...ncBg); doc.setDrawColor(...ncColor); doc.setLineWidth(0.4);
        doc.rect(PW-MR-badgeW, y+1, badgeW, 7, 'FD');
        doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...ncColor);
        doc.text(nc.prio, PW-MR-badgeW/2, y+5.5, {align:'center'});
        doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
        doc.text((ncIdx+1)+'. '+nc.tipo, ML+2, y+5.8, {maxWidth:CW-badgeW-6});
        y += 9;

        // Elemento (circuito — juego)
        if (elem) {
          doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
          doc.text(elem, ML+2, y+4.5);
          y += 6;
        }

        // Descripción (máx 4 líneas)
        if (descLns.length) {
          doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
          descLns.forEach(function(l,li){ doc.text(l, ML+2, y+4.5+li*4.5); });
          if (descTrunc) {
            doc.setFontSize(7); doc.setFont('helvetica','italic'); doc.setTextColor(...MUTED);
            doc.text('(texto completo en el informe)', ML+2, y+4.5+descLns.length*4.5+1.5);
          }
          y += 4.5 + descLns.length * 4.5 + (descTrunc ? 6 : 3);
        }

        y += 2;

        // Defecto (izquierda) y Corrección (derecha) en la misma fila
        var halfW = (CW - 4) / 2;
        var corrX = ML + halfW + 4;

        // Labels en la misma línea
        doc.setFontSize(7.5); doc.setFont('helvetica','bold'); doc.setTextColor(...MUTED);
        doc.text('Fotografía del defecto:', ML, y);
        doc.text('Fotografía de corrección:', corrX, y);
        y += 4;

        // Izquierda: fotos del defecto (hasta 3 en fila dentro del halfW)
        if (nFotos > 0) {
          var fw = nFotos > 1 ? (halfW / nFotos - 1) : halfW;
          fotosD.slice(0, 3).forEach(function(fd, fi) {
            var fotoSrc = fd.dataUrl || fd.url;
            var fx = ML + fi * (fw + 1);
            try {
              var fmt = fotoSrc.startsWith('data:image/png') ? 'PNG' : 'JPEG';
              var fit = fitImage(doc, fotoSrc, fw, fH);
              var ox = (fw - fit.w) / 2;
              var oy = (fH - fit.h) / 2;
              doc.addImage(fotoSrc, fmt, fx+ox, y+oy, fit.w, fit.h);
            } catch(e) {}
            doc.setDrawColor(...BORDER); doc.setLineWidth(0.2);
            doc.rect(fx, y, fw, fH, 'D');
          });
        } else {
          doc.setFillColor(225,225,225); doc.rect(ML, y, halfW, fH, 'F');
          doc.setDrawColor(...BORDER); doc.rect(ML, y, halfW, fH, 'D');
          doc.setFontSize(8); doc.setFont('helvetica','italic'); doc.setTextColor(...MUTED);
          doc.text('Sin fotografía', ML + halfW/2, y+fH/2, {align:'center'});
        }

        // Derecha: fotos de corrección o caja vacía si no hay
        if (nFotosC > 0) {
          var fwC = nFotosC > 1 ? (halfW / nFotosC - 1) : halfW;
          fotosC.slice(0, 3).forEach(function(fc, fi) {
            var fotoSrc = fc.dataUrl || fc.url;
            var fxC = corrX + fi * (fwC + 1);
            try {
              var fmtC = fotoSrc.startsWith('data:image/png') ? 'PNG' : 'JPEG';
              var fitC = fitImage(doc, fotoSrc, fwC, fH);
              var oxC = (fwC - fitC.w) / 2;
              var oyC = (fH - fitC.h) / 2;
              doc.addImage(fotoSrc, fmtC, fxC+oxC, y+oyC, fitC.w, fitC.h);
            } catch(e) {}
            doc.setDrawColor(...BORDER); doc.setLineWidth(0.2);
            doc.rect(fxC, y, fwC, fH, 'D');
          });
        } else {
          doc.setDrawColor(...MUTED); doc.setLineWidth(0.5);
          doc.setLineDashPattern([2, 1.5], 0);
          doc.rect(corrX, y, halfW, fH, 'D');
          doc.setLineDashPattern([], 0);
          doc.setFontSize(9); doc.setFont('helvetica','italic'); doc.setTextColor(...MUTED);
          doc.text('Foto corrección', corrX + halfW/2, y+fH/2, {align:'center'});
        }

        y += fH + 5;

        // Separador
        doc.setDrawColor(...BORDER); doc.setLineWidth(0.2);
        doc.line(ML, y, PW-MR, y);
        y += 6;
      });

      addPiePC();
      var fileName = (ref.replace(/\//g,'_')||'plan') + '_CORRECCIONES.pdf';
      doc.save(fileName);
      hideGenerating();
    } catch(e) {
      hideGenerating();
      alert('Error generando plan de correcciones: ' + e.message);
      console.error(e);
    }
  }

  function toggleNcList(btn, extraCount) {
    var el = document.getElementById('nc-extra');
    var expand = el.style.display === 'none';
    el.style.display = expand ? 'block' : 'none';
    btn.textContent = expand ? 'Ver menos ▲' : 'Ver ' + extraCount + ' más ▼';
  }

  function updateOnline() {
    if (!navigator.onLine) document.getElementById('alertOffline').classList.add('vis');
  }
  window.addEventListener('offline', updateOnline);
</script>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#C8993A">
  <title>Resultado - ARP</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    .app-header{background:var(--dark);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
    .res-header{border-radius:14px;padding:24px 20px;text-align:center;margin-bottom:16px}
    .res-header.favorable{background:linear-gradient(135deg,#1a3a2a,#1e4d35)}
    .res-header.desfavorable{background:linear-gradient(135deg,#3a1a1a,#4d1e1e)}
    .res-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px}
    .res-header.favorable .res-icon{background:rgba(39,174,96,0.25)}
    .res-header.desfavorable .res-icon{background:rgba(192,57,43,0.25)}
    .res-titulo{color:white;font-size:22px;font-weight:700;margin-bottom:4px}
    .res-ref{color:rgba(255,255,255,0.5);font-size:12px;font-family:monospace}
    .res-instalacion{color:rgba(255,255,255,0.8);font-size:14px;margin-top:8px}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
    .stat-box{background:white;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
    .stat-num{font-size:28px;font-weight:700;color:var(--gold)}
    .stat-label{font-size:11px;color:var(--muted);margin-top:2px}
    .nc-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
    .nc-item:last-child{border-bottom:none}
    .nc-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;flex-shrink:0}
    .btn-pdf{width:100%;padding:15px;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s}
    .btn-informe{background:var(--gold);color:white;box-shadow:0 4px 12px rgba(200,153,58,.3)}
    .btn-informe:hover{opacity:.9}
    .btn-certificado{background:#1e4d35;color:white;box-shadow:0 4px 12px rgba(39,174,96,.2)}
    .btn-certificado:hover{opacity:.9}
    .btn-registro{background:var(--dark);color:white}
    .btn-registro:hover{opacity:.9}
    .btn-disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
    .info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--surf);font-size:13px}
    .info-label{color:var(--muted);font-size:12px}
    .sesion-item{font-size:12px;color:var(--muted);padding:3px 0}
    .alert-offline{background:#FFF9F0;border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12px;display:none}
    .alert-offline.vis{display:block}
    .generating{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
    .generating.vis{display:flex}
    .generating-text{color:white;font-size:15px;font-weight:600}
    .generating-sub{color:rgba(255,255,255,.6);font-size:12px}
  </style>
</head>

  let D = null; // datos de la inspección (puede ser una revisión histórica mientras se visualiza)
  let D_actual = null; // datos siempre de la revisión vigente (current)
  let viendoRevisionIdx = null; // null = viendo la actual; número = índice en historialRevisiones
  let CONFIG = null; // config empresa + formato
  // Modo comparativa (ENAC): resultado.html?comparar=1&alc=paa&de=10&a=11 — ver cmpBuscar()
  const MODO_CMP = params.get('comparar') === '1';
  let CMP = null; // { ops, i (cursor), de, a }

  // ── CONFIG POR DEFECTO (si Firestore falla offline) ──
  const CONFIG_DEFAULT = { empresa: {}, alcance: {}, director: {} };

  // Normaliza juegos de cada circuito a array — vienen de Firestore como array (antiguo) o
  // como mapa {juegoId: juegoData} (nuevo, ver buildCircuitosMap en inspeccion.html). El resto
  // del informe asume siempre array (índices, filter/reduce), igual que ya pasa con circuitos.
  function normalizarJuegos(circuitos) {
    (circuitos || []).forEach(function(c) {
      if (c.juegos && !Array.isArray(c.juegos)) {
        c.juegos = Object.keys(c.juegos).map(function(k) { var j = c.juegos[k]; if (!j.id) j.id = k; return j; })
          .sort(function(a, b) { return (a.orden || 0) - (b.orden || 0); });
      }
    });
  }

  // sesiones: array (antiguo) o mapa {fecha:{horaInicio,horaFin}} (nuevo, ver
  // buildSesionesUpdate en inspeccion.html) — el resto del informe asume siempre array.
  function normalizarSesiones(D) {
    if (D.sesiones && !Array.isArray(D.sesiones)) {
      D.sesiones = Object.keys(D.sesiones).map(function(f) { return Object.assign({ fecha: f }, D.sesiones[f]); })
        .sort(function(a, b) { return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0; });
    }
  }

  // ── CARGA ──
  initAuth({
    onReady: function(user, ud) { cargarDatos(); }
  });

  setTimeout(async () => {
    if (D || MODO_CMP) return;
    const local = localStorage.getItem('insp_' + inspeccionId);
    if (local) {
      try {
        D = JSON.parse(local);
        D_actual = D;
        document.getElementById('alertOffline').classList.add('vis');
        CONFIG = CONFIG_DEFAULT;
        renderResultado();
        return;
      } catch(e) {}
    }
    // Sin datos tras 4s — mostrar error en lugar de spinner eterno
    document.getElementById('mainContent').innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--muted)"><div style="font-size:40px;margin-bottom:12px">&#9888;</div><div style="font-size:14px;margin-bottom:16px">No se pudo cargar el resultado.<br>Verifica tu conexión e inténtalo de nuevo.</div><button onclick="location.reload()" style="padding:10px 20px;background:var(--gold);color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer">Reintentar</button><br><br><a href=\"inspecciones.html\" style="color:var(--muted);font-size:13px">&#8592; Volver</a></div>';
  }, 4000);

  // Datos de ejemplo para el informe comparativo: todo lo que depende de cada inspección
  // va entre corchetes; el formato (checklist, columnas, norma) es el de la revisión nueva.
  function inspeccionMuestra(alc, h, formato) {
    const d = new Date();
    const iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const tipos = formato.tiposJuego && formato.tiposJuego.length ? formato.tiposJuego : null;
    return {
      id: 'comparativa', tipoAlcance: alc.toUpperCase(), estado: 'borrador', revision: 0,
      nombreInstalacion: '[Nombre de la instalación]', localidad: '[Localidad]', municipio: '[Municipio]',
      direccion: '[Dirección]', cp: '', provincia: '[Provincia]', codigoInstalacion: 'XXX',
      fechaInspeccion: iso, sesiones: [{ fecha: iso, horaInicio: '', horaFin: '' }],
      inspectorNombre: '[Inspector]', propietario: '[Propietario]', cif: '[CIF]', gestor: '[Gestor]',
      solicitante: '[Solicitante]', tipoInspeccion: '[TIPO DE INSPECCIÓN]',
      circuitos: [{ id: 'c1', nombre: '[Circuito / elemento]', orden: 0, tipoElemento: tipos ? tipos[0].id : undefined,
        juegos: [{ id: 'j1', nombre: '[Juego / elemento]', tipo: 'R', orden: 0 }] }],
      ncs: [], checklist: {}, checklistObs: {}, ensayos: '',
      formatoDocumento: Object.assign({}, formato, { informeRevision: h.revision, informeFecha: h.fechaVigencia || '' })
    };
  }

  async function cargarComparativa() {
    const alc = (params.get('alc') || 'paa').toLowerCase();
    const deRev = String(params.get('de') || ''), aRev = String(params.get('a') || '');
    const main = document.getElementById('mainContent');
    const enlacePantalla = 'comparar-informe.html?alc=' + encodeURIComponent(alc) + '&de=' + encodeURIComponent(deRev) + '&a=' + encodeURIComponent(aRev);
    const aviso = function(msg) {
      main.innerHTML = '<div style="max-width:620px;margin:30px auto;padding:20px;background:white;border:1px solid var(--border);border-radius:12px;font-size:14px;line-height:1.6">' +
        msg + '<br><br><a href="' + enlacePantalla + '" style="color:var(--gold);font-weight:600">Ver la comparativa en pantalla</a></div>';
    };
    try {
      const cfgRef = db.collection('config').doc(alc);
      const [ce, dir, cfgS, hDe, hA] = await Promise.all([
        db.collection('config').doc('empresa').get(), db.collection('config').doc('director').get(), cfgRef.get(),
        cfgRef.collection('historial').doc(deRev).get(), cfgRef.collection('historial').doc(aRev).get()
      ]);
      CONFIG = { empresa: ce.exists ? ce.data() : {}, director: dir.exists ? dir.data() : {}, alcance: cfgS.exists ? cfgS.data() : {} };
      const de = hDe.exists ? hDe.data() : null, a = hA.exists ? hA.data() : null;
      if (!de || !a) { aviso('No se encuentran las revisiones ' + escHtml(deRev) + ' y ' + escHtml(aRev) + ' en el historial.'); return; }
      if (!de.plantilla || !a.plantilla) {
        aviso('La Rev ' + escHtml(String(de.plantilla ? a.revision : de.revision)) + ' es anterior a que la app guardara una copia del texto del informe, así que no se puede generar el informe comparativo. En pantalla se pueden comparar sus preguntas y criterios.');
        return;
      }
      const formato = { checklist: a.checklist || [], columnas: a.columnas || [], tiposJuego: a.tiposJuego || null,
        normaAplicable: CONFIG.alcance.normaAplicable || null, normasDetalle: CONFIG.alcance.normasDetalle || null };
      // El PDF se dibuja con el código actual: solo es fiel si la revisión nueva es la plantilla actual.
      if (PLANTILLA_INFORME.huella(PLANTILLA_INFORME.estructura(alc, formato)) !== PLANTILLA_INFORME.huella(a.plantilla)) {
        aviso('El informe comparativo se genera con la plantilla actual de la app, que no corresponde a la Rev ' + escHtml(String(a.revision)) +
          '. Para comparar revisiones antiguas entre sí, usa la comparativa en pantalla.');
        return;
      }
      CMP = { ops: PLANTILLA_INFORME.diffBloques(de.plantilla, a.plantilla), i: 0, de: de, a: a, alc: alc,
        soloPlantilla: String(de.revision) === String(a.revision) };
      D = inspeccionMuestra(alc, a, formato);
      D_actual = D;
      normalizarSesiones(D);
      if (formato.checklist.length) GEN_ITEMS_PDF = formato.checklist;
      if (formato.columnas.length)
        COLS_PDF = formato.columnas.map(function(c){
          var def = COLS_PDF_DEFAULT.find(function(d){ return d.key===c.id; });
          return {key:c.id, label:c.label, abbrev:c.abbrev, ref:(def?def.ref:''), desc:(def?def.desc:'')};
        });
      const n = { ins: 0, del: 0, mod: 0, mov: 0 };
      CMP.ops.forEach(function(o){ if (o.t === 'ins') n.ins++; else if (o.t === 'del') n.del++; else if (o.t === 'mod') n.mod++; else if (o.t === 'movA') n.mov++; });
      CMP.resumen = n.mod + ' modificado(s) · ' + n.ins + ' añadido(s) · ' + n.del + ' eliminado(s) · ' + n.mov + ' movido(s)';
      if (CMP.soloPlantilla) {
        main.innerHTML = '<div style="max-width:620px;margin:24px auto;padding:22px;background:white;border:1px solid var(--border);border-radius:12px">' +
          '<div style="font-size:17px;font-weight:700;color:var(--dark);margin-bottom:6px">Plantilla del informe — ' + escHtml(alc.toUpperCase()) + ' Rev ' + escHtml(String(a.revision)) + '</div>' +
          '<div style="font-size:13px;line-height:1.7;color:var(--text)">Vigente desde ' + escHtml(a.fechaVigencia || '') + '<br>' +
          (a.motivo ? '<b>Motivo:</b> ' + escHtml(a.motivo) + '<br>' : '') +
          '<span style="color:var(--muted)">Informe completo de esta revisión; los datos de cada inspección aparecen entre corchetes.</span></div>' +
          '<button onclick="generarInforme()" style="width:100%;margin-top:14px;padding:13px;background:var(--gold);color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer">&#11015; Descargar plantilla del informe (PDF)</button></div>';
        return;
      }
      main.innerHTML = '<div style="max-width:620px;margin:24px auto;padding:22px;background:white;border:1px solid var(--border);border-radius:12px">' +
        '<div style="font-size:17px;font-weight:700;color:var(--dark);margin-bottom:6px">Informe comparativo — ' + escHtml(alc.toUpperCase()) + '</div>' +
        '<div style="font-size:13px;line-height:1.7;color:var(--text)">De la <b>Rev ' + escHtml(String(de.revision)) + '</b> (' + escHtml(de.fechaVigencia || '') + ') a la <b>Rev ' + escHtml(String(a.revision)) + '</b> (' + escHtml(a.fechaVigencia || '') + ')<br>' +
        (a.motivo ? '<b>Motivo:</b> ' + escHtml(a.motivo) + '<br>' : '') + escHtml(CMP.resumen) + '</div>' +
        '<div style="font-size:12px;margin:12px 0;line-height:1.8"><span style="color:#0047C2;font-weight:600">Azul</span>: añadido o movido a esa posición &nbsp;·&nbsp; ' +
        '<span style="color:#D00000;text-decoration:line-through;font-weight:600">Rojo tachado</span>: eliminado o movido desde esa posición<br>' +
        '<span style="color:var(--muted)">El informe es la plantilla completa: los datos de cada inspección aparecen entre corchetes.</span></div>' +
        '<button onclick="generarInforme()" style="width:100%;padding:13px;background:var(--gold);color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer">&#11015; Descargar informe comparativo (PDF)</button>' +
        '<div style="text-align:center;margin-top:12px"><a href="' + enlacePantalla + '" style="color:var(--muted);font-size:12px">Ver la comparativa en pantalla</a></div></div>';
    } catch (e) {
      aviso('Error cargando la comparativa: ' + escHtml(e.message));
    }
  }

  async function cargarDatos() {
    if (MODO_CMP) return cargarComparativa();
    try {
      // Cargar empresa + director (no dependen del alcance de la inspección)
      try {
        const [ceSnap, dirSnap] = await Promise.all([
          db.collection('config').doc('empresa').get(),
          db.collection('config').doc('director').get()
        ]);
        CONFIG = {
          empresa:  ceSnap.exists  ? ceSnap.data()  : {},
          alcance:  {},
          director: dirSnap.exists ? dirSnap.data() : {}
        };
      } catch(e) {
        CONFIG = CONFIG_DEFAULT;
      }

      // Cargar inspección
      const snap = await db.collection('inspecciones').doc(inspeccionId).get();
      if (!snap.exists) { document.getElementById('mainContent').innerHTML = '<p style="color:var(--red);padding:20px">Inspección no encontrada.</p>'; return; }
      D = { id: snap.id, ...snap.data() };

      // NC: viven en la subcolección inspecciones/{id}/ncs desde que se creó la inspección con
      // la versión nueva de la app — si existen documentos ahí, sustituyen a D.ncs (que en ese
      // caso ya no se escribe en el documento padre). Si la subcolección está vacía, se usa el
      // array embebido D.ncs tal cual venía de snap.data() (inspecciones antiguas).
      try {
        const ncsSnap = await db.collection('inspecciones').doc(inspeccionId).collection('ncs').get();
        if (!ncsSnap.empty) {
          const ncsSub = [];
          ncsSnap.forEach(function(d) { var nc = d.data(); nc.id = d.id; ncsSub.push(nc); });
          ncsSub.sort(function(a, b) { return (a.orden || 0) - (b.orden || 0); });
          D.ncs = ncsSub;
        }
      } catch (e) { console.warn('No se pudo leer la subcolección de NC:', e.message); }

      // Config del alcance real de esta inspección (fallback usado solo cuando la
      // inspección no tiene formatoDocumento propio, ej. inspecciones antiguas anteriores
      // a ese snapshot). 'PAA' como último recurso porque esas inspecciones antiguas eran
      // siempre PAA (no existían otros alcances todavía).
      try {
        const alcSnap = await db.collection('config').doc((D.tipoAlcance || 'PAA').toLowerCase()).get();
        if (alcSnap.exists) CONFIG.alcance = alcSnap.data();
      } catch(e) {}
      // Normalizar circuitos: nuevo formato = mapa {id: circData}, legacy = array
      if (D.circuitos && !Array.isArray(D.circuitos))
        D.circuitos = Object.values(D.circuitos).sort(function(a,b){ return (a.orden||0)-(b.orden||0); });
      normalizarJuegos(D.circuitos);
      normalizarSesiones(D);
      D_actual = D;

      // Aplicar formato del snapshot guardado en la inspección
      if (D.formatoDocumento) {
        if (D.formatoDocumento.checklist && D.formatoDocumento.checklist.length)
          GEN_ITEMS_PDF = D.formatoDocumento.checklist;
        if (D.formatoDocumento.columnas && D.formatoDocumento.columnas.length)
          COLS_PDF = D.formatoDocumento.columnas.map(function(c){
            var def = COLS_PDF_DEFAULT.find(function(d){ return d.key===c.id; });
            return {key:c.id, label:c.label, abbrev:c.abbrev, ref:(def?def.ref:''), desc:(def?def.desc:'')};
          });
      }

      // Guardar snapshot en localStorage (triple backup)
      try { localStorage.setItem('insp_' + inspeccionId, JSON.stringify(D)); } catch(e) {}

      if (!navigator.onLine) document.getElementById('alertOffline').classList.add('vis');
      renderResultado();
    } catch(e) {
      // Intentar desde localStorage
      const local = localStorage.getItem('insp_' + inspeccionId);
      if (local) {
        try {
          D = JSON.parse(local);
          if (D.circuitos && !Array.isArray(D.circuitos))
            D.circuitos = Object.values(D.circuitos).sort(function(a,b){ return (a.orden||0)-(b.orden||0); });
          normalizarJuegos(D.circuitos);
          normalizarSesiones(D);
          D_actual = D;
          if (D.formatoDocumento) {
            if (D.formatoDocumento.checklist && D.formatoDocumento.checklist.length)
              GEN_ITEMS_PDF = D.formatoDocumento.checklist;
            if (D.formatoDocumento.columnas && D.formatoDocumento.columnas.length)
              COLS_PDF = D.formatoDocumento.columnas.map(function(c){
                var def = COLS_PDF_DEFAULT.find(function(d){ return d.key===c.id; });
                return {key:c.id, label:c.label, abbrev:c.abbrev, ref:(def?def.ref:''), desc:(def?def.desc:'')};
              });
          }
          CONFIG = CONFIG_DEFAULT;
          document.getElementById('alertOffline').classList.add('vis');
          renderResultado();
        } catch(e2) {
          document.getElementById('mainContent').innerHTML = '<p style="color:var(--red);padding:20px">Error cargando datos: ' + e.message + '</p>';
        }
      }
    }
  }

  function renderResultado() {
    if (!D) return;

    // Claves de columna por circuito: las de su tipoElemento (SAE) o las de siempre (PAA/FER).
    const tiposJuegoRes = D.formatoDocumento?.tiposJuego;
    function keysForCircRes(c) {
      if (tiposJuegoRes && c.tipoElemento) {
        var t = tiposJuegoRes.find(function(tt){ return tt.id===c.tipoElemento; });
        if (t) return (t.columnas||[]).map(function(cc){ return cc.id; });
      }
      return ['ie','af','ej','ra','zs'];
    }
    const totalJuegos = (D.circuitos || []).reduce((s,c) => s + (c.juegos||[]).filter(j => j.tipo === 'R').length, 0);
    const totalAux = (D.circuitos || []).reduce((s,c) => s + (c.juegos||[]).filter(j => j.tipo !== 'R').length, 0);
    const juegosOk = (D.circuitos || []).reduce((s,c) =>
      s + (c.juegos||[]).filter(j => j.tipo === 'R' && keysForCircRes(c).every(k => j[k]==='S'||j[k]==='NA')).length, 0);
    const juegosNC = (D.circuitos || []).reduce((s,c) =>
      s + (c.juegos||[]).filter(j => j.tipo === 'R' && keysForCircRes(c).some(k => j[k]==='N')).length, 0);
    const auxOk = (D.circuitos || []).reduce((s,c) =>
      s + (c.juegos||[]).filter(j => j.tipo !== 'R' && keysForCircRes(c).every(k => j[k]==='S'||j[k]==='NA')).length, 0);
    const auxNC = (D.circuitos || []).reduce((s,c) =>
      s + (c.juegos||[]).filter(j => j.tipo !== 'R' && keysForCircRes(c).some(k => j[k]==='N')).length, 0);
    const ncsGenerales = (D.ncs || []).filter(n => n.prio && n.prio !== 'OBSERVACION' && n.autoId && n.autoId.startsWith('g')).length;

    document.getElementById('hdrTitulo').textContent = D.nombreInstalacion || 'Resultado';

      if (!ses.length) return `<div class="sesion-item">📅 ${D.fechaInspeccion||'Sin fecha'}</div>`;
      return ses.map(s => `<div class="sesion-item">📅 ${s.fecha||'Sin fecha'} · ${s.horaInicio||'--'}–${s.horaFin||'--'}</div>`).join('');
    })();

    // Agrupar NCs por tipo+prio para mostrar resumen
    const ncGrupos = {};

        + '<button onclick="toggleNcList(this,' + _extra + ')" style="margin-top:6px;width:100%;padding:6px;font-size:12px;font-weight:600;background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--muted)">Ver ' + _extra + ' más ▼</button>';

    document.getElementById('mainContent').innerHTML = `
      <div class="res-header ${favorable?'favorable':'desfavorable'}">
        <div class="res-icon">${favorable?'✓':'!'}</div>
        <div class="res-titulo">${favorable?'FAVORABLE':'DESFAVORABLE'}</div>
        <div class="res-ref">${getNRegistro()||D.id}</div>

      </div>

      <div class="stats-grid" style="grid-template-columns:repeat(5,1fr)">
        <div class="stat-box"><div class="stat-num">${totalJuegos}</div><div class="stat-label">${tiposJuegoRes&&tiposJuegoRes.length?'Elementos':'Juegos'}</div></div>

        <div class="stat-box"><div class="stat-num" style="color:${(juegosNC+auxNC)?'var(--red)':'var(--green)'}">${juegosNC} / ${auxNC}</div><div class="stat-label">Con NC</div></div>
        <div class="stat-box"><div class="stat-num" style="color:${ncsGenerales?'var(--red)':'var(--green)'}">${ncsGenerales}</div><div class="stat-label">NC Gen.</div></div>

      <div class="card">

        ${obs.length?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)">${obs.length} observación${obs.length>1?'es':''} (no bloquean certificado)</div>`:''}

      <div class="card">
        <div class="card-title">Generar documentos ${viendoRevisionIdx!==null?'(Rev.'+D.revision+')':''}</div>
        <button class="btn-pdf btn-informe" onclick="generarInforme()">
          &#128196; Generar Informe PDF
        </button>
        <button class="btn-pdf ${favorable?'btn-certificado':'btn-disabled'}" onclick="${favorable?'generarCertificado()':'void(0)'}">
          &#127941; ${favorable?'Generar Certificado PDF':'Certificado (solo FAVORABLE)'}
        </button>
        <button class="btn-pdf btn-registro" onclick="generarRegistro()">
          &#128203; Generar Registro
        </button>
        ${(D.ncs||[]).filter(function(n){return n.prio&&n.prio!=='OBSERVACION';}).length?`<button class="btn-pdf" style="background:#2C3E50;color:white;" onclick="generarPlanCorrecciones()">&#9998; Plan de Correcciones (cliente)</button>`:''}
      </div>

      ${(D_actual.historialRevisiones&&D_actual.historialRevisiones.length)?`
      <div class="card">
        <div class="card-title">Historial de revisiones</div>
        ${D_actual.historialRevisiones.map((r,idx)=>`
          <div class="info-row">
            <span>Rev.${r.revision} — ${r.resultado||'?'} ${r.fechaCompletada?('· '+new Date(r.fechaCompletada).toLocaleDateString('es-ES')):''}</span>
            <a href="#" onclick="verRevisionHistorica(${idx});return false;" style="color:var(--gold);font-weight:600;font-size:12px">Ver / Descargar &#8594;</a>
          </div>`).join('')}
        <div class="info-row">
          <span>Rev.${D_actual.revision} — ${D_actual.resultado||'?'} (actual)</span>
          ${viendoRevisionIdx!==null?`<a href="#" onclick="volverActual();return false;" style="color:var(--gold);font-weight:600;font-size:12px">Ver / Descargar &#8594;</a>`:'<span style="color:var(--muted);font-size:12px">Viendo ahora</span>'}
        </div>
      </div>`:''}`;
  }

  function verRevisionHistorica(idx){
    const snap=D_actual.historialRevisiones[idx];
    // Solo las revisiones anteriores a la que se está viendo cuentan como "anterior" para
    // el coloreado de diffs — si no, al ver Rev.0 se compara consigo misma (siempre "sin
    // cambio" = negro) y al ver Rev.N>0 se compara contra la última guardada en vez de la
    // inmediatamente anterior.
    D=Object.assign({},D_actual,snap,{id:D_actual.id,historialRevisiones:D_actual.historialRevisiones.slice(0,idx)});
    viendoRevisionIdx=idx;
    renderResultado();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function volverActual(){
    D=D_actual;
    viendoRevisionIdx=null;

  // ═══════════════════════════════════════════════════
  //   GENERACIÓN PDF — INFORME
  // ═══════════════════════════════════════════════════

  // Colores
  // Resuelve el nombre del elemento de una NC.
  // Formato nuevo: nc.juegoId → busca por ID estable (inmune a reordenación/borrado).
  // nc.elem: texto congelado en el momento de crear la NC — seguro pero puede quedar
  // desfasado si el elemento se renombra después.
  // _ci/_ji (legacy, solo en NC de antes de la migración a IDs estables): son índices de
  // posición en el array de circuitos — si el circuito se reordena o se borra otro por
  // delante, _ci ya no apunta al mismo elemento pero SIGUE apuntando a ALGUNO válido, así
  // que esta rama nunca "falla" — devuelve, con total confianza, el nombre de un elemento
  // distinto al real. Verificado con datos reales 2026-09-03 (Aventura Amazonia Pelayos).
  // Por eso _ci/_ji va DESPUÉS de nc.elem: el texto congelado es más fiable que una
  // posición que puede haberse movido, y solo se usa _ci/_ji como último recurso si ni
  // siquiera hay nc.elem guardado (NC muy antigua/manual sin texto).
  function getNcElem(nc) {
    if (D && D.circuitos) {
      var circs = Array.isArray(D.circuitos) ? D.circuitos : Object.values(D.circuitos);
      // Formato nuevo: buscar juego por ID estable
      if (nc.juegoId) {
        var matches = [];
        for (var c of circs) {
          for (var j of (c.juegos||[])) {
            if (j.id === nc.juegoId) matches.push(c.nombre + ' — ' + (j.nombre || 'Juego'));
          }
        }
        if (matches.length === 1) return matches[0];
        // juegoId duplicado (datos corruptos): usar elem almacenado como referencia
        if (matches.length > 1) return nc.elem || matches[0];
      }
      if (nc.elem) return nc.elem;
      // Último recurso: índices posicionales _ci/_ji (poco fiables, ver comentario arriba)
      if (nc._ci !== undefined && nc._ci !== 'g' && nc._ji !== undefined) {
        var circ = circs[nc._ci];
        var juego = circ && circ.juegos && circ.juegos[nc._ji];
        if (circ && juego) return circ.nombre + ' — ' + (juego.nombre || ('Juego ' + (nc._ji + 1)));
      }
    }
    return nc.elem || '';
  }

  const GOLD = [200, 153, 58];
  const DARK = [26, 26, 26];
  const MUTED = [138, 130, 120];
  const BORDER = [226, 221, 213];
  const SURF = [245, 243, 239];
  const RED = [192, 57, 43];
  const ORANGE = [230, 126, 34];
  const GREEN_C = [39, 174, 96];
  const BLUE_C = [41, 128, 185];
  const WHITE = [255, 255, 255];
  const BLACK = [0, 0, 0];

  // Dimensiones A4
  const PW = 210, PH = 297;
  const ML = 20, MR = 20, MT = 15, MB = 15;
  const CW = PW - ML - MR;

  // Barra de cabecera de grupo por tipoJuego (ej. "VÍA (14) — UNE-EN 12572-1:2017") —
  // única función usada por Informe y Registro. Antes había dos copias independientes de
  // este mismo dibujo, una en cada documento, sin nada que garantizara que se mantuvieran
  // iguales entre sí ni frente a PAA (que no la usa, al no tener más de un conjunto de
  // columnas). Ahora solo hay un sitio que cambiar.
  function drawTipoGroupBar(doc, y, tipoCfg, opts) {
    opts = opts || {};
    doc.setFillColor(...GOLD);
    doc.rect(ML, y, CW, 6, 'F');
    doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...WHITE);
    var txt = (tipoCfg.label||tipoCfg.id).toUpperCase();
    if (opts.count !== undefined) txt += ' ('+opts.count+')';
    if (tipoCfg.normaRef) txt += ' — '+tipoCfg.normaRef;
    doc.text(txt, ML+2, y+4.2);
    return y + (opts.heightAfter !== undefined ? opts.heightAfter : 9);
  }

  // Quita el nº de apartado de la norma al principio de un label (ej. "4.3.1 Distribución
  // y ubicación..." → "Distribución y ubicación..."). Los labels de SAE/FER llevan el
  // número incrustado en el propio texto (a diferencia de PAA, que lo guarda aparte en
  // `ref`) — mismo texto real, solo sin el prefijo, para que quepa como cabecera de columna.
  function shortLabelNorma(label) {
    return (label||'').replace(/^\d+(\.\d+)*\s+/, '');
  }

  // Fila de cabecera de una tabla de registro (Circuitos/Elemento + criterios + Obs.) —
  // usada tanto por PAA (Circuitos/Juegos + 5 columnas fijas) como por SAE/FER (Elemento +
  // columnas dinámicas por tipo). `cols` es un array plano {width, label, align?} en orden
  // de izquierda a derecha; el texto de cada columna se ajusta automáticamente al ancho
  // disponible, y si una sola palabra (sin espacios) no cabe ni siquiera ocupando toda la
  // columna, se reduce el tamaño de letra de TODA la fila hasta que quepa entera — nunca se
  // corta una palabra a mitad (splitTextToSize por sí solo lo hace si no le queda más remedio).
  function drawRegHeaderRow(doc, y, cols, fontSize) {
    fontSize = fontSize || 6.5;
    var minFontSize = 4;
    doc.setFont('helvetica', 'bold');
    function palabraMasLarga(label) {
      return label.replace(/\//g, '/ ').split(/\s+/).filter(Boolean);
    }
    // Encoger la fuente hasta que la palabra más larga de cada columna quepa entera
    cols.forEach(function(c) {
      var palabras = palabraMasLarga(c.label);
      var fs = fontSize;
      while (fs > minFontSize) {
        doc.setFontSize(fs);
        var anchoMax = Math.max(0, ...palabras.map(function(p){ return doc.getTextWidth(p); }));
        if (anchoMax <= c.width - 3) break;
        fs -= 0.25;
      }
      if (fs < fontSize) fontSize = fs;
    });
    doc.setFontSize(fontSize);
    var lineH = fontSize * 0.42;
    var linesPerCol = cols.map(function(c){ return doc.splitTextToSize(c.label.replace(/\//g, '/ '), c.width - 3); });
    var maxLines = Math.max(1, ...linesPerCol.map(function(l){ return l.length; }));
    var h = Math.max(10, maxLines * lineH + 4);

    var x = ML;
    doc.setDrawColor(...DARK); doc.setLineWidth(0.2);
    cols.forEach(function(c, i){
      doc.setFillColor(...SURF);
      doc.rect(x, y, c.width, h, 'FD');
      var lines = linesPerCol[i];
      var startY = y + h/2 - (lines.length-1)*lineH/2 + lineH*0.35;
      var align = c.align || 'center';
      var tx = align === 'left' ? x + 2 : x + c.width/2;
      lines.forEach(function(l, li){ doc.text(l, tx, startY + li*lineH, {align: align}); });
      x += c.width;
    });
    return y + h;
  }

  // Pie de portada
  function addPiePagina(doc, nombreCorto) {
    doc.setDrawColor(...GOLD); doc.setLineWidth(0.5);
    doc.line(ML, PH-18, PW-MR, PH-18);
    doc.setFillColor(...GOLD);
    doc.rect(ML, PH-18, CW, 0.5, 'F');
    doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...GOLD);
    const c = CONFIG?.empresa || CONFIG_DEFAULT.empresa;
    doc.text(`${c.sedeSocial}`, PW/2, PH-13, {align:'center'});
    if (c.sedeFiscal && c.sedeFiscal !== c.sedeSocial) doc.text(`${c.sedeFiscal}`, PW/2, PH-9, {align:'center'});

  // resultado.html?comparar=1&alc=paa&de=10&a=11 genera el informe de la plantilla (con

  const AZUL_CMP = [0, 71, 194], ROJO_CMP = [208, 0, 0];

  // Siguiente operación de la comparación que corresponde al texto que se va a dibujar.
  // Devuelve además los eliminados que quedan antes (se dibujan tachados en ese punto).
  function cmpBuscar(texto) {
    const pre = [];
    if (!CMP) return { pre: pre, op: null };
    for (let j = CMP.i; j < CMP.ops.length; j++) {
      const op = CMP.ops[j];
      if (op.b && op.t !== 'movDe' && op.b.x === texto) {
        for (let k = CMP.i; k < j; k++) if (CMP.ops[k].t === 'del' || CMP.ops[k].t === 'movDe') pre.push(CMP.ops[k]);
        CMP.i = j + 1;
        return { pre: pre, op: op };

    }
    return { pre: pre, op: null };
  }

  function cmpSaltoSiHaceFalta(c, y, alto) {

  // Dibuja una línea de texto (con salto de renglón) formada por trozos {x, st:'eq'|'ins'|'del'|'tag'}.
  function cmpPintarTrozos(c, y, trozos) {
    const doc = c.doc;
    const fijarFuente = function(){ doc.setFontSize(c.fontSize); doc.setFont('helvetica', c.font || 'normal'); };
    fijarFuente();
    const unidades = [];
    trozos.forEach(function(t){ String(t.x).split(/(\s+)/).filter(function(w){ return w !== ''; }).forEach(function(w){ unidades.push({ x: w, st: t.st }); }); });
    const lineas = []; let linea = [], ancho = 0;
    unidades.forEach(function(u){
      const w = doc.getTextWidth(u.x), esp = !u.x.trim();
      if (!esp && ancho + w > c.maxW && linea.length) { lineas.push(linea); linea = []; ancho = 0; }
      if (esp && !linea.length) return;
      linea.push(u); ancho += w;
    });
    if (linea.length || !lineas.length) lineas.push(linea);
    lineas.forEach(function(l){
      if (y > c.maxY) { y = cmpSaltoSiHaceFalta(c, y); fijarFuente(); }
      let cx = c.x;
      l.forEach(function(u){
        const w = doc.getTextWidth(u.x);
        const col = u.st === 'ins' ? AZUL_CMP : (u.st === 'del' || u.st === 'tag') ? ROJO_CMP : (c.color || DARK);
        doc.setTextColor(...col);
        doc.text(u.x, cx, y);
        if (u.st === 'del' && u.x.trim()) {
          doc.setDrawColor(...ROJO_CMP); doc.setLineWidth(0.25);

  }
  // Franja de la leyenda de NC eliminada o movida desde aquí: color atenuado, borde rojo
  // discontinuo y texto tachado.
  function cmpPintarFranjaQuitada(c, y, texto, movida) {
    const doc = c.doc;
    const prio = (String(texto).match(/NO CONFORMIDAD (GRAVE|MEDIA|LEVE|DOCUMENTAL)/) || [])[1];
    const base = ({ GRAVE: RED, MEDIA: ORANGE, LEVE: GREEN_C, DOCUMENTAL: BLUE_C })[prio] || [150, 150, 150];
    const claro = base.map(function(v){ return Math.round(v + (255 - v) * 0.78); });
    doc.setFontSize(8); doc.setFont('helvetica', 'bold');
    const lines = doc.splitTextToSize(texto, CW - 4);
    const bh = Math.max(8, lines.length * 4.5 + 4);
    y = cmpSaltoSiHaceFalta(c, y, bh);
    doc.setFontSize(8); doc.setFont('helvetica', 'bold');
    doc.setFillColor(...claro); doc.rect(ML, y, CW, bh, 'F');
    doc.setDrawColor(...ROJO_CMP); doc.setLineWidth(0.6); doc.setLineDashPattern([1.2, 1], 0);
    doc.rect(ML, y, CW, bh); doc.setLineDashPattern([], 0);
    doc.setTextColor(...ROJO_CMP);
    lines.forEach(function(l, i){
      const ly = y + 4.5 + i * 4.5;
      doc.text(l, ML + 2, ly);

      doc.line(ML + 2, ly - 1, ML + 2 + doc.getTextWidth(l), ly - 1);

    doc.setFontSize(6.5); doc.setTextColor(...ROJO_CMP);
    doc.text(movida ? 'MOVIDO A OTRA POSICIÓN' : 'ELIMINADO', ML + CW - 2, y + bh - 2, { align: 'right' });
    return y + bh + 1;
  }
  function cmpPintarEliminado(c, y, op) {
    if (op.a.k === 'ley') return cmpPintarFranjaQuitada(c, y, op.a.x, op.t === 'movDe');
    const trozos = [{ x: op.a.x, st: 'del' }];
    if (op.t === 'movDe') trozos.push({ x: ' (movido a otra posición)', st: 'tag' });
    return cmpPintarTrozos(c, y, trozos);

  function cmpTrozosDe(op, texto) {
    if (!op || op.t === 'eq') return [{ x: texto, st: 'eq' }];
    if (op.t === 'ins' || op.t === 'movA') return [{ x: texto, st: 'ins' }];

  // Sustituye a addTextBlock en modo comparativa: cada línea se cruza con la comparación.
  function cmpTextBlock(doc, text, x, y, maxW, fontSize, color, font, lineH, maxY, ref, fmtRev, fmtFecha, nPag, totPag) {
    const c = { doc: doc, x: x, maxW: maxW, fontSize: fontSize, color: color || DARK, font: font, lineH: lineH, maxY: maxY,
      ref: ref, fmtRev: fmtRev, fmtFecha: fmtFecha, nPag: nPag, totPag: totPag };
    String(text).split('\n').forEach(function(linea){
      const t = linea.trim();
      if (!t) { y = cmpPintarTrozos(c, y, []); return; }
      const r = cmpBuscar(t);
      r.pre.forEach(function(op){ y = cmpPintarEliminado(c, y, op); });

  }
  // Al terminar una sección: dibuja lo eliminado/movido que quedaba al final de ella.
  function cmpCerrarSeccion(seccion, c, y) {
    if (!CMP) return y;
    while (CMP.i < CMP.ops.length) {
      const op = CMP.ops[CMP.i];
      if ((op.b || op.a).s !== seccion) break;
      if (op.t === 'del' || op.t === 'movDe') y = cmpPintarEliminado(c, y, op);
      CMP.i++;
    }
    return y;
  }

  function addTextBlock(doc, text, x, y, maxW, fontSize, color, font, lineH, maxY, ref, fmtRev, fmtFecha, nPag, totPag) {
    if (CMP) return cmpTextBlock(doc, text, x, y, maxW, fontSize, color, font, lineH, maxY, ref, fmtRev, fmtFecha, nPag, totPag);
    doc.setFontSize(fontSize); doc.setFont('helvetica', font||'normal'); doc.setTextColor(...(color||DARK));
    const lines = doc.splitTextToSize(text, maxW);
    for (const line of lines) {
      if (y > maxY) {
        doc.addPage();
        nPag[0]++;
        addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFecha);
        // addCabecera cambia tamaño/color/tipo de letra para dibujar su propia cabecera y
        // pie — sin restaurar aquí, el resto del párrafo en la página nueva se queda con
        // esa fuente (pequeña, gris o dorada) en vez de la del cuerpo del texto.
        doc.setFontSize(fontSize); doc.setFont('helvetica', font||'normal'); doc.setTextColor(...(color||DARK));
        y = MT + 8;
      }
      doc.text(line, x, y);
      y += lineH;
    }
    return y;
  }

  var _fotosDB_res = null;

        var req = tx.objectStore('fotosPendientes').get(key);

  function loadImageAsBase64(url, localKey) {
    function fromUrl(resolve, intentos) {
      intentos = intentos || 0;
      if (!url || url.startsWith('data:')) { resolve(url || null); return; }
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const MAX_W = 1200, MAX_H = 900;
        let w = img.width, h = img.height;
        if (w > MAX_W || h > MAX_H) {
          const r = Math.min(MAX_W / w, MAX_H / h);
          w = Math.round(w * r); h = Math.round(h * r);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      // Reintenta hasta 2 veces (hueco de red puntual) antes de darla por perdida —
      // ver incidente Rebollar 22/09: fotos que existían y funcionaban se quedaron en
      // blanco en el PDF por un fallo de carga momentáneo, sin ningún aviso.
      img.onerror = () => {
        if (intentos < 2) setTimeout(() => fromUrl(resolve, intentos + 1), 500);
        else resolve(null);
      };
      img.src = url;
    }
    return new Promise((resolve) => {
      if (localKey) {
        leerFotoLocal_res(localKey).then(function(data) {
          if (data && data.dataUrl) { resolve(data.dataUrl); return; }
          fromUrl(resolve, 0);
        }).catch(function() { fromUrl(resolve, 0); });
        return;
      }
      fromUrl(resolve, 0);
    });
  }

  // Helper: preload all photos in inspection data. Devuelve la lista de fotos que no se
  // pudieron cargar (con reintentos ya agotados) para poder avisar ANTES de generar el PDF,
  // en vez de que salgan en blanco sin que nadie se entere.
  async function preloadFotos(data) {
    const fallidas = [];
    // Fotos generales
    const fotos = data.fotos || [];
    for (let i = 0; i < fotos.length; i++) {
      fotos[i].dataUrl = await loadImageAsBase64(fotos[i].url, fotos[i].localKey);
      if (!fotos[i].dataUrl && fotos[i].url) fallidas.push('Foto general');
    }
    // Fotos por juego
    for (const circ of (data.circuitos || [])) {
      for (const j of (circ.juegos || [])) {
        for (let i = 0; i < (j.fotos || []).length; i++) {
          const f = j.fotos[i];
          j.fotos[i].dataUrl = await loadImageAsBase64(f.url, f.localKey);
          if (!j.fotos[i].dataUrl && f.url) fallidas.push((circ.nombre||'').trim() + ' — ' + (j.nombre || 'juego'));
        }
      }
    }
    // Fotos NCs
    for (const nc of (data.ncs || [])) {
      for (const arr of [nc.fotosDefecto || [], nc.fotosCorreccion || []]) {
        for (let i = 0; i < arr.length; i++) {
          const f = arr[i];
          arr[i].dataUrl = await loadImageAsBase64(f.url, f.localKey);
          if (!arr[i].dataUrl && f.url) fallidas.push('NC: ' + (nc.tipo || nc.elem || ''));
        }
      }
    }
    return fallidas;
  }

  // Misma comparación que inspeccion.html (revisionFormatoAlCompletar): ¿el checklist y las

  function _canonRes(v) {
    if (Array.isArray(v)) return '[' + v.map(_canonRes).join(',') + ']';
    if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(function(k){ return JSON.stringify(k) + ':' + _canonRes(v[k]); }).join(',') + '}';
    return JSON.stringify(v === undefined ? null : v);

  function revisionInforme() {

    const vigente = cfg.formatoRevision || 0;
    const mismoFormato = _canonRes(cfg.checklist || []) === _canonRes(fd.checklist || []) && _canonRes(cfg.columnas || []) === _canonRes(fd.columnas || []);
    if (D.estado !== 'completada' && viendoRevisionIdx === null && vigente > (Number(rev) || 0) && mismoFormato) {
      rev = vigente; fecha = cfg.formatoFecha || fecha;

      // en vez de dejar elegir "generar igual" (eso fue justo lo que pasó el 22/09).
      hideGenerating();
      alert(
        '⚠️ No se ha podido generar el informe.\n\n' +
        fotosFallidas.length + ' foto(s) no se han podido cargar tras varios intentos:\n\n' +
        fotosFallidas.slice(0, 10).join('\n') + (fotosFallidas.length > 10 ? '\n...y ' + (fotosFallidas.length - 10) + ' más' : '') +
        '\n\nComprueba tu conexión y vuelve a intentarlo.'

    }
    await new Promise(r => setTimeout(r, 100));
    try {
      const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
      const ref = getNRegistro();
      const fmtRev = _revInf.rev;
      const fmtFechaStr = _revInf.fecha;
      if (!fmtRev || !fmtFechaStr) {
        // Ver bug FER 2026-09: config/{alcance} nunca publicado por el flujo normal deja
        // Rev./Fecha en blanco en el PDF sin avisar a nadie — aviso en consola para detectarlo
        // al primer informe generado de un alcance nuevo, no meses después.
        console.warn('[informe] Rev./Fecha en blanco para alcance "' + D.tipoAlcance + '" — revisa config/' + (D.tipoAlcance||'').toLowerCase() + '.formatoRevision/formatoFecha en Firestore.');
      }
      const norma = D.formatoDocumento?.normaAplicable || CONFIG?.alcance?.normaAplicable || { numero:'', titulo:'', tipoInstalacion:'la instalación' };
      // Alcances con columnas por tipo de elemento (ej. SAE: Vía/Muro; FER: Tramo, con un
      // único tipo) — cambia cómo se agrupa/titula la sección de resultados específicos y
      // el flujo de inspeccion.html. PAA es hoy el único alcance sin tiposJuego.
      const tiposJuegoInforme = D.formatoDocumento?.tiposJuego || null;
      const esTiposJuego = !!(tiposJuegoInforme && tiposJuegoInforme.length);
      const tituloInspeccionSeccion = esTiposJuego ? ('INSPECCIÓN — ' + (norma.tipoInstalacion||'LA INSTALACIÓN').toUpperCase()) : 'INSPECCIÓN DE PARQUES DE AVENTURA';
      const tituloDescripcionSeccion = esTiposJuego ? 'DESCRIPCIÓN DE LA INSTALACIÓN' : 'DESCRIPCIÓN DEL RECORRIDO';
      // Textos narrativos (Metodología/Mantenimiento/Características): SÍ dependen del
      // alcance concreto, no solo de si tiene tiposJuego — esTiposJuego ya no basta para
      // distinguir SAE de FER. mapaAlcance[D.tipoAlcance] si existe una versión propia,
      // si no cae al texto de PAA (placeholder genérico hasta tener el texto real de ese
      // alcance — nunca el texto de OTRO alcance con tiposJuego, sería contenido incorrecto).
      function textoPorAlcance(mapaAlcance, fallbackPaa) {
        if (D.tipoAlcance && D.tipoAlcance !== 'PAA' && !mapaAlcance[D.tipoAlcance]) {
          // Aviso en consola si un alcance no-PAA cae al texto genérico de PAA por no
          // tener su propia variante — así se detecta en el primer PDF generado, no meses
          // después (esto es justo lo que pasó con FER sin que nadie lo notara).
          console.warn('[informe] Sin texto propio para alcance "' + D.tipoAlcance + '" — usando el genérico de PAA. Revisa resultado.html.');
        }
        return mapaAlcance[D.tipoAlcance] || fallbackPaa;
      }

      const totPag = [0];
      const nPag = [0];
      const indicePags = {};

      // ═══ PÁGINA 1: PORTADA ═══
      nPag[0]++;
      let y = 18;

      // Línea gold única encima del título
      doc.setDrawColor(...GOLD); doc.setLineWidth(0.8);
      doc.line(ML, y, PW-MR, y); y += 10;

      // Título
      doc.setFontSize(26); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
      const titulo1 = 'Inspección de';
      const titulo2 = norma.tipoInstalacion;
      const titulo3 = 'según ' + norma.numero;
      [titulo1,titulo2,titulo3].forEach(t => {
        doc.text(t, PW-MR, y, {align:'right'});
        y += 13;
      });
      y += 6;

      // Línea gold simple bajo el título
      doc.setDrawColor(...GOLD); doc.setLineWidth(0.5);
      doc.line(ML, y, PW-MR, y); y += 10;

      // Instalación
      doc.setFontSize(18); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
      doc.text(D.nombreInstalacion||'', PW-MR, y, {align:'right'}); y += 8;
      doc.setFontSize(12); doc.setTextColor(...MUTED);
      doc.text(D.localidad||D.municipio||'', PW-MR, y, {align:'right'}); y += 2;
      doc.line(ML, y, PW-MR, y); y += 8;

      // Dirección
      doc.setFontSize(11); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
      const dirLines = doc.splitTextToSize(composeDireccion(D), CW);
      dirLines.forEach((line, i) => { doc.text(line, PW-MR, y + i * 5, {align:'right'}); });
      y += (dirLines.length - 1) * 5 + 2;
      doc.line(ML, y, PW-MR, y); y += 10;

      // Referencia
      doc.setFontSize(12); doc.setTextColor(...DARK);
      doc.text(ref, PW-MR, y, {align:'right'}); y += 2;
      doc.line(ML, y, PW-MR, y); y += 8;

      // Sesiones — alineadas a la derecha
      doc.setFontSize(10); doc.setFont('helvetica','italic'); doc.setTextColor(...DARK);
      const sesLines = getSesionesStr().split('\n');
      sesLines.forEach(s => { doc.text(s, PW-MR, y, {align:'right'}); y += 6; });
      y += 2;
      doc.line(ML, y, PW-MR, y);

      if (CMP && CMP.soloPlantilla) {
        // Recuadro de la plantilla de una revisión (botón "PDF" del historial).
        const cy = y + 10;
        doc.setFontSize(8.5); doc.setFont('helvetica','normal');
        const motivoLns = CMP.a.motivo ? doc.splitTextToSize('Motivo de la revisión: ' + CMP.a.motivo, CW - 8) : [];
        const altoCaja = 24 + motivoLns.length * 4.2;
        doc.setDrawColor(...GOLD); doc.setLineWidth(0.6); doc.rect(ML, cy, CW, altoCaja);
        doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
        doc.text('PLANTILLA DEL INFORME — Rev ' + CMP.a.revision + ' (vigente desde ' + (CMP.a.fechaVigencia || '') + ')', ML + 4, cy + 7);
        doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...MUTED);
        doc.text('Plantilla completa del informe: los datos de cada inspección aparecen entre corchetes.', ML + 4, cy + 13.5);
        doc.setFontSize(8.5); doc.setTextColor(...DARK);
        motivoLns.forEach((l, i) => doc.text(l, ML + 4, cy + 19.5 + i * 4.2));
      } else if (CMP) {
        // Recuadro del informe comparativo: revisiones, leyenda de colores y motivo.
        const cy = y + 10;
        doc.setFontSize(8.5); doc.setFont('helvetica','normal');
        const motivoLns = CMP.a.motivo ? doc.splitTextToSize('Motivo del cambio: ' + CMP.a.motivo, CW - 8) : [];
        const altoCaja = 39 + motivoLns.length * 4.2;

        doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(...AZUL_CMP);

        doc.setFontSize(9.5); doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
        doc.text('De la Rev ' + CMP.de.revision + ' (' + (CMP.de.fechaVigencia || '') + ') a la Rev ' + CMP.a.revision + ' (' + (CMP.a.fechaVigencia || '') + ')', ML + 4, cy + 13);
        doc.setFontSize(8.5); doc.setTextColor(...MUTED);
        doc.text('Cambios: ' + CMP.resumen, ML + 4, cy + 18);
        doc.setFontSize(9.5);
        doc.setFont('helvetica','bold'); doc.setTextColor(...AZUL_CMP);
        const wAzul = doc.getTextWidth('Texto en azul');

        doc.text(': añadido o movido a esa posición', ML + 4 + wAzul, cy + 24.5);
        doc.setFont('helvetica','bold'); doc.setTextColor(...ROJO_CMP);
        const wRojo = doc.getTextWidth('Texto en rojo tachado');

        doc.setFont('helvetica','normal'); doc.setTextColor(...DARK);
        doc.text(': eliminado o movido desde esa posición', ML + 4 + wRojo, cy + 30);
        doc.setFontSize(8); doc.setTextColor(...MUTED);
        doc.text('Plantilla completa del informe: los datos de cada inspección aparecen entre corchetes.', ML + 4, cy + 35.5);
        doc.setFontSize(8.5); doc.setTextColor(...DARK);
        motivoLns.forEach((l, i) => doc.text(l, ML + 4, cy + 40.5 + i * 4.2));

      // Logo derecha (izquierda reservada para ENAC)

      // Pie portada (sin ref duplicada)
      addPiePagina(doc);

      doc.addPage(); nPag[0]++;

      y = MT + 10;

      doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);

      const indiceItems = [
        ['METODOLOGÍA', 'METODOLOGIA'], ['   I. Naturaleza de la inspección', 'METODOLOGIA'],
        ['   II. Material utilizado', 'METODOLOGIA'],
        ['MANTENIMIENTO', 'MANTENIMIENTO'],
        ['RESULTADOS DE LA INSPECCIÓN', 'RESULTADOS'],
        [tituloDescripcionSeccion, 'DESCRIPCION'],
        [tituloInspeccionSeccion, 'INSPECCION'],
        ['ANEXOS', 'ANEXOS'],
        ['LISTADO DE OBSERVACIONES', 'LISTADO'],
        ['CARACTERÍSTICAS DE INSPECCIÓN', 'CARACTERISTICAS'],
      ];
      const indiceY0 = y;
      const indicePagina = nPag[0];
      indiceItems.forEach(([txt]) => {
        doc.setFontSize(10); doc.setFont('helvetica', txt.startsWith('   ')?'normal':'bold');
        doc.setTextColor(...DARK);
        doc.text(txt.trim(), ML, y);
        doc.setDrawColor(...BORDER); doc.setLineWidth(0.1);
        const dotX = ML + doc.getTextWidth(txt.trim()) + 3;
        doc.line(dotX, y, PW-MR-8, y);
        y += 7;

      // ═══ PÁGINA 3: DATOS ═══
      doc.addPage(); nPag[0]++;
      addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
      y = MT + 10;

      // Cabecera con logo
      doc.setFillColor(...SURF);
      doc.rect(ML, y-5, CW, 14, 'F');

      doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('INFORME DE INSPECCIÓN', ML+22, y+2);
      // Subtítulo con ancho variable según el alcance (tipoInstalacion) — se encoge para
      // no pisar la caja de Rev./Fecha a la derecha (antes se dibujaba a tamaño fijo y
      // "INSPECCIÓN DE INSTALACIONES ESTRUCTURA ARTIFICIAL DE ESCALADA" se metía encima).
      const subtitInsp = 'INSPECCIÓN DE INSTALACIONES ' + (norma.tipoInstalacion || '').toUpperCase();
      const subtitMaxW = (PW-MR-25) - (ML+22) - 3;
      var subtitFS = 10;
      doc.setFont('helvetica','normal');
      while (subtitFS > 7 && doc.setFontSize(subtitFS).getTextWidth(subtitInsp) > subtitMaxW) subtitFS -= 0.25;
      doc.setFontSize(subtitFS);
      doc.text(subtitInsp, ML+22, y+7);
      doc.setFontSize(8); doc.setTextColor(...MUTED);
      doc.text(`Rev. ${fmtRev}`, PW-MR-25, y);
      doc.text(`Fecha: ${fmtFechaStr}`, PW-MR-25, y+5);
      y += 18;

      // Caja Propietario
      const cajaH = 36;
      doc.setDrawColor(...DARK); doc.setLineWidth(0.3);
      doc.rect(ML, y, CW, cajaH);
      doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('PROPIETARIO DE LAS INSTALACIONES', ML+3, y+6);
      doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.text(D.propietario||D.nombreInstalacion||'', PW-MR-3, y+14, {align:'right'});
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      doc.text(D.nombreInstalacion||'', PW-MR-3, y+20, {align:'right'});
      if (D.cif) doc.text(D.cif.replace(/[​-‏﻿]/g,'').trim(), PW-MR-3, y+26, {align:'right'});
      doc.setFont('helvetica','bold');
      doc.text('GESTOR DE LAS INSTALACIONES:', ML+3, y+cajaH-4);
      doc.setFont('helvetica','normal');
      doc.text(D.gestor||D.propietario||'', PW-MR-3, y+cajaH-4, {align:'right'});
      y += cajaH + 5;

      // Caja Solicitante + Tipo
      doc.rect(ML, y, CW, 22);
      doc.setFont('helvetica','bold'); doc.setFontSize(9);
      doc.text('SOLICITANTE DE LA INSPECCION', ML+3, y+6);
      doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.text(D.solicitante||D.propietario||'', PW-MR-3, y+12, {align:'right'});
      doc.setFont('helvetica','bold'); doc.setFontSize(9);
      doc.text('TIPO DE INSPECCION', ML+3, y+18);
      doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.text(D.tipoInspeccion||'ANUAL', PW-MR-3, y+18, {align:'right'});
      y += 27;

      // Caja Organismo
      const c = CONFIG?.empresa || CONFIG_DEFAULT.empresa;
      doc.rect(ML, y, CW, 38);
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...DARK);
      doc.text('ORGANISMO DE INSPECCIÓN', ML+3, y+6);
      doc.setFont('helvetica','bold'); doc.setFontSize(11);
      doc.text(c.nombre.toUpperCase(), PW-MR-3, y+13, {align:'right'});
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      doc.text(c.sedeSocial, PW-MR-3, y+19, {align:'right'});
      var _yOff = 19;
      if (c.sedeFiscal && c.sedeFiscal !== c.sedeSocial) { doc.text(c.sedeFiscal, PW-MR-3, y+25, {align:'right'}); _yOff = 25; }
      doc.text('Teléfono: ' + c.telefono, PW-MR-3, y+_yOff+6, {align:'right'});
      doc.text('E-mail: ' + c.email, PW-MR-3, y+_yOff+11, {align:'right'});


      // ═══ PÁGINAS 4-5: METODOLOGÍA ═══
      doc.addPage(); nPag[0]++;
      indicePags['METODOLOGIA'] = nPag[0];
      addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
      y = MT + 8;

      doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(...GOLD);
      doc.text('METODOLOGÍA', ML, y); y += 8;

      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('I. Naturaleza de la inspección', ML, y); y += 6;
      y = addTextBlock(doc, textoPorAlcance({SAE: TEXTO_METODOLOGIA_1_SAE, FER: TEXTO_METODOLOGIA_1_FER}, TEXTO_METODOLOGIA_1), ML, y, CW, 9, DARK, 'normal', 5, PH-18, ref, fmtRev, fmtFechaStr, nPag, totPag);
      y += 6;
      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      if (y > PH-40) { doc.addPage(); nPag[0]++; addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr); y = MT+8; }
      doc.text('II. Material utilizado', ML, y); y += 6;
      y = addTextBlock(doc, textoPorAlcance({SAE: TEXTO_METODOLOGIA_2_SAE, FER: TEXTO_METODOLOGIA_2_FER}, TEXTO_METODOLOGIA_2), ML, y, CW, 9, DARK, 'normal', 5, PH-18, ref, fmtRev, fmtFechaStr, nPag, totPag);
      y = cmpCerrarSeccion('Metodología', cmpCtx(doc, ref, fmtRev, fmtFechaStr, nPag, totPag), y);


      // ═══ MANTENIMIENTO ═══
      doc.addPage(); nPag[0]++;
      indicePags['MANTENIMIENTO'] = nPag[0];
      addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
      y = MT + 8;

      doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(...GOLD);
      doc.text('MANTENIMIENTO', ML, y); y += 8;

      const seccionesMant = PLANTILLA_INFORME.mantenimiento(D.tipoAlcance);
      for (const [titulo, texto] of seccionesMant) {
        if (y > PH-50) { doc.addPage(); nPag[0]++; addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr); y = MT+8; }
        // Título con el mismo wrap que el cuerpo — antes usaba doc.text() sin maxWidth y
        // se salía de la página en títulos largos (ej. el de EPI en SAE, ~127 caracteres).
        y = addTextBlock(doc, titulo, ML, y, CW, 10, DARK, 'bold', 5, PH-18, ref, fmtRev, fmtFechaStr, nPag, totPag);
        y += 2;
        y = addTextBlock(doc, texto, ML, y, CW, 9, DARK, 'normal', 5, PH-18, ref, fmtRev, fmtFechaStr, nPag, totPag);
        y += 6;
      }
      y = cmpCerrarSeccion('Mantenimiento', cmpCtx(doc, ref, fmtRev, fmtFechaStr, nPag, totPag), y);


      // ═══ RESULTADOS ═══
      doc.addPage(); nPag[0]++;
      indicePags['RESULTADOS'] = nPag[0];
      addCabecera(doc, nPag[0], totPag[0], ref, fmtRev, fmtFechaStr);
      y = MT + 8;

      doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(...GOLD);
      doc.text('RESULTADOS DE LA INSPECCIÓN', ML, y); y += 8;
      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('I. Normativa de referencia:', ML, y); y += 6;
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      const normasDetalleInforme = D.formatoDocumento?.normasDetalle;
      if (normasDetalleInforme && normasDetalleInforme.length) {
        normasDetalleInforme.forEach(function(n){
          const txt = n.numero + (n.titulo ? ': ' + n.titulo : '');
          const lns = doc.splitTextToSize(txt, CW);
          doc.text(lns, ML, y); y += lns.length*4.5 + 2;
        });
        y += 6;
      } else {
        doc.text(norma.numero + (norma.titulo ? ': ' + norma.titulo : ''), ML, y, {maxWidth: CW}); y += 12;
      }
      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...DARK);
      doc.text('II. Resultados de la inspección', ML, y); y += 6;
      // La tabla de colores va justo después de la lista de niveles de severidad, que es lo
      // que explica, y antes de la metodología ("En caso de que la inspección resulte con...").
      textoPorAlcance({SAE: TEXTO_RESULTADOS_SAE, FER: TEXTO_RESULTADOS_FER}, TEXTO_RESULTADOS); // solo por el aviso de alcance sin texto propio
      const textoResPartes = PLANTILLA_INFORME.resultados(D.tipoAlcance);
      const textoResMetodo = textoResPartes.metodo;
      y = addTextBlock(doc, textoResPartes.niveles, ML, y, CW, 9, DARK, 'normal', 5, PH-18, ref, fmtRev, fmtFechaStr, nPag, totPag);

      // Tabla colores NC
      y += 3;
      const COLOR_PRIO_LEYENDA = { GRAVE: RED, MEDIA: ORANGE, LEVE: GREEN_C, DOCUMENTAL: BLUE_C };
      const ncColors = PLANTILLA_INFORME.LEYENDA_NC.map(function(l){ return { color: COLOR_PRIO_LEYENDA[l.prio], text: l.texto }; });
      // La leyenda es un bloque: si no cabe entera, pasa completa a la página siguiente
      // (antes se cortaba franja a franja y la última quedaba sola en otra página).
      doc.setFontSize(8); doc.setFont('helvetica','bold');
      const ncFilas = ncColors.map(({color, text}) => {
        const lines = doc.splitTextToSize(text, CW-4);
        return { color, lines, bh: Math.max(8, lines.length * 4.5 + 4) };

      const ncAltoTotal = ncFilas.reduce((s, f) => s + f.bh + 1, 0);

      ncFilas.forEach(({color, lines, bh}, iFranja) => {
        const cmpF = CMP ? cmpBuscar(ncColors[iFranja].text) : null;
        if (cmpF) cmpF.pre.forEach(function(op){ y = cmpPintarEliminado(cmpCtx(doc, ref, fmtRev, fmtFechaStr, nPag, totPag), y, op); });

        if (cmpF && cmpF.op && (cmpF.op.t === 'movA' || cmpF.op.t === 'ins')) {
          doc.setDrawColor(...AZUL_CMP); doc.setLineWidth(0.9); doc.rect(ML, y, CW, bh);

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limpiar caché - ARP</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#1A1A1A;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;text-align:center}
    h1{font-size:20px;margin-bottom:8px}
    p{color:#aaa;font-size:14px;margin-bottom:32px;max-width:320px}
    button{background:#C8993A;color:white;border:none;padding:16px 32px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;width:100%;max-width:320px}
    #estado{margin-top:20px;font-size:14px;color:#C8993A;min-height:20px}
  </style>
</head>
<body>
  <h1>Limpiar caché</h1>
  <p>Elimina la versión almacenada de la app para cargar la última actualización.</p>
  <button onclick="limpiar()">Limpiar y reiniciar</button>
  <div id="estado"></div>
  <script>
    async function limpiar() {
      var el = document.getElementById('estado');
      el.textContent = 'Limpiando…';
      try {
        // Desregistrar todos los service workers
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var r of regs) await r.unregister();
        }
        // Borrar todas las cachés
        var keys = await caches.keys();
        for (var k of keys) await caches.delete(k);
        el.textContent = 'Listo. Redirigiendo…';
        setTimeout(function() { location.href = 'index.html'; }, 800);
      } catch(e) {
        el.textContent = 'Error: ' + e.message;
      }
    }
  </script>
</body>
</html>

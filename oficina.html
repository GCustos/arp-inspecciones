<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#C8993A">
  <title>Oficina - ARP</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .content{padding:16px;max-width:1400px;margin:0 auto}
    .stats-bar{display:flex;gap:24px;background:white;border:1px solid var(--border);border-radius:12px;padding:14px 20px;margin-bottom:18px;flex-wrap:wrap}
    .stat{display:flex;flex-direction:column;gap:2px}
    .stat-val{font-size:22px;font-weight:700;color:var(--dark);line-height:1}
    .stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
    .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:12px}
    table{border-collapse:collapse;width:100%;min-width:1100px;font-size:12px}
    thead th{background:var(--dark);color:white;padding:9px 10px;text-align:left;white-space:nowrap;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;z-index:10}
    thead th:first-child{border-radius:11px 0 0 0}
    thead th:last-child{border-radius:0 11px 0 0}
    thead th.sep{border-left:2px solid var(--gold)}
    tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:#FFF8F0}
    tbody tr.finalizado td{color:var(--muted)}
    td{padding:8px 10px;vertical-align:middle;white-space:nowrap}
    td.sep{border-left:2px solid var(--gold)}
    .tag-fav{color:var(--green);font-weight:700;font-size:10px;background:#E8F5E9;padding:2px 6px;border-radius:4px}
    .tag-des{color:var(--red);font-weight:700;font-size:10px;background:#FFEBEE;padding:2px 6px;border-radius:4px}
    .chk{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;font-size:12px}
    .chk.yes{color:var(--green)}
    .chk.no{color:var(--border)}
    .vacio{color:var(--border);font-style:italic}
    .edit-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;color:var(--muted);transition:all .15s;white-space:nowrap}
    .edit-btn:hover{border-color:var(--gold);color:var(--gold)}
    td-nombre{max-width:160px;overflow:hidden;text-overflow:ellipsis}
    /* Modal */
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center}
    .overlay.open{display:flex}
    @media(min-width:520px){.overlay{align-items:center}}
    .modal{background:white;border-radius:16px 16px 0 0;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding:20px 16px 32px}
    @media(min-width:520px){.modal{border-radius:16px;padding:24px}}
    .modal-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:10px}
    .modal-titulo{font-size:15px;font-weight:700;color:var(--dark)}
    .modal-sub{font-size:11px;color:var(--muted);margin-top:3px}
    .btn-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;padding:0;line-height:1;flex-shrink:0}
    .form-row{margin-bottom:14px}
    .form-row label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
    .form-row input,.form-row textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;color:var(--text);background:white;outline:none;transition:border-color .15s}
    .form-row input:focus,.form-row textarea:focus{border-color:var(--gold)}
    .form-row textarea{resize:vertical;min-height:70px}
    .form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .chk-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border)}
    .chk-row label{font-size:14px;color:var(--dark);flex:1;cursor:pointer}
    .chk-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);cursor:pointer;flex-shrink:0}
    .modal-footer{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
    .btn-guardar{flex:1;padding:12px;background:var(--gold);color:white;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
    .btn-guardar:disabled{opacity:.5;cursor:not-allowed}
    .btn-cancel{padding:12px 20px;background:white;color:var(--muted);border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;cursor:pointer}
    .btn-docs{display:block;margin-top:16px;padding:11px;text-align:center;border:1.5px solid var(--gold);border-radius:10px;color:var(--gold);font-size:13px;font-weight:700;text-decoration:none}
    .btn-docs:hover{background:#FFF8F0}
    /* Revisiones */
    .rev-toggle{background:none;border:none;color:var(--gold);cursor:pointer;font-size:12px;padding:0 4px 0 0}
    tbody tr.rev-sub{cursor:default;background:var(--surf)}
    tbody tr.rev-sub:hover{background:var(--surf)}
    .rev-tbl{min-width:0;width:auto;font-size:11px}
    .rev-tbl td{padding:4px 14px 4px 0;border:none}
    .rev-sindato{color:var(--orange);font-style:italic}
    .rev-curso{color:var(--blue);font-size:10px;font-weight:700}
    .rev-cuenta{color:var(--green);font-size:10px;font-weight:700}
    .rev-nocuenta{color:var(--muted);font-size:10px}
    /* Cobros */
    .cobro-pend{color:var(--orange);font-weight:700}
    .cobro-ok{color:var(--green);font-weight:700}
    .cobro-sd{color:var(--green);font-size:10px}
    .pg-sec{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
    .pg-titulo{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
    .pg-resumen{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;background:var(--surf);border-radius:8px;padding:8px 10px;margin-bottom:10px}
    .pg-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--border);font-size:12px}
    .pg-item .pg-main{flex:1;min-width:0}
    .pg-item .pg-imp{font-weight:700;white-space:nowrap}
    .pg-item .pg-meta{font-size:10px;color:var(--muted);margin-top:2px}
    .pg-item.anulado .pg-imp,.pg-item.anulado .pg-linea{text-decoration:line-through;color:var(--muted)}
    .pg-item .pg-anul{font-size:10px;color:var(--red);margin-top:2px}
    .pg-nuevo{background:var(--surf);border-radius:8px;padding:10px;margin-top:10px}
    .pg-nuevo .form-row{margin-bottom:8px}
    .pg-nuevo select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;background:white}
    .btn-pago{width:100%;padding:10px;background:white;color:var(--gold);border:1.5px solid var(--gold);border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
    .btn-pago:disabled{opacity:.5;cursor:not-allowed}
  </style>
</head>
<body>

<div class="app-header">
  <button class="btn-back" onclick="history.back()">&#8592;</button>
  <div class="hdr-mark" onclick="location.href='index.html'" style="cursor:pointer" title="Inicio">ARP</div>
  <div class="hdr-title">Oficina</div>
</div>

<div class="content" id="content">
  <div class="spinner"></div>
</div>

<div class="overlay" id="overlay" onclick="cerrarModal(event)">
  <div class="modal" id="modal">
    <div class="modal-hdr">
      <div>
        <div class="modal-titulo" id="modalTitulo"></div>
        <div class="modal-sub" id="modalSub"></div>
      </div>
      <button class="btn-close" onclick="cerrarModal()">&#10005;</button>
    </div>
    <div id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-guardar" id="btnGuardar" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="utils.js?v=2"></script>
<script>
  if (!firebase.apps.length) {
    firebase.initializeApp({
      apiKey:"AIzaSyDncKj2_RBJWgzzjOn2079x47pf_ycGFlc",
      authDomain:"arp-inspecciones.firebaseapp.com",
      projectId:"arp-inspecciones",
      storageBucket:"arp-inspecciones.firebasestorage.app",
      messagingSenderId:"35880168451",
      appId:"1:35880168451:web:090e3c250b4416ed0b3236"
    });
  }
  var auth = firebase.auth();
  var db   = firebase.firestore();

  var inspData    = [];
  var usuariosMap = {}; // email → iniciales
  var editandoId  = null;
  var expandidos  = {}; // id → true si se ven sus revisiones
  var filtroAnio  = null; // null = todos
  var miEmail     = '';

  initAuth({
    roles: ['admin', 'director', 'proyecto', 'oficina'],
    onDenied: 'message',
    onReady: function(user, ud) { miEmail = user.email; cargar(); }
  });

  // ── COBROS ──
  // seguimientoAdmin.pagos[] = {id, fecha, importe, forma, referencia, nota, registradoPor,
  // registradoEn, anulado?:{por,en,motivo}}. Un pago nunca se edita ni se borra: si está mal
  // se anula con motivo y sigue visible (trazabilidad de dónde sale cada cifra).
  // facturaCobrada se deriva de los pagos (pendiente = 0). Expedientes marcados como
  // cobrados antes de existir los pagos se muestran como "cobrada (sin detalle)".
  function num(v) {
    if (v === null || v === undefined || v === '') return null;
    var n = typeof v === 'number' ? v : parseFloat(v);
    return isNaN(n) ? null : n;
  }

  function fmtEur(n) {
    return n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function estadoCobro(sa) {
    sa = sa || {};
    var activos = (sa.pagos || []).filter(function(p){ return !p.anulado; });
    var cobrado = activos.reduce(function(s, p){ return s + (num(p.importe) || 0); }, 0);
    var base = num(sa.importeFacturado);
    if (base === null) base = num(sa.ofertaTotal);
    var e = { tienePagos: activos.length > 0, cobrado: cobrado, base: base, pendiente: null, cobrada: false, sinDetalle: false };
    if (base !== null) e.pendiente = Math.round((base - cobrado) * 100) / 100;
    if (e.tienePagos) e.cobrada = e.pendiente !== null && e.pendiente <= 0;
    else if (sa.facturaCobrada) { e.cobrada = true; e.sinDetalle = true; }
    return e;
  }

  // Todas las escrituras de seguimientoAdmin pasan por una transacción que relee el
  // documento: si dos personas apuntan pagos a la vez, ninguno pisa al otro.
  function actualizarSA(id, mutar) {
    var ref = db.collection('inspecciones').doc(id);
    var saFinal;
    return db.runTransaction(function(tx) {
      return tx.get(ref).then(function(snap) {
        var sa = JSON.parse(JSON.stringify((snap.data() || {}).seguimientoAdmin || {}));
        if (!sa.pagos) sa.pagos = [];
        mutar(sa);
        // Con algún pago apuntado (aunque esté anulado) manda el registro de pagos.
        var e = estadoCobro(sa);
        if (sa.pagos.length) sa.facturaCobrada = e.tienePagos && e.cobrada;
        saFinal = sa;
        tx.update(ref, { seguimientoAdmin: sa });
      });
    }).then(function() {
      var insp = inspData.find(function(i){ return i.id === id; });
      if (insp) insp.seguimientoAdmin = saFinal;
      return saFinal;
    });
  }

  function codigoInsp(insp) {
    return insp.codigoInstalacion || (insp.nRegistro || '').split('/')[0] || '';
  }

  function cargar() {
    Promise.all([
      db.collection('usuarios').get(),
      db.collection('inspecciones').where('estado', '==', 'completada').get(),
      // Una Rev.N abierta tiene ya una revisión anterior cerrada (emitida, facturable)
      db.collection('inspecciones').where('estado', '==', 'en_curso').get()
    ]).then(function(results) {
      results[0].forEach(function(d) {
        var data = d.data();
        usuariosMap[d.id] = data.nombreCorto || computeIni(data.nombre || d.id);
      });
      inspData = [];
      results[1].forEach(function(d) {
        inspData.push(Object.assign({ id: d.id }, d.data()));
      });
      results[2].forEach(function(d) {
        var data = d.data();
        if ((data.historialRevisiones || []).length) inspData.push(Object.assign({ id: d.id }, data));
      });
      inspData.sort(function(a, b) {
        var fa = a.fechaInspeccion || '';
        var fb = b.fechaInspeccion || '';
        return fb > fa ? 1 : fb < fa ? -1 : 0;
      });
      render();
    }).catch(function(e) {
      document.getElementById('content').innerHTML = '<div class="empty-state">Error: ' + escHtml(e.message) + '</div>';
    });
  }

  function computeIni(s) { return computeIniciales(s); } // delega en utils.js

  function certVisado(insp) {
    if (insp.resultado !== 'FAVORABLE') return null;
    var fecha = insp.fechaInspeccion;
    // Rev.1+: usar la fecha de la última sesión si hay más de una
    if (insp.sesiones && insp.sesiones.length > 1) {
      var last = insp.sesiones[insp.sesiones.length - 1];
      if (last && last.fecha) fecha = last.fecha;
    }
    if (!fecha) return null;
    var d = new Date(fecha + 'T12:00:00');
    d.setFullYear(d.getFullYear() + 1);
    return d.toISOString().slice(0, 10);
  }

  function expediente(insp) {
    var f = insp.fechaInspeccion || '';
    return f.length >= 10 ? f.slice(2,4) + f.slice(5,7) + f.slice(8,10) : f;
  }

  window.setAnio = function(anio) { filtroAnio = anio; render(); };

  function render() {
    // Year filter buttons
    var anios = [];
    inspData.forEach(function(i) {
      var y = (i.fechaInspeccion || '').slice(0, 4);
      if (y && anios.indexOf(y) === -1) anios.push(y);
    });
    anios.sort().reverse();

    var filtros = '<div class="toolbar" style="margin-bottom:16px">' +
      '<button class="filtro-btn' + (filtroAnio === null ? ' active' : '') + '" onclick="setAnio(null)">Todos</button>';
    anios.forEach(function(y) {
      filtros += '<button class="filtro-btn' + (filtroAnio === y ? ' active' : '') + '" onclick="setAnio(\'' + y + '\')">' + y + '</button>';
    });
    filtros += '</div>';

    // Apply filter
    var lista = filtroAnio
      ? inspData.filter(function(i){ return (i.fechaInspeccion || '').slice(0,4) === filtroAnio; })
      : inspData;

    var total      = lista.filter(function(i){ return i.estado === 'completada'; }).length;
    var pendCobro  = lista.filter(function(i){ return !estadoCobro(i.seguimientoAdmin).cobrada; }).length;
    var cerradas   = lista.filter(function(i){ return i.seguimientoAdmin && i.seguimientoAdmin.finalizado; }).length;

    var html = filtros +
      '<div class="stats-bar">' +
        '<div class="stat"><div class="stat-val">' + total + '</div><div class="stat-lbl">Completadas</div></div>' +
        '<div class="stat"><div class="stat-val" style="color:var(--orange)">' + pendCobro + '</div><div class="stat-lbl">Pdte. cobro</div></div>' +
        '<div class="stat"><div class="stat-val" style="color:var(--green)">' + cerradas + '</div><div class="stat-lbl">Cerradas</div></div>' +
      '</div>' +
      '<div class="tbl-wrap"><table>' +
      '<thead><tr>' +
        '<th>C&#243;d.</th><th>Expediente</th><th>Fecha</th><th>Insp.</th>' +
        '<th>Instalaci&#243;n</th><th>Tipo</th><th>N&#176; Reg.</th>' +
        '<th>Resultado</th><th>Cert./Visado</th>' +
        '<th class="sep">Oferta Ref</th><th>Total &#8364;</th>' +
        '<th>N&#176; Fra.</th><th>Mandada</th><th>Cobrado / Pdte.</th>' +
        '<th>OK</th><th>Obs</th><th></th>' +
      '</tr></thead><tbody>';

    if (!lista.length) {
      html += '<tr><td colspan="17" style="text-align:center;color:var(--muted);padding:30px 20px">No hay inspecciones completadas' + (filtroAnio ? ' en ' + filtroAnio : '') + '.</td></tr>';
    } else {
      lista.forEach(function(i) {
        var sa  = i.seguimientoAdmin || {};
        var res = i.resultado || '';
        var cert = certVisado(i);
        var revs = revisionesInspeccion(i);
        var ini = revs.map(iniRevision).join(' → ');
        var abierto = !!expandidos[i.id];
        var nReg = i.nRegistro || '';
        // Display only up to Rev. part for width
        var nRegDisplay = nReg.length > 20 ? nReg.slice(0, 20) + '…' : nReg;
        var nombreDisplay = (i.nombreInstalacion || '').length > 22 ? (i.nombreInstalacion||'').slice(0,22) + '…' : (i.nombreInstalacion || '');

        html += '<tr class="' + (sa.finalizado ? 'finalizado' : '') + '" onclick="abrirEditar(\'' + escHtml(i.id) + '\')">' +
          '<td style="font-family:monospace;font-size:12px;font-weight:700">' + escHtml(codigoInsp(i)) + '</td>' +
          '<td style="font-family:monospace;font-size:11px;color:var(--muted)">' + escHtml(expediente(i)) + '</td>' +
          '<td style="font-size:11px">' + escHtml(i.fechaInspeccion || '') + '</td>' +
          '<td style="font-weight:700;font-size:12px">' +
            (revs.length > 1 ? '<button class="rev-toggle" title="Ver revisiones" onclick="event.stopPropagation();toggleRevs(\'' + escHtml(i.id) + '\')">' + (abierto ? '&#9662;' : '&#9656;') + '</button>' : '') +
            escHtml(ini) + '</td>' +
          '<td style="max-width:160px;overflow:hidden;text-overflow:ellipsis" title="' + escHtml(i.nombreInstalacion || '') + '">' + escHtml(nombreDisplay) + '</td>' +
          '<td><span class="badge-alcance badge-' + (i.tipoAlcance||'').toLowerCase() + '">' + escHtml(i.tipoAlcance || '') + '</span></td>' +
          '<td style="font-family:monospace;font-size:10px" title="' + escHtml(nReg) + '">' + escHtml(nRegDisplay) +
            (i.estado !== 'completada' ? ' <span class="rev-curso">en curso</span>' : '') + '</td>' +
          '<td>' + (res === 'FAVORABLE' ? '<span class="tag-fav">FAV</span>' : res === 'DESFAVORABLE' ? '<span class="tag-des">DES</span>' : '<span style="font-size:10px;color:var(--muted)">' + escHtml(res) + '</span>') + '</td>' +
          '<td style="font-size:11px;color:var(--muted)">' + (cert ? escHtml(cert) : '—') + '</td>' +
          '<td class="sep"><span style="font-family:monospace;font-size:11px">' + (sa.ofertaRef ? escHtml(sa.ofertaRef) : '<span class="vacio">—</span>') + '</span></td>' +
          '<td style="font-size:12px">' + (sa.ofertaTotal != null && sa.ofertaTotal !== '' ? escHtml(String(sa.ofertaTotal)) + ' &#8364;' : '<span class="vacio">—</span>') + '</td>' +
          '<td style="font-family:monospace;font-size:11px">' + (sa.nFactura ? escHtml(sa.nFactura) : '<span class="vacio">—</span>') + '</td>' +
          '<td><span class="chk ' + (sa.facturaMandada ? 'yes' : 'no') + '">' + (sa.facturaMandada ? '&#10003;' : '&#8212;') + '</span></td>' +
          '<td style="font-size:11px">' + celdaCobro(sa) + '</td>' +
          '<td><span class="chk ' + (sa.finalizado ? 'yes' : 'no') + '">' + (sa.finalizado ? '&#10003;' : '&#8212;') + '</span></td>' +
          '<td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--muted)" title="' + escHtml(sa.obs || '') + '">' + escHtml(sa.obs || '') + '</td>' +
          '<td><button class="edit-btn" onclick="event.stopPropagation();abrirEditar(\'' + escHtml(i.id) + '\')">&#9998;</button></td>' +
        '</tr>';
        if (abierto) html += filaRevisiones(revs);
      });
    }

    html += '</tbody></table></div>';
    document.getElementById('content').innerHTML = html;
  }

  // ── REVISIONES ── (quién hizo cada una; la lógica está en revisionesInspeccion, utils.js)
  function iniDe(email, nombre) { return usuariosMap[email] || computeIni(nombre || ''); }

  function iniRevision(r) {
    if (r.sinDato) return '?';
    var s = iniDe(r.inspectorEmail, r.inspectorNombre);
    if (r.inspector2Email) {
      var s2 = iniDe(r.inspector2Email, r.inspector2Nombre);
      if (s2 && s2 !== '?') s += ' - ' + s2;
    }
    return s;
  }

  window.toggleRevs = function(id) { expandidos[id] = !expandidos[id]; render(); };

  function filaRevisiones(revs) {
    var MOTIVO = { revisita: 'Revisita en campo', correccion: 'Corrección documental' };
    var h = '<tr class="rev-sub"><td></td><td colspan="16"><table class="rev-tbl">';
    revs.forEach(function(r) {
      var quien = r.sinDato
        ? '<span class="rev-sindato">Sin dato de inspector (revisión anterior a 10/2026)</span>'
        : escHtml(r.inspectorNombre || r.inspectorEmail) + (r.inspector2Email ? ' + ' + escHtml(r.inspector2Nombre || r.inspector2Email) : '');
      var motivo = r.revision === 0 ? 'Inspección' : (MOTIVO[r.motivo] || '<span class="rev-sindato">Motivo sin dato</span>');
      var estado = !r.cerrada ? '<span class="rev-curso">en curso</span>'
        : r.cuenta ? '<span class="rev-cuenta">cuenta para formación</span>'
        : '<span class="rev-nocuenta">no cuenta</span>';
      h += '<tr>' +
        '<td style="font-family:monospace;font-weight:700">Rev.' + r.revision + '</td>' +
        '<td>' + escHtml(fmtFecha(r.fecha) || '—') + '</td>' +
        '<td>' + quien + '</td>' +
        '<td>' + motivo + '</td>' +
        '<td>' + (r.resultado === 'FAVORABLE' ? '<span class="tag-fav">FAV</span>' : r.resultado === 'DESFAVORABLE' ? '<span class="tag-des">DES</span>' : '') + '</td>' +
        '<td>' + estado + '</td>' +
      '</tr>';
    });
    return h + '</table></td></tr>';
  }

  function celdaCobro(sa) {
    var e = estadoCobro(sa);
    if (e.sinDetalle) return '<span class="cobro-sd" title="Marcada como cobrada antes de existir el registro de pagos">&#10003; sin detalle</span>';
    if (e.cobrada) return '<span class="cobro-ok">&#10003; ' + fmtEur(e.cobrado) + '</span>';
    if (!e.tienePagos && e.pendiente === null) return '<span class="vacio">&#8212;</span>';
    var cob = e.tienePagos ? fmtEur(e.cobrado) : '<span class="vacio">&#8212;</span>';
    var pend = e.pendiente !== null ? '<span class="cobro-pend">' + fmtEur(e.pendiente) + '</span>' : '<span class="vacio">&#8212;</span>';
    return cob + ' / ' + pend;
  }

  window.abrirEditar = function(id) {
    var insp = inspData.find(function(i){ return i.id === id; });
    if (!insp) return;
    editandoId = id;
    var sa = insp.seguimientoAdmin || {};
    document.getElementById('modalTitulo').textContent = insp.nombreInstalacion || id;
    document.getElementById('modalSub').textContent =
      (insp.fechaInspeccion || '') + (insp.resultado ? ' · ' + insp.resultado : '') +
      (insp.nRegistro ? ' · ' + insp.nRegistro : '');
    document.getElementById('modalBody').innerHTML =
      '<div class="form-2col">' +
        '<div class="form-row"><label>Oferta Ref</label><input id="f_ofertaRef" type="text" value="' + escHtml(sa.ofertaRef || '') + '" placeholder="260109/JM/0/Rev.0"></div>' +
        '<div class="form-row"><label>Total &#8364;</label><input id="f_ofertaTotal" type="number" step="0.01" min="0" value="' + (sa.ofertaTotal != null && sa.ofertaTotal !== '' ? escHtml(String(sa.ofertaTotal)) : '') + '" placeholder="0.00"></div>' +
      '</div>' +
      '<div class="form-2col">' +
        '<div class="form-row"><label>N&#176; Factura</label><input id="f_nFactura" type="text" value="' + escHtml(sa.nFactura || '') + '" placeholder="FV-2026-001"></div>' +
        '<div class="form-row"><label>Importe facturado &#8364;</label><input id="f_importeFacturado" type="number" step="0.01" min="0" value="' + (num(sa.importeFacturado) !== null ? escHtml(String(sa.importeFacturado)) : '') + '" placeholder="' + (num(sa.ofertaTotal) !== null ? 'Igual que oferta: ' + escHtml(String(sa.ofertaTotal)) : '0.00') + '"></div>' +
      '</div>' +
      '<div class="chk-row"><label for="f_facturaMandada">Factura mandada</label><input type="checkbox" id="f_facturaMandada"' + (sa.facturaMandada ? ' checked' : '') + '></div>' +
      '<div class="chk-row"><label for="f_finalizado">Expediente finalizado</label><input type="checkbox" id="f_finalizado"' + (sa.finalizado ? ' checked' : '') + '></div>' +
      '<div class="form-row" style="margin-top:12px"><label>Observaciones</label><textarea id="f_obs" placeholder="Notas internas...">' + escHtml(sa.obs || '') + '</textarea></div>' +
      '<div id="pagosBox" class="pg-sec"></div>' +
      '<a class="btn-docs" href="resultado.html?id=' + encodeURIComponent(id) + '">Ver / descargar documentos (Informe, Registro, Certificado) &#8594;</a>';
    renderPagos(sa);
    document.getElementById('overlay').classList.add('open');
    document.getElementById('modal').scrollTop = 0;
    document.getElementById('btnGuardar').disabled = false;
    document.getElementById('btnGuardar').textContent = 'Guardar';
  };

  window.cerrarModal = function(evt) {
    if (evt && evt.target !== document.getElementById('overlay')) return;
    document.getElementById('overlay').classList.remove('open');
    editandoId = null;
  };

  // Sección de pagos dentro del modal. Se repinta sola tras añadir/anular un pago, sin tocar
  // los campos del formulario de arriba (que pueden tener cambios aún sin guardar).
  function renderPagos(sa) {
    var box = document.getElementById('pagosBox');
    if (!box) return;
    var e = estadoCobro(sa);
    var pagos = (sa.pagos || []).slice().sort(function(a, b){ return (a.fecha || '') < (b.fecha || '') ? -1 : 1; });
    var html = '<div class="pg-titulo">Pagos</div>' +
      '<div class="pg-resumen">' +
        '<span>Facturado: <b>' + (e.base !== null ? fmtEur(e.base) + ' &#8364;' : '&#8212;') + '</b></span>' +
        '<span>Cobrado: <b class="cobro-ok">' + fmtEur(e.cobrado) + ' &#8364;</b></span>' +
        '<span>Pendiente: <b class="' + (e.pendiente !== null && e.pendiente > 0 ? 'cobro-pend' : 'cobro-ok') + '">' +
          (e.pendiente !== null ? fmtEur(Math.max(e.pendiente, 0)) + ' &#8364;' : '&#8212;') + '</b></span>' +
        (e.pendiente !== null && e.pendiente < 0 ? '<span class="cobro-pend">Cobrado de m&#225;s: ' + fmtEur(-e.pendiente) + ' &#8364;</span>' : '') +
      '</div>';
    if (e.sinDetalle) {
      html += '<div class="chk-row" style="border-top:none;padding-top:0"><label for="f_cobradaSD" style="font-size:12px;color:var(--muted)">Cobrada sin detalle (marcada antes de existir el registro de pagos)</label><input type="checkbox" id="f_cobradaSD" checked></div>';
    }
    if (!pagos.length) {
      html += '<div style="font-size:12px;color:var(--muted);padding:4px 0 8px">Sin pagos registrados.</div>';
    }
    pagos.forEach(function(p) {
      var linea = [p.forma, p.referencia ? 'Ref. ' + p.referencia : '', p.nota].filter(Boolean).map(escHtml).join(' &middot; ');
      html += '<div class="pg-item' + (p.anulado ? ' anulado' : '') + '">' +
        '<div class="pg-main">' +
          '<div><span class="pg-imp">' + fmtEur(num(p.importe) || 0) + ' &#8364;</span> &middot; ' + escHtml(fmtFecha(p.fecha || '')) + '</div>' +
          (linea ? '<div class="pg-linea">' + linea + '</div>' : '') +
          '<div class="pg-meta">Apuntado por ' + escHtml(p.registradoPor || '?') + (p.registradoEn ? ' el ' + escHtml(fmtFecha(p.registradoEn.slice(0, 10))) : '') + '</div>' +
          (p.anulado ? '<div class="pg-anul">Anulado por ' + escHtml(p.anulado.por || '?') + ' el ' + escHtml(fmtFecha((p.anulado.en || '').slice(0, 10))) + ': ' + escHtml(p.anulado.motivo || '') + '</div>' : '') +
        '</div>' +
        (p.anulado ? '' : '<button class="edit-btn" onclick="anularPago(\'' + escHtml(p.id) + '\')">Anular</button>') +
      '</div>';
    });
    var hoy = new Date().toISOString().slice(0, 10);
    html += '<div class="pg-nuevo">' +
      '<div class="form-2col">' +
        '<div class="form-row"><label>Fecha</label><input id="p_fecha" type="date" value="' + hoy + '"></div>' +
        '<div class="form-row"><label>Importe &#8364;</label><input id="p_importe" type="number" step="0.01" min="0" placeholder="' + (e.pendiente !== null && e.pendiente > 0 ? escHtml(String(e.pendiente)) : '0.00') + '"></div>' +
      '</div>' +
      '<div class="form-2col">' +
        '<div class="form-row"><label>Forma de pago</label><select id="p_forma">' +
          ['Transferencia', 'Tarjeta', 'Domiciliación', 'Efectivo', 'Otro'].map(function(f){ return '<option>' + escHtml(f) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="form-row"><label>Referencia</label><input id="p_ref" type="text" placeholder="N&#176; transferencia, recibo..."></div>' +
      '</div>' +
      '<div class="form-row"><label>Nota</label><input id="p_nota" type="text" placeholder="Opcional (ej. 2&#186; plazo)"></div>' +
      '<button class="btn-pago" id="btnPago" onclick="agregarPago()">+ A&#241;adir pago</button>' +
    '</div>';
    box.innerHTML = html;
  }

  window.agregarPago = function() {
    if (!editandoId) return;
    var importe = num(document.getElementById('p_importe').value.trim());
    var fecha = document.getElementById('p_fecha').value;
    if (importe === null || importe <= 0) { alert('Indica el importe del pago.'); return; }
    if (!fecha) { alert('Indica la fecha del pago.'); return; }
    var pago = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      fecha: fecha,
      importe: Math.round(importe * 100) / 100,
      forma: document.getElementById('p_forma').value,
      referencia: document.getElementById('p_ref').value.trim(),
      nota: document.getElementById('p_nota').value.trim(),
      registradoPor: miEmail,
      registradoEn: new Date().toISOString()
    };
    var btn = document.getElementById('btnPago');
    btn.disabled = true; btn.textContent = 'Guardando…';
    var id = editandoId;
    actualizarSA(id, function(sa) { sa.pagos.push(pago); })
      .then(function(sa) {
        if (editandoId === id) renderPagos(sa);
        showToast('Pago registrado');
        render();
      })
      .catch(function(e) {
        btn.disabled = false; btn.textContent = '+ Añadir pago';
        alert('Error: ' + e.message);
      });
  };

  window.anularPago = function(pagoId) {
    if (!editandoId) return;
    var motivo = prompt('Motivo de la anulación (queda registrado y visible):');
    if (motivo === null) return;
    motivo = motivo.trim();
    if (!motivo) { alert('El motivo es obligatorio.'); return; }
    var id = editandoId;
    actualizarSA(id, function(sa) {
      var p = sa.pagos.find(function(x){ return x.id === pagoId; });
      if (p && !p.anulado) p.anulado = { por: miEmail, en: new Date().toISOString(), motivo: motivo };
    }).then(function(sa) {
      if (editandoId === id) renderPagos(sa);
      showToast('Pago anulado');
      render();
    }).catch(function(e) { alert('Error: ' + e.message); });
  };

  window.guardar = function() {
    if (!editandoId) return;
    var btn = document.getElementById('btnGuardar');
    btn.disabled = true; btn.textContent = 'Guardando…';
    var totalRaw = document.getElementById('f_ofertaTotal').value.trim();
    var factRaw  = document.getElementById('f_importeFacturado').value.trim();
    var chkSD    = document.getElementById('f_cobradaSD');
    var campos = {
      ofertaRef:        document.getElementById('f_ofertaRef').value.trim(),
      ofertaTotal:      totalRaw !== '' ? parseFloat(totalRaw) : null,
      nFactura:         document.getElementById('f_nFactura').value.trim(),
      importeFacturado: factRaw !== '' ? parseFloat(factRaw) : null,
      facturaMandada:   document.getElementById('f_facturaMandada').checked,
      finalizado:       document.getElementById('f_finalizado').checked,
      obs:              document.getElementById('f_obs').value.trim()
    };
    actualizarSA(editandoId, function(sa) {
      Object.keys(campos).forEach(function(k){ sa[k] = campos[k]; });
      // Sin pagos, "cobrada" solo puede venir de la marca antigua: se puede quitar, no poner.
      if (!sa.pagos.some(function(p){ return !p.anulado; })) sa.facturaCobrada = !!(chkSD && chkSD.checked);
    })
      .then(function() {
        document.getElementById('overlay').classList.remove('open');
        editandoId = null;
        showToast('Guardado');
        render();
      })
      .catch(function(e) {
        btn.disabled = false; btn.textContent = 'Guardar';
        alert('Error: ' + e.message);
      });
  };
</script>
</body>
</html>

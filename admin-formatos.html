<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#C8993A">
  <title>Formatos de Inspección - ARP</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .tabs{display:flex;background:var(--dark);padding:0 16px}
    .tab{flex:1;padding:10px 0;font-size:12px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;text-align:center}
    .tab.active{color:var(--gold);border-bottom-color:var(--gold)}

    .sec-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 8px;display:flex;align-items:center;justify-content:space-between}
    .rev-badge{background:var(--gold);color:white;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
    .fecha-badge{font-size:11px;color:var(--muted);margin-top:2px}

    /* items del formato */
    .fmt-item{background:white;border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start}
    .fmt-item.sortable-ghost{opacity:.4}
    .drag-handle{color:var(--muted);font-size:16px;cursor:grab;padding:2px 0;flex-shrink:0;user-select:none}
    .fmt-body{flex:1;min-width:0}
    .fmt-ref{font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.05em}
    .fmt-sec{font-size:13px;font-weight:600;color:var(--dark);margin:1px 0}
    .fmt-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
    .fmt-actions{display:flex;gap:6px;flex-shrink:0}
    .btn-icon{background:none;border:1.5px solid var(--border);border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
    .btn-icon:hover{border-color:var(--gold);color:var(--gold)}
    .btn-icon.danger:hover{border-color:var(--red);color:var(--red)}

    /* columnas */
    .col-item{background:white;border:1px solid var(--border);border-radius:10px;padding:10px 13px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
    .col-id{font-family:monospace;font-size:12px;font-weight:700;color:var(--dark);min-width:28px}
    .col-abbrev{font-size:12px;color:var(--muted);flex:1}
    .col-label{font-size:12px;color:var(--text);flex:2}

    /* botones */
    .btn-add{width:100%;padding:10px;border:2px dashed var(--border);border-radius:10px;background:none;font-family:inherit;font-size:13px;color:var(--muted);cursor:pointer;margin-top:4px}
    .btn-add:hover{border-color:var(--gold);color:var(--gold)}
    .btn-primary{padding:11px 20px;background:var(--gold);color:white;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .btn-primary:hover{opacity:.9}
    .btn-publish{padding:11px 20px;background:var(--dark);color:white;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .btn-publish:hover{opacity:.85}
    .btn-secondary{padding:11px 20px;background:white;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;color:var(--text);cursor:pointer}
    .btn-secondary:hover{border-color:var(--gold)}
    .action-bar{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}

    /* historial */
    .hist-item{background:white;border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-bottom:8px}
    .hist-header{display:flex;align-items:center;gap:10px;cursor:pointer}
    .hist-rev{font-size:14px;font-weight:700;color:var(--dark)}
    .hist-meta{font-size:11px;color:var(--muted);flex:1}
    .hist-body{margin-top:10px;display:none}
    .hist-body.open{display:block}
    .btn-hist-pdf{padding:3px 8px;font-size:10px;font-weight:700;border:1.5px solid var(--border);border-radius:6px;background:white;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:inherit}
    .btn-hist-pdf:hover{border-color:var(--gold);color:var(--gold)}
    .hist-body .diff-item{font-size:11px;padding:3px 0;border-bottom:1px solid var(--border)}
    .diff-add{color:var(--green)}
    .diff-del{color:var(--red);text-decoration:line-through}
    .diff-mod{color:var(--orange)}

    /* modal edición */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center}
    .modal-overlay.open{display:flex}
    @media(min-width:520px){.modal-overlay{align-items:center;padding:20px}}
    .modal{background:white;border-radius:16px 16px 0 0;padding:22px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto}
    @media(min-width:520px){.modal{border-radius:16px}}
    .modal-title{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:16px}
    .field{margin-bottom:12px}
    .field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    .field input,.field textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:13px;color:var(--text);outline:none}
    .field input:focus,.field textarea:focus{border-color:var(--gold)}
    .field textarea{resize:vertical;min-height:80px}
    .modal-actions{display:flex;gap:8px;margin-top:16px}
    .btn-cancel{flex:1;padding:11px;border:1.5px solid var(--border);border-radius:9px;background:white;font-family:inherit;font-size:13px;font-weight:600;color:var(--text);cursor:pointer}
    .btn-save{flex:2;padding:11px;border:none;border-radius:9px;background:var(--gold);color:white;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}

    /* empty state borrador */
    .empty-draft{text-align:center;padding:48px 20px;color:var(--muted)}
    .empty-draft .ed-icon{font-size:36px;margin-bottom:12px}
    .empty-draft .ed-title{font-size:14px;font-weight:600;color:var(--dark);margin-bottom:6px}
    .empty-draft .ed-desc{font-size:12px;line-height:1.5;margin-bottom:20px}

    /* diff preview */
    .diff-preview{background:var(--surf);border-radius:10px;padding:12px;font-size:12px;margin:12px 0;max-height:200px;overflow-y:auto}
    .diff-preview p{margin:4px 0}
    .no-changes{color:var(--muted);font-style:italic}
  </style>
</head>
<body>

<div class="app-header">
  <button class="btn-back" onclick="location.href='admin.html'">&#8592;</button>
  <div class="hdr-mark">ARP</div>
  <div class="hdr-title" id="hdrTitle">Formatos</div>
</div>

<div id="alcTabs" style="display:flex;background:var(--surf);border-bottom:1px solid var(--border);padding:0 16px;gap:4px"></div>

<div class="tabs">
  <button class="tab active" id="tabActivo"   onclick="goTab('activo',this)">Activo</button>
  <button class="tab"        id="tabBorrador" onclick="goTab('borrador',this)">Borrador <span id="borradorDot" style="display:none;color:var(--orange)">●</span></button>
  <button class="tab"        id="tabHistorial" onclick="goTab('historial',this)">Historial</button>
</div>

<div class="content" id="content"><div class="spinner"></div></div>

<!-- MODAL EDITAR PREGUNTA -->
<div class="modal-overlay" id="modalPregunta">
  <div class="modal">
    <div class="modal-title" id="mpTitulo">Pregunta</div>
    <div class="field"><label>Referencia norma</label><input type="text" id="mpRef" placeholder="4.1"></div>
    <div class="field"><label>Sección</label><input type="text" id="mpSec" placeholder="Selección de Lugar y Entorno"></div>
    <div class="field"><label>Descripción</label><textarea id="mpDesc" rows="4" placeholder="Descripción detallada del criterio..."></textarea></div>
    <div class="field"><label>Texto de ayuda (icono "!" en la app, opcional)</label><textarea id="mpAyudaTexto" rows="3" placeholder="Explicación adicional para el inspector, opcional..."></textarea></div>
    <div class="field">
      <label>Foto de ayuda (opcional)</label>
      <img id="mpAyudaFotoPreview" style="max-width:100%;border-radius:6px;margin-bottom:6px;display:none">
      <input type="file" id="mpAyudaFotoInput" accept="image/*" onchange="subirFotoAyuda(this,'mp')" style="display:none">
      <button type="button" class="btn-cancel" style="width:100%" onclick="document.getElementById('mpAyudaFotoInput').click()">📷 Subir foto</button>
      <button type="button" class="btn-cancel" id="mpAyudaFotoQuitar" style="width:100%;display:none;color:var(--red);margin-top:4px" onclick="quitarFotoAyuda('mp')">Quitar foto</button>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal('modalPregunta')">Cancelar</button>
      <button class="btn-save" onclick="guardarPregunta()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL EDITAR COLUMNA -->
<div class="modal-overlay" id="modalColumna">
  <div class="modal">
    <div class="modal-title" id="mcTitulo">Columna</div>
    <div class="field"><label>Código (2-4 letras, no cambiar si hay inspecciones)</label><input type="text" id="mcId" placeholder="ie" maxlength="4" style="text-transform:lowercase"></div>
    <div class="field"><label>Abreviatura (para cabecera tabla)</label><input type="text" id="mcAbbrev" placeholder="Integ. est." maxlength="20"></div>
    <div class="field"><label>Nombre completo</label><input type="text" id="mcLabel" placeholder="Integridad estructural"></div>
    <div class="field"><label>Texto de ayuda (icono "!" en la app, opcional)</label><textarea id="mcAyudaTexto" rows="3" placeholder="Explicación adicional para el inspector, opcional..."></textarea></div>
    <div class="field">
      <label>Foto de ayuda (opcional)</label>
      <img id="mcAyudaFotoPreview" style="max-width:100%;border-radius:6px;margin-bottom:6px;display:none">
      <input type="file" id="mcAyudaFotoInput" accept="image/*" onchange="subirFotoAyuda(this,'mc')" style="display:none">
      <button type="button" class="btn-cancel" style="width:100%" onclick="document.getElementById('mcAyudaFotoInput').click()">📷 Subir foto</button>
      <button type="button" class="btn-cancel" id="mcAyudaFotoQuitar" style="width:100%;display:none;color:var(--red);margin-top:4px" onclick="quitarFotoAyuda('mc')">Quitar foto</button>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal('modalColumna')">Cancelar</button>
      <button class="btn-save" onclick="guardarColumna()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL PUBLICAR -->
<div class="modal-overlay" id="modalPublicar">
  <div class="modal">
    <div class="modal-title" id="mpubTitulo">Publicar formato</div>
    <div id="mpubResumen" style="font-size:12px;color:var(--muted);white-space:pre-wrap;background:var(--surf);padding:10px;border-radius:8px;margin-bottom:14px"></div>
    <div class="field">
      <label>Motivo del cambio <span style="color:var(--red)">*</span> (requerido para trazabilidad ENAC)</label>
      <textarea id="mpubMotivo" rows="3" placeholder="Ej: Actualización por cambio normativa UNE 2025. Comunicado a ENAC el 04/08/2026."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal('modalPublicar')">Cancelar</button>
      <button class="btn-save" onclick="confirmarPublicacion()">Publicar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="utils.js"></script>
<script>
  if (!firebase.apps.length) {
    firebase.initializeApp({
      apiKey:'AIzaSyDncKj2_RBJWgzzjOn2079x47pf_ycGFlc',
      authDomain:'arp-inspecciones.firebaseapp.com',
      projectId:'arp-inspecciones',
      storageBucket:'arp-inspecciones.firebasestorage.app',
      messagingSenderId:'35880168451',
      appId:'1:35880168451:web:090e3c250b4416ed0b3236'
    });
  }
  var auth = firebase.auth();
  var db   = firebase.firestore();
  var storage = firebase.storage();

  var formatoActivo   = null;
  var borrador        = null;
  var tabActual       = 'activo';
  var alcanceActual   = '';
  var alcancesConfig  = [];
  var empresaData     = {};
  var _historialDocs  = [];
  var editandoPreguntaIdx = null;
  var editandoColumnaIdx  = null;
  var _sortableChk   = null;
  var _sortableCols  = null;
  var currentUserEmail = '';

  function uid(){ return Math.random().toString(36).slice(2,8); }

  function renderAlcTabs() {
    var container = document.getElementById('alcTabs');
    if (!container) return;
    container.innerHTML = alcancesConfig.map(function(a) {
      var active = a.id === alcanceActual;
      return '<button id="alcTab_' + a.id + '" onclick="setAlcance(\'' + a.id + '\')" ' +
        'style="flex:1;padding:8px 4px;font-size:12px;font-weight:700;border:none;background:none;cursor:pointer;' +
        'border-bottom:2px solid ' + (active ? 'var(--gold)' : 'transparent') + ';' +
        'color:' + (active ? 'var(--gold)' : 'var(--muted)') + '">' +
        escHtml(a.label || a.id.toUpperCase()) + '</button>';
    }).join('');
  }

  function setAlcance(a) {
    alcanceActual = a;
    alcancesConfig.forEach(function(k) {
      var btn = document.getElementById('alcTab_' + k.id);
      if (!btn) return;
      btn.style.borderBottomColor = (k.id === a ? 'var(--gold)' : 'transparent');
      btn.style.color = (k.id === a ? 'var(--gold)' : 'var(--muted)');
    });
    var alc = alcancesConfig.find(function(k) { return k.id === a; });
    document.getElementById('hdrTitle').textContent = 'Formatos ' + ((alc && alc.label) || a.toUpperCase());
    formatoActivo = null; borrador = null;
    document.getElementById('borradorDot').style.display = 'none';
    goTab('activo', document.getElementById('tabActivo'));
    cargar();
  }

  initAuth({
    roles: ['admin','director'],
    onReady: function(user, ud) {
      currentUserEmail = user.email;
      db.collection('config').doc('empresa').get().then(function(snap) {
        var data = snap.exists ? snap.data() : {};
        empresaData = data;
        alcancesConfig = (data.alcances || []).filter(function(a) { return a.id; });
        if (!alcancesConfig.length) {
          document.getElementById('content').innerHTML =
            '<div class="empty-state">No hay alcances configurados.<br>' +
            '<a href="admin-empresa.html">Añade alcances en Empresa y Director</a></div>';
          return;
        }
        alcanceActual = alcancesConfig[0].id;
        renderAlcTabs();
        document.getElementById('hdrTitle').textContent = 'Formatos ' + ((alcancesConfig[0].label) || alcancesConfig[0].id.toUpperCase());
        cargar();
      }).catch(function() {
        document.getElementById('content').innerHTML =
          '<div class="empty-state">Error cargando alcances. Comprueba la conexión.</div>';
      });
    }
  });

  // ── CARGA ──
  function cargar() {
    var alc = alcanceActual;
    Promise.all([
      db.collection('config').doc(alc).get(),
      db.collection('config').doc(alc+'_borrador').get()
    ]).then(function(res) {
      var cfg = res[0].exists ? res[0].data() : {};
      formatoActivo = {
        // Los valores tras || son fallback histórico solo de PAA (rev/fecha ya conocidas
        // de antes de que existiera formatoRevision/formatoFecha en Firestore) — no aplica
        // a otros alcances, que simplemente parten de 0/'—' hasta tener su propia revisión.
        revision:         cfg.formatoRevision  || (alc==='paa' ? 9  : 0),
        fechaVigencia:    cfg.formatoFecha      || (alc==='paa' ? '26/02/2026' : '—'),
        registroRevision: cfg.registroRevision  || (alc==='paa' ? 7  : 0),
        registroFecha:    cfg.registroFecha     || (alc==='paa' ? '10/02/2026' : '—'),
        checklist:        cfg.checklist         || [],
        columnas:         cfg.columnas          || [],
        tiposJuego:       cfg.tiposJuego        || null
      };
      borrador = res[1].exists ? res[1].data() : null;
      document.getElementById('borradorDot').style.display = borrador ? 'inline' : 'none';
      renderTab();
    }).catch(function(e){
      document.getElementById('content').innerHTML = '<div class="empty-state">Error: '+escHtml(e.message)+'</div>';
    });
  }

  // ── TABS ──
  function goTab(tab, btn) {
    tabActual = tab;
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    if (btn) btn.classList.add('active');
    else document.getElementById('tab'+cap(tab)).classList.add('active');
    renderTab();
  }
  function cap(s){ return s[0].toUpperCase()+s.slice(1); }

  function renderTab() {
    if (tabActual==='activo')    renderActivo();
    else if (tabActual==='borrador') renderBorrador();
    else renderHistorial();
  }

  // ── TAB ACTIVO ──
  function renderActivo() {
    if (!formatoActivo) return;
    var f = formatoActivo;
    var html = '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:4px">'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<span style="font-size:11px;color:var(--muted);width:60px">Informe</span>'
      +'<span class="rev-badge">Rev '+f.revision+'</span>'
      +'<span class="fecha-badge">Vigente desde '+escHtml(f.fechaVigencia)+'</span>'
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<span style="font-size:11px;color:var(--muted);width:60px">Registro</span>'
      +'<span class="rev-badge" style="background:var(--dark)">Rev '+f.registroRevision+'</span>'
      +'<span class="fecha-badge">Vigente desde '+escHtml(f.registroFecha)+'</span>'
      +'</div>'
      +'</div>';

    html += '<div class="sec-label" style="margin-top:16px">Preguntas generales ('+f.checklist.length+')</div>';
    f.checklist.forEach(function(item,i){
      html += renderItemReadonly(i+1, item);
    });
    if (!f.checklist.length) html += '<div class="empty-state" style="padding:16px">Sin preguntas definidas.</div>';

    if (f.tiposJuego && f.tiposJuego.length) {
      // Alcances con columnas por tipo de juego (ej. SAE: Vía/Muro) — solo lectura por ahora,
      // no comparte código con el editor de columnas plano de abajo (ese es el de PAA/FER).
      f.tiposJuego.forEach(function(tipo){
        html += '<div class="sec-label">Columnas — '+escHtml(tipo.label)+' ('+(tipo.columnas||[]).length+')</div>';
        (tipo.columnas||[]).forEach(function(col){
          html += '<div class="col-item">'
            +'<span class="col-id">'+escHtml(col.id)+'</span>'
            +'<span class="col-abbrev">'+escHtml(col.abbrev)+'</span>'
            +'<span class="col-label">'+escHtml(col.label)+'</span>'
            +'</div>';
        });
      });
    } else {
      html += '<div class="sec-label">Columnas de inspección ('+f.columnas.length+')</div>';
      f.columnas.forEach(function(col){
        html += '<div class="col-item">'
          +'<span class="col-id">'+escHtml(col.id)+'</span>'
          +'<span class="col-abbrev">'+escHtml(col.abbrev)+'</span>'
          +'<span class="col-label">'+escHtml(col.label)+'</span>'
          +'</div>';
      });
      if (!f.columnas.length) html += '<div class="empty-state" style="padding:16px">Sin columnas definidas.</div>';
    }

    document.getElementById('content').innerHTML = html;
  }

  function renderItemReadonly(n, item) {
    return '<div class="fmt-item">'
      +'<div class="fmt-body">'
      +'<div class="fmt-ref">'+n+'. '+escHtml(item.ref)+' &middot; '+escHtml(item.sec)+'</div>'
      +'<div class="fmt-desc">'+escHtml(item.desc)+'</div>'
      +'</div></div>';
  }

  // ── TAB BORRADOR ──
  function renderBorrador() {
    if (!borrador) {
      document.getElementById('content').innerHTML =
        '<div class="empty-draft">'
        +'<div class="ed-icon">&#9998;</div>'
        +'<div class="ed-title">Sin borrador activo</div>'
        +'<div class="ed-desc">Crea un borrador basado en el formato activo (Rev '+formatoActivo.revision+').<br>Puedes editar durante varios días sin afectar las inspecciones en curso.</div>'
        +'<button class="btn-primary" onclick="crearBorrador()">Crear borrador</button>'
        +'</div>';
      return;
    }

    var b = borrador;
    var meta = b.fechaBorrador ? 'Borrador del '+escHtml(b.fechaBorrador) : 'Borrador en curso';
    var html = '<div class="fecha-badge" style="margin-bottom:16px">'+meta+(b.editadoPor?' &middot; '+escHtml(b.editadoPor):'')+' &#9998;</div>';

    // Preguntas
    html += '<div class="sec-label">Preguntas generales'
      +'<button class="btn-primary" style="font-size:11px;padding:4px 10px" onclick="nuevaPregunta()">+ Añadir</button>'
      +'</div>'
      +'<div id="listaPreguntas">';
    b.checklist.forEach(function(item,i){
      html += renderItemEditor(i, item);
    });
    if (!b.checklist.length) html += '<div class="empty-state" style="padding:12px">Sin preguntas. Pulsa + Añadir.</div>';
    html += '</div>';

    // Columnas — alcances con tiposJuego (ej. SAE: Vía/Muro) todavía no tienen editor propio
    // aquí, así que se muestran solo en lectura para no crear columnas planas huérfanas.
    if (b.tiposJuego && b.tiposJuego.length) {
      b.tiposJuego.forEach(function(tipo){
        html += '<div class="sec-label" style="margin-top:20px">Columnas — '+escHtml(tipo.label)+' ('+(tipo.columnas||[]).length+')</div>';
        (tipo.columnas||[]).forEach(function(col){
          html += '<div class="col-item">'
            +'<span class="col-id">'+escHtml(col.id)+'</span>'
            +'<span class="col-abbrev">'+escHtml(col.abbrev)+'</span>'
            +'<span class="col-label">'+escHtml(col.label)+'</span>'
            +'</div>';
        });
      });
      html += '<div class="empty-state" style="padding:8px 12px;font-size:11px">Edición de columnas por tipo de juego: aún no disponible desde aquí.</div>';
    } else {
      html += '<div class="sec-label" style="margin-top:20px">Columnas de inspección'
        +'<button class="btn-primary" style="font-size:11px;padding:4px 10px" onclick="nuevaColumna()">+ Añadir</button>'
        +'</div>'
        +'<div id="listaColumnas">';
      b.columnas.forEach(function(col,i){
        html += renderColEditor(i, col);
      });
      if (!b.columnas.length) html += '<div class="empty-state" style="padding:12px">Sin columnas.</div>';
      html += '</div>';
    }

    // Botones
    html += '<div class="action-bar">'
      +'<button class="btn-secondary" onclick="guardarBorrador(false)">Guardar borrador</button>'
      +'<button class="btn-publish" onclick="previsualizarPublicacion()">&#9654; Publicar como Rev '+(formatoActivo.revision+1)+'</button>'
      +'</div>'
      +'<div style="margin-top:8px">'
      +'<button style="background:none;border:none;color:var(--red);font-size:12px;cursor:pointer" onclick="descartarBorrador()">Descartar borrador</button>'
      +'</div>';

    document.getElementById('content').innerHTML = html;
    initSortablesBorrador();
  }

  function initSortablesBorrador() {
    var elChk = document.getElementById('listaPreguntas');
    var elCols = document.getElementById('listaColumnas');
    if (_sortableChk) _sortableChk.destroy();
    if (_sortableCols) _sortableCols.destroy();
    if (elChk) {
      _sortableChk = new Sortable(elChk, {
        handle:'.drag-handle', animation:150, ghostClass:'sortable-ghost',
        onEnd: function(evt) {
          var moved = borrador.checklist.splice(evt.oldIndex, 1)[0];
          borrador.checklist.splice(evt.newIndex, 0, moved);
        }
      });
    }
    // elCols no existe cuando el alcance usa tiposJuego (columnas de solo lectura, sin editor aún)
    if (elCols) {
      _sortableCols = new Sortable(elCols, {
        handle:'.drag-handle', animation:150, ghostClass:'sortable-ghost',
        onEnd: function(evt) {
          var moved = borrador.columnas.splice(evt.oldIndex, 1)[0];
          borrador.columnas.splice(evt.newIndex, 0, moved);
        }
      });
    }
  }

  // ── AYUDA (icono "!") — foto+texto opcionales, compartido por pregunta y columna ──
  // _ayudaFotoTemp[prefix]: null = sin cambios, '' = foto quitada, url = foto nueva subida.
  var _ayudaFotoTemp = { mp: null, mc: null };
  function _resetAyudaUI(prefix, ayuda) {
    _ayudaFotoTemp[prefix] = null;
    document.getElementById(prefix+'AyudaTexto').value = (ayuda && ayuda.texto) || '';
    var img = document.getElementById(prefix+'AyudaFotoPreview');
    var btnQuitar = document.getElementById(prefix+'AyudaFotoQuitar');
    if (ayuda && ayuda.foto) { img.src = ayuda.foto; img.style.display = 'block'; btnQuitar.style.display = 'block'; }
    else { img.style.display = 'none'; btnQuitar.style.display = 'none'; }
    document.getElementById(prefix+'AyudaFotoInput').value = '';
  }
  window.subirFotoAyuda = function(input, prefix) {
    var f = input.files[0];
    if (!f) return;
    var path = 'config/'+alcanceActual+'/ayuda/'+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'');
    storage.ref(path).put(f).then(function(snap){ return snap.ref.getDownloadURL(); })
      .then(function(url){
        _ayudaFotoTemp[prefix] = url;
        var img = document.getElementById(prefix+'AyudaFotoPreview');
        img.src = url; img.style.display = 'block';
        document.getElementById(prefix+'AyudaFotoQuitar').style.display = 'block';
      })
      .catch(function(e){ alert('Error subiendo foto: '+e.message); });
  };
  window.quitarFotoAyuda = function(prefix) {
    _ayudaFotoTemp[prefix] = '';
    document.getElementById(prefix+'AyudaFotoPreview').style.display = 'none';
    document.getElementById(prefix+'AyudaFotoQuitar').style.display = 'none';
    document.getElementById(prefix+'AyudaFotoInput').value = '';
  };
  // Construye el objeto ayuda final a partir del texto+foto del modal y lo ya guardado.
  function _buildAyuda(prefix, ayudaPrevia) {
    var texto = document.getElementById(prefix+'AyudaTexto').value.trim();
    var fotoPrevia = (ayudaPrevia && ayudaPrevia.foto) || '';
    var foto = _ayudaFotoTemp[prefix] === null ? fotoPrevia : _ayudaFotoTemp[prefix];
    if (!texto && !foto) return null;
    return { texto: texto, foto: foto || null };
  }

    } else {

      if (ayuda) actualizada.ayuda = ayuda; else delete actualizada.ayuda;
      borrador.checklist[editandoPreguntaIdx] = actualizada;

    cerrarModal('modalPregunta');

  // ── PUBLICACIÓN ──
  function calcularDiff(anterior, nuevo, keyField) {
    var antMap = {}, newMap = {};
    anterior.forEach(function(i){ antMap[i[keyField]] = i; });
    nuevo.forEach(function(i){ newMap[i[keyField]] = i; });
    var anadidos   = nuevo.filter(function(i){ return !antMap[i[keyField]]; });
    var eliminados = anterior.filter(function(i){ return !newMap[i[keyField]]; });
    var modificados = nuevo.filter(function(i){
      return antMap[i[keyField]] && JSON.stringify(antMap[i[keyField]])!==JSON.stringify(i);
    });
    return { anadidos:anadidos, eliminados:eliminados, modificados:modificados };
  }

  var _pendingDiff = null;

  window.previsualizarPublicacion = function() {
    guardarBorrador(true);

    var diffChk  = calcularDiff(formatoActivo.checklist, borrador.checklist, 'id');
    var diffCols = calcularDiff(formatoActivo.columnas,  borrador.columnas,  'id');
    var totalCambios = diffChk.anadidos.length + diffChk.eliminados.length + diffChk.modificados.length
                     + diffCols.anadidos.length + diffCols.eliminados.length + diffCols.modificados.length;

    var resumen = '';
    if (!totalCambios) {
      resumen = 'Sin cambios en checklist ni columnas.';
    } else {
      if (diffChk.anadidos.length)    resumen += '+ ' + diffChk.anadidos.length    + ' pregunta(s) nueva(s)\n';
      if (diffChk.eliminados.length)  resumen += '- ' + diffChk.eliminados.length  + ' pregunta(s) eliminada(s)\n';
      if (diffChk.modificados.length) resumen += '~ ' + diffChk.modificados.length + ' pregunta(s) modificada(s)\n';
      if (diffCols.anadidos.length)   resumen += '+ ' + diffCols.anadidos.length   + ' columna(s) nueva(s)\n';
      if (diffCols.eliminados.length) resumen += '- ' + diffCols.eliminados.length + ' columna(s) eliminada(s)\n';
      if (diffCols.modificados.length)resumen += '~ ' + diffCols.modificados.length+ ' columna(s) modificada(s)\n';
    }

    var nuevaRev = formatoActivo.revision + 1;
    var hoy = new Date().toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric'});

    _pendingDiff = { diffChk: diffChk, diffCols: diffCols };
    document.getElementById('mpubTitulo').textContent  = 'Publicar Rev ' + nuevaRev + ' — ' + alcanceActual.toUpperCase();
    document.getElementById('mpubResumen').textContent = 'Vigente desde: ' + hoy + '\n\n' + resumen +
      '\nLas inspecciones EN CURSO no se ven afectadas.\nLas NUEVAS usarán este formato.';
    document.getElementById('mpubMotivo').value = '';
    document.getElementById('modalPublicar').classList.add('open');
  };

  window.confirmarPublicacion = function() {
    var motivo = document.getElementById('mpubMotivo').value.trim();
    if (!motivo) { alert('El motivo es requerido para la trazabilidad ENAC.'); return; }
    cerrarModal('modalPublicar');
    publicar(_pendingDiff.diffChk, _pendingDiff.diffCols, motivo);
  };

  function publicar(diffChk, diffCols, motivo) {
    var nuevaRev  = formatoActivo.revision + 1;
    var hoy = new Date().toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric'});
    var batch = db.batch();

    // 1. Actualizar config/{alcanceActual}
    // tiposJuego (SAE) se reescribe tal cual venía en el borrador — todavía no es editable
    // aquí, pero se preserva explícitamente en cada publicación en vez de dejarlo a merge.
    var cfgRef = db.collection('config').doc(alcanceActual);
    batch.set(cfgRef, {
      checklist:       borrador.checklist,
      columnas:        borrador.columnas,
      tiposJuego:      borrador.tiposJuego || null,
      formatoRevision: nuevaRev,
      formatoFecha:    hoy
    }, {merge: true});

    // 2. Guardar en historial
    var histRef = db.collection('config').doc(alcanceActual).collection('historial').doc(String(nuevaRev));
    batch.set(histRef, {
      revision:     nuevaRev,
      fechaVigencia:hoy,
      publicadoPor: currentUserEmail,
      motivo:       motivo,
      checklist:    borrador.checklist,
      columnas:     borrador.columnas,
      tiposJuego:   borrador.tiposJuego || null,
      cambios: {
        checklist: { anadidos: diffChk.anadidos, eliminados: diffChk.eliminados, modificados: diffChk.modificados },
        columnas:  { anadidos: diffCols.anadidos, eliminados: diffCols.eliminados, modificados: diffCols.modificados }
      }
    });

    // 3. Borrar borrador
    var borrRef = db.collection('config').doc(alcanceActual+'_borrador');
    batch.delete(borrRef);

    batch.commit().then(function() {
      formatoActivo = {
        revision:     nuevaRev,
        fechaVigencia:hoy,
        checklist:    borrador.checklist,
        columnas:     borrador.columnas,
        tiposJuego:   borrador.tiposJuego || null
      };
      borrador = null;
      document.getElementById('borradorDot').style.display = 'none';
      alert('✓ Rev '+nuevaRev+' publicada. Vigente desde '+hoy+'.');
      goTab('activo', document.getElementById('tabActivo'));
    }).catch(function(e){ alert('Error al publicar: '+e.message); });
  }

  // ── TAB HISTORIAL ──
  function renderHistorial() {
    document.getElementById('content').innerHTML = '<div class="spinner"></div>';
    db.collection('config').doc(alcanceActual).collection('historial').get()
      .then(function(snap) {
        if (snap.empty) {
          document.getElementById('content').innerHTML = '<div class="empty-state">Sin historial. Ejecuta el script de migración.</div>';
          return;
        }
        var docs = [];
        snap.forEach(function(d){ docs.push(d.data()); });
        docs.sort(function(a,b){ return (b.revision||0)-(a.revision||0); });
        _historialDocs = docs;
        var html = '';
        docs.forEach(function(h, idx) {
          var cambios = h.cambios || {};
          var chk  = cambios.checklist || {};
          var cols = cambios.columnas  || {};
          var chkA = chk.anadidos   || [];
          var chkE = chk.eliminados || [];
          var chkM = chk.modificados|| [];
          var colsA = cols.anadidos  || cols.anadidas  || [];
          var colsE = cols.eliminados|| cols.eliminadas|| [];
          var colsM = cols.modificados||cols.modificadas||[];
          var total = chkA.length + chkE.length + chkM.length + colsA.length + colsE.length + colsM.length;

          // Entradas sin diff pre-computado: calcular desde snapshots consecutivos
          if (!total && h.checklist && idx < docs.length - 1) {
            var prev = docs[idx + 1];
            if (prev && prev.checklist) {
              var d2 = calcularDiff(prev.checklist, h.checklist, 'id');
              chkA = d2.anadidos; chkE = d2.eliminados; chkM = d2.modificados;
              total = chkA.length + chkE.length + chkM.length;
            }
          }
          var resumen = total ? total+' cambio'+(total!==1?'s':'') : (cambios.nota || 'Sin cambios registrados');

          var regLine = h.registroRevision
            ? '<span style="font-size:11px;color:var(--muted)">Registro Rev '+h.registroRevision+' &middot; '+escHtml(h.registroFecha||'')+'</span>'
            : '';
          html += '<div class="hist-item">'
            +'<div class="hist-header" onclick="toggleHist(this)">'
            +'<div style="flex:1;min-width:0">'
            +'<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'
            +'<span class="hist-rev">Informe Rev '+h.revision+'</span>'
            +'<span style="font-size:11px;color:var(--muted)">'+escHtml(h.fechaVigencia||'')+'</span>'
            +(regLine?'<span style="color:var(--border)">|</span>'+regLine:'')
            +'</div>'
            +'<div class="hist-meta" style="margin-top:2px">'+escHtml(h.publicadoPor||'')+'&nbsp;&middot;&nbsp;'+escHtml(resumen)+'</div>'
            +(h.motivo?'<div style="font-size:11px;color:var(--text);margin-top:3px;font-style:italic">'+escHtml(h.motivo)+'</div>':'')
            +'</div>'
            +'<div style="display:flex;gap:4px;align-items:center;flex-shrink:0">'
            +(h.checklist?'<button class="btn-hist-pdf" onclick="event.stopPropagation();generarPdfFormato('+idx+')">PDF</button>':'')
            +(h.checklist&&idx<docs.length-1?'<button class="btn-hist-pdf" onclick="event.stopPropagation();generarPdfCambios('+idx+')" title="PDF de cambios vs Rev anterior">↕ Cambios</button>':'')
            +'<span>&#9660;</span>'
            +'</div>'
            +'</div>'
            +'<div class="hist-body">';

          if (cambios.nota) html += '<p style="font-size:12px;color:var(--muted);margin:4px 0">'+escHtml(cambios.nota)+'</p>';

          chkA.forEach(function(i){
            html += '<div class="diff-item diff-add">+ ['+escHtml(i.ref)+'] '+escHtml(i.sec)+'</div>';
          });
          chkE.forEach(function(i){
            html += '<div class="diff-item diff-del">- ['+escHtml(i.ref)+'] '+escHtml(i.sec)+'</div>';
          });
          chkM.forEach(function(i){
            html += '<div class="diff-item diff-mod">~ ['+escHtml(i.ref)+'] '+escHtml(i.sec)+'</div>';
          });
          colsA.forEach(function(c){
            html += '<div class="diff-item diff-add">+ Columna: '+escHtml(c.label)+'</div>';
          });
          colsE.forEach(function(c){
            html += '<div class="diff-item diff-del">- Columna: '+escHtml(c.label)+'</div>';
          });
          colsM.forEach(function(c){
            html += '<div class="diff-item diff-mod">~ Columna: '+escHtml(c.label)+'</div>';
          });
          if (!total && !cambios.nota) html += '<div class="diff-item" style="color:var(--muted)">Sin detalles de cambios.</div>';

          html += '</div></div>';
        });
        document.getElementById('content').innerHTML = html;
      })
      .catch(function(e){
        document.getElementById('content').innerHTML = '<div class="empty-state">Error: '+escHtml(e.message)+'</div>';
      });
  }

  // ── PDF DE FORMATO Y CAMBIOS ─────────────────────────────────────────────

  function abrirVentanaImpresion(html) {
    var w = window.open('', '_blank', 'width=960,height=720');
    if (!w) { alert('Permite ventanas emergentes para generar el PDF.'); return; }
    w.document.write(html);
    w.document.close();
  }

  function alcLabel() {
    var a = alcancesConfig.find(function(k) { return k.id === alcanceActual; });
    return a ? a.label + (a.desc ? ' — ' + a.desc : '') : alcanceActual.toUpperCase();
  }

  window.generarPdfFormato = function(idx) {
    var h = _historialDocs[idx];
    if (!h || !h.checklist) { alert('No hay snapshot del checklist para esta revisión.'); return; }
    abrirVentanaImpresion(buildFormatoHtml(h, null));
  };

  window.generarPdfCambios = function(idx) {
    var h    = _historialDocs[idx];
    var prev = _historialDocs[idx + 1] || null;
    if (!h || !h.checklist) { alert('No hay snapshot del checklist para esta revisión.'); return; }
    abrirVentanaImpresion(buildFormatoHtml(h, prev));
  };

  function buildFormatoHtml(h, prev) {
    var isDiff  = !!prev;
    var empresa = escHtml(empresaData.nombre || empresaData.nombreCorto || '');
    var alc     = alcLabel();
    var title   = isDiff
      ? 'Rev ' + prev.revision + ' → Rev ' + h.revision + ' — ' + alc
      : 'Formato de inspección Rev ' + h.revision + ' — ' + alc;

    // Construir filas con o sin diff
    var currItems = h.checklist || [];
    var prevMap = {}, currMap = {};
    if (prev && prev.checklist) prev.checklist.forEach(function(i){ prevMap[i.id] = i; });
    currItems.forEach(function(i){ currMap[i.id] = i; });

    var rows = '';
    currItems.forEach(function(item) {
      var cls = '', marker = '';
      if (isDiff) {
        if (!prevMap[item.id])                                        { cls = 'row-add'; marker = '+'; }
        else if (JSON.stringify(prevMap[item.id]) !== JSON.stringify(item)) { cls = 'row-mod'; marker = '~'; }
      }
      rows += '<tr class="' + cls + '">'
        + '<td class="col-m">' + (marker ? '<b>' + marker + '</b>' : '') + '</td>'
        + '<td class="col-ref">' + escHtml(item.ref||'') + '</td>'
        + '<td class="col-sec">' + escHtml(item.sec||'') + '</td>'
        + '<td>' + escHtml(item.desc||'') + '</td>'
        + '</tr>';
    });
    // Eliminados — al final con tachado
    if (isDiff && prev && prev.checklist) {
      prev.checklist.forEach(function(item) {
        if (!currMap[item.id]) {
          rows += '<tr class="row-del">'
            + '<td class="col-m"><b>−</b></td>'
            + '<td class="col-ref">' + escHtml(item.ref||'') + '</td>'
            + '<td class="col-sec">' + escHtml(item.sec||'') + '</td>'
            + '<td>' + escHtml(item.desc||'') + '</td>'
            + '</tr>';
        }
      });
    }

    var legend = isDiff
      ? '<div class="legend">'
        + '<span class="lg-add">+ Añadido</span>'
        + '<span class="lg-del">− Eliminado</span>'
        + '<span class="lg-mod">~ Modificado</span>'
        + '</div>'
      : '';

    return '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">'
      + '<title>' + escHtml(title) + '</title><style>'
      + 'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:24px;color:#2C2C2C;font-size:12px}'
      + 'h1{font-size:17px;color:#C8993A;margin:0 0 2px;font-weight:700}'
      + 'h2{font-size:12px;color:#8A8278;font-weight:400;margin:0 0 14px}'
      + '.meta{background:#F5F3EF;border-radius:8px;padding:10px 14px;margin-bottom:12px;display:grid;grid-template-columns:110px 1fr;gap:3px 8px;font-size:11px}'
      + '.mk{color:#8A8278;font-weight:600}'
      + '.motivo{font-style:italic}'
      + '.legend{display:flex;gap:12px;margin-bottom:10px;font-size:10px;font-weight:600}'
      + '.lg-add{background:#e8f5e9;padding:2px 8px;border-radius:4px;color:#27AE60}'
      + '.lg-del{background:#ffebee;padding:2px 8px;border-radius:4px;color:#C0392B}'
      + '.lg-mod{background:#fff8e1;padding:2px 8px;border-radius:4px;color:#E67E22}'
      + 'table{width:100%;border-collapse:collapse;font-size:11px}'
      + 'th{background:#C8993A;color:white;padding:6px 8px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.03em}'
      + 'td{padding:5px 8px;border-bottom:1px solid #E2DDD5;vertical-align:top}'
      + '.col-m{width:16px;text-align:center;color:#8A8278;font-size:10px}'
      + '.col-ref{width:50px;font-family:monospace;color:#8A8278;font-size:10px}'
      + '.col-sec{width:150px;font-weight:500}'
      + '.row-add td{background:#e8f5e9}'
      + '.row-del td{background:#ffebee;color:#C0392B;text-decoration:line-through}'
      + '.row-mod td{background:#fff8e1}'
      + '.footer{margin-top:16px;font-size:9px;color:#8A8278;border-top:1px solid #E2DDD5;padding-top:6px;display:flex;justify-content:space-between}'
      + '@media print{@page{margin:12mm}body{padding:0}}'
      + '</style></head><body>'
      + '<h1>' + escHtml(title) + '</h1>'
      + '<h2>' + empresa + '</h2>'
      + '<div class="meta">'
      + (isDiff ? '<span class="mk">Revisión</span><span>Rev ' + prev.revision + ' → Rev ' + h.revision + '</span>' : '<span class="mk">Revisión</span><span>Rev ' + h.revision + '</span>')
      + '<span class="mk">Vigente desde</span><span>' + escHtml(h.fechaVigencia||'') + '</span>'
      + '<span class="mk">Publicado por</span><span>' + escHtml(h.publicadoPor||'') + '</span>'
      + (h.motivo ? '<span class="mk">Motivo</span><span class="motivo">' + escHtml(h.motivo) + '</span>' : '')
      + (isDiff ? '<span class="mk">Rev anterior</span><span>Rev ' + prev.revision + ' (' + escHtml(prev.fechaVigencia||'') + ')</span>' : '')
      + '</div>'
      + legend
      + '<table><thead><tr>'
      + '<th class="col-m"></th><th class="col-ref">Ref.</th><th class="col-sec">Sección</th><th>Descripción</th>'
      + '</tr></thead><tbody>' + rows + '</tbody></table>'
      + '<div class="footer">'
      + '<span>' + empresa + ' · ' + escHtml(alc) + ' · Rev ' + h.revision + '</span>'
      + '<span>Generado ' + new Date().toLocaleDateString('es-ES') + '</span>'
      + '</div>'
      + '</body></html>';
  }

  ['modalPregunta','modalColumna'].forEach(function(id){
    document.getElementById(id).addEventListener('click', function(e){
      if (e.target===this) cerrarModal(id);
    });
  });
</script>
</body>
</html>

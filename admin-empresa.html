<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#C8993A">
  <title>Empresa y Director — ARP</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .frm-sec{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
    .frm-sec:first-of-type{margin-top:0}
    .frm-card{background:white;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:8px}
    .frm-row{padding:12px 16px;border-bottom:1px solid var(--border)}
    .frm-row:last-child{border-bottom:none}
    .frm-row label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
    .frm-row input{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;color:var(--text);background:white;box-sizing:border-box}
    .frm-row input:focus{border-color:var(--gold);outline:none}
    .frm-note{font-size:11px;color:var(--muted);margin-top:4px}
    .btn-save{width:100%;padding:13px;background:var(--gold);color:white;border:none;border-radius:12px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:4px}
    .btn-save:disabled{opacity:.5;cursor:not-allowed}
    .alc-header{display:flex;gap:8px;margin-bottom:4px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0 2px}
    .alc-h-id{width:76px;flex-shrink:0}
    .alc-h-label{width:88px;flex-shrink:0}
    .alc-list{margin-bottom:8px}
    .alc-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
    .alc-id{width:76px;flex-shrink:0;font-family:monospace}
    .alc-label{width:88px;flex-shrink:0}
    .alc-desc{flex:1}
    .alc-row input{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:12px;color:var(--text);background:white;width:100%;box-sizing:border-box}
    .alc-row input:focus{border-color:var(--gold);outline:none}
    .alc-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px;flex-shrink:0;line-height:1}
    .alc-del:hover{color:var(--red)}
    .btn-add-alc{width:100%;padding:9px;background:white;border:1.5px dashed var(--border);border-radius:8px;font-family:inherit;font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:8px}
    .btn-add-alc:hover{border-color:var(--gold);color:var(--gold)}
  </style>
</head>
<body>

<div class="app-header">
  <button class="btn-back" onclick="history.back()">&#8592;</button>
  <div class="hdr-title">Empresa y Director</div>
</div>

<div class="content" id="mainContent">
  <div class="spinner-wrap"><div class="spinner"></div></div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="utils.js"></script>
<script>
  if (!firebase.apps.length) {
    firebase.initializeApp({
      apiKey:'AIzaSyDncKj2_RBJWgzzjOn2079x47pf_ycGFlc',
      authDomain:'arp-inspecciones.firebaseapp.com',
      projectId:'arp-inspecciones',
      storageBucket:'arp-inspecciones.firebasestorage.app',
      messagingSenderId:'35880168451',
      appId:'1:35880168451:web:090e3c250b4416ed0b3236'
    });
  }
  var db = firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(function(){});

  var currentUserEmail = '';
  var empresaOrig = {};
  var directorOrig = {};
  var alcancesArr  = [];

  initAuth({
    roles:    ['admin','director'],
    onDenied: 'redirect',
    onReady:  function(user) {
      currentUserEmail = user.email;
      cargar();
    }
  });

  function cargar() {
    Promise.all([
      db.collection('config').doc('empresa').get(),
      db.collection('config').doc('director').get()
    ]).then(function(snaps) {
      empresaOrig  = snaps[0].exists ? snaps[0].data() : {};
      directorOrig = snaps[1].exists ? snaps[1].data() : {};
      alcancesArr  = (empresaOrig.alcances || []).map(function(a) {
        return { id: a.id||'', label: a.label||'', desc: a.desc||'' };
      });
      renderForm();
    }).catch(function(e) {
      document.getElementById('mainContent').innerHTML =
        '<p style="color:var(--red);padding:20px">Error cargando configuración: ' + e.message + '</p>';
    });
  }

  // ── Renderizado ──────────────────────────────────────────────────────────────

  function campo(id, label, value, nota) {
    return '<div class="frm-row">' +
      '<label>' + label + '</label>' +
      '<input id="' + id + '" value="' + escHtml(value) + '">' +
      (nota ? '<div class="frm-note">' + nota + '</div>' : '') +
      '</div>';
  }

  function val(id) {
    var el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }

  function renderForm() {
    var e = empresaOrig;
    var d = directorOrig;
    document.getElementById('mainContent').innerHTML =

      '<div class="frm-sec">Datos de empresa</div>' +
      '<div class="frm-card">' +
        campo('emp-nombre',       'Nombre completo',           e.nombre||'') +
        campo('emp-nombreCorto',  'Nombre corto (PDF cabecera)',e.nombreCorto||'') +
        campo('emp-sedeSocial',   'Sede social',               e.sedeSocial||'') +
        campo('emp-sedeFiscal',   'Sede fiscal',               e.sedeFiscal||'',
              'Solo aparece en PDFs si es diferente a la sede social.') +
        campo('emp-telefono',     'Teléfono',                  e.telefono||'') +
        campo('emp-email',        'Email',                     e.email||'') +
        campo('emp-web',          'Web',                       e.web||'') +
        campo('emp-acreditacion', 'Número acreditación ENAC',  e.acreditacion||'') +
      '</div>' +
      '<button class="btn-save" id="btnEmp" onclick="guardarEmpresa()">Guardar datos de empresa</button>' +

      '<div class="frm-sec">Director técnico</div>' +
      '<div class="frm-card">' +
        campo('dir-nombre',     'Nombre y apellidos', d.nombre||'') +
        campo('dir-cargo',      'Cargo',              d.cargo||'') +
        campo('dir-titulacion', 'Titulación',         d.titulacion||'') +
        campo('dir-colegiado',  'Nº colegiado',       d.colegiado||'') +
      '</div>' +
      '<button class="btn-save" id="btnDir" onclick="guardarDirector()">Guardar director</button>' +

      '<div class="frm-sec">Alcances disponibles</div>' +
      '<p style="font-size:12px;color:var(--muted);margin-bottom:10px">' +
        'El ID (minúsculas) debe coincidir con el documento de configuración en Firestore ' +
        '(ej: <code>paa</code>, <code>sae</code>). Es la clave interna del sistema.' +
      '</p>' +
      '<div class="alc-header">' +
        '<div class="alc-h-id">ID</div>' +
        '<div class="alc-h-label">Etiqueta</div>' +
        '<div style="flex:1">Descripción</div>' +
      '</div>' +
      '<div id="alcList" class="alc-list"></div>' +
      '<button class="btn-add-alc" onclick="addAlcRow()">+ Añadir alcance</button>' +
      '<button class="btn-save" id="btnAlc" onclick="guardarAlcances()">Guardar alcances</button>';

    renderAlcList();
  }

  function renderAlcList() {
    var html = '';
    alcancesArr.forEach(function(a, i) {
      html +=
        '<div class="alc-row" id="alcrow-' + i + '">' +
          '<input class="alc-id"    value="' + escHtml(a.id)    + '" placeholder="paa"                   oninput="syncAlc(' + i + ')">' +
          '<input class="alc-label" value="' + escHtml(a.label) + '" placeholder="PAA"                   oninput="syncAlc(' + i + ')">' +
          '<input class="alc-desc"  value="' + escHtml(a.desc)  + '" placeholder="Descripción del alcance" oninput="syncAlc(' + i + ')">' +
          '<button class="alc-del" onclick="delAlcRow(' + i + ')">&#10005;</button>' +
        '</div>';
    });
    var el = document.getElementById('alcList');
    if (el) el.innerHTML = html;
  }

  function syncAlc(i) {
    var row = document.getElementById('alcrow-' + i);
    if (!row || !alcancesArr[i]) return;
    alcancesArr[i].id    = row.querySelector('.alc-id').value.trim().toLowerCase();
    alcancesArr[i].label = row.querySelector('.alc-label').value.trim();
    alcancesArr[i].desc  = row.querySelector('.alc-desc').value.trim();
  }

  function addAlcRow() {
    alcancesArr.push({ id:'', label:'', desc:'' });
    renderAlcList();
    var rows = document.querySelectorAll('.alc-row');
    if (rows.length) rows[rows.length - 1].querySelector('.alc-id').focus();
  }

  function delAlcRow(i) {
    alcancesArr.splice(i, 1);
    renderAlcList();
  }

  // ── Diff helper ─────────────────────────────────────────────────────────────

  function diffObj(orig, nuevo, defs) {
    var cambios = [];
    defs.forEach(function(d) {
      var ant = String(orig[d.key] || '');
      var nw  = String(nuevo[d.key] || '');
      if (ant !== nw) cambios.push({ campo: d.key, etiqueta: d.label, anterior: ant, nuevo: nw });
    });
    return cambios;
  }

  function histEntry(seccion, cambios) {
    return {
      fecha:   firebase.firestore.FieldValue.serverTimestamp(),
      usuario: currentUserEmail,
      seccion: seccion,
      cambios: cambios
    };
  }

  function toastSave(cambios, nombre) {
    if (!cambios.length) { showToast('Sin cambios que guardar'); return; }
    var n = cambios.length;
    showToast(nombre + ' guardado — ' + n + ' campo' + (n > 1 ? 's' : '') + ' actualizado' + (n > 1 ? 's' : ''));
  }

  // ── Guardar empresa ─────────────────────────────────────────────────────────

  function guardarEmpresa() {
    var btn = document.getElementById('btnEmp');
    btn.disabled = true; btn.textContent = 'Guardando…';

    var nuevo = {
      nombre:       val('emp-nombre'),
      nombreCorto:  val('emp-nombreCorto'),
      sedeSocial:   val('emp-sedeSocial'),
      sedeFiscal:   val('emp-sedeFiscal'),
      telefono:     val('emp-telefono'),
      email:        val('emp-email'),
      web:          val('emp-web'),
      acreditacion: val('emp-acreditacion')
    };
    var cambios = diffObj(empresaOrig, nuevo, [
      { key:'nombre',       label:'Nombre' },
      { key:'nombreCorto',  label:'Nombre corto' },
      { key:'sedeSocial',   label:'Sede social' },
      { key:'sedeFiscal',   label:'Sede fiscal' },
      { key:'telefono',     label:'Teléfono' },
      { key:'email',        label:'Email' },
      { key:'web',          label:'Web' },
      { key:'acreditacion', label:'Acreditación ENAC' }
    ]);

    var batch = db.batch();
    batch.set(db.collection('config').doc('empresa'), nuevo, { merge: true });
    if (cambios.length) {
      batch.set(
        db.collection('config').doc('empresa').collection('historial').doc(String(Date.now())),
        histEntry('empresa', cambios)
      );
    }
    batch.commit().then(function() {
      Object.assign(empresaOrig, nuevo);
      btn.disabled = false; btn.textContent = 'Guardar datos de empresa';
      toastSave(cambios, 'Empresa');
    }).catch(function(e) {
      btn.disabled = false; btn.textContent = 'Guardar datos de empresa';
      alert('Error al guardar: ' + e.message);
    });
  }

  // ── Guardar director ────────────────────────────────────────────────────────

  function guardarDirector() {
    var btn = document.getElementById('btnDir');
    btn.disabled = true; btn.textContent = 'Guardando…';

    var nuevo = {
      nombre:     val('dir-nombre'),
      cargo:      val('dir-cargo'),
      titulacion: val('dir-titulacion'),
      colegiado:  val('dir-colegiado')
    };
    var cambios = diffObj(directorOrig, nuevo, [
      { key:'nombre',     label:'Nombre' },
      { key:'cargo',      label:'Cargo' },
      { key:'titulacion', label:'Titulación' },
      { key:'colegiado',  label:'Nº colegiado' }
    ]);

    var batch = db.batch();
    batch.set(db.collection('config').doc('director'), nuevo);
    if (cambios.length) {
      batch.set(
        db.collection('config').doc('empresa').collection('historial').doc(String(Date.now())),
        histEntry('director', cambios)
      );
    }
    batch.commit().then(function() {
      Object.assign(directorOrig, nuevo);
      btn.disabled = false; btn.textContent = 'Guardar director';
      toastSave(cambios, 'Director');
    }).catch(function(e) {
      btn.disabled = false; btn.textContent = 'Guardar director';
      alert('Error al guardar: ' + e.message);
    });
  }

  // ── Guardar alcances ────────────────────────────────────────────────────────

  function guardarAlcances() {
    // Sync state from DOM before saving
    document.querySelectorAll('.alc-row').forEach(function(row, i) {
      if (alcancesArr[i]) {
        alcancesArr[i].id    = row.querySelector('.alc-id').value.trim().toLowerCase();
        alcancesArr[i].label = row.querySelector('.alc-label').value.trim();
        alcancesArr[i].desc  = row.querySelector('.alc-desc').value.trim();
      }
    });
    var nuevoArr = alcancesArr.filter(function(a) { return !!a.id; });

    var alcOrig  = empresaOrig.alcances || [];
    var byIdOrig = {};
    alcOrig.forEach(function(a) { byIdOrig[a.id] = a; });
    var byIdNuevo = {};
    nuevoArr.forEach(function(a) { byIdNuevo[a.id] = a; });

    var cambios = [];
    nuevoArr.forEach(function(a) {
      if (!byIdOrig[a.id]) {
        cambios.push({ campo:'alcance', etiqueta:'Alcance añadido', anterior:'', nuevo: a.id + (a.label ? ' — ' + a.label : '') });
      } else {
        var o = byIdOrig[a.id];
        if (o.label !== a.label || o.desc !== a.desc)
          cambios.push({ campo:'alcance.' + a.id, etiqueta:'Alcance ' + a.id, anterior: o.label + (o.desc ? ' / ' + o.desc : ''), nuevo: a.label + (a.desc ? ' / ' + a.desc : '') });
      }
    });
    alcOrig.forEach(function(a) {
      if (!byIdNuevo[a.id])
        cambios.push({ campo:'alcance', etiqueta:'Alcance eliminado', anterior: a.id + (a.label ? ' — ' + a.label : ''), nuevo:'' });
    });

    var btn = document.getElementById('btnAlc');
    btn.disabled = true; btn.textContent = 'Guardando…';

    var batch = db.batch();
    batch.set(db.collection('config').doc('empresa'), { alcances: nuevoArr }, { merge: true });
    if (cambios.length) {
      batch.set(
        db.collection('config').doc('empresa').collection('historial').doc(String(Date.now())),
        histEntry('alcances', cambios)
      );
    }
    batch.commit().then(function() {
      empresaOrig.alcances = nuevoArr;
      alcancesArr = nuevoArr.slice();
      btn.disabled = false; btn.textContent = 'Guardar alcances';
      showToast(cambios.length ? 'Alcances guardados' : 'Sin cambios que guardar');
    }).catch(function(e) {
      btn.disabled = false; btn.textContent = 'Guardar alcances';
      alert('Error al guardar: ' + e.message);
    });
  }
</script>
</body>
</html>

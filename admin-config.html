<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#C8993A">
  <title>Configuración - ARP</title>
  <style>
    :root{--gold:#C8993A;--dark:#1A1A1A;--surf:#F5F3EF;--border:#E2DDD5;--text:#2C2C2C;--muted:#8A8278;--red:#C0392B;--green:#27AE60;}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--surf);color:var(--text);min-height:100vh}
    .app-header{background:var(--dark);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
    .btn-back{background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer;padding:0;line-height:1}
    .hdr-mark{width:30px;height:30px;background:var(--gold);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white}
    .hdr-title{color:white;font-size:15px;font-weight:600;flex:1}
    .content{padding:16px;max-width:560px;margin:0 auto;padding-bottom:60px}
    .sec-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
    .sec-title:first-child{margin-top:8px}
    .card{background:white;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
    .card-row{display:flex;align-items:center;padding:14px 16px;gap:12px;border-bottom:1px solid var(--border)}
    .card-row:last-child{border-bottom:none}
    .row-info{flex:1}
    .row-label{font-size:14px;font-weight:600;color:var(--dark)}
    .row-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .badge-alcance{display:inline-block;padding:2px 8px;background:var(--gold);color:white;border-radius:5px;font-size:11px;font-weight:700;margin-right:6px}
    /* Toggle switch */
    .toggle-wrap{position:relative;width:44px;height:24px;flex-shrink:0}
    .toggle-wrap input{opacity:0;width:0;height:0;position:absolute}
    .toggle-track{display:block;width:44px;height:24px;background:var(--border);border-radius:12px;cursor:pointer;transition:background .2s}
    .toggle-wrap input:checked + .toggle-track{background:var(--green)}
    .toggle-track::after{content:'';position:absolute;top:4px;left:4px;width:16px;height:16px;background:white;border-radius:50%;transition:left .2s}
    .toggle-wrap input:checked + .toggle-track::after{left:24px}
    /* Input campo texto */
    .field-wrap{padding:14px 16px}
    .field-wrap label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
    .field-wrap input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;color:var(--text);background:white}
    .field-wrap input:focus{border-color:var(--gold);outline:none}
    .field-note{font-size:11px;color:var(--muted);margin-top:5px}
    /* Guardar */
    .btn-save{width:100%;padding:14px;background:var(--gold);color:white;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:20px}
    .btn-save:disabled{opacity:.5;cursor:not-allowed}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1}
    .spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:60px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<div class="app-header">
  <button class="btn-back" onclick="location.href='admin.html'">&#8592;</button>
  <div class="hdr-mark">&#9881;</div>
  <div class="hdr-title">Configuración</div>
</div>

<div class="content" id="content">
  <div class="spinner"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
  if (!firebase.apps.length) {
    firebase.initializeApp({
      apiKey:"AIzaSyDncKj2_RBJWgzzjOn2079x47pf_ycGFlc",
      authDomain:"arp-inspecciones.firebaseapp.com",
      projectId:"arp-inspecciones",
      storageBucket:"arp-inspecciones.firebasestorage.app",
      messagingSenderId:"35880168451",
      appId:"1:35880168451:web:090e3c250b4416ed0b3236"
    });
  }
  var db = firebase.firestore();
  var auth = firebase.auth();

  var rol = null;
  var configData = {};

  // Alcances disponibles con su descripción
  var ALCANCES = [
    { id: 'PAA', label: 'PAA', desc: 'Parques acrobáticos en altura' },
    { id: 'FER', label: 'FER', desc: 'Vías ferratas' },
    { id: 'SAE', label: 'SAE', desc: 'Sistemas de acceso por escalada' },
    { id: 'AJN', label: 'AJN', desc: 'Áreas de juego en naturaleza' },
  ];

  auth.onAuthStateChanged(function(user) {
    if (!user) { location.href = 'index.html'; return; }
    db.collection('usuarios').doc(user.uid).get().then(function(snap) {
      if (!snap.exists) { location.href = 'index.html'; return; }
      rol = snap.data().rol;
      if (rol !== 'admin' && rol !== 'director' && rol !== 'oficina') {
        location.href = 'index.html'; return;
      }
      cargar();
    });
  });

  function cargar() {
    db.collection('config').doc('empresa').get().then(function(snap) {
      configData = snap.exists ? snap.data() : {};
      renderUI();
    }).catch(function() { renderUI(); });
  }

  function renderUI() {
    var enacAlc = configData.enacAlcances || {};
    var acreditacion = configData.acreditacion || '';
    var revSinEnac  = configData.revCertificadoDoc     || '19/05/2023 Rev 3.';
    var revConEnac  = configData.revCertificadoDocEnac || '08/01/2025 Rev 5.';

    var togglesHtml = ALCANCES.map(function(a) {
      var checked = enacAlc[a.id] ? 'checked' : '';
      return '<div class="card-row">' +
        '<div class="row-info">' +
          '<div class="row-label"><span class="badge-alcance">' + a.id + '</span>' + a.desc + '</div>' +
          '<div class="row-sub" id="sub-' + a.id + '">' + (enacAlc[a.id] ? 'Acreditado ENAC' : 'Sin acreditación ENAC') + '</div>' +
        '</div>' +
        '<label class="toggle-wrap">' +
          '<input type="checkbox" id="enac-' + a.id + '" ' + checked + ' onchange="onToggle(\'' + a.id + '\')">' +
          '<span class="toggle-track"></span>' +
        '</label>' +
      '</div>';
    }).join('');

    document.getElementById('content').innerHTML =
      '<p class="sec-title">Acreditación ENAC por tipo de inspección</p>' +
      '<div class="card">' + togglesHtml + '</div>' +
      '<p style="font-size:11px;color:var(--muted);margin-bottom:4px">Activar un tipo incluye "acreditado Nº…" en el certificado y usa el modelo con ENAC.</p>' +

      '<p class="sec-title">Número de acreditación ENAC</p>' +
      '<div class="card">' +
        '<div class="field-wrap">' +
          '<label>Número ENAC</label>' +
          '<input type="text" id="campo-acreditacion" value="' + escHtml(acreditacion) + '" placeholder="Ej: Nº 489 / EI 558">' +
          '<p class="field-note">Aparece en los certificados de los tipos marcados como acreditados.</p>' +
        '</div>' +
      '</div>' +

      '<p class="sec-title">Revisión del documento certificado</p>' +
      '<div class="card">' +
        '<div class="field-wrap">' +
          '<label>Revisión sin ENAC</label>' +
          '<input type="text" id="campo-rev-sin-enac" value="' + escHtml(revSinEnac) + '" placeholder="Ej: 19/05/2023 Rev 3.">' +
          '<p class="field-note">Pie del certificado cuando el alcance NO tiene ENAC activo.</p>' +
        '</div>' +
        '<div class="field-wrap">' +
          '<label>Revisión con ENAC</label>' +
          '<input type="text" id="campo-rev-con-enac" value="' + escHtml(revConEnac) + '" placeholder="Ej: 08/01/2025 Rev 5.">' +
          '<p class="field-note">Pie del certificado cuando el alcance SÍ tiene ENAC activo.</p>' +
        '</div>' +
      '</div>' +

      '<button class="btn-save" id="btn-save" onclick="guardar()">Guardar cambios</button>';
  }

  function onToggle(id) {
    var chk = document.getElementById('enac-' + id);
    var sub = document.getElementById('sub-' + id);
    if (sub) sub.textContent = chk.checked ? 'Acreditado ENAC' : 'Sin acreditación ENAC';
  }

  function guardar() {
    var btn = document.getElementById('btn-save');
    btn.disabled = true;
    btn.textContent = 'Guardando…';

    var enacAlcances = {};
    ALCANCES.forEach(function(a) {
      enacAlcances[a.id] = !!document.getElementById('enac-' + a.id).checked;
    });
    var acreditacion     = document.getElementById('campo-acreditacion').value.trim();
    var revSinEnac       = document.getElementById('campo-rev-sin-enac').value.trim();
    var revConEnac       = document.getElementById('campo-rev-con-enac').value.trim();

    db.collection('config').doc('empresa').set({
      enacAlcances: enacAlcances,
      acreditacion: acreditacion,
      revCertificadoDoc:     revSinEnac,
      revCertificadoDocEnac: revConEnac
    }, { merge: true }).then(function() {
      configData.enacAlcances = enacAlcances;
      configData.acreditacion = acreditacion;
      configData.revCertificadoDoc     = revSinEnac;
      configData.revCertificadoDocEnac = revConEnac;
      btn.disabled = false;
      btn.textContent = 'Guardar cambios';
      showToast('Configuración guardada');
    }).catch(function(e) {
      btn.disabled = false;
      btn.textContent = 'Guardar cambios';
      alert('Error al guardar: ' + e.message);
    });
  }

  function escHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
  }
</script>
</body>
</html>
